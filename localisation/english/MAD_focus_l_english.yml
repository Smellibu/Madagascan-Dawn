 MAD_Japanese_bypass: "Japanese Bypass"
 MAD_Japanese_bypass_desc: "Build the Japanese-backed bypass around Antananarivo to reduce congestion and improve the connection between Madagascar’s main transport corridors. The project eases movement through the capital while bringing Japanese investment and deeper Japanese involvement in Madagascar’s development."
 MAD_Rocade_ring_road: "Rocade Ring Road"
 MAD_Rocade_ring_road_desc: "Construct the Rocade ring road around Antananarivo to move traffic away from the city centre and improve urban logistics. Better roads reduce bottlenecks, support infrastructure efficiency and make the capital easier to connect with the wider economy."
 MAD_Promote_drought_tolerant_crops: "Promote Drought Tolerant Crops"
 MAD_Promote_drought_tolerant_crops_desc: "Complete the Promote Drought Tolerant Crops national focus."
