# Historical military-policy programmes, 2005-2024
MAD_POL_MIL_2005_RESTRUCTURING: "The 2005 Armed Forces Restructuring Programme"
MAD_POL_MIL_2005_RESTRUCTURING_desc: "The programme joined national defence and sovereignty to the Armed Forces' contribution to national development. It proposed better training, surveillance of land, airspace and maritime territory, peacekeeping participation, bilateral exercises and development detachments. The restructuring drafts have been prepared and sent to the Presidency for comments; the new structure and revised missions are not yet approved."
MAD_POL_MIL_FIDY_2006_CHALLENGE: "General Fidy's Challenge"
MAD_POL_MIL_FIDY_2006_CHALLENGE_desc: "In November 2006, retired General Andrianafidisoa, known as Fidy, distributed leaflets announcing a provisional military government at Ivato. He denied attempting a coup and argued that the government was unconstitutional, but only a limited number of officers rallied to him. The armed forces must decide whether to reject the call, examine the constitutional grievance or support the provisional board."
MAD_POL_MIL_NATIONAL_SECURITY_REFORM_2014_17: "The National Security Reform Plan"
MAD_POL_MIL_NATIONAL_SECURITY_REFORM_2014_17_desc: "Beginning in 2014, Madagascar's national security reform process sought a whole-of-government framework for identifying risks, coordinating institutions and aligning defence and internal security policy. The general policy letter was adopted in January 2016 and the National Security Reform Plan was published in September 2017."
MAD_POL_MIL_HCDN_SPDSN_ESTABLISHMENT: "Establish National Defence Coordination"
MAD_POL_MIL_HCDN_SPDSN_ESTABLISHMENT_desc: "The High Council of National Defence provides a cross-government forum for national defence and security policy. Its Permanent Secretariat supplies a standing administrative and coordination capacity. Establish both institutions as part of the national security framework rather than treating them as a purely military officers' committee."
MAD_POL_MIL_INTERNAL_CONTROL_2021_23: "The 2021-23 Armed Forces Restructuring Plan"
MAD_POL_MIL_INTERNAL_CONTROL_2021_23_desc: "The Ministry of Defence's restructuring programme emphasised internal control, risk management, professional conduct and procedures for preventing, reporting and investigating misconduct. It connected military governance to human resources, ethics, investigations, finance and operational management."

MAD_military_refoundation.6.t: "The 2005 Armed Forces Restructuring Programme"
MAD_military_refoundation.6.d: "The programme's two responsibilities are national defence and sovereignty, and the Armed Forces' contribution to national development. Training, surveillance of land, airspace and maritime territory, peacekeeping, bilateral exercises and development detachments are part of the proposed operational programme. The restructuring drafts have been sent to the Presidency for comments; the proposed new structure has not yet been approved."
MAD_military_refoundation.6.a: "Submit the proposals for presidential approval"
MAD_military_refoundation.6.b: "Implement a comprehensive restructuring programme"
MAD_military_refoundation.7.t: "General Fidy's Challenge"
MAD_military_refoundation.7.d: "Leaflets distributed at Ivato announced a provisional military government under retired General Andrianafidisoa, known as Fidy. He said he was calling for the President to stand down because he considered the government unconstitutional, and denied that he had attempted a coup. The challenge did not attract broad military support. The government must decide how to respond to his intervention and constitutional complaint."
MAD_military_refoundation.7.a: "Reject the call and maintain the chain of command"
MAD_military_refoundation.7.b: "Review the constitutional complaint"
MAD_military_refoundation.7.c: "Support the provisional military government"
MAD_military_refoundation.9.t: "Military Pressure on the HAT"
MAD_military_refoundation.9.d: "In April and May 2010, military leaders pressed for a political resolution while the armed-forces minister was dismissed amid coup rumours and a gendarmerie mutiny followed. The transitional government must decide whether to accommodate senior officers, negotiate clearer civilian command arrangements or assert civilian authority despite the risk of further confrontation."
MAD_military_refoundation.9.a: "Accommodate the officer corps"
MAD_military_refoundation.9.b: "Negotiate a civilian command compact"
MAD_military_refoundation.9.c: "Reject the military's demands"
MAD_military_refoundation.10.t: "The November 2010 Military Challenge"
MAD_military_refoundation.10.d: "A limited group of officers challenged the High Authority of the Transition in November 2010. The confrontation was resolved after negotiations lasting almost three days; it should not be mistaken for a unified uprising by the whole armed forces. The government can negotiate reintegration, suppress the challenge or give the military a formal role in mediating the transition."
MAD_military_refoundation.10.a: "Negotiate and reintegrate the dissident officers"
MAD_military_refoundation.10.b: "Suppress the military challenge"
MAD_military_refoundation.10.c: "Give military leadership a formal mediation role"
MAD_military_refoundation.11.t: "The SADC Roadmap and the Military's Mandate"
MAD_military_refoundation.11.d: "The military's political role remains part of the struggle over the SADC transition roadmap and the return to constitutional government. The government can accept the electoral timetable and withdraw the armed forces from political arbitration, or retain a military guarantee over the transition's key decisions."
MAD_military_refoundation.11.a: "Accept the transition timetable and withdraw from political arbitration"
MAD_military_refoundation.11.b: "Retain the military as guarantor of the transition"
MAD_military_refoundation.12.t: "The National Security Reform Plan"
MAD_military_refoundation.12.d: "The national security reform process seeks a whole-of-government framework for preparing and coordinating national defence and security policy. The policy letter adopted in January 2016 and the National Security Reform Plan published in September 2017 provide a basis for better interministerial coordination, risk assessment and coherent institutional responsibilities."
MAD_military_refoundation.12.a: "Adopt the National Security Reform Plan"
MAD_military_refoundation.12.b: "Keep security reform fragmented between the services"
MAD_military_refoundation.13.t: "The HCDN and Permanent Secretariat"
MAD_military_refoundation.13.d: "The High Council of National Defence was established under Act 2016-059, while Decree 2017-242 established its Permanent Secretariat for National Defence and Security. The Council's membership extends across government; it is not simply a military officers' committee. The government must choose whether to institutionalise this statutory coordination system or keep security coordination within the executive."
MAD_military_refoundation.13.a: "Establish the statutory national defence coordination system"
MAD_military_refoundation.13.b: "Keep national security coordination within the executive"
MAD_military_refoundation.14.t: "Internal Control and Military Governance"
MAD_military_refoundation.14.d: "The 2021-23 Armed Forces restructuring plan placed internal control, risk management and professional conduct at the centre of military governance. It called for procedures to prevent, report and investigate misconduct and for stronger practice in human resources, ethics, military investigations, finance and operations. The government must decide whether to implement those systems or leave the plan as administrative guidance."
MAD_military_refoundation.14.a: "Implement internal control and risk management"
MAD_military_refoundation.14.b: "Keep the programme as administrative guidance"
MAD_military_refoundation.16.t: "The Military Directorate's Mandate"
MAD_military_refoundation.16.d: "Ordinance 2009-001 assigned full powers to the Military Directorate. Ordinance 2009-002, also dated 17 March 2009, transferred those powers to Andry Rajoelina and provided for a transition towards the Fourth Republic within a maximum of 24 months. The Directorate's proposed responsibilities included national consultations, constitutional preparation, electoral and political-party legislation, and elections within that period."
MAD_military_refoundation.16.a: "Retain the Military Directorate and its 24-month programme"
MAD_military_refoundation.16.b: "Limit the Directorate to restoring order and preparing a transfer"

MAD_MIL_2005_OPERATIONAL_PROGRAMME: "2005 Defence and Development Programme"
MAD_MIL_2005_OPERATIONAL_PROGRAMME_desc: "A limited operational programme improves training, readiness, land and maritime surveillance, peacekeeping participation and the Armed Forces' contribution to national development."
MAD_MIL_2005_FORCE_RESTRUCTURE: "Comprehensive Armed Forces Restructuring"
MAD_MIL_2005_FORCE_RESTRUCTURE_desc: "A more ambitious restructuring programme improves readiness and operational capacity while reducing some recurring personnel and administrative costs. Implementing the revised structure creates institutional disruption."
MAD_MIL_FIDY_PROVISIONAL_BOARD: "Fidy's Provisional Military Board"
MAD_MIL_FIDY_PROVISIONAL_BOARD_desc: "A provisional military authority has taken power without broad institutional support. Its uncertain mandate and contested administration place additional pressure on stability and the state bureaucracy."
MAD_MIL_HAT_OFFICER_ACCOMMODATION: "HAT Officer-Corps Accommodation"
MAD_MIL_HAT_OFFICER_ACCOMMODATION_desc: "The transitional administration maintains officer support through political and financial accommodation, sustaining military influence while increasing the cost of the security establishment."
MAD_MIL_CIVILIAN_COMMAND_COMPACT: "Civilian Command Compact"
MAD_MIL_CIVILIAN_COMMAND_COMPACT_desc: "A negotiated understanding clarifies civilian authority and the services' institutional responsibilities, easing the cost of coordination while preserving a professional military role."
MAD_MIL_HAT_TRANSITION_GUARANTOR: "Military Transition Guarantor"
MAD_MIL_HAT_TRANSITION_GUARANTOR_desc: "The military has assumed a formal mediation role in the transition. This adds political leverage but weakens the distinction between military command and civilian political arbitration."
MAD_MIL_TGV_TRANSITION_GUARANTOR: "TGV Transition Guarantee"
MAD_MIL_TGV_TRANSITION_GUARANTOR_desc: "Military leadership retains a guarantee over the transition's major political decisions, giving officers leverage over the timetable and the return to constitutional government."
MAD_MIL_NATIONAL_SECURITY_REFORM_PLAN: "National Security Reform Plan"
MAD_MIL_NATIONAL_SECURITY_REFORM_PLAN_desc: "A whole-of-government policy framework improves administrative coordination, risk assessment and the coherence of national defence and security responsibilities."
MAD_MIL_HCDN_SPDSN_BASE: "HCDN and SPDSN Established"
MAD_MIL_HCDN_SPDSN_BASE_desc: "The High Council of National Defence and its Permanent Secretariat provide a standing interministerial framework for preparing and coordinating national defence and security policy across government."
MAD_MIL_EXECUTIVE_SECURITY_CONTINUITY_IDEA: "Executive Security Coordination"
MAD_MIL_EXECUTIVE_SECURITY_CONTINUITY_IDEA_desc: "National security coordination remains concentrated within the executive rather than being institutionalised through a standing cross-government council and permanent secretariat."
MAD_MIL_INTERNAL_CONTROL_FRAMEWORK: "Armed Forces Internal-Control Framework"
MAD_MIL_INTERNAL_CONTROL_FRAMEWORK_desc: "Internal control, risk management, professional conduct and procedures for reporting and investigating misconduct strengthen the Armed Forces' internal governance."
MAD_MIL_INTERNAL_INSPECTION_CAPACITY: "Expanded Military Inspection Services"
MAD_MIL_INTERNAL_INSPECTION_CAPACITY_desc: "The Ministry of Defence has expanded inspection capacity across the Land, Air and Naval branches, appointing inspectors to strengthen internal oversight and accountability."
MAD_MIL_GFSI_RAPID_RESPONSE: "Groupement des Forces Spéciales d'Intervention"
MAD_MIL_GFSI_RAPID_RESPONSE_desc: "A national reserve of special intervention forces operates under the General Staff's operational command for military security and specialised rapid-response operations."
MAD_MIL_DIRECTORATE_TRANSITION: "Military Directorate Transition Mandate"
MAD_MIL_DIRECTORATE_TRANSITION_desc: "The Military Directorate exercises a temporary transitional mandate. Its expanded administrative responsibilities increase bureaucracy and strain stability while giving the military a formal role in preparing a transfer of power."
MAD_MIL_CREATE_GFSI: "Establish the Groupement des Forces Spéciales d'Intervention"
MAD_MIL_CREATE_GFSI_desc: "Create the 2021 national reserve of special intervention forces under the General Staff's operational command, providing a specialised rapid-response and military security capability."
MAD_MILITARY_INSPECTORATE_IMPLEMENTATION: "Expand the Military Inspection Services"
MAD_MILITARY_INSPECTORATE_IMPLEMENTATION_desc: "Implement the 2024 inspection recommendations by appointing five inspectors in each of the Land, Air and Naval branches, extending internal oversight beyond the Land Army."
 MAD_POL_TGV_OFFICERS_OF_MARCH: "Reward the Officers of March"
 MAD_POL_TGV_OFFICERS_OF_MARCH_desc: "The 3 November 2009 promotion round rewarded officers who helped secure the March transfer of power. Noël Girardin Rakotonandrasana, André Ndriarijaona, Jean Bruno Wilfrid Razafindrakoto and Richard Ravalomanana entered the general officer corps. André Ndriarijaona’s earlier Army Chief of Staff appointment in March is preserved separately from his November promotion. Completing this focus promotes an already-serving André to Field Marshal; missing officers are recruited as Generals."
 MAD_POL_TGV_2013_OFFICER_PROMOTIONS: "Elevate the Senior Command"
 MAD_POL_TGV_2013_OFFICER_PROMOTIONS_desc: "The divisional-general promotions took effect on their historical dates: Richard Ravalomanana on 1 December 2012, Tafara Edmond and Rafenomanjato Mamy Jerison on 1 January 2013, and Béni Xavier Rasolofonirina on 1 September 2013. If this focus is completed, Richard is the sole Field Marshal from the round; the other three remain Generals and gain experience. If the focus is not completed, the historical promotions still occur on their dates."
 MAD_POL_HVM_OFFICER_PROMOTIONS: "Expand the General Officer Corps"
 MAD_POL_HVM_OFFICER_PROMOTIONS_desc: "The HVM administration continues the expansion of the general officer corps. The second-semester 2015 promotion list announced in February 2016 included Alphonse Ravelontsoa, Jean Louis Tombovelo, Roger Rakotomalala, Paulin Babity, Jean Noelson Fulgence Raharinirina, Marc Rakotomarolahy, Eddie Charles Razafindrakoto, Evariste Botojanina and Ludovic Pierre Ramarokoto. The same list records one additional officer only as \"Fomana\", without a fuller identity. A further 58 promotions in 2017 continued that expansion. The enlarged senior establishment strengthens the presidency's links to the armed forces but adds to long-term personnel costs."

# CNME establishment and successor FIS
MAD_POL_TGV_ESTABLISH_FIS: "Establish the FIS"
MAD_POL_TGV_ESTABLISH_FIS_desc: "Decide whether to establish a more powerful executive-directed Special Intervention Force or a force subject to stronger judicial oversight. The choice will shape the risks and costs of future internal-security operations."
MAD_military_refoundation.8.t: "Establish the Joint National Investigation Committee"
MAD_military_refoundation.8.d: "The transitional administration must decide how to establish the Commission nationale mixte d'enquête (CNME), an investigative body drawing on military and gendarmerie personnel. It is a temporary arrangement, not yet the later Special Intervention Force. Choose whether to strengthen administrative integrity while accepting higher bureaucratic costs, or to favour executive-led security coordination at the cost of political power while reducing police expenditure."
MAD_military_refoundation.8.a: "Create the CNME with administrative integrity safeguards"
MAD_military_refoundation.8.b: "Create the CNME under executive security coordination"
MAD_military_refoundation.20.t: "Establishing the FIS"
MAD_military_refoundation.20.d: "The government must decide how the Forces d'intervention spéciale (FIS) should operate. One option places the force under direct executive command, while the other gives it stronger judicial oversight. The institutional model will shape its costs, effectiveness and the prospects for the planned operation against Dahalo networks."
MAD_military_refoundation.20.a: "Empower the executive-run FIS"
MAD_military_refoundation.20.b: "Create a judicially supervised successor FIS"

MAD_TGV_CNME_INTEGRITY_MODEL: "CNME: Administrative Integrity Model"
MAD_TGV_CNME_INTEGRITY_MODEL_desc: "The CNME's initial design reduces the cost of anti-corruption measures, while its additional reporting and coordination requirements increase bureaucratic costs by 10%."
MAD_TGV_CNME_EXECUTIVE_MODEL: "CNME: Executive Coordination Model"
MAD_TGV_CNME_EXECUTIVE_MODEL_desc: "The CNME is closely directed by the executive. Political power generation is reduced by 15%, but the arrangement lowers police costs by 10%."
MAD_TGV_FIS_PARALLEL_SECURITY: "Executive-Directed FIS and DST"
MAD_TGV_FIS_PARALLEL_SECURITY_desc: "The FIS operates alongside the Internal Security Service (DST) under direct executive command. The model combines administrative savings with additional bureaucratic burdens, while weak judicial safeguards make Operation Tandroka substantially harder."
MAD_TGV_FIS_ACCOUNTABLE_SECURITY: "Judicially Supervised FIS and DST"
MAD_TGV_FIS_ACCOUNTABLE_SECURITY_desc: "The successor FIS operates with judicial oversight and alongside the DST. Its safeguards increase bureaucracy costs by 15%, while stronger accountability provides 5% more political power generation and reduces police costs by 5%. Its oversight improves the prospects for Operation Tandroka."
MAD_TGV_FIS_PARALLEL_SECURITY_LIMITED: "Executive-Directed FIS and DST (Limited)"
MAD_TGV_FIS_PARALLEL_SECURITY_LIMITED_desc: "A more limited form of the FIS operates alongside the Internal Security Service (DST) under direct executive command. Its administrative effects are less pronounced, while weak judicial safeguards still make Operation Tandroka harder."
MAD_TGV_FIS_ACCOUNTABLE_SECURITY_LIMITED: "Judicially Supervised FIS and DST (Limited)"
MAD_TGV_FIS_ACCOUNTABLE_SECURITY_LIMITED_desc: "A more limited form of the FIS operates alongside the DST with judicial oversight. Its administrative benefits and safeguards are more modest, but it still improves the prospects for Operation Tandroka."

MAD_DAHALO_TANDROKA_REQUIRES_FIS_TT: "Requires an established successor FIS. Complete the TGV focus Establish the FIS first."
MAD_DAHALO_FIS_DST_BACK: "Retain and Back the FIS and DST"
MAD_DAHALO_FIS_DST_BACK_desc: "After Operation Tandroka's failure, retain both the FIS and the Internal Security Service (DST). Their continued role preserves the executive's security apparatus, but future military operations will be less likely to succeed, cost 5 additional Rural Cooperation and inflict an additional 5% stability loss if they fail."
MAD_DAHALO_FIS_DST_DISMANTLE: "Dismantle the FIS and DST"
MAD_DAHALO_FIS_DST_DISMANTLE_desc: "Following Operation Tandroka's failure, disband the FIS and dismantle the DST's parallel role. This removes the institutional liability that would otherwise make later military operations harder."
MAD_DAHALO_FIS_REVIEW_PENDING: "Review of the FIS and DST is available."
MAD_DAHALO_FIS_REVIEW_RESOLVED: "The post-Tandroka review of the FIS and DST has been resolved."
MAD_TGV_FIS_ESTABLISHED: "The successor FIS has been established."
MAD_TGV_DST_ESTABLISHED: "The Internal Security Service (DST) remains active."
MAD_TGV_FIS_DIRECT_COMMAND: "The FIS is under direct executive command."
MAD_TGV_FIS_JUDICIAL_OVERSIGHT: "The FIS operates under judicial oversight."
MAD_TGV_FIS_DISMANTLED: "The FIS and DST have been dismantled."
MAD_DAHALO_FIS_POST_TANDROKA_LIABILITY: "The FIS and DST remain in place after Operation Tandroka's failure."
MAD_APOLLO21_EVENT_FIRED: "The Apollo 21 event has fired."
MAD_APOLLO21_SECURITY_RESPONSE: "The government has adopted a national-security response to Apollo 21."
MAD_APOLLO21_JUDICIAL_RESPONSE: "The government has placed Apollo 21 under judicial oversight."

mad_apollo21.1.t: "Apollo 21"
mad_apollo21.1.d: "On 20 July 2021, Malagasy authorities arrested six people in an investigation into an alleged attack on state security. Two days later, the public prosecutor said the suspects had planned to eliminate or neutralise several people, including President Andry Rajoelina. The government described the affair as a foiled plot, but officials did not disclose how advanced it was or provide enough public information to independently establish the full extent of the alleged conspiracy. The investigation places the administration under pressure to protect the presidency while demonstrating that the case will be handled lawfully."
mad_apollo21.1.a: "Treat Apollo 21 as a national-security emergency"
mad_apollo21.1.b: "Place the investigation under judicial oversight"
MAD_APOLLO21_SECURITY_POSTURE: "Apollo 21: National-Security Posture"
MAD_APOLLO21_SECURITY_POSTURE_desc: "The government has strengthened the security response following the alleged Apollo 21 conspiracy. The measures bring a temporary political and administrative benefit, alongside higher police expenditure."
MAD_APOLLO21_JUDICIAL_REVIEW: "Apollo 21: Judicial Review"
MAD_APOLLO21_JUDICIAL_REVIEW_desc: "The government has kept the Apollo 21 investigation under stronger judicial oversight, improving institutional credibility and the administration's anti-corruption capacity."
