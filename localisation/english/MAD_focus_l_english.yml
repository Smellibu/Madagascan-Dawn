 MAD_POLICY_TAMIMA_EXPORT_SYNDICATES_IDEA_desc: "Chartered merchant houses coordinate private export finance and logistics, with the associated risk of concentrated commercial influence."
 MAD_POLICY_MILITARY_ENGINEER_MANDATE_IDEA: "Military Engineer Corps Works Mandate"
 MAD_POLICY_MILITARY_ENGINEER_MANDATE_IDEA_desc: "The Engineer Corps has been assigned a standing national works mandate alongside its military responsibilities."
 MAD_POLICY_AREMA_MILLING_BOARD_IDEA: "Public Milling and Storage Board"
 MAD_POLICY_AREMA_MILLING_BOARD_IDEA_desc: "The state directly operates strategic milling, storage and local food-processing capacity."
 MAD_POLICY_TIM_EXPORT_CREDIT_IDEA: "Export Credit Guarantee Framework"
 MAD_POLICY_TIM_EXPORT_CREDIT_IDEA_desc: "The state underwrites part of private export-credit risk to protect supply chains and access to external markets."
 MAD_POLICY_TGV_VELIRANO_BONDS_IDEA: "Velirano Project Bonds"
 MAD_POLICY_TGV_VELIRANO_BONDS_IDEA_desc: "Sovereign-backed project bonds finance the selected infrastructure portfolio, increasing the state's financing exposure."
 MAD_POLICY_HVM_SME_COINVESTMENT_IDEA: "Malagasy SME Co-Investment Facility"
 MAD_POLICY_HVM_SME_COINVESTMENT_IDEA_desc: "Public capital is matched with private SME investment, including participation by external development-finance partners."
 MAD_POLICY_GRAZING_TRIBUNAL_PUBLIC_IDEA: "Public Grazing Claims Tribunal"
 MAD_POLICY_GRAZING_TRIBUNAL_PUBLIC_IDEA_desc: "A public tribunal provides a uniform process for grazing access, livestock losses and restitution."
 MAD_POLICY_GRAZING_TRIBUNAL_PRIVATE_IDEA: "Mutual Grazing Compensation Associations"
 MAD_POLICY_GRAZING_TRIBUNAL_PRIVATE_IDEA_desc: "Locally recognised mutual associations mediate grazing and compensation claims through negotiated agreements."
