 mad_drought.15.a: "Send help south"
 mad_drought.15.d: "The 2000 dry season has failed across the south. Harvests are badly reduced, water sources are falling, and families in the hardest-hit districts are beginning to move in search of food and water.\n\nToliara and the Grand Sud take the strongest shock."
 mad_drought.15.t: "The 2000 Southern Drought"
 mad_drought.16.a: "Open the relief routes"
 mad_drought.16.d: "Another failed season has tightened the food and water shortage in the south. The worst-hit communities face crop losses and households begin moving toward places where food and water can still be found.\n\nToliara takes the strongest shock and migration follows the gap between the hardest- and least-affected states."
 mad_drought.16.t: "The 2003 Southern Drought"
 mad_drought.17.a: "Protect the lean season"
 mad_drought.17.d: "A prolonged dry spell has turned a poor harvest into a food crisis in the south. The lean season stretches on, grain stocks thin out, and aid becomes necessary in the most exposed communities.\n\nThe Grand Sud takes the strongest shock."
 mad_drought.17.t: "The 2004–05 Southern Food Crisis"
 mad_drought.18.a: "Bring water and grain"
 mad_drought.18.d: "Rainfall has again failed across the south. Crops are suffering, household food stocks are shrinking, and the strain is greatest in Toliara and the surrounding drought-prone districts.\n\nThe worst-hit state sees a strong shock and renewed outward migration."
 mad_drought.18.t: "The 2009 Southern Drought"
 mad_drought.19.a: "Emergency relief again"
 mad_drought.19.d: "The next season brings another serious rainfall deficit in the south-west. Harvests fail in the most exposed areas and food insecurity deepens.\n\nThe drought map darkens in the most affected state, pushing another wave of migration toward the least-affected state."
 mad_drought.19.t: "The 2010 Southern Drought"
