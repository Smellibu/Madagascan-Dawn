 MAD_MADARAIL_OWNERSHIP_REVIEW: "Review Madarail's Ownership"
 MAD_MADARAIL_OWNERSHIP_REVIEW_desc: "The private consortium behind Madarail is not a fixed entity - stakes are bought, sold and refinanced among a handful of operators and investors. Pushing for a review of the arrangement may shift who effectively controls the railway's day-to-day operation, for better or worse."

