 ###### Ownership BOP decisions ######
 MAD_OWNERSHIP_BOP: "Economic Ownership and Development"
 MAD_OWNERSHIP_BOP_desc: "Use public and private programmes to shape economic development, or transfer selected state enterprises to private ownership. Each completed policy shifts the balance towards public provision or private enterprise."

 MAD_SELL_TELMA_PRIVATE: "Privatise TelMa"
 MAD_SELL_TELMA_PRIVATE_desc: "Sell TelMa back into private hands after its nationalisation."

 MAD_SELL_AIRLINE_PRIVATE: "Privatise Madagascan Airlines"
 MAD_SELL_AIRLINE_PRIVATE_desc: "Return Madagascan Airlines to private ownership after successful state control."

 MAD_SELL_JIRAMA_PRIVATE: "Privatise JIRAMA"
 MAD_SELL_JIRAMA_PRIVATE_desc: "Return JIRAMA to private ownership after choosing the public model."

 MAD_SELL_MADARAIL_PRIVATE: "Privatise Madarail"
 MAD_SELL_MADARAIL_PRIVATE_desc: "Sell Madarail back into private hands after nationalisation."

 MAD_SELL_GPM_PRIVATE: "Privatise Fuel Distribution"
 MAD_SELL_GPM_PRIVATE_desc: "Return the state-controlled fuel distribution system to private ownership."

 MAD_SELL_AMBATOVY_PRIVATE: "Privatise Ambatovy"
 MAD_SELL_AMBATOVY_PRIVATE_desc: "Return Ambatovy to private control after state participation."

 MAD_Rosewood: "Rosewood Controls"
 MAD_Rosewood_desc: "Madagascar's rosewood trade has left behind seized stockpiles, international scrutiny and a corruption problem that cannot be solved by a simple ban. First establish what the state actually controls, then decide whether to prioritise strict traceability or controlled domestic use."
 MAD_ROSEWOOD_STOCKPILE_AUDIT: "Audit the Rosewood Stockpiles"
 MAD_ROSEWOOD_STOCKPILE_AUDIT_desc: "Inventory, mark and secure the seized rosewood and ebony stockpiles. A credible chain of custody is the first condition for doing anything useful with timber already in state hands."
 MAD_ROSEWOOD_CITES_TRACEABILITY: "Enforce CITES Traceability"
 MAD_ROSEWOOD_CITES_TRACEABILITY_desc: "Keep the stockpile under strict verification and traceability rules. Madagascar's international credibility matters more than a quick sale, and a clean chain of custody can support conservation-linked investment and tourism."
 MAD_ROSEWOOD_DOMESTIC_USE: "Authorise Controlled Domestic Use"
 MAD_ROSEWOOD_DOMESTIC_USE_desc: "Permit verified stockpiles to be used inside Madagascar for public buildings and tightly controlled artisan production. This releases some trapped value now, but a politicised enforcement system makes leakage and corruption more likely."

 MAD_SPAT: "SPAT Operations Continue"
 MAD_SPAT_desc: "Keep Toamasina under its autonomous public port authority. SPAT keeps the port in domestic hands, but it must become more commercially capable if it is to carry the expansion burden itself."
 MAD_SPAT_STRENGTHEN_AUTHORITY: "Strengthen SPAT's Authority"
 MAD_SPAT_STRENGTHEN_AUTHORITY_desc: "Give SPAT stronger commercial and operational capacity so the autonomous port authority can plan investment, manage terminals and prepare Toamasina for the next expansion. The payoff is a more capable public gateway rather than a private concession."
 MAD_TOAMASINA_JICA_EXPANSION_desc: "Expand Toamasina's berths, access infrastructure and terminal capacity with Japanese financing. The project can follow either the private ICTSI route or a strengthened public SPAT route; in both cases it turns the port into a larger gateway for the national economy."

 MAD_mining_code_reform: "Rewrite the Mining Code"
 MAD_mining_code_reform_desc: "Replace the old mining framework with clearer fiscal, environmental and social rules."
 MAD_END_PERMIT_FREEZE: "Reopen the Mining Registry"
 MAD_END_PERMIT_FREEZE_desc: "Resume the processing of pending mining permit applications and clear the regulatory bottleneck. A working registry lets legitimate exploration and development projects move again instead of leaving permits frozen indefinitely."
 MAD_MINING_LOCAL_BENEFIT_FUND: "Make Mining Pay Locally"
 MAD_MINING_LOCAL_BENEFIT_FUND_desc: "Create a visible local and regional return from mineral development. New community investment rules make the mining sector more productive and more defensible by ensuring extraction leaves something behind where it happens."
 MAD_2009_Sanctions_desc: "The post-coup government loses preferential access to the US market. The shock falls hardest on export-oriented activity, especially the apparel sector, while investment becomes harder to attract and economic uncertainty deepens."
 MAD_POL_ROY_SUMMON_HOUSES: "Summon the Houses of Madagascar"
 MAD_POL_ROY_SUMMON_HOUSES_desc: "The royalist movement must bring together associations and authorities whose histories and traditions are not identical. Building a national constituency requires negotiation between these different institutions, rather than treating every community as part of one royal hierarchy."
 MAD_POL_ROY_MALAGASY_TRADITION: "Fihavanana and Hasina"
 MAD_POL_ROY_MALAGASY_TRADITION_desc: "Fihavanana expresses bonds of kinship, solidarity and mutual obligation, while hasina refers to sacred authority and the legitimacy associated with respected leadership. The royalist movement draws on these concepts to present its programme as rooted in Malagasy political culture, while recognising that their meanings and practice differ across communities."
 MAD_POL_ROY_SACRED_CONSTITUTION: "A New Constitutional Order"
 MAD_POL_ROY_SACRED_CONSTITUTION_desc: "The movement seeks to replace the republican constitutional order with a Malagasy settlement grounded in the country's political traditions. It has yet to resolve whether legitimacy will rest primarily with a personal sovereign or a council representing the Houses; the rupture within the royalist movement has made that question unavoidable."
 MAD_POL_ROY_CROWN_QUESTION: "The Question of the Crown"
 MAD_POL_ROY_CROWN_QUESTION_desc: "Ndriana Rabarioelina's expulsion from TAMIMA has split the royalist movement. His supporters argue for authority centred on his personal claim to the Imerina Crown, while TAMIMA's collective project looks to the associations and Houses it represents. The movement must now decide which of these rival political directions will shape the restoration."
 MAD_POL_ROY_KINGS_MANDATE: "The King's Mandate"
 MAD_POL_ROY_KINGS_MANDATE_desc: "Ndriana's claim to the historic kingship of Imerina becomes the foundation of the restored state. Executive authority rests personally with the Crown, while the wider Andriana associations remain institutions of counsel and support. The new monarchy is organised around Ndriana's authority rather than a collective government of the Houses."
 MAD_POL_ROY_CROWN_ABOVE_NOBILITY: "Christ the King of Kings"
 MAD_POL_ROY_CROWN_ABOVE_NOBILITY_desc: "In this branch, the personal Crown is placed above the noble Houses. The King claims final authority, with princes and other noble representatives serving within a hierarchy centred on the sovereign. The movement presents this arrangement through a Christian ideal of righteous kingship, rather than government by a council of equal Houses."
 MAD_POL_ROY_CHRIST_KING: "Servants of Righteousness"
 MAD_POL_ROY_CHRIST_KING_desc: "Ndriana's Christian programme presents public office as a moral responsibility under the Crown. The administration is expected to resist patronage, corruption and arbitrary rule, with Christian teaching shaping the standards by which officials are judged. The aim is to restore confidence in government through disciplined and responsible public service."
 MAD_POL_ROY_LEGAL_ORDER: "Recast the Legal Order"
 MAD_POL_ROY_LEGAL_ORDER_desc: "Madagascar's legal order draws on French-derived civil law, national legislation and customary practices that continue to shape matters such as land, inheritance and local dispute resolution. Ndriana's programme seeks a Malagasy constitutional settlement that gives traditional authorities a clearer place in public life. The Crown must decide how customary rules will be recognised alongside national law and equal legal protections."
 MAD_POL_ROY_FINANCIAL_REFORM: "Monetary and Financial Reform"
 MAD_POL_ROY_FINANCIAL_REFORM_desc: "A restored state needs credible public finances before it can pursue a wider programme. Debt obligations, limited revenue and reliance on external finance constrain the choices available to any government. Ndriana's programme therefore places fiscal stability and greater control over financial policy ahead of a return to normal party competition."
 MAD_POL_ROY_MALAGASY_LAND_FARMERS: "Malagasy Land for Malagasy Farmers"
 MAD_POL_ROY_MALAGASY_LAND_FARMERS_desc: "The Crown's land programme argues that land should remain a secure foundation for Malagasy livelihoods. It seeks to protect smallholder access, strengthen land tenure and ensure that agricultural investment respects the rights of local communities. The restoration's claim to national sovereignty must have practical meaning for the people who cultivate the land."
 MAD_POL_ROY_COUNCIL_OF_KINGS: "Convene the Royal and Noble Houses"
 MAD_POL_ROY_COUNCIL_OF_KINGS_desc: "Bring dynastic claimants, noble associations and recognised traditional authorities into a common forum in Antananarivo. The assembly provides a place for consultation before the movement settles the source and limits of national authority. It is a proposed institution of the alternative settlement, not the revival of a single historical parliament shared by all Malagasy communities."
 MAD_POL_ROY_LIVING_FORCES: "The Living Forces of the Nation"
 MAD_POL_ROY_LIVING_FORCES_desc: "The restoration cannot govern through royal and noble associations alone. It needs a wider national coalition of professionals, workers, researchers, business groups and organised communities. Bring these constituencies into the political settlement and give them a lasting role in the country's intellectual and administrative life."
 MAD_POL_ROY_NATIONAL_TRUST: "The National Wealth Is a National Trust"
 MAD_POL_ROY_NATIONAL_TRUST_desc: "The Crown proposes treating Madagascar's mineral, forestry and energy wealth as a national trust. Resource development should retain more value within the country through local processing, Malagasy skills and transparent agreements, while ensuring that communities near extraction projects share in their benefits. The objective is to move beyond exporting raw materials with too little lasting value retained at home."
 MAD_POL_ROY_ENDOGENOUS_DEVELOPMENT: "Endogenous Development"
 MAD_POL_ROY_ENDOGENOUS_DEVELOPMENT_desc: "The Crown's development programme seeks to build economic capacity from within Madagascar rather than depend indefinitely on imported expertise and external capital. Stronger technical education, scientific research, domestic enterprise and local production are intended to reinforce one another. Malagasy industry must be able to develop its own skills, suppliers and productive capabilities."
 MAD_POL_ROY_SACRED_HERITAGE: "Restore the Sacred Heritage"
 MAD_POL_ROY_SACRED_HERITAGE_desc: "The Crown places the Rova of Antananarivo and the wider royal landscape of Imerina at the centre of national heritage. Royal tombs, historic sites and sacred places carry memories of the kingdom and its people. Their preservation is intended to reconnect the restored monarchy with the history of Imerina while presenting that heritage as part of Madagascar's wider national story."
 MAD_POL_ROY_BIBLICAL_GEOPOLITICS: "Biblical Geopolitics"
 MAD_POL_ROY_BIBLICAL_GEOPOLITICS_desc: "Ndriana's royal theology links the Imerina dynastic claim to an Abrahamic inheritance and argues that Madagascar should stand with Israel and the wider Judeo-Christian world. This is the religious and political doctrine of his movement, not an established historical account of Malagasy royal genealogy. The government must decide whether this conviction becomes a formal foreign-policy commitment, practical cooperation or a matter of religious and scholarly affinity."
 MAD_POL_ROY_TRUE_SOVEREIGNTY: "True National Sovereignty"
 MAD_POL_ROY_TRUE_SOVEREIGNTY_desc: "The movement treats sovereignty as more than formal independence: it also means having the ability to shape the country's financial and productive future. The Crown seeks greater control over strategic investment, public debt and the terms on which foreign capital develops Malagasy resources. Economic independence must be balanced with the technology, finance and trade relationships required for growth."
 MAD_POL_ROY_REGIONAL_HOUSES: "Recognise the Regional Houses"
 MAD_POL_ROY_REGIONAL_HOUSES_desc: "Madagascar's traditional authorities have distinct histories and sources of legitimacy. Sakalava dynastic traditions, the different historical political traditions of Betsileo communities, Antemoro noble and religious lineages, and the local authorities of Antanala and Antambahoaka communities cannot be treated as interchangeable forms of kingship. Ndriana's government seeks negotiated recognition for these institutions, giving regional authorities a place in the restored kingdom without imposing a single model of royal rule across the island."
 MAD_POL_ROY_NEW_KINGDOM: "The New Kingdom of Madagascar"
 MAD_POL_ROY_NEW_KINGDOM_desc: "Ndriana's supporters extend his personal Imerina royal claim into a national project: a new Kingdom of Madagascar under the Crown. Its political identity combines the Imerina dynastic claim, Christian state principles and negotiated recognition of regional traditional authorities. This is a modern restoration programme and an alternative political settlement, not the uninterrupted continuation of the historic Merina monarchy."
 MAD_POL_ROY_TAMIMA_SACRED_HERITAGE: "Guard the Sacred Heritage"
 MAD_POL_ROY_TAMIMA_SACRED_HERITAGE_desc: "TAMIMA's heritage programme seeks to document and preserve the histories of the island's Andriana associations and traditional communities. Genealogies, royal tombs, sacred sites, manuscripts and local customs form part of a heritage that cannot be reduced to a single royal tradition. Preservation should be pursued with the communities and institutions that maintain these traditions."
 MAD_POL_ROY_CROWNLESS_CONSTITUTION: "The Crown Without a King"
 MAD_POL_ROY_CROWNLESS_CONSTITUTION_desc: "Replace the provisional council arrangement with a written constitution rooted in the negotiated settlement of the Houses, local customary institutions and representative government. The new order gives collective institutions a constitutional role without placing a hereditary monarch at the head of the state."
 MAD_POL_ROY_ONE_MADAGASCAR_MANY_HOUSES_FINAL: "One Madagascar, Many Houses"
 MAD_POL_ROY_ONE_MADAGASCAR_MANY_HOUSES_FINAL_desc: "The Houses and their constituent associations are brought into a shared national settlement without a sovereign throne. Their histories and customs remain distinct, but they are represented within one constitutional order and one Malagasy state."
 MAD_POL_ROY_TAMIMA_COUNCIL_GOVERNMENT: "Council Government"
 MAD_POL_ROY_TAMIMA_COUNCIL_GOVERNMENT_desc: "Establish the council of Houses as a permanent part of national government under the new constitution. Political authority is exercised through collective representation and renewed elections, allowing smaller associations and political groupings to participate in public life without restoring a personal monarchy."
 MAD_POL_ROY_TAMIMA_COUNCIL: "TAMIMA: The National Council of Houses"
 MAD_POL_ROY_TAMIMA_COUNCIL_desc: "TAMIMA, the Fiombonambe Taranaka Andriana Miray eto Madagasikara, brings together associations of Andriana descendants from across Madagascar. Ndriana Rabarioelina's expulsion from TAMIMA created the rupture that divided the royalist movement. TAMIMA's political project places collective representation by its associations and Houses, rather than Ndriana's personal Imerina claim, at the centre of the proposed settlement."
 MAD_POL_ROY_FIHAVANANA: "Fihavanana Before Faction"
 MAD_POL_ROY_FIHAVANANA_desc: "Fihavanana, often expressed through kinship, solidarity and mutual responsibility, provides a social principle for TAMIMA's wider political settlement. Its purpose is to encourage cooperation between communities and organised groups, grounding national government in obligations that extend beyond the interests of individual Houses."
 MAD_POL_ROY_ANTENIMIERAN_ANDRIANA: "The Antenimieran'ny Andriana"
 MAD_POL_ROY_ANTENIMIERAN_ANDRIANA_desc: "Establish the Antenimieran'ny Andriana as a proposed upper chamber representing TAMIMA's constituent noble associations and recognised Houses. It gives the Andriana a permanent place in the national constitutional settlement and provides a forum for collective deliberation. This is a new institution within the alternative political order, not a claim that an equivalent nationwide nobles' parliament existed historically."
 MAD_POL_ROY_TAMIMA_REPRESENT_LIVING_FORCES: "Represent the Living Forces"
 MAD_POL_ROY_TAMIMA_REPRESENT_LIVING_FORCES_desc: "TAMIMA's council cannot rely on noble descent alone to govern the country. Its constitutional settlement must also include recognised local authorities, professional associations, workers, researchers and business organisations. Customary institutions can contribute to national governance while remaining connected to the responsibilities and protections of the modern state."
 MAD_POL_ROY_TAMIMA_LIVING_FORCES: "TAMIMA Living Forces"
 MAD_POL_ROY_RESTORE_FOKONOLONA: "Restore the Fokonolona"
 MAD_POL_ROY_RESTORE_FOKONOLONA_desc: "Place the Fokonolona, the village community assembly, at the foundation of local government. Communities gain a greater role in shared resources, local agreements and mutual assistance. This village-level institution is distinct from the national Antenimieran'ny Andriana, giving the council constitution a local basis beyond the noble associations in the capital."
 MAD_POL_ROY_DINA_CUSTOMARY_JUSTICE: "Dina and Customary Justice"
 MAD_POL_ROY_DINA_CUSTOMARY_JUSTICE_desc: "Recognise Dina, locally rooted agreements used by communities to regulate shared life and resolve disputes, as part of the constitutional settlement. Their place in national governance must be clearly defined, with safeguards for due process and individual rights and consistency with national law. Customary justice should complement public institutions rather than operate beyond their protections."

 MAD_POL_MIL_TAKES_RESPONSIBILITY: "The FPA Takes Political Responsibility"
 MAD_POL_MIL_TAKES_RESPONSIBILITY_desc: "The FPA has moved from a political network able to influence events to a formal participant in the post-crisis settlement. Its role now depends on how the crisis was resolved: it may assume executive responsibility after a military transfer, govern following victory in the civil war, or take part in a negotiated civilian settlement. Its mandate will be judged by its ability to administer services, restore confidence and establish a durable settlement."
 MAD_POL_MIL_CHAIN_OF_COMMAND: "Restore the Chain of Command"
 MAD_POL_MIL_CHAIN_OF_COMMAND_desc: "Rebuild a disciplined command structure before allowing the armed forces to take a larger political role."
 MAD_POL_MIL_PROTECT_BALLOT: "The Military Party and the Ballot"
 MAD_POL_MIL_PROTECT_BALLOT_desc: "The FPA accepts electoral competition as the test of its political mandate. Following a direct military transfer, party 22 remains in government while accepting elections. After a negotiated civilian settlement, the FPA supports the agreed executive and coalition as the country prepares for constitutional competition."
 MAD_POL_MIL_PROTECT_BALLOT_ELECTION_BAN_TT: "The FPA will no longer be able to ban elections while it remains in power."
 MAD_POL_MIL_FINAL_ARBITER: "The Military's Reserved Veto"
 MAD_POL_MIL_FINAL_ARBITER_desc: "After a direct military transfer or military victory, the FPA retains the right to overrule civilian institutions when it judges the national interest to be threatened. Under a negotiated settlement, it seeks to secure a veto within the agreed political framework, giving the movement influence over decisions it regards as vital to the national interest."
 MAD_POL_MIL_CAPSAT_LESSON: "Remember Camp CAPSAT"
 MAD_POL_MIL_CAPSAT_LESSON_desc: "CAPSAT's defiance of the military hierarchy demonstrated how a unit could operate outside the normal chain of command and organise mutinous activity through its own networks. Its leaders challenged established military authority, encouraged other soldiers to break with their commanders and exposed the danger of politically aligned units acting independently of the defence leadership. The new military order must decide whether such units remain autonomous political forces or return under a unified command."
 MAD_POL_MIL_NEVER_DIVIDED: "Never Again a Divided Army"
 MAD_POL_MIL_NEVER_DIVIDED_desc: "Make chain of command, officer cohesion and unified orders matters of political survival."
 MAD_POL_MIL_SOUTHERN_SECURITY: "Restore State Presence in the Grand Sud"
 MAD_POL_MIL_SOUTHERN_SECURITY_desc: "The South needs more than periodic security operations. The government must connect rural administration, public services, food logistics and lawful security. The purpose is to restore state presence and reduce the space in which cattle raiding and local violence can displace public authority."
 MAD_POL_MIL_GENDARMERIE_REFORM: "A Gendarmerie Under Law"
 MAD_POL_MIL_GENDARMERIE_REFORM_desc: "A rural public-order force must be answerable to law and civilian administration. Its mission is prevention, patrol coverage, lawful response and reliable rural service, not political policing or a parallel presidential command network."
 MAD_POL_MIL_ENGINEERS: "National Reconstruction Works"
 MAD_POL_MIL_ENGINEERS_desc: "Engineering capacity should restore roads, water and electricity infrastructure, bridge remote areas to markets and strengthen the productive base. The same skills can support a limited domestic defence industry alongside the country's wider reconstruction programme."
 MAD_POL_MIL_MARITIME_SECURITY: "Watch the Indian Ocean"
 MAD_POL_MIL_MARITIME_SECURITY_desc: "Build on telecommunications and maritime-awareness work to turn Madagascar's maritime domain into a genuine security responsibility."
 MAD_POL_MIL_MULTILATERAL_DOCTRINE: "A Multilateral Defence Doctrine"
 MAD_POL_MIL_MULTILATERAL_DOCTRINE_desc: "Use training and defence cooperation with foreign partners without surrendering the political independence of the armed forces."
 MAD_POL_MIL_ASSEMBLIES: "National Consultation and Reconciliation"
 MAD_POL_MIL_ASSEMBLIES_desc: "The transition cannot be legitimised by the armed forces alone. It must engage religious authorities, political movements, civic organisations, trade unions, regional representatives, youth and communities affected by the crisis. Consultation should define rules for constitutional renewal and security governance, not simply distribute positions among established elites."
 MAD_POL_MIL_CLEAN_UNIFORM: "Public Accounts and Integrity"
 MAD_POL_MIL_CLEAN_UNIFORM_desc: "Refoundation requires public accounts, procurement, customs and state-enterprise contracts to become more transparent. The administration must distinguish a consistent integrity programme from a selective campaign against political opponents. Begin with stronger public-accountability rules and transparent procurement standards."
 MAD_POL_MIL_REFOUNDATION: "Adopt the Refoundation Programme"
 MAD_POL_MIL_REFOUNDATION_desc: "The government has established its mandate, engaged political and civic constituencies, and committed to public accountability. It can now begin the work of refoundation through specific policies: reliable services, a more productive economy, digitally capable administration, decentralised public authority and a credible constitutional settlement."
 MAD_POL_MIL_CIVILIAN_GUARDIANSHIP: "A Credible Electoral Settlement"
 MAD_POL_MIL_CIVILIAN_GUARDIANSHIP_desc: "Keep party 22 in government while preparing constitutional competition, a trusted CENI, revised electoral rules and a referendum. The transition will depend on institutions capable of administering credible elections and respecting the outcome."
 MAD_AREMA_REBUILDING: "AREMA Rebuilding"
 MAD_AREMA_REBUILDING_desc: "Reassemble the party's political organisation and prepare its return to national government."
 MAD_POL_AREMA_CHOOSE_OLD_GUARD: "The Ratsiraka Tradition"
 MAD_POL_AREMA_CHOOSE_OLD_GUARD_desc: "AREMA became the dominant political organisation of Didier Ratsiraka's Second Republic. Its identity was shaped by the Malagasy Socialist Revolution and the Red Book, which placed national sovereignty, state-directed development and non-alignment at the centre of government. The old guard seeks to restore that political tradition while confronting the failures of its original economic model."
 MAD_POL_AREMA_CHOOSE_RENEWAL: "Renew the Movement"
 MAD_POL_AREMA_CHOOSE_RENEWAL_desc: "Adapt AREMA to a competitive political system while keeping social provision at the heart of its programme."
 MAD_POL_AREMA_CHOOSE_RECONCILIATION: "Reconcile the Movement"
 MAD_POL_AREMA_CHOOSE_RECONCILIATION_desc: "Put factional conflict behind AREMA and rebuild its legitimacy through national compromise and institutional stability."
 MAD_POL_AREMA_REVOLUTIONARY_ORGANISATION: "Rebuild the Revolutionary Organisation"
 MAD_POL_AREMA_REVOLUTIONARY_ORGANISATION_desc: "AREMA once organised the political establishment of the Second Republic through the National Front for the Defence of the Revolution, a wider coalition of parties dominated by Ratsiraka's movement. Rebuilding its organisation means restoring a national political network, strengthening provincial administration and mobilising support beyond Antananarivo. The objective is to recover the organisational reach of the former governing movement without assuming that the old political structure can simply be recreated."
 MAD_POL_AREMA_OLD_GUARD_ADAPT: "Discipline the State Apparatus"
 MAD_POL_AREMA_OLD_GUARD_ADAPT_desc: "The original socialist programme relied on nationalisation, administrative controls and central economic planning. Economic difficulties, shortages and weaknesses in public investment eventually forced Ratsiraka's government to reconsider parts of that model and introduce more market-oriented reforms. The old guard must now decide which institutions remain valuable and which failures of the earlier system must not be repeated."
 MAD_POL_AREMA_RENEWAL_PROGRAMME: "Renew the Social Programme"
 MAD_POL_AREMA_RENEWAL_PROGRAMME_desc: "Translate AREMA's social commitments into a practical programme for agriculture, education and public services."
 MAD_POL_AREMA_RENEWAL_MODERNISE: "Modernise the Movement"
 MAD_POL_AREMA_RENEWAL_MODERNISE_desc: "Pair social provision with productivity and a more workable relationship with investment and private enterprise."
 MAD_POL_AREMA_RECONCILIATION_PACT: "A National Reconciliation Pact"
 MAD_POL_AREMA_RECONCILIATION_PACT_desc: "Build the broad political settlement needed for AREMA to return as a credible national governing party."
 MAD_POL_AREMA_RECONCILIATION_INSTITUTIONALISE: "Institutionalise the Settlement"
 MAD_POL_AREMA_RECONCILIATION_INSTITUTIONALISE_desc: "Turn reconciliation into durable institutions, stronger local administration and a government outsiders can work with."
 MAD_POL_AREMA_REBUILD: "Rebuild AREMA"
 MAD_POL_AREMA_REBUILD_desc: "Restore AREMA as a governing movement rather than a relic of the Ratsiraka era. Once this first AREMA-in-power focus is completed, AREMA's secular-republican policy on historic royal houses applies while the party governs and is removed when it loses power."
 MAD_POL_AREMA_REVOLUTION_ADAPTS: "The Revolution Must Adapt"
 MAD_POL_AREMA_REVOLUTION_ADAPTS_desc: "Decide whether the movement restores the old state-led model or builds a modern Malagasy socialism."
 MAD_POL_AREMA_STATE_LEADS: "The Malagasy State Must Lead"
 MAD_POL_AREMA_STATE_LEADS_desc: "The Red Book envisaged a state capable of directing investment, coordinating production and using public enterprises to support national development. AREMA now seeks to restore that responsibility to government, concentrating public resources on strategic infrastructure, essential services and industries that private capital alone may neglect. The objective is not simply to expand state ownership, but to give the government a more deliberate role in shaping the country's economic priorities."
 MAD_POL_AREMA_STRATEGIC_ENTERPRISES: "Strategic Enterprises in Public Hands"
 MAD_POL_AREMA_STRATEGIC_ENTERPRISES_desc: "Use the existing public-private ownership balance to bring strategic utilities, transport and energy back toward public control."
 MAD_POL_AREMA_FOKONOLONA: "Fokonolona and the Rural World"
 MAD_POL_AREMA_FOKONOLONA_desc: "Build development around Malagasy communal institutions and rural society rather than treating the countryside simply as a source of exports."
 MAD_POL_AREMA_FOOD_FIRST: "Food Before Export"
 MAD_POL_AREMA_FOOD_FIRST_desc: "Use agricultural reform to prioritise food security and the domestic economy before export maximisation."
 MAD_POL_AREMA_INDEPENDENCE: "Malagasy Economic Independence"
 MAD_POL_AREMA_INDEPENDENCE_desc: "Ratsiraka's early economic programme sought to strengthen Malagasy control over strategic sectors previously dominated by foreign interests. This policy of economic decolonisation treated ownership of key industries as part of national sovereignty, but also exposed the state to the costs and responsibilities of managing major enterprises. AREMA now revisits that approach, weighing domestic control against the capital, technology and expertise needed for development."
 MAD_POL_AREMA_INDIAN_OCEAN: "The Indian Ocean Is Ours"
 MAD_POL_AREMA_INDIAN_OCEAN_desc: "Ratsiraka sought to keep Madagascar outside the established Western power blocs through a policy of non-alignment. His government developed relationships with countries including Cuba, North Korea, Libya and Iran, presenting diplomatic independence as an extension of national sovereignty. AREMA now seeks to recover that freedom of diplomatic manoeuvre while adapting it to Madagascar's present economic and strategic interests."
 MAD_POL_AREMA_PROVINCES: "Return to Provincial Autonomy"
 MAD_POL_AREMA_PROVINCES_desc: "The alternative is a more decentralised state in which territorial governments receive a larger share of responsibility."
 MAD_POL_AREMA_MIXED_ECONOMY: "A Mixed Malagasy Economy"
 MAD_POL_AREMA_MIXED_ECONOMY_desc: "Learn from the limits of the old state economy without abandoning the role of government in strategic sectors."
 MAD_POL_AREMA_STRATEGIC_INVESTMENT: "Strategic Investment Under Malagasy Control"
 MAD_POL_AREMA_STRATEGIC_INVESTMENT_desc: "Foreign capital can participate where it strengthens Malagasy development rather than displacing it."
 MAD_POL_AREMA_ECO_SOCIAL_REPUBLIC: "An Ecological Social Republic"
 MAD_POL_AREMA_ECO_SOCIAL_REPUBLIC_desc: "Translate modern AREMA's social and ecological language into the state-led development model."
 MAD_POL_AREMA_SECOND_SOCIALISM: "The Second Malagasy Socialism"
 MAD_POL_AREMA_SECOND_SOCIALISM_desc: "The first Malagasy socialist experiment demonstrated both the possibilities and limitations of state-directed development. Public ownership and national planning offered a means of pursuing economic independence, but excessive administrative controls, poorly coordinated investment and mounting financial pressures undermined the model. A second Malagasy socialism must retain strategic public direction while building a more productive, financially sustainable economy."

 MAD_POL_TIM_RETURN: "Return to Madagascar Naturally"
 MAD_POL_TIM_RETURN_desc: "Tiako i Madagasikara emerged as the political vehicle of Marc Ravalomanana's challenge to the existing political establishment. Its rise was closely associated with his business background, his mayoralty in Antananarivo and a promise of more effective administration and economic recovery. The movement's development vision, Madagascar Naturellement, sought to modernise the country through better governance, infrastructure, human development and a stronger private sector."
 MAD_POL_TIM_TRUST: "A Government Citizens Can Trust"
 MAD_POL_TIM_TRUST_desc: "TIM's original appeal rested partly on the promise of more effective administration, economic recovery and a break with entrenched political interests. The early years of government brought renewed growth, but later concerns over political concentration, public contracting and conflicts of interest weakened confidence. A renewed TIM government must demonstrate that public institutions can act independently of the ruling party and its business allies."
 MAD_POL_TIM_BUSINESS_SEPARATION: "Separate Business From Government"
 MAD_POL_TIM_BUSINESS_SEPARATION_desc: "Ravalomanana entered politics as the founder of TIKO, a Malagasy food and retail conglomerate that became one of the country's largest domestic businesses. His commercial background informed TIM's approach to private-sector development, but his position as president also raised concerns over conflicts of interest and the influence of private business on public decisions. Government procurement, regulatory authority and private ownership must now be clearly separated."
 MAD_POL_TIM_NATIONAL_CHAMPION: "Build a Malagasy National Champion"
 MAD_POL_TIM_NATIONAL_CHAMPION_desc: "The growth of TIKO demonstrated the potential for Malagasy-owned companies to become major industrial and commercial groups. Rather than treating domestic business success as a threat, the government can help build nationally owned enterprises through investment, infrastructure and fair access to finance. The challenge is to support domestic champions without recreating the political privileges and conflicts of interest associated with the TIKO controversy."
 MAD_POL_TIM_CONNECT_ISLAND: "Connect the Island"
 MAD_POL_TIM_CONNECT_ISLAND_desc: "Modern roads, ports, rail and communications are the foundation of the MAP development programme."
 MAD_POL_TIM_TIKO_COMPETITION: "Tiko and the Competition Question"
 MAD_POL_TIM_TIKO_COMPETITION_desc: "TIKO's expansion raised a central question for Madagascar's political economy: how can the country encourage successful domestic corporations without allowing one group to dominate access to markets and government? The government must choose whether to prioritise competition policy and independent regulation or use nationally owned companies as instruments of economic development."
 MAD_POL_TIM_MAP: "The Madagascar Action Plan"
 MAD_POL_TIM_MAP_desc: "The Madagascar Action Plan translated the government's national development vision into a coordinated programme of reform and investment. Its eight commitments covered responsible governance, connected infrastructure, education, rural development, health, economic growth, environmental protection and national solidarity. The plan sought to combine public-sector reform with investment and private-sector development, treating poverty reduction as a national programme rather than a collection of isolated projects."
 MAD_POL_TIM_GREEN_REVOLUTION: "A Green Revolution for Madagascar"
 MAD_POL_TIM_GREEN_REVOLUTION_desc: "Use agricultural reform to raise output, improve rural incomes and reduce the vulnerability of the food economy."
 MAD_POL_TIM_LAND_TITLES: "Title the Land"
 MAD_POL_TIM_LAND_TITLES_desc: "Clear property rights make smallholder investment and outside investment less dependent on administrative connections."
 MAD_POL_TIM_OPEN_ECONOMY: "Open the Economy"
 MAD_POL_TIM_OPEN_ECONOMY_desc: "The liberal path reaches its natural conclusion when private fuel, telecom, utility, rail or foreign-investment systems are actually working."
 MAD_POL_TIM_DECENTRALISE: "Put the Fokontany to Work"
 MAD_POL_TIM_DECENTRALISE_desc: "Give local administration a real role in delivering the development programme."
 MAD_POL_TIM_ENVIRONMENT: "Cherish the Environment"
 MAD_POL_TIM_ENVIRONMENT_desc: "Combine the MAP's environmental commitments with the modern rosewood and protected-area problems already confronting Madagascar."
 MAD_POL_TIM_RECONCILIATION: "National Reconciliation"
 MAD_POL_TIM_RECONCILIATION_desc: "End the politics of permanent transition and contest by rebuilding a shared democratic settlement."
 MAD_POL_TIM_REFUND_THE_REPUBLIC: "Re-found the Republic"
 MAD_POL_TIM_REFUND_THE_REPUBLIC_desc: "Ravalomanana's presidency demonstrated how quickly a capable political and business network could drive national development, but also how vulnerable public institutions become when too much influence is concentrated around a single leader. Controversies surrounding TIKO, government contracting and presidential authority weakened confidence in the administration. A second TIM government must build lasting institutions able to regulate the economy and scrutinise the executive independently."

 MAD_POL_TGV_YOUTH_READY: "The Youth Are Ready"
 MAD_POL_TGV_YOUTH_READY_desc: "Tanora malaGasy Vonona emerged as the political movement behind Andry Rajoelina's rise in Antananarivo. Rajoelina was an entrepreneur with substantial interests in the capital's media and advertising industries, and his political appeal drew on his public profile, younger supporters and dissatisfaction with the established political leadership. TGV now seeks to turn that following into a durable national political organisation."
 MAD_POL_TGV_2009_LEGACY: "What is TGV's mandate?"
 MAD_POL_TGV_2009_LEGACY_desc: "The confrontation with Ravalomanana escalated after the government closed Rajoelina's Viva television station. Public demonstrations brought together opposition parties, dissatisfied citizens and supporters of the mayor, turning a dispute over media freedom and political authority into a wider national crisis. Military mutinies and pressure on the presidency culminated in Ravalomanana's departure and the establishment of the High Transitional Authority under Rajoelina. TGV must now decide whether to treat this rupture as a continuing political mandate or establish legitimacy through constitutional government."
 MAD_POL_TGV_FOURTH_REPUBLIC: "The Fourth Republic"
 MAD_POL_TGV_FOURTH_REPUBLIC_desc: "The Fourth Republic was established through a new Constitution approved by referendum during Rajoelina's period as head of the High Transitional Authority. Although it provided a new constitutional framework, the process remained disputed by opposition groups and much of the international community. The new republic must build legitimacy through functioning institutions, credible elections and a constitutional order that commands broader political acceptance."
 MAD_POL_TGV_RETURN_BALLOT: "Return Through the Ballot Box"
 MAD_POL_TGV_RETURN_BALLOT_desc: "The end of the transitional period requires TGV to demonstrate that its authority rests on electoral support rather than the political arrangements of the transition. The compromise surrounding the return to elections kept both Rajoelina and Ravalomanana from standing, and Rajoelina instead backed Hery Rajaonarimampianina, who won the presidency. In this alternative path, TGV must establish its own electoral mandate and accept the responsibilities of constitutional government."
 MAD_POL_TGV_THIRTEEN_VELIRANO: "The Thirteen Velirano"
 MAD_POL_TGV_THIRTEEN_VELIRANO_desc: "The thirteen Velirano are the commitments associated with Rajoelina's political programme. They set out promises for national development, improved public services and a more visible state response to everyday problems. The challenge is to turn these commitments into funded programmes with measurable results, rather than allowing them to remain electoral declarations."
 MAD_POL_TGV_EMERGENCE_INITIATIVE: "The Emergence Initiative"
 MAD_POL_TGV_EMERGENCE_INITIATIVE_desc: "The Initiative pour l'Émergence de Madagascar set out Rajoelina's long-term vision for transforming the country's economy and institutions. It was subsequently developed into the Plan Émergence Madagascar, built around social, economic and environmental priorities with governance as a cross-cutting objective. The programme places particular emphasis on infrastructure, private investment, productive industries, human capital and improved public administration."
 MAD_POL_TGV_INFRASTRUCTURE_FIRST: "Infrastructure First"
 MAD_POL_TGV_INFRASTRUCTURE_FIRST_desc: "Visible roads, ports, airports and urban projects become the centrepiece of the presidency."
 MAD_POL_TGV_JIRAMA_DELIVERY: "Make JIRAMA Work"
 MAD_POL_TGV_JIRAMA_DELIVERY_desc: "Electricity is one of the government's most visible tests. A successful JIRAMA recovery becomes a major political victory; failure becomes a permanent liability."
 MAD_POL_TGV_SPECIAL_ECONOMIC_ZONES: "The Special Economic Zones"
 MAD_POL_TGV_SPECIAL_ECONOMIC_ZONES_desc: "Use zones and concessions to attract the private capital needed for rapid industrial growth."
 MAD_POL_TGV_INDUSTRIAL_MADAGASCAR: "Industrial Madagascar"
 MAD_POL_TGV_INDUSTRIAL_MADAGASCAR_desc: "Link mining, processing, manufacturing and infrastructure rather than exporting every raw material."
 MAD_POL_TGV_FOOD_SOVEREIGNTY: "Food Sovereignty"
 MAD_POL_TGV_FOOD_SOVEREIGNTY_desc: "Raise domestic agricultural production and resilience while the drought and food systems are still being repaired."
 MAD_POL_TGV_DIGITAL_MADAGASCAR: "Digital TGV"
 MAD_POL_TGV_DIGITAL_MADAGASCAR_desc: "Use telecoms, fibre and digital government as the modernising infrastructure behind the emergence programme."
 MAD_POL_TGV_PRESIDENTIAL_PROJECTS: "The Presidential Projects"
 MAD_POL_TGV_PRESIDENTIAL_PROJECTS_desc: "Centralise delivery of the largest projects in the presidency so that political promises become visible construction and economic output."
 MAD_POL_TGV_TRANSPARENT_EMERGENCE: "Transparent Emergence"
 MAD_POL_TGV_TRANSPARENT_EMERGENCE_desc: "Institutionalise procurement and transparency so the emergence programme is durable after the presidency."
 MAD_POL_TGV_STRONG_EXECUTIVE: "The Strong Executive"
 MAD_POL_TGV_STRONG_EXECUTIVE_desc: "Rajoelina's approach to development places considerable importance on presidential leadership and centrally directed projects. Major infrastructure programmes become visible expressions of the presidency's ability to deliver change, allowing the executive to set priorities and drive implementation directly. This model can accelerate selected projects and concentrate responsibility, but risks weakening independent institutions and making national development dependent on the priorities of the head of state."

 MAD_POL_HVM_PARTY_OF_GOVERNMENT: "Build a Party of Government"
 MAD_POL_HVM_PARTY_OF_GOVERNMENT_desc: "Hery Rajaonarimampianina entered national politics after serving as Finance Minister under the transitional administration. Supported by Rajoelina, he won the presidency but did not inherit an established national party with a long political tradition. HVM was developed as his political base, providing the administration with an organisation capable of building parliamentary support and sustaining its governing programme."
 MAD_POL_HVM_STABILISE_REPUBLIC: "Stabilise the Republic"
 MAD_POL_HVM_STABILISE_REPUBLIC_desc: "The return to elected government ended a prolonged period of political transition, but the new administration inherited weakened public institutions, disrupted development programmes, damaged donor relations and an unsettled political environment. Restoring predictable government and rebuilding confidence in the Fourth Republic are the immediate priorities. The state must demonstrate that constitutional government can provide continuity, rather than another temporary arrangement between competing political forces."
 MAD_POL_HVM_RULE_OF_LAW: "Strengthen the Rule of Law"
 MAD_POL_HVM_RULE_OF_LAW_desc: "The prolonged transition left Madagascar's public institutions and anti-corruption framework weakened. The new administration must restore reliable public financial management, strengthen the independence and capacity of oversight institutions, and ensure that anti-corruption laws are applied consistently. The credibility of the Fourth Republic will depend on whether government authority is exercised through functioning institutions rather than personal influence."
 MAD_POL_HVM_DECENTRALISE: "Decentralise the State"
 MAD_POL_HVM_DECENTRALISE_desc: "Give territorial government the administrative capacity promised by the development plan."
 MAD_POL_HVM_MACRO_STABILITY: "Preserve Macroeconomic Stability"
 MAD_POL_HVM_MACRO_STABILITY_desc: "Protect fiscal and financial stability so that long-term development can be financed without constant crisis."
 MAD_POL_HVM_INVESTMENT_FRIENDLY: "An Investment-Friendly Madagascar"
 MAD_POL_HVM_INVESTMENT_FRIENDLY_desc: "After prolonged political uncertainty, Madagascar must rebuild confidence among domestic businesses, international investors and development partners. The government's economic programme prioritises stronger tax and customs administration, improved oversight of state-owned enterprises, better public finances and a more predictable business environment. Investment must support productive growth while reducing the burden of inefficient state enterprises and unreliable infrastructure, particularly in energy and transport."
 MAD_POL_HVM_HUMAN_CAPITAL: "Invest in Human Capital"
 MAD_POL_HVM_HUMAN_CAPITAL_desc: "Education and skills are the central long-term development investment."
 MAD_POL_HVM_VOCATIONAL_TRAINING: "Professional Training for the Young"
 MAD_POL_HVM_VOCATIONAL_TRAINING_desc: "Expand practical training so that industry and agriculture have a workforce able to use modern capital."
 MAD_POL_HVM_AGRICULTURE: "The Agricultural Revolution"
 MAD_POL_HVM_AGRICULTURE_desc: "Turn agricultural reform into the broad productivity increase envisioned by Fisandratana 2030."
 MAD_POL_HVM_LIGHT_INDUSTRY: "Build the Light Industry"
 MAD_POL_HVM_LIGHT_INDUSTRY_desc: "Use agriculture, labour skills and investment to develop processing and light manufacturing."
 MAD_POL_HVM_PPP_FRAMEWORK: "Build Through Partnerships"
 MAD_POL_HVM_PPP_FRAMEWORK_desc: "Turn PPPs and project finance into a normal part of state development rather than improvised deals."
 MAD_POL_HVM_ENERGY_FOR_GROWTH: "Energy for Growth"
 MAD_POL_HVM_ENERGY_FOR_GROWTH_desc: "Tie the energy recovery programme directly to industrial and human development."
 MAD_POL_HVM_NATURAL_CAPITAL: "Protect the Natural Capital"
 MAD_POL_HVM_NATURAL_CAPITAL_desc: "Treat forests, protected areas and environmental resilience as economic infrastructure, not a separate concern."
 MAD_POL_HVM_ELECTORAL_FRAMEWORK: "A Credible Election Framework"
 MAD_POL_HVM_ELECTORAL_FRAMEWORK_desc: "Institutionalise elections and political competition after the years of transition politics."
 MAD_POL_HVM_FISANDRATANA_2030: "Fisandratana 2030"
 MAD_POL_HVM_FISANDRATANA_2030_desc: "Fisandratana 2030 was presented as a long-term vision for Madagascar's economic growth and transformation under Rajaonarimampianina. It sought to concentrate investment around four economic growth hubs and develop priority sectors including agriculture, fisheries, light industry, mining and tourism. Transport, energy, education, vocational training and healthcare were central to the programme. Its ambitious targets depended on sustained investment and effective implementation, rather than simply announcing a new national vision."

 # Events

 # Decision localisations
 MAD_royal_political_category: "Royal Political Affairs"
 MAD_royal_political_category_desc: "Royal and TAMIMA programmes are administered here. Permanent reforms are one-time measures; council consultations reappear after their cooldowns. The island sovereignty chain progresses from dossier to preparation, then separate demands for Réunion and Mayotte. The Mayotte demand requires Madagascar to have incorporated the Comoros and cored its states."
