 MAD_POL_ROYAL_CONSTITUTION: "Royal Constitutional Order"
 MAD_POL_ROYAL_CONSTITUTION_desc: "A Royalist political programme reinforcing the constitutional role of the Crown. Its political benefits belong to the Royalist programme; secular or state-church cooperation is tracked by a separate constitutional idea."
 MAD_POL_SECULAR_GOVERNMENT: "Secular Constitution and Government"
 MAD_POL_SECULAR_GOVERNMENT_desc: "The state keeps spiritual authorities outside formal government. MPs may still consult religious leaders privately, but the constitutional order does not openly bind government to the clergy."
 MAD_POL_UNSECULAR_GOVERNMENT: "Open State-Church Cooperation"
 MAD_RURAL_AREMA_NOT_IN_POWER_TT: "AREMA is not in power"
 MAD_POL_UNSECULAR_GOVERNMENT_desc: "Government openly recognises spiritual leaders as partners in public life."
 MAD_RURAL_UNSECULARISE_GOVERNMENT: "Unsecularise the Constitution and Government"
 MAD_RURAL_UNSECULARISE_GOVERNMENT_desc: "Replace the secular constitutional model with open state-church cooperation."
 MAD_RURAL_SECULARISE_GOVERNMENT: "Secularise the Constitution and Government"
 MAD_RURAL_SECULARISE_GOVERNMENT_desc: "Restore the secular constitutional model."
 MAD_RURAL_SECULAR_CLERGY_OPINION_TT: "The Clergy interest group's monthly opinion shift changes from +0.5 to -0.5 while the secular model is active."
 MAD_REMENABILA_GATHER_DAHALO_POPULATION_IDEA: "Recruit from the Dahalo"
 MAD_REMENABILA_GATHER_DAHALO_POPULATION_IDEA_desc: "The Remenabila movement consolidates local cattle-raiding networks into its manpower base."
 MAD_REMENABILA_MORE_COWS_POPULATION_IDEA: "The Herd Feeds the Ranks"
 MAD_REMENABILA_MORE_COWS_POPULATION_IDEA_desc: "The expansion of cattle-taking and herd control deepens the movement's rural recruitment pool."

 MAD_POL_ANDRIANA_HERITAGE_RECOGNISED: "Recognised Historic Royal Houses"
 MAD_POL_ANDRIANA_HERITAGE_RECOGNISED_desc: "An alternative-history policy granting historic royal houses a recognised ceremonial and consultative place in public life; it does not claim a real post-2000 Malagasy statute existed. The idea is suspended without effects while CRPM or TAMIMA holds power, then restored when that government leaves if recognition remains the chosen policy."
 MAD_POL_ANDRIANA_NON_RECOGNITION: "Republican Non-Recognition of Royal Houses"
 MAD_POL_AREMA_REPUBLICAN_SECULARISM: "Legacy AREMA Policy (Migration Only)"
 MAD_POL_AREMA_REPUBLICAN_SECULARISM_desc: "Obsolete compatibility placeholder from an earlier version. It has no effects and is automatically removed; AREMA's constitutional restriction is enforced by the secularisation decision."
 MAD_POL_ANDRIANA_NON_RECOGNITION_desc: "The republic does not formally recognise historic royal houses as public institutions. The idea is suspended without effects while CRPM or TAMIMA holds power, then restored when that government leaves if non-recognition remains the chosen policy."
