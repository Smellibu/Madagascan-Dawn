 MAD_POL_TIM_GREEN_REVOLUTION_IDEA: "The Green Revolution"
 MAD_POL_TIM_GREEN_REVOLUTION_IDEA_desc: "A national programme to modernise Malagasy agriculture through improved farming methods, mechanisation, agricultural training, irrigation and rural infrastructure. Higher productivity and lower labour requirements strengthen food security while making the countryside more commercially productive."
 MAD_POL_AREMA_SOCIALIST_PLANNING: "Socialist Economic Planning"
 MAD_POL_AREMA_SOCIALIST_PLANNING_desc: "Put Madagascar's development under a coherent national plan. Direct investment, industrial priorities and public resources toward a coordinated programme of socialist development."
 MAD_POL_TIM_HEALTH: "Health, Family Planning & Public Health"
 MAD_POL_TIM_HEALTH_desc: "Expand access to quality health services, strengthen rural health care, improve maternal and child health, confront malaria and HIV/AIDS, and make family planning a normal part of public health policy."
 MAD_POL_TGV_HEALTH_FOR_ALL: "Health for All"
 MAD_POL_TGV_HEALTH_FOR_ALL_desc: "Make quality health care available across Madagascar. Expand access, lower financial barriers, strengthen community health and bring the promise of universal health coverage into the emergence programme."
 MAD_POL_HVM_HEALTH_NUTRITION: "Health & Nutrition"
 MAD_POL_HVM_HEALTH_NUTRITION_desc: "Treat health and nutrition as pillars of human capital. Expand access to care, strengthen prevention and nutrition programmes, and make a healthier population part of Fisandratana's development strategy."
 MAD_HEALTH_SYSTEM_EXPANSION: "Expanded Health System"
 MAD_HEALTH_SYSTEM_EXPANSION_desc: "Expanded access to affordable health services, stronger health institutions and broader preventive care improve the population's health and welfare."

 mad_roy_rework.1.t: "The Covenant of the Nations"
 mad_roy_rework.1.d: "The King has long taught that the Malagasy kings descend from Abraham, and that a land which blesses Israel and honours the Judeo-Christian inheritance will itself be blessed. Delegations from Jerusalem now offer agricultural expertise and investment, and the Fifohazana churches urge an open embrace of the Holy Land. The Foreign Ministry warns that every Arab and Muslim capital in the region is watching how far Antananarivo will go.\n\nHow far will the Covenant extend?"
 mad_roy_rework.1.a: "A formal partnership with Israel."
 mad_roy_rework.1.b: "Pilgrimage, church and farming ties only."
 mad_roy_rework.1.c: "Keep Biblical geopolitics scholarly; align with none."
 mad_royal.2.t: "Replace the Colonial Laws"
 mad_royal.2.d: "The Royal House's programme calls for the urgent replacement of laws derived from the colonial and Napoleonic legal inheritance. The new system must be built with the traditional authorities rather than merely renaming the old code."
 mad_royal.2.a: "Promulgate a Malagasy legal charter"
 mad_royal.2.b: "Use a transitional legal framework"
 MAD_ROYAL_BEGIN_MONETARY_REFORM: "Begin Monetary Reform"
 MAD_ROYAL_BEGIN_MONETARY_REFORM_desc: "A one-time financial stabilisation measure to reduce outstanding national debt without spending from the treasury reserve."
 MAD_TAMIMA_CONSULT_TWELVE_ELDERS: "Consult the Twelve Elders"
 MAD_TAMIMA_CONSULT_TWELVE_ELDERS_desc: "Consult the Twelve Elders on customary governance and national disputes."
 MAD_TAMIMA_REGIONAL_HOUSE_CONFERENCE: "Hold a Regional House Conference"
 MAD_TAMIMA_REGIONAL_HOUSE_CONFERENCE_desc: "Hold a recurring regional conference with the traditional Houses. It does not construct another administrative office."
 mad_royal.5.t: "One Madagascar, Many Houses"
 mad_royal.5.d: "TAMIMA now faces the practical question of how many traditional Houses can be bound into one national constitutional settlement. The Houses can be tied together through a stronger central council, or given stronger regional institutional weight inside a single state."
 mad_royal.5.a: "Bind the Houses through the national council"
 mad_royal.5.b: "Strengthen the Houses in their regions"
 MAD_POL_ROY_FFKM_CONCORDAT: "The FFKM Concordat"
 MAD_POL_ROY_FFKM_CONCORDAT_desc: "The FFKM, the Council of Christian Churches in Madagascar, provides a forum for cooperation among major Christian denominations. The Crown seeks a formal relationship with the churches, defining their contribution to education, healthcare and social welfare while giving Christian leadership a recognised place in public life. Such a concordat would deepen church-state cooperation while raising questions about religious pluralism and the position of non-Christian communities."
 MAD_POL_ROY_PEOPLES_GUARDIANS: "Guardians of the People"
 MAD_POL_ROY_PEOPLES_GUARDIANS_desc: "The Crown presents the security forces as guardians responsible for public safety and the protection of communities. Its programme calls for disciplined services loyal to the state rather than rival political patrons. The challenge is to define this protective role without allowing royal security institutions to become a substitute for civilian accountability."
 MAD_POL_ROY_ISRAEL_AGRITECH: "Israeli Agricultural Exchange"
 MAD_POL_ROY_ISRAEL_AGRITECH_desc: "Following the chosen approach to Israel, agricultural cooperation can draw on expertise in irrigation, water management, dryland cultivation and agricultural technology. Any transfer must be adapted to Malagasy conditions, smallholder farming and the different needs of the island's regions rather than copied wholesale."
 MAD_POL_ROY_ISRAEL_SECURITY: "Israeli Security Cooperation"
 MAD_POL_ROY_ISRAEL_SECURITY_desc: "A formal covenant would extend relations beyond agriculture into security cooperation. Training, advisory assistance and military exchange could influence the development of the Malagasy security forces, but closer alignment would also carry diplomatic consequences for Madagascar's relationships across the region."
 MAD_POL_ROY_ISLANDS_WAIT: "Keep the Island Question Open"
 MAD_POL_ROY_ISLANDS_WAIT_desc: "The Crown keeps Madagascar's claims concerning the surrounding islands open while building practical relations with neighbouring island states. Commercial links and a stronger maritime presence offer a way to increase Madagascar's regional influence before any direct confrontation over sovereignty claims."
 MAD_ROY_ISRAEL_TIES_tt: "Requires an established Israel relationship through the Biblical Geopolitics event."
 MAD_ROY_ISRAEL_COVENANT_tt: "Requires the formal Israel covenant option."
 MAD_ROY_ISRAEL_NEUTRAL_tt: "Requires the non-aligned Biblical Geopolitics option."

 MAD_JIRAMA_REQUIREMENTS_MET_IN_TIME_tt: "The four-project and generation requirements were recorded as met before the five-year recovery deadline."

