 MAD_ROY_UNLOCK_FINANCIAL_SECTION_TT: "Unlocks the §YBegin Monetary Reform§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_HERITAGE_SECTION_TT: "Unlocks the §YConsecrate the Restored Rova§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_ISRAEL_SECTION_TT: "Unlocks the §YSend a Royal Delegation to Israel§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_ISLANDS_SECTION_TT: "Unlocks the §YPresent the Island Sovereignty Dossier§! decision and, after the dossier is presented, the §YPrepare the Island Reclamation§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_CUSTOMARY_SECTION_TT: "Unlocks the §YRecognise Customary Governance§! decision in §YRoyal Political Affairs§!."
 MAD_TAMIMA_UNLOCK_HOUSE_AFFAIRS_SECTION_TT: "Unlocks the §YConsult the Twelve Elders§! and §YHold a Regional House Conference§! decisions in §YRoyal Political Affairs§!."
 MAD_ROY_RESTORE_ROVA: "Consecrate the Restored Rova"
 MAD_ROY_RESTORE_ROVA_desc: "Fund the ceremonial and archival consecration of the restored Rova alongside the restoration of its physical grounds and public facilities."
 MAD_ROY_SEND_ROYAL_DELEGATION_TO_ISRAEL: "Send a Royal Delegation to Israel"
 MAD_ROY_SEND_ROYAL_DELEGATION_TO_ISRAEL_desc: "Send a formal royal delegation to strengthen bilateral relations."
 MAD_ROY_PRESENT_ISLAND_DOSSIER: "Present the Island Sovereignty Dossier"
 MAD_ROY_PRESENT_ISLAND_DOSSIER_desc: "Present Madagascar's sovereignty case to France. This is the required first stage before reclamation preparations."
 MAD_ROY_PREPARE_ISLAND_RECLAMATION: "Prepare the Island Reclamation"
 MAD_ROY_PREPARE_ISLAND_RECLAMATION_desc: "After presenting the dossier, prepare the political position for a future reclamation attempt, defining the diplomatic and legal steps that Madagascar would pursue."
 MAD_ROY_ISLAND_DOSSIER_TENSION: "Madagascar Presents the Island Sovereignty Dossier"
 MAD_ROY_RECLAMATION_REQUIRES_DOSSIER_TT: "Requires the §YPresent the Island Sovereignty Dossier§! decision to be completed first."
 MAD_ROYAL_RECOGNISE_CUSTOMARY_GOVERNANCE: "Recognise Customary Governance"
 MAD_ROYAL_RECOGNISE_CUSTOMARY_GOVERNANCE_desc: "Enact recognition of customary institutions through a permanent administrative office."

 MAD_ROYAL_ASSERT_THE_CROWN: "Assert the Crown"
 MAD_ROYAL_ASSERT_THE_CROWN_desc: "Assert the personal Crown through a one-time administrative measure."

 MAD_ROY_OFFER_UNION_COMOROS: "Offer Union to the Comoros"
 MAD_ROY_OFFER_UNION_COMOROS_desc: "Offer a political union to the Comoros."
 MAD_ROY_OFFER_UNION_SEYCHELLES: "Offer Union to the Seychelles"
 MAD_ROY_OFFER_UNION_SEYCHELLES_desc: "Offer a political union to the Seychelles."
 MAD_ROY_OFFER_UNION_MAURITIUS: "Offer Union to Mauritius"
 MAD_ROY_OFFER_UNION_MAURITIUS_desc: "Offer a political union to Mauritius."
 MAD_ROY_DEMAND_REUNION: "Demand Réunion"
 MAD_ROY_DEMAND_REUNION_desc: "France must decide whether to transfer Réunion. Its willingness to accept is affected by Madagascar's army and navy size, France's opinion of Madagascar, and whether the countries share the same government outlook. Refusal strengthens Madagascar's claim and raises tension."
 MAD_ROY_DEMAND_MAYOTTE: "Demand Mayotte"
 MAD_ROY_DEMAND_MAYOTTE_desc: "France must decide whether to transfer Mayotte. Its willingness to accept is affected by Madagascar's army and navy size, France's opinion of Madagascar, and whether the countries share the same government outlook. Refusal strengthens Madagascar's claim and raises tension."
 MAD_ROY_MAYOTTE_REQUIRES_COMOROS_CORE_TT: "Requires Madagascar to have incorporated the Comoros and added Malagasy cores to its states."
 MAD_ROY_ISLAND_RECLAMATION_PREPARED_TT: "Island reclamation preparations must be completed."
 MAD_ROY_FRANCE_REFUSES_REUNION_TENSION: "France Refuses Madagascar's Demand for Réunion"
 MAD_ROY_FRANCE_REFUSES_MAYOTTE_TENSION: "France Refuses Madagascar's Demand for Mayotte"
 mad_royal.6.t: "A Challenge to the King's Lineage"
 mad_royal.6.d: "Demonstrations have erupted in Antananarivo after opponents of Ndriana's restoration challenged his claim to descend from Madagascar's historical royal line. The Crown can suppress the protests by expanding security spending and deploying the Gendarmerie, or tolerate the demonstrations and risk serious damage to the capital's public infrastructure."
 mad_royal.6.a: "Crush the protests and defend the Crown"
 mad_royal.6.b: "Allow the protests to continue"
 mad_royal.7.t: "A Union with Madagascar?"
 mad_royal.7.d: "Madagascar has proposed a political union with the Comoros. The proposal would bring the islands under a shared Malagasy state, with the Comorian territory integrated into Madagascar. The government must decide whether to accept the offer or preserve Comorian sovereignty."
 mad_royal.7.a: "Accept the union with Madagascar"
 mad_royal.7.b: "Reject the proposal and preserve our sovereignty"
 mad_royal.8.t: "A Union with Madagascar?"
 mad_royal.8.d: "Madagascar has proposed a political union with the Seychelles. The proposal would bring the islands under a shared Malagasy state, with Seychellois territory integrated into Madagascar. The government must decide whether to accept the offer or preserve Seychellois sovereignty."
 mad_royal.8.a: "Accept the union with Madagascar"
 mad_royal.8.b: "Reject the proposal and preserve our sovereignty"
 mad_royal.9.t: "A Union with Madagascar?"
 mad_royal.9.d: "Madagascar has proposed a political union with Mauritius. The proposal would bring the islands under a shared Malagasy state, with Mauritian territory integrated into Madagascar. The government must decide whether to accept the offer or preserve Mauritian sovereignty."
 mad_royal.9.a: "Accept the union with Madagascar"
 mad_royal.9.b: "Reject the proposal and preserve our sovereignty"
 mad_royal.10.t: "The Malagasy Demand for Réunion"
 mad_royal.10.d: "Madagascar has formally demanded that France transfer Réunion. The Madagascan government argues that the island belongs within the Malagasy national sphere. Compliance would be a major diplomatic concession; refusal risks further escalation. Madagascar's military strength, French opinion of Madagascar, and political alignment may influence the French government's judgement."
 mad_royal.10.a: "Agree to transfer Réunion"
 mad_royal.10.b: "Reject the demand for Réunion"
 mad_royal.11.t: "The Malagasy Demand for Mayotte"
 mad_royal.11.d: "After incorporating the Comoros into the Malagasy state, Madagascar has formally demanded that France transfer Mayotte. The government argues that the island belongs within the Malagasy national sphere. Compliance would be a major diplomatic concession; refusal risks further escalation. Madagascar's military strength, French opinion of Madagascar, and political alignment may influence the French government's judgement."
 mad_royal.11.a: "Agree to transfer Mayotte"
 mad_royal.11.b: "Reject the demand for Mayotte"

