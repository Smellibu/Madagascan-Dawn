 # --- Fixed focus ID spelling ---
 MAD_Coup_d_arret: "Coup D'Arret"
 MAD_Coup_d_arret_desc: "After years of strained security operations, officials seek a decisive change in the campaign against cattle raiding. A turning point would require more than a conspicuous operation: reliable intelligence, consistent justice and cooperation from communities are needed to prevent armed networks from simply regrouping elsewhere."
 # --- Foreign investment offers ---
 mad_foreign_investment.1.t: "South Korean Investment Offer for Madagascar"
 mad_foreign_investment.1.d: "Madagascar has proposed an investment package to support industrial production and agriculture. Accepting commits Korean funds to the project and deepens South Korea's economic influence in Madagascar; the expected return depends on local productivity and delivery."
 mad_foreign_investment.1.a: "Accept the investment"
 mad_foreign_investment.1.b: "Decline the investment"
 mad_foreign_investment.2.t: "South Korean Investment Arrives"
 mad_foreign_investment.2.d: "South Korea has accepted Madagascar's proposal and committed $7.5 billion of its own funds to the agreed investment programme. The agreement marks a substantial expansion of economic ties between the two countries."
 mad_foreign_investment.2.a: "Welcome the investment"
 mad_foreign_investment.3.t: "South Korea Declines the Investment Offer"
 mad_foreign_investment.3.d: "South Korea has declined Madagascar's proposed investment package. The expected capital will not arrive, and the refusal risks straining bilateral economic relations."
 mad_foreign_investment.3.a: "We will continue without it"

 mad_foreign_investment.11.t: "U.S. Investment Offer for Madagascar"
 mad_foreign_investment.11.d: "Madagascar has proposed an investment package to support industrial production and agriculture. Accepting commits U.S. capital to the project and deepens American economic influence in Madagascar; the expected return depends on local productivity and delivery."
 mad_foreign_investment.11.a: "Accept the investment"
 mad_foreign_investment.11.b: "Decline the investment"
