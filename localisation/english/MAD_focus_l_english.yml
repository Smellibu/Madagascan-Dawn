 MAD_ratsiraka_digs_in: "Ratsiraka Digs In"
 MAD_ratsiraka_digs_in_desc: "Complete the Ratsiraka Digs In national focus."
 MAD_ICTSI_CONCESSION: "ICTSI Concession"
 MAD_ICTSI_CONCESSION_desc: "Complete the ICTSI concession national focus."
 MAD_vanilla_export_sector: "Vanilla Export Sector"
 MAD_vanilla_export_sector_desc: "Expand Madagascar's vanilla exports and turn the crop into a larger source of foreign income."
 MAD_DAEWOO_DEAL: "Daewoo Deal"
 MAD_DAEWOO_DEAL_desc: "Sign the Daewoo agricultural agreement and invite major Korean investment into Madagascar’s farming sector. The deal promises new commercial agriculture and infrastructure, but its large scale and foreign involvement will make the project politically sensitive."
 MAD_POVERTY_PAPER: "Poverty Paper"
 MAD_POVERTY_PAPER_desc: "Commission a broad national development programme focused on reducing poverty and improving living standards. The plan directs attention toward infrastructure and social welfare, while giving the government a clearer framework for managing Madagascar’s long-term economic development."
 MAD_AMBATOVY_COVID_SUSPENSION: "Ambatovy Covid Suspension"
 MAD_AMBATOVY_COVID_SUSPENSION_desc: "Complete the Ambatovy Covid Suspension national focus."
 MAD_ECOTOURISM_INVESTMENT: "Ecotourism Investment"
 MAD_ECOTOURISM_INVESTMENT_desc: "Complete the Ecotourism Investment national focus."
 MAD_QMM_LAGOON_POLLUTION_SCANDAL: "Qmm Lagoon Pollution Scandal"
 MAD_QMM_LAGOON_POLLUTION_SCANDAL_desc: "Complete the Qmm Lagoon Pollution Scandal national focus."
 MAD_TELECOM_LAW_2005: "Telecom Law 2005"
 MAD_TELECOM_LAW_2005_desc: "Complete the Telecom Law 2005 national focus."
 MAD_MADARAIL_OWNERSHIP_CHURN: "Madarail Ownership Churn"
 MAD_MADARAIL_OWNERSHIP_CHURN_desc: "Complete the Madarail Ownership Churn national focus."
 MAD_PAGOSE: "PAGOSE: Fix the Institution"
 MAD_PAGOSE_desc: "Use the PAGOSE programme's governance and operational reforms to improve JIRAMA's day-to-day reliability and the efficiency of the energy network."
 MAD_EGOSIP_LOAN: "Borrow to Fix the Grid"
 MAD_EGOSIP_LOAN_desc: "Use external financing to push repairs and energy investment forward. The loan brings money into the treasury and lowers financing costs, but debt service slightly reduces the return from new investment."
 MAD_Mandroseza_PLANT: "Rehabilitate Mandroseza"
 MAD_Mandroseza_PLANT_desc: "Modernise the Mandroseza plant serving the capital. The focus prepares the work; the real rehabilitation is a treasury-funded construction decision that takes time to complete."
 MAD_Sahofika_DAM: "Sahofika Financials"
 MAD_Sahofika_DAM_desc: "Lock in the financing structure for the Sahofika hydro project. The state's contribution unlocks a long construction period in exchange for a major renewable generation increase."
 MAD_DECIM: "Launch DECIM"
 MAD_DECIM_desc: "Use the DECIM programme to modernise isolated grids, combine renewable generation with storage and improve distribution efficiency."
 MAD_LEAD_PROJECT: "Put LEAD to Work"
 MAD_LEAD_PROJECT_desc: "Turn LEAD into an electricity-access programme for households, businesses and essential services. The focus unlocks the actual access build rather than handing out a free infrastructure level."
 MAD_LEAD_EXPANSION: "Connect the Last Mile"
 MAD_LEAD_EXPANSION_desc: "Extend the economic gains from new connections into local businesses and households. Better welfare and local tax collection follow once access exists."
 MAD_Volobe_Amont_DAM: "Close the Volobe Deal"
 MAD_Volobe_Amont_DAM_desc: "Complete the financial close for Volobe Amont and establish the project as a bankable public-private generation project. Construction remains a separate long-term decision."
 MAD_EDF_JOINS_VOLOBE: "Bring EDF Into Volobe"
 MAD_EDF_JOINS_VOLOBE_desc: "Deepen French participation in Volobe Amont. EDF's involvement improves project financing conditions and adds another source of technical and investment capacity."
 MAD_ADDED_SOLAR: "Hybrid Solar for Isolated Grids"
 MAD_ADDED_SOLAR_desc: "Add solar generation to isolated JIRAMA systems. DECIM support lowers the cost of the transition, while the full solar package requires its own construction decision."
 MAD_DECIM_SMART_GRID: "Turn DECIM Smart"
 MAD_DECIM_SMART_GRID_desc: "Modernise the grid itself with better control, metering and distribution technology. The focus improves the utility immediately and unlocks the paid rollout."
 MAD_RURAL_SMART_METER_CONNECTION: "Smart Meters in the Countryside"
 MAD_RURAL_SMART_METER_CONNECTION_desc: "Bring modern metering into rural areas so new connections become measurable, billable and easier to maintain."
 MAD_offshore_wind: "Pilot Offshore Wind"
 MAD_offshore_wind_desc: "Explore a late-game offshore wind pilot once Madagascar has a smarter grid. It is expensive and experimental, but offers another route to renewable generation."

 MAD_AR1_HIGHWAY: "Ar1 Highway"
 MAD_AR1_HIGHWAY_desc: "Build the Antananarivo–Toamasina AR1 highway to create a faster land connection between the capital and the country’s main port. The corridor reduces transport bottlenecks, improves national logistics and strengthens the economic link between Madagascar’s political and commercial centres."
 MAD_set_prices: "Set Prices"
 MAD_set_prices_desc: "Use state-backed price setting to give vanilla growers more stability at the cost of some agricultural efficiency."
 MAD_self_regulate_vanilla: "Self Regulate Vanilla"
 MAD_self_regulate_vanilla_desc: "Let the market set vanilla prices and output, favouring growth and flexibility over stability."
