 ###### Ownership BOP decisions ######
 MAD_OWNERSHIP_BOP: "Company Ownership"
 MAD_OWNERSHIP_BOP_desc: "Reverse state ownership of individual companies. Each sale is permanent and provides only about 75% of the direct benefits of the original private route."

 MAD_SELL_TELMA_PRIVATE: "Privatise TelMa"
 MAD_SELL_TELMA_PRIVATE_desc: "Sell TelMa back into private hands after its nationalisation. The state ownership advantages are removed and the private route returns at roughly 75% of its original strength. This decision is irreversible."

 MAD_SELL_AIRLINE_PRIVATE: "Privatise Madagascan Airlines"
 MAD_SELL_AIRLINE_PRIVATE_desc: "Return Madagascan Airlines to private ownership after successful state control. The state airline's benefits are removed and the private route returns at roughly 75% of its original strength. This decision is irreversible."

 MAD_SELL_JIRAMA_PRIVATE: "Privatise JIRAMA"
 MAD_SELL_JIRAMA_PRIVATE_desc: "Return JIRAMA to private ownership after choosing the public model. The public model's direct benefits are removed and the private route returns at roughly 75% of its original strength. This decision is irreversible."

 MAD_SELL_MADARAIL_PRIVATE: "Privatise Madarail"
 MAD_SELL_MADARAIL_PRIVATE_desc: "Sell Madarail back into private hands after nationalisation. The state operator is removed and a reduced version of the original private route's benefits returns. This decision is irreversible."

 MAD_SELL_GPM_PRIVATE: "Privatise Fuel Distribution"
 MAD_SELL_GPM_PRIVATE_desc: "Return the state-controlled fuel distribution system to private ownership. State-control benefits are removed and the original private route's direct benefits return at roughly 75% strength. This does not apply to private companies consolidating other private companies."

 MAD_SELL_AMBATOVY_PRIVATE: "Privatise Ambatovy"
 MAD_SELL_AMBATOVY_PRIVATE_desc: "Return Ambatovy to private control after state participation. The state-control benefits are removed and the original private operational route returns at roughly 75% strength. This decision is irreversible."   
 
 
 MAD_Rosewood: "Rosewood Controls"
 MAD_Rosewood_desc: "Madagascar's rosewood trade has left behind seized stockpiles, international scrutiny and a corruption problem that cannot be solved by a simple ban. First establish what the state actually controls, then decide whether to prioritise strict traceability or controlled domestic use."
 MAD_ROSEWOOD_STOCKPILE_AUDIT: "Audit the Rosewood Stockpiles"
 MAD_ROSEWOOD_STOCKPILE_AUDIT_desc: "Inventory, mark and secure the seized rosewood and ebony stockpiles. A credible chain of custody is the first condition for doing anything useful with timber already in state hands."
 MAD_ROSEWOOD_CITES_TRACEABILITY: "Enforce CITES Traceability"
 MAD_ROSEWOOD_CITES_TRACEABILITY_desc: "Keep the stockpile under strict verification and traceability rules. Madagascar's international credibility matters more than a quick sale, and a clean chain of custody can support conservation-linked investment and tourism."
 MAD_ROSEWOOD_DOMESTIC_USE: "Authorise Controlled Domestic Use"
 MAD_ROSEWOOD_DOMESTIC_USE_desc: "Permit verified stockpiles to be used inside Madagascar for public buildings and tightly controlled artisan production. This releases some trapped value now, but a politicised enforcement system makes leakage and corruption more likely."

 MAD_SPAT: "SPAT Operations Continue"
 MAD_SPAT_desc: "Keep Toamasina under its autonomous public port authority. SPAT keeps the port in domestic hands, but it must become more commercially capable if it is to carry the expansion burden itself."
 MAD_SPAT_STRENGTHEN_AUTHORITY: "Strengthen SPAT's Authority"
 MAD_SPAT_STRENGTHEN_AUTHORITY_desc: "Give SPAT stronger commercial and operational capacity so the autonomous port authority can plan investment, manage terminals and prepare Toamasina for the next expansion. The payoff is a more capable public gateway rather than a private concession."
 MAD_TOAMASINA_JICA_EXPANSION_desc: "Expand Toamasina's berths, access infrastructure and terminal capacity with Japanese financing. The project can follow either the private ICTSI route or a strengthened public SPAT route; in both cases it turns the port into a larger gateway for the national economy."

 MAD_mining_code_reform: "Rewrite the Mining Code"
 MAD_mining_code_reform_desc: "Replace the old mining framework with clearer fiscal, environmental and social rules. The reform becomes available once Madagascar has actually built enough of a mining sector for the old rules to become a bottleneck."
 MAD_END_PERMIT_FREEZE: "Reopen the Mining Registry"
 MAD_END_PERMIT_FREEZE_desc: "Resume the processing of pending mining permit applications and clear the regulatory bottleneck. A working registry lets legitimate exploration and development projects move again instead of leaving permits frozen indefinitely."
 MAD_MINING_LOCAL_BENEFIT_FUND: "Make Mining Pay Locally"
 MAD_MINING_LOCAL_BENEFIT_FUND_desc: "Create a visible local and regional return from mineral development. New community investment rules make the mining sector more productive and more defensible by ensuring extraction leaves something behind where it happens."

 MAD_2009_Sanctions_desc: "The post-coup government loses preferential access to the US market. The shock falls hardest on export-oriented activity, especially the apparel sector, while investment becomes harder to attract and economic uncertainty deepens."
 MAD_POL_ROY_SUMMON_HOUSES: "Summon the Houses of Madagascar"
 MAD_POL_ROY_SUMMON_HOUSES_desc: "Assemble the royal and noble associations into one political movement and establish the restoration's initial organised constituency."
 MAD_POL_ROY_MALAGASY_TRADITION: "Fihavanana and Hasina"
 MAD_POL_ROY_MALAGASY_TRADITION_desc: "Make Fihavanana and Hasina a social foundation of the restoration, strengthening cohesion and grounding the movement in Malagasy political culture."
 MAD_POL_ROY_SACRED_CONSTITUTION: "A New Constitutional Order"
 MAD_POL_ROY_SACRED_CONSTITUTION_desc: "Begin the constitutional rupture repeatedly proposed by the Royal House: replace the inherited order with a Malagasy constitutional settlement while leaving the final balance between crown and Houses unresolved."
 MAD_POL_ROY_CROWN_QUESTION: "The Question of the Crown"
 MAD_POL_ROY_CROWN_QUESTION_desc: "The restoration has reached its constitutional crossroads. The next step determines whether authority is centred on Ndriana's personal crown or organised through the traditional Houses."
 MAD_POL_ROY_KINGS_MANDATE: "The King's Mandate"
 MAD_POL_ROY_KINGS_MANDATE_desc: "Place executive authority in Ndriana's personal crown and close normal electoral competition while preserving the wider royal institutions around him."
 MAD_POL_ROY_CROWN_ABOVE_NOBILITY: "Christ the King of Kings" 
 MAD_POL_ROY_CROWN_ABOVE_NOBILITY_desc: "A land is blessed when its king is of noble birth, and the king reigns in righteousness while the princes govern in justice. The Crown now stands above the great houses and the Church becomes the moral foundation of the state."
 MAD_POL_ROY_CHRIST_KING: "Servants of Righteousness"
 MAD_POL_ROY_CHRIST_KING_desc: "The republics' institutions, from the electoral commission to the courts, have been hollowed out by corruption. The Crown sets a Christian standard for public service and rebuilds the administration beneath it."
 MAD_POL_ROY_NATIONAL_WEALTH: "Replace the Colonial Laws"
 MAD_POL_ROY_NATIONAL_WEALTH_desc: "Replace inherited colonial and Napoleonic law with a Malagasy legal framework. The Crown must choose between promulgating a new legal charter and using a transitional framework shaped with traditional authorities."
 MAD_POL_ROY_CUSTOM_BEFORE_PARTY: "Monetary and Financial Reform"
 MAD_POL_ROY_CUSTOM_BEFORE_PARTY_desc: "Reform the state’s financial foundations before returning to party politics. The Crown pays the initial programme cost and unlocks a one-time debt-reduction measure that trades faster economic growth for a smaller public debt burden."
 MAD_POL_ROY_CROWN_FINAL: "Malagasy Land for Malagasy Farmers"
 MAD_POL_ROY_CROWN_FINAL_desc: "Madagascar is a sacred land, and its soil is not for sale to foreign hands. The Crown secures the land for Malagasy farmers and recovers the island's agricultural base."
 MAD_POL_ROY_COUNCIL_OF_KINGS: "The Council of Kings and Princes"
 MAD_POL_ROY_COUNCIL_OF_KINGS_desc: "Turn the Kings and Princes into a formal constitutional body and establish a permanent administrative centre in Antananarivo. The project costs 12 treasury, adds an office and building slot, strengthens central administration, improves stability, reduces corruption and raises domestic influence."
 MAD_POL_ROY_LIVING_FORCES: "The Living Forces of the Nation"
 MAD_POL_ROY_LIVING_FORCES_desc: "Bring traditional authorities, professionals, workers, researchers and other organised national forces into the restoration. Fund a civilian R&D facility in a random owned state so the coalition gains a durable intellectual base."
 MAD_POL_ROY_NATIONAL_TRUST: "The National Wealth Is a National Trust"
 MAD_POL_ROY_NATIONAL_TRUST_desc: "The island's raw wealth is placed in a national trust, to be processed and sold by Malagasy hands rather than carried away abroad."
 MAD_POL_ROY_ENDOGENOUS_DEVELOPMENT: "Endogenous Development"
 MAD_POL_ROY_ENDOGENOUS_DEVELOPMENT_desc: "A future generated by Malagasy tradition itself. The Royal Academy of Sciences founds a civilian research institute, and domestic industry is given the tools to grow from within."
 MAD_POL_ROY_SACRED_HERITAGE: "Restore the Sacred Heritage"
 MAD_POL_ROY_SACRED_HERITAGE_desc: "The Rova of Antananarivo, the royal hills and the sacred villages are restored as the spiritual heart of the kingdom, drawing pilgrims, visitors and commerce to the capital."
 MAD_POL_ROY_BIBLICAL_GEOPOLITICS: "Biblical Geopolitics"
 MAD_POL_ROY_BIBLICAL_GEOPOLITICS_desc: "The King teaches that the Malagasy kings descend from Abraham and that the nation must stand with the Judeo-Christian world. How far that conviction shapes foreign policy is now a matter of state."
 MAD_POL_ROY_TRUE_SOVEREIGNTY: "True National Sovereignty"
 MAD_POL_ROY_TRUE_SOVEREIGNTY_desc:0 "The head and not the tail, the lender and not the borrower. The kingdom pays down its debts and takes back the economic levers that foreign interests have held since independence."
 MAD_POL_ROY_TRIBES_BEFORE_PARTIES: "Tribes Before Parties"
 MAD_POL_ROY_TRIBES_BEFORE_PARTIES_desc: "The traditional kings of the Antemoro, Betsileo, Antanala, Antambahoaka and Sakalava are placed in their rightful seats. Power returns to the kingdoms and the parties give way to custom."
 MAD_POL_ROY_NEW_KINGDOM: "The New Kingdom of Madagascar"
 MAD_POL_ROY_NEW_KINGDOM_desc:0 "The New Kingdom of Madagascar, a kingdom of priests and a holy nation, rises from the ruins of the republics. The poor are no longer forgotten."
 MAD_POL_ROY_TAMIMA_SACRED_HERITAGE: "Guard the Sacred Heritage"
 MAD_POL_ROY_TAMIMA_SACRED_HERITAGE_desc: "The university is charged with studying and safeguarding the sacred heritage of the island: its tombs, hills and customs. A civilian research institute is founded."
 MAD_POL_ROY_CROWNLESS_CONSTITUTION: "The Crown Without a King"
 MAD_POL_ROY_CROWNLESS_CONSTITUTION_desc: "The council government is replaced by a written constitution rooted in custom and not in the person of a king."
 MAD_POL_ROY_ONE_MADAGASCAR_MANY_HOUSES_FINAL: "One Madagascar, Many Houses"
 MAD_POL_ROY_ONE_MADAGASCAR_MANY_HOUSES_FINAL_desc: "The houses stand together under one flag. A united nation without a throne begins to grow."
 MAD_POL_ROY_TAMIMA_COUNCIL_GOVERNMENT: "Council Government"
 MAD_POL_ROY_TAMIMA_COUNCIL_GOVERNMENT_desc: "The council becomes a permanent government and elections return, with a lower threshold so that the many houses are heard."
 MAD_POL_ROY_TAMIMA_COUNCIL: "The National Council of Houses"
 MAD_POL_ROY_TAMIMA_COUNCIL_desc: "Make the network of Andriana associations, councils, committees and elders the collective political constituency of the restoration."
 MAD_POL_ROY_FIHAVANANA: "Fihavanana Before Faction"
 MAD_POL_ROY_FIHAVANANA_desc: "Make Fihavanana—the bond of kinship and mutual obligation—a governing principle. The settlement boosts stability and domestic influence, improves relations with the landowners and labour unions where those groups exist, and expands social spending."
 MAD_POL_ROY_FOKONOLONA: "The Antenimieran’ny Andriana"
 MAD_POL_ROY_FOKONOLONA_desc: "Establish the Antenimieran’ny Andriana as a working upper house in the capital. The focus funds an administrative office and two additional building slots in Antananarivo."
 MAD_POL_ROY_CUSTOMARY_JUSTICE: "Represent the Living Forces"
 MAD_POL_ROY_CUSTOMARY_JUSTICE_desc: "Bring traditional authorities, researchers, workers, professionals and organised communities into the national settlement. The focus funds a local office and two civilian research bonuses, while improving stability and domestic influence and strengthening relations with labour and business groups where they exist."
 MAD_POL_ROY_CROWN_WITHOUT_KING: "Restore the Fokonolona"
 MAD_POL_ROY_CROWN_WITHOUT_KING_desc: "Restore the fokonolona, the village assembly, as a local governing institution. Communities receive greater responsibility for local questions and communal resources."
 MAD_POL_ROY_ONE_MADAGASCAR_MANY_HOUSES: "Dina and Customary Justice"
 MAD_POL_ROY_ONE_MADAGASCAR_MANY_HOUSES_desc: "Recognise Dina and customary justice as part of the constitutional settlement. The measure reduces corruption and centralisation, improves stability and domestic influence, and strengthens landowner support where the group exists."
 
 MAD_POL_MIL_TAKES_RESPONSIBILITY: "The Army Takes Responsibility"
 MAD_POL_MIL_TAKES_RESPONSIBILITY_desc: "The armed forces can remain neutral, or decide that repeated political crises have made them responsible for restoring order themselves."
 MAD_POL_MIL_CHAIN_OF_COMMAND: "Restore the Chain of Command"
 MAD_POL_MIL_CHAIN_OF_COMMAND_desc: "Rebuild a disciplined command structure before allowing the armed forces to take a larger political role."
 MAD_POL_MIL_LESSON_2002: "The Lesson of 2002"
 MAD_POL_MIL_LESSON_2002_desc: "The post-election crisis showed both the danger of military intervention and the danger of leaving the armed forces politically divided."
 MAD_POL_MIL_PROTECT_BALLOT: "Protect the Ballot, Not the Palace"
 MAD_POL_MIL_PROTECT_BALLOT_desc: "The army will defend constitutional government without becoming the government."
 MAD_POL_MIL_FINAL_ARBITER: "The Army as Final Arbiter"
 MAD_POL_MIL_FINAL_ARBITER_desc: "When civilian institutions fail, the armed forces will decide when the national interest requires intervention."
 MAD_POL_MIL_CAPSAT_LESSON: "Remember Camp CAPSAT"
 MAD_POL_MIL_CAPSAT_LESSON_desc: "The 2009 mutiny cannot simply be forgotten. We must decide what place politicised military units have in the new order."
 MAD_POL_MIL_NEVER_DIVIDED: "Never Again a Divided Army"
 MAD_POL_MIL_NEVER_DIVIDED_desc: "Make chain of command, officer cohesion and unified orders matters of political survival."
 MAD_POL_MIL_SOUTHERN_SECURITY: "The Southern Security Mission"
 MAD_POL_MIL_SOUTHERN_SECURITY_desc: "The army has a long-running domestic mission against armed cattle-raiding networks. A political military government will make that mission a central test of its competence."
 MAD_POL_MIL_GENDARMERIE_REFORM: "Reform the Gendarmerie"
 MAD_POL_MIL_GENDARMERIE_REFORM_desc: "The army cannot substitute indefinitely for civilian security institutions. Reform the gendarmerie and its relationship with the armed forces."
 MAD_POL_MIL_ENGINEERS: "Build the Engineers"
 MAD_POL_MIL_ENGINEERS_desc: "Use the army's engineering capacity for roads, logistics and national resilience as well as war."
 MAD_POL_MIL_MARITIME_SECURITY: "Watch the Indian Ocean"
 MAD_POL_MIL_MARITIME_SECURITY_desc: "Build on telecommunications and maritime-awareness work to turn Madagascar's maritime domain into a genuine security responsibility."
 MAD_POL_MIL_MULTILATERAL_DOCTRINE: "A Multilateral Defence Doctrine"
 MAD_POL_MIL_MULTILATERAL_DOCTRINE_desc: "Use training and defence cooperation with foreign partners without surrendering the political independence of the armed forces."
 MAD_POL_MIL_ASSEMBLIES: "The Military Assemblies"
 MAD_POL_MIL_ASSEMBLIES_desc: "Bring the officer corps together to decide what a modern Malagasy military should be and what its relationship with the state ought to be."
 MAD_POL_MIL_CLEAN_UNIFORM: "Clean Hands in Uniform"
 MAD_POL_MIL_CLEAN_UNIFORM_desc: "A military government cannot claim national renewal while corruption remains entrenched in the state."
 MAD_POL_MIL_REFOUNDATION: "The Refoundation"
 MAD_POL_MIL_REFOUNDATION_desc: "The transition has reached the point where the armed forces must choose whether to remain in power or reopen civilian politics."
 MAD_POL_MIL_CIVILIAN_GUARDIANSHIP: "A Military Guardian of the Republic"
 MAD_POL_MIL_CIVILIAN_GUARDIANSHIP_desc: "The armed forces withdraw from day-to-day rule while retaining a constitutional guardianship role."
 
 MAD_AREMA_REBUILDING: "AREMA Rebuilding"
 MAD_AREMA_REBUILDING_desc: "Reassemble the party's political organisation and prepare its return to national government."
 MAD_POL_AREMA_CHOOSE_OLD_GUARD: "The Ratsiraka Tradition"
 MAD_POL_AREMA_CHOOSE_OLD_GUARD_desc: "Keep AREMA's revolutionary organisation, state-led development and economic sovereignty at the centre of the movement."
 MAD_POL_AREMA_CHOOSE_RENEWAL: "Renew the Movement"
 MAD_POL_AREMA_CHOOSE_RENEWAL_desc: "Adapt AREMA to a competitive political system while keeping social provision at the heart of its programme."
 MAD_POL_AREMA_CHOOSE_RECONCILIATION: "Reconcile the Movement"
 MAD_POL_AREMA_CHOOSE_RECONCILIATION_desc: "Put factional conflict behind AREMA and rebuild its legitimacy through national compromise and institutional stability."
 MAD_POL_AREMA_REVOLUTIONARY_ORGANISATION: "Rebuild the Revolutionary Organisation"
 MAD_POL_AREMA_REVOLUTIONARY_ORGANISATION_desc: "Restore the disciplined political organisation and state capacity that once made AREMA the country's dominant governing machine."
 MAD_POL_AREMA_OLD_GUARD_ADAPT: "Discipline the State Apparatus"
 MAD_POL_AREMA_OLD_GUARD_ADAPT_desc: "Make the old revolutionary machine serve a functioning modern state rather than simply recreate the past."
 MAD_POL_AREMA_RENEWAL_PROGRAMME: "Renew the Social Programme"
 MAD_POL_AREMA_RENEWAL_PROGRAMME_desc: "Translate AREMA's social commitments into a practical programme for agriculture, education and public services."
 MAD_POL_AREMA_RENEWAL_MODERNISE: "Modernise the Movement"
 MAD_POL_AREMA_RENEWAL_MODERNISE_desc: "Pair social provision with productivity and a more workable relationship with investment and private enterprise."
 MAD_POL_AREMA_RECONCILIATION_PACT: "A National Reconciliation Pact"
 MAD_POL_AREMA_RECONCILIATION_PACT_desc: "Build the broad political settlement needed for AREMA to return as a credible national governing party."
 MAD_POL_AREMA_RECONCILIATION_INSTITUTIONALISE: "Institutionalise the Settlement"
 MAD_POL_AREMA_RECONCILIATION_INSTITUTIONALISE_desc: "Turn reconciliation into durable institutions, stronger local administration and a government outsiders can work with."
 MAD_POL_AREMA_REBUILD: "Rebuild AREMA"
 MAD_POL_AREMA_REBUILD_desc: "Restore AREMA as a governing movement rather than a relic of the Ratsiraka era."
 MAD_POL_AREMA_REVOLUTION_ADAPTS: "The Revolution Must Adapt"
 MAD_POL_AREMA_REVOLUTION_ADAPTS_desc: "Decide whether the movement restores the old state-led model or builds a modern Malagasy socialism."
 MAD_POL_AREMA_STATE_LEADS: "The Malagasy State Must Lead"
 MAD_POL_AREMA_STATE_LEADS_desc: "The state returns to the centre of strategic development."
 MAD_POL_AREMA_STRATEGIC_ENTERPRISES: "Strategic Enterprises in Public Hands"
 MAD_POL_AREMA_STRATEGIC_ENTERPRISES_desc: "Use the existing public-private ownership balance to bring strategic utilities, transport and energy back toward public control."
 MAD_POL_AREMA_FOKONOLONA: "Fokonolona and the Rural World"
 MAD_POL_AREMA_FOKONOLONA_desc: "Build development around Malagasy communal institutions and rural society rather than treating the countryside simply as a source of exports."
 MAD_POL_AREMA_FOOD_FIRST: "Food Before Export"
 MAD_POL_AREMA_FOOD_FIRST_desc: "Use agricultural reform to prioritise food security and the domestic economy before export maximisation."
 MAD_POL_AREMA_INDEPENDENCE: "Malagasy Economic Independence"
 MAD_POL_AREMA_INDEPENDENCE_desc: "Reduce dependence on outside capital where strategic ownership is at stake."
 MAD_POL_AREMA_INDIAN_OCEAN: "The Indian Ocean Is Ours"
 MAD_POL_AREMA_INDIAN_OCEAN_desc: "Revive the sovereignty-conscious and non-aligned outlook associated with Ratsiraka's foreign policy."
 MAD_POL_AREMA_PROVINCES: "Return to Provincial Autonomy"
 MAD_POL_AREMA_PROVINCES_desc: "The alternative is a more decentralised state in which territorial governments receive a larger share of responsibility."
 MAD_POL_AREMA_MIXED_ECONOMY: "A Mixed Malagasy Economy"
 MAD_POL_AREMA_MIXED_ECONOMY_desc: "Learn from the limits of the old state economy without abandoning the role of government in strategic sectors."
 MAD_POL_AREMA_STRATEGIC_INVESTMENT: "Strategic Investment Under Malagasy Control"
 MAD_POL_AREMA_STRATEGIC_INVESTMENT_desc: "Foreign capital can participate where it strengthens Malagasy development rather than displacing it."
 MAD_POL_AREMA_ECO_SOCIAL_REPUBLIC: "An Ecological Social Republic"
 MAD_POL_AREMA_ECO_SOCIAL_REPUBLIC_desc: "Translate modern AREMA's social and ecological language into the state-led development model."
 MAD_POL_AREMA_SECOND_SOCIALISM: "The Second Malagasy Socialism"
 MAD_POL_AREMA_SECOND_SOCIALISM_desc: "AREMA's legacy becomes a new model rather than a simple restoration of the past."
 
 MAD_POL_TIM_RETURN: "Return to Madagascar Naturally"
 MAD_POL_TIM_RETURN_desc: "The movement returns to power with a programme built around liberal democracy, business, infrastructure and national development."
 MAD_POL_TIM_TRUST: "A Government Citizens Can Trust"
 MAD_POL_TIM_TRUST_desc: "Make rule of law and institutional credibility central to the next TIM administration."
 MAD_POL_TIM_BUSINESS_SEPARATION: "Separate Business From Government"
 MAD_POL_TIM_BUSINESS_SEPARATION_desc: "Build a competitive liberal economy in which political power does not simply become a business advantage."
 MAD_POL_TIM_NATIONAL_CHAMPION: "Build a Malagasy National Champion"
 MAD_POL_TIM_NATIONAL_CHAMPION_desc: "Take the alternative lesson from the Tiko years: Malagasy business can become a strategic national asset if the state backs it aggressively."
 MAD_POL_TIM_CONNECT_ISLAND: "Connect the Island"
 MAD_POL_TIM_CONNECT_ISLAND_desc: "Modern roads, ports, rail and communications are the foundation of the MAP development programme."
 MAD_POL_TIM_TIKO_COMPETITION: "Tiko and the Competition Question"
 MAD_POL_TIM_TIKO_COMPETITION_desc: "Decide whether the legacy of a powerful national company becomes a model for entrepreneurship or a reason to strengthen competition policy."
 MAD_POL_TIM_MAP: "The Madagascar Action Plan"
 MAD_POL_TIM_MAP_desc: "Restore the broad development framework that placed governance, infrastructure, education, rural development and private investment into one national programme."
 MAD_POL_TIM_GREEN_REVOLUTION: "A Green Revolution for Madagascar"
 MAD_POL_TIM_GREEN_REVOLUTION_desc: "Use agricultural reform to raise output, improve rural incomes and reduce the vulnerability of the food economy."
 MAD_POL_TIM_LAND_TITLES: "Title the Land"
 MAD_POL_TIM_LAND_TITLES_desc: "Clear property rights make smallholder investment and outside investment less dependent on administrative connections."
 MAD_POL_TIM_OPEN_ECONOMY: "Open the Economy"
 MAD_POL_TIM_OPEN_ECONOMY_desc: "The liberal path reaches its natural conclusion when private fuel, telecom, utility, rail or foreign-investment systems are actually working."
 MAD_POL_TIM_DECENTRALISE: "Put the Fokontany to Work"
 MAD_POL_TIM_DECENTRALISE_desc: "Give local administration a real role in delivering the development programme."
 MAD_POL_TIM_ENVIRONMENT: "Cherish the Environment"
 MAD_POL_TIM_ENVIRONMENT_desc: "Combine the MAP's environmental commitments with the modern rosewood and protected-area problems already confronting Madagascar."
 MAD_POL_TIM_RECONCILIATION: "National Reconciliation"
 MAD_POL_TIM_RECONCILIATION_desc: "End the politics of permanent transition and contest by rebuilding a shared democratic settlement."
 MAD_POL_TIM_REFUND_THE_REPUBLIC: "Re-found the Republic"
 MAD_POL_TIM_REFUND_THE_REPUBLIC_desc: "A second TIM government must leave behind institutions stronger than the business network that originally brought it to power."
 
 MAD_POL_TGV_YOUTH_READY: "The Youth Are Ready"
 MAD_POL_TGV_YOUTH_READY_desc: "Turn the urban youth movement that created TGV into a governing political force."
 MAD_POL_TGV_2009_LEGACY: "What is TGV's mandate?"
 MAD_POL_TGV_2009_LEGACY_desc: "The movement ruptured mainstream Malagasy politics and must decide what it wants that rupture to mean in government."
 MAD_POL_TGV_FOURTH_REPUBLIC: "The Fourth Republic"
 MAD_POL_TGV_FOURTH_REPUBLIC_desc: "Make the constitutional order created by the transition the foundation of the new political system."
 MAD_POL_TGV_RETURN_BALLOT: "Return Through the Ballot Box"
 MAD_POL_TGV_RETURN_BALLOT_desc: "The movement proves that its support can be renewed through elections rather than permanent transition politics."
 MAD_POL_TGV_THIRTEEN_VELIRANO: "The Thirteen Velirano"
 MAD_POL_TGV_THIRTEEN_VELIRANO_desc: "Turn the electoral promises into an actual governing programme."
 MAD_POL_TGV_EMERGENCE_INITIATIVE: "The Emergence Initiative"
 MAD_POL_TGV_EMERGENCE_INITIATIVE_desc: "Build national development around the IEM and the later Programme Emergence Madagascar."
 MAD_POL_TGV_INFRASTRUCTURE_FIRST: "Infrastructure First"
 MAD_POL_TGV_INFRASTRUCTURE_FIRST_desc: "Visible roads, ports, airports and urban projects become the centrepiece of the presidency."
 MAD_POL_TGV_JIRAMA_DELIVERY: "Make JIRAMA Work"
 MAD_POL_TGV_JIRAMA_DELIVERY_desc: "Electricity is one of the government's most visible tests. A successful JIRAMA recovery becomes a major political victory; failure becomes a permanent liability."
 MAD_POL_TGV_SPECIAL_ECONOMIC_ZONES: "The Special Economic Zones"
 MAD_POL_TGV_SPECIAL_ECONOMIC_ZONES_desc: "Use zones and concessions to attract the private capital needed for rapid industrial growth."
 MAD_POL_TGV_INDUSTRIAL_MADAGASCAR: "Industrial Madagascar"
 MAD_POL_TGV_INDUSTRIAL_MADAGASCAR_desc: "Link mining, processing, manufacturing and infrastructure rather than exporting every raw material."
 MAD_POL_TGV_FOOD_SOVEREIGNTY: "Food Sovereignty"
 MAD_POL_TGV_FOOD_SOVEREIGNTY_desc: "Raise domestic agricultural production and resilience while the drought and food systems are still being repaired."
 MAD_POL_TGV_DIGITAL_MADAGASCAR: "Digital TGV"
 MAD_POL_TGV_DIGITAL_MADAGASCAR_desc: "Use telecoms, fibre and digital government as the modernising infrastructure behind the emergence programme."
 MAD_POL_TGV_PRESIDENTIAL_PROJECTS: "The Presidential Projects"
 MAD_POL_TGV_PRESIDENTIAL_PROJECTS_desc: "Centralise delivery of the largest projects in the presidency so that political promises become visible construction and economic output."
 MAD_POL_TGV_TRANSPARENT_EMERGENCE: "Transparent Emergence"
 MAD_POL_TGV_TRANSPARENT_EMERGENCE_desc: "Institutionalise procurement and transparency so the emergence programme is durable after the presidency."
 MAD_POL_TGV_STRONG_EXECUTIVE: "The Strong Executive"
 MAD_POL_TGV_STRONG_EXECUTIVE_desc: "The alternative is to keep the presidency as the political engine of the entire emergence programme."
 
 MAD_POL_HVM_PARTY_OF_GOVERNMENT: "Build a Party of Government"
 MAD_POL_HVM_PARTY_OF_GOVERNMENT_desc: "Turn HVM from a presidential vehicle into a durable governing organisation."
 MAD_POL_HVM_STABILISE_REPUBLIC: "Stabilise the Republic"
 MAD_POL_HVM_STABILISE_REPUBLIC_desc: "The first priority is to make post-transition politics boring again."
 MAD_POL_HVM_RULE_OF_LAW: "Strengthen the Rule of Law"
 MAD_POL_HVM_RULE_OF_LAW_desc: "Rebuild institutional confidence through predictable government and anti-corruption reform."
 MAD_POL_HVM_DECENTRALISE: "Decentralise the State"
 MAD_POL_HVM_DECENTRALISE_desc: "Give territorial government the administrative capacity promised by the development plan."
 MAD_POL_HVM_MACRO_STABILITY: "Preserve Macroeconomic Stability"
 MAD_POL_HVM_MACRO_STABILITY_desc: "Protect fiscal and financial stability so that long-term development can be financed without constant crisis."
 MAD_POL_HVM_INVESTMENT_FRIENDLY: "An Investment-Friendly Madagascar"
 MAD_POL_HVM_INVESTMENT_FRIENDLY_desc: "Create the predictable regulatory environment needed for private and foreign investment."
 MAD_POL_HVM_HUMAN_CAPITAL: "Invest in Human Capital"
 MAD_POL_HVM_HUMAN_CAPITAL_desc: "Education and skills are the central long-term development investment."
 MAD_POL_HVM_VOCATIONAL_TRAINING: "Professional Training for the Young"
 MAD_POL_HVM_VOCATIONAL_TRAINING_desc: "Expand practical training so that industry and agriculture have a workforce able to use modern capital."
 MAD_POL_HVM_AGRICULTURE: "The Agricultural Revolution"
 MAD_POL_HVM_AGRICULTURE_desc: "Turn agricultural reform into the broad productivity increase envisioned by Fisandratana 2030."
 MAD_POL_HVM_LIGHT_INDUSTRY: "Build the Light Industry"
 MAD_POL_HVM_LIGHT_INDUSTRY_desc: "Use agriculture, labour skills and investment to develop processing and light manufacturing."
 MAD_POL_HVM_PPP_FRAMEWORK: "Build Through Partnerships"
 MAD_POL_HVM_PPP_FRAMEWORK_desc: "Turn PPPs and project finance into a normal part of state development rather than improvised deals."
 MAD_POL_HVM_ENERGY_FOR_GROWTH: "Energy for Growth"
 MAD_POL_HVM_ENERGY_FOR_GROWTH_desc: "Tie the energy recovery programme directly to industrial and human development."
 MAD_POL_HVM_NATURAL_CAPITAL: "Protect the Natural Capital"
 MAD_POL_HVM_NATURAL_CAPITAL_desc: "Treat forests, protected areas and environmental resilience as economic infrastructure, not a separate concern."
 MAD_POL_HVM_ELECTORAL_FRAMEWORK: "A Credible Election Framework"
 MAD_POL_HVM_ELECTORAL_FRAMEWORK_desc: "Institutionalise elections and political competition after the years of transition politics."
 MAD_POL_HVM_FISANDRATANA_2030: "Fisandratana 2030"
 MAD_POL_HVM_FISANDRATANA_2030_desc: "The full development programme is only as strong as the reforms and investments the state has actually managed to complete."
 
 # Events
 mad_political.1.t: "The Question of the Crown"
 mad_political.1.d: "Rabarioelina's royal movement has reached the point where its constitutional future must be decided. The established noble organisations can be brought into a wider council, or the claimant can declare that the crown itself is the source of political authority."
 mad_political.1.a: "The King stands above the council"
 mad_political.1.b: "The houses must rule together"
 mad_political.2.t: "The Military Refoundation"
 mad_political.2.d: "The transition has reached its decisive moment. The armed forces can continue to govern in the name of national stability, or deliberately reopen civilian politics and return the country to elections."
 mad_political.2.a: "Maintain military rule"
 mad_political.2.b: "Return to elections"
 
 # Decision localisations
 MAD_royal_political_category: "Royal Political Affairs"
 MAD_royal_political_category_desc: "Royal and TAMIMA programmes are administered here. Permanent reforms are one-time measures; council consultations reappear after their cooldowns. The island sovereignty chain progresses from dossier to preparation, then separate demands for Réunion and Mayotte. The Mayotte demand requires Madagascar to have incorporated the Comoros and cored its states."
 MAD_ROY_UNLOCK_CROWN_AFFAIRS_SECTION_TT: "Unlocks the §YAssert the Crown§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_FINANCIAL_SECTION_TT: "Unlocks the §YBegin Monetary Reform§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_HERITAGE_SECTION_TT: "Unlocks the §YConsecrate the Restored Rova§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_ISRAEL_SECTION_TT: "Unlocks the §YSend a Royal Delegation to Israel§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_ISLANDS_SECTION_TT: "Unlocks the §YPresent the Island Sovereignty Dossier§! decision and, after the dossier is presented, the §YPrepare the Island Reclamation§! decision in §YRoyal Political Affairs§!."
 MAD_ROY_UNLOCK_CUSTOMARY_SECTION_TT: "Unlocks the §YRecognise Customary Governance§! decision in §YRoyal Political Affairs§!."
 MAD_TAMIMA_UNLOCK_HOUSE_AFFAIRS_SECTION_TT: "Unlocks the §YConsult the Twelve Elders§! and §YHold a Regional House Conference§! decisions in §YRoyal Political Affairs§!."
 MAD_ROY_RESTORE_ROVA: "Consecrate the Restored Rova"
 MAD_ROY_RESTORE_ROVA_desc: "Fund the ceremonial and archival consecration of the restored Rova. The one-time measure costs 8 treasury, builds an administrative office in Antananarivo, adds 3 percentage points of stability and 5% domestic influence. It complements the focus’s physical public works."
 MAD_ROY_SEND_ROYAL_DELEGATION_TO_ISRAEL: "Send a Royal Delegation to Israel"
 MAD_ROY_SEND_ROYAL_DELEGATION_TO_ISRAEL_desc: "Send a formal royal delegation to improve bilateral relations and increase Madagascar’s influence in Israel by 2%. Israel must exist."
 MAD_ROY_PRESENT_ISLAND_DOSSIER: "Present the Island Sovereignty Dossier"
 MAD_ROY_PRESENT_ISLAND_DOSSIER_desc: "Present Madagascar’s sovereignty case to France. Relations with France deteriorate and the move adds 1 world tension. This is the required first stage before reclamation preparations."
 MAD_ROY_PREPARE_ISLAND_RECLAMATION: "Prepare the Island Reclamation"
 MAD_ROY_PREPARE_ISLAND_RECLAMATION_desc: "After presenting the dossier, prepare the political position for a future reclamation attempt. The move adds 2 world tension and 2% war support. This is a one-time preparatory action, not a claim that the islands have been reclaimed."
 MAD_ROY_ISLAND_DOSSIER_TENSION: "Madagascar Presents the Island Sovereignty Dossier"
 MAD_ROY_RECLAMATION_REQUIRES_DOSSIER_TT: "Requires the §YPresent the Island Sovereignty Dossier§! decision to be completed first."
 MAD_ROYAL_RECOGNISE_CUSTOMARY_GOVERNANCE: "Recognise Customary Governance"
 MAD_ROYAL_RECOGNISE_CUSTOMARY_GOVERNANCE_desc: "Enact recognition of customary institutions through a permanent administrative office in state 268, provided it is a Malagasy core with fewer than two office levels. Costs 12 treasury, reduces corruption, and can only be enacted once."

 MAD_ROYAL_ASSERT_THE_CROWN: "Assert the Crown"
 MAD_ROYAL_ASSERT_THE_CROWN_desc: "One-time administrative measure that strengthens the personal Crown by increasing centralization and domestic influence by 2%, at a treasury cost of 1."

 MAD_ROY_OFFER_UNION_COMOROS: "Offer Union to the Comoros"
 MAD_ROY_OFFER_UNION_COMOROS_desc: "Costs 100 political power. Requires the Comorian government to have at least +100 opinion of Madagascar and Madagascar to hold at least 35% influence in the Comoros. The offer is sent as a diplomatic event; acceptance incorporates the Comoros into Madagascar and adds cores to its states."
 MAD_ROY_OFFER_UNION_SEYCHELLES: "Offer Union to the Seychelles"
 MAD_ROY_OFFER_UNION_SEYCHELLES_desc: "Costs 100 political power. Requires the Seychellois government to have at least +100 opinion of Madagascar and Madagascar to hold at least 35% influence in the Seychelles. The offer is sent as a diplomatic event; acceptance incorporates the Seychelles into Madagascar and adds cores to its states."
 MAD_ROY_OFFER_UNION_MAURITIUS: "Offer Union to Mauritius"
 MAD_ROY_OFFER_UNION_MAURITIUS_desc: "Costs 100 political power. Requires the Mauritian government to have at least +100 opinion of Madagascar and Madagascar to hold at least 35% influence in Mauritius. The offer is sent as a diplomatic event; acceptance incorporates Mauritius into Madagascar and adds cores to its states."
 MAD_ROY_DEMAND_REUNION: "Demand Réunion"
 MAD_ROY_DEMAND_REUNION_desc: "Costs 100 political power and requires island reclamation preparations to be complete. France must decide whether to transfer Réunion. Its willingness to accept is affected by Madagascar’s army and navy size, France’s opinion of Madagascar, and whether the countries share the same government outlook. Refusal strengthens Madagascar’s claim and raises tension."
 MAD_ROY_DEMAND_MAYOTTE: "Demand Mayotte"
 MAD_ROY_DEMAND_MAYOTTE_desc: "Costs 100 political power and requires island reclamation preparations to be complete, plus Madagascar’s incorporation of the Comoros as a core territory. France must decide whether to transfer Mayotte. Its willingness to accept is affected by Madagascar’s army and navy size, France’s opinion of Madagascar, and whether the countries share the same government outlook. Refusal strengthens Madagascar’s claim and raises tension."
 MAD_ROY_MAYOTTE_REQUIRES_COMOROS_CORE_TT: "Requires Madagascar to have incorporated the Comoros and added Malagasy cores to its states."
 MAD_ROY_FRANCE_REFUSES_REUNION_TENSION: "France Refuses Madagascar’s Demand for Réunion"
 MAD_ROY_FRANCE_REFUSES_MAYOTTE_TENSION: "France Refuses Madagascar’s Demand for Mayotte"
 mad_royal.6.t: "A Challenge to the King's Lineage"
 mad_royal.6.d: "Demonstrations have erupted in Antananarivo after opponents of Ndriana's restoration challenged his claim to descend from Madagascar's historical royal line. The Crown can suppress the protests by expanding security spending and deploying the Gendarmerie, or tolerate the demonstrations and risk serious damage to the capital's public infrastructure."
 mad_royal.6.a: "Crush the protests and defend the Crown"
 mad_royal.6.b: "Allow the protests to continue"
 mad_royal.7.t: "A Union with Madagascar?"
 mad_royal.7.d: "Madagascar has proposed a political union with the Comoros. The proposal would bring the islands under a shared Malagasy state, with the Comorian territory integrated into Madagascar. The government must decide whether to accept the offer or preserve Comorian sovereignty."
 mad_royal.7.a: "Accept the union with Madagascar"
 mad_royal.7.b: "Reject the proposal and preserve our sovereignty"
 mad_royal.8.t: "A Union with Madagascar?"
 mad_royal.8.d: "Madagascar has proposed a political union with the Seychelles. The proposal would bring the islands under a shared Malagasy state, with Seychellois territory integrated into Madagascar. The government must decide whether to accept the offer or preserve Seychellois sovereignty."
 mad_royal.8.a: "Accept the union with Madagascar"
 mad_royal.8.b: "Reject the proposal and preserve our sovereignty"
 mad_royal.9.t: "A Union with Madagascar?"
 mad_royal.9.d: "Madagascar has proposed a political union with Mauritius. The proposal would bring the islands under a shared Malagasy state, with Mauritian territory integrated into Madagascar. The government must decide whether to accept the offer or preserve Mauritian sovereignty."
 mad_royal.9.a: "Accept the union with Madagascar"
 mad_royal.9.b: "Reject the proposal and preserve our sovereignty"
 mad_royal.10.t: "The Malagasy Demand for Réunion"
 mad_royal.10.d: "Madagascar has formally demanded that France transfer Réunion. The Madagascan government argues that the island belongs within the Malagasy national sphere. Compliance would be a major diplomatic concession; refusal risks further escalation. Madagascar’s military strength, French opinion of Madagascar, and political alignment may influence the French government's judgement."
 mad_royal.10.a: "Agree to transfer Réunion"
 mad_royal.10.b: "Reject the demand for Réunion"
 mad_royal.11.t: "The Malagasy Demand for Mayotte"
 mad_royal.11.d: "After incorporating the Comoros into the Malagasy state, Madagascar has formally demanded that France transfer Mayotte. The government argues that the island belongs within the Malagasy national sphere. Compliance would be a major diplomatic concession; refusal risks further escalation. Madagascar’s military strength, French opinion of Madagascar, and political alignment may influence the French government's judgement."
 mad_royal.11.a: "Agree to transfer Mayotte"
 mad_royal.11.b: "Reject the demand for Mayotte"

