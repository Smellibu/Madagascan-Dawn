 MAD_POL_TGV_PEM: "Programme Emergence Madagascar"
 MAD_POL_HVM_TECHNOCRATIC_STATE: "Technocratic Development State"
 MAD_POL_ROY_COUNCIL_OFFER: "Royal Council Offer"
 MAD_POL_ROY_COUNCIL_OFFER_desc: "Traditional authorities retain cultural standing in parts of Madagascar, where royal lineages and local councils can influence questions of land, mediation and community identity. Any proposal to give them a formal role must reconcile that heritage with the responsibilities and rights of the modern state."
 MAD_POL_ROY_RECONCILIATION: "Royal Reconciliation"
 MAD_POL_ROY_RECONCILIATION_desc: "Reconciliation between customary authorities and national institutions offers a way to address historical grievances and strengthen local legitimacy. The difficult work is to recognise community traditions without allowing inherited status to override equal treatment, representative government or the legal protections owed to every citizen."
 MAD_POL_MIL_PROFESSIONAL_OFFICERS: "Professionalize the Officer Corps"
 MAD_POL_MIL_PROFESSIONAL_OFFICERS_desc: "The General Staff's institutional approach depends on officers whose appointments and conduct are governed by professional standards rather than factional allegiance. Clear promotion criteria, common training and consistent discipline would strengthen military service as a national institution and reduce the influence of personal patronage."
 MAD_POL_AREMA_REVOLUTIONARY_LEGACY: "Uphold the 1975 Socialist Charter"
 MAD_POL_AREMA_REVOLUTIONARY_LEGACY_desc: "The 1975 Charter of the Malagasy Socialist Revolution, known as the Boky Mena, established the ideological basis of Ratsiraka's Second Republic. It combined Malagasy control of key economic sectors, public economic planning, agrarian transformation and food self-sufficiency with local institutions organised around the fokonolona and an independent foreign policy. This focus reasserts the Charter as the old guard's governing reference, prioritising public ownership and domestic production over export receipts and reliance on foreign capital."
 MAD_POL_AREMA_STATE_BANKS: "Restore State Control of Commercial Banking"
 MAD_POL_AREMA_STATE_BANKS_desc: "In June 1975, Ratsiraka's government nationalised all commercial banks, bringing the banking system under Malagasy state ownership. The socialist programme treated banking as a strategic instrument for directing credit and supporting national development. This focus restores that approach, using public control of finance to support domestic industry and agriculture while requiring disciplined lending so that public banks do not simply finance unviable enterprises."
 MAD_POL_AREMA_NATIONAL_DEVELOPMENT_PACT: "Advance AREMA's 2007 Development Platform"
 MAD_POL_AREMA_NATIONAL_DEVELOPMENT_PACT_desc: "AREMA contested the September 2007 legislative election under party secretary Pierre Houlder despite founder Didier Ratsiraka's call for a boycott. Contemporary election reporting noted that the party's programme shared similarities with President Marc Ravalomanana's Madagascar Action Plan, although AREMA struggled to bring its platform to public attention. This focus represents the party's attempt to advance a national development programme through parliamentary politics."
 MAD_POL_TIM_COMPETITION_LAW: "Enforce Fair Competition"
 MAD_POL_TIM_COMPETITION_LAW_desc: "The 2005 competition framework sought to protect free competition and establish clearer rules for commercial conduct. Effective enforcement requires a capable regulator, transparent investigations and courts able to resolve disputes, so that new firms can enter markets and public decisions do not favour a politically connected incumbent."
 MAD_POL_TIM_NATIONAL_TAX_CAPACITY: "Strengthen National Revenue Collection"
 MAD_POL_TIM_NATIONAL_TAX_CAPACITY_desc: "The government's revenue reforms aimed to strengthen tax and customs administration, improve collection and make economic activity easier to record. Better revenue systems were intended to support development spending and reduce arbitrary treatment of businesses, while clearer procedures and stronger oversight were needed to limit evasion and corruption."
 MAD_POL_TIM_INFRASTRUCTURE_FINANCE: "Finance the Infrastructure Programme"
 MAD_POL_TIM_INFRASTRUCTURE_FINANCE_desc: "The MAP required sustained financing for roads, transport links, ports, energy and telecommunications. The government sought to combine domestic resources with development-partner support and private investment, while identifying projects that could connect productive areas to markets and extend essential services. Project selection and operating costs remained important constraints on delivery."
 MAD_POL_TIM_MAP_REVIEW: "Review MAP Delivery and Results"
 MAD_POL_TIM_MAP_REVIEW_desc: "The MAP set measurable goals and monitoring indicators for each of its eight commitments. A national review compares implementation with those targets, examining whether budget allocations, infrastructure works and sector programmes are producing the promised improvements in access, productivity and living standards, and identifying where delivery needs to be adjusted."
 MAD_POL_TGV_WATER_PROGRAMME: "Water for Every Community"
 MAD_POL_TGV_WATER_PROGRAMME_desc: "Velirano 2 linked access to potable water with reliable electricity. The programme prioritised expanding and rehabilitating water-supply systems, improving treatment, storage and distribution, and extending reliable services to communities beyond the main cities."
 MAD_POL_TGV_PROJECT_FINANCE: "Mobilise Project Finance"
 MAD_POL_TGV_PROJECT_FINANCE_desc: "The PEM sought to finance selected structuring projects largely through private investment, supported by public-private partnerships and a more attractive investment climate. The government promoted investor participation in transport, energy, industrial zones and other productive sectors, with projects expected to support economic activity and employment."
 MAD_POL_TGV_YOUTH_INDUSTRIALISATION: "Build an Industrial Workforce"
 MAD_POL_TGV_YOUTH_INDUSTRIALISATION_desc: "Industrial growth required more than new factories. The programme sought to connect vocational training, technical skills and employment pathways with manufacturers and processing businesses, particularly for younger workers entering the labour market."
 MAD_POL_HVM_ADMINISTRATIVE_STATE: "Strengthen Public Administration"
 MAD_POL_HVM_ADMINISTRATIVE_STATE_desc: "Effective public administration depends on officials who can implement rules consistently, maintain records and deliver services beyond the capital. The government sought to rebuild professional administrative routines, clarify responsibilities between central and territorial authorities, and improve accountability for public services."
 MAD_POL_HVM_PUBLIC_FINANCE: "The government introduced an immediate public financial management action plan built around 21 priority actions, alongside wider ministry-level reforms. Law No. 2016-055 established a revised Public Procurement Code, while the administration pursued more credible budgeting, stronger audit procedures and greater transparency over public spending and state-owned enterprises."
 MAD_POL_HVM_PUBLIC_FINANCE_desc: "The government introduced an immediate public financial management action plan built around 21 priority actions, alongside wider ministry-level reforms. Its priorities included more credible budgeting and execution, stronger procurement and audit procedures, and greater transparency over public spending and state-owned enterprises."
 MAD_POL_HVM_PROJECT_REVIEW: "HVM Project Review"
 MAD_POL_HVM_PROJECT_REVIEW_desc: "An audit of major projects examines whether announced investments have delivered the infrastructure and services they promised. Reviews are especially important where costs are high and delivery is slow, allowing officials to identify stalled contracts, clarify responsibilities and decide whether public money should continue to be committed."
 # ===== Madagascar party-political events =====
 mad_political.1.t: "The Crown Question"
 mad_political.1.d: "The question is no longer whether Madagascar's royal institutions should be recognised, but who may claim authority in their name. Rabarioelina seeks a personal crown, while the traditional Houses reject a unilateral claim and favour a council grounded in customary legitimacy. The decision will determine whether royal authority is concentrated in one ruler or shared among the Houses."
 mad_political.1.a: "Rabarioelina will claim the crown"
 mad_political.1.b: "Let the Houses establish TAMIMA"

 mad_political.2.t: "A Popular Uprising Against the Government"
 mad_political.2.d: "The disputed Daewoo concession has become a rallying point for a much wider uprising against the government. Public anger has been building over economic hardship, allegations of corruption and conflicts of interest, increasingly centralised decision-making, and restrictions on opposition media and political activity. Demonstrators, civil society groups and rival political movements have converged around demands for accountability and a change of government, even though they do not share a single programme. As mass protests spread, soldiers at Camp CAPSAT mutiny and refuse orders to repress civilians, bringing the armed forces into direct confrontation with the government. The authorities must decide whether to defend civilian rule, hand power to the military or accept a transitional movement led by the opposition."
 mad_political.2.a: "Reassert national sovereignty"
 mad_political.2.b: "Hand power to the armed forces"
 mad_political.2.c: "Defend civilian government and absorb the backlash"

 mad_political.3.t: "What Role Should the Armed Forces Play?"
 mad_political.3.d: "The officer corps must decide whether the armed forces should return to a strictly professional role under civilian authority, act as a constitutional guardian, or claim a final right to intervene when civilian politics breaks down. The choice will shape military involvement in politics and the limits placed on future intervention."
 mad_political.3.a: "Professionalise the armed forces"
 mad_political.3.b: "Become the republic's guardian"
 mad_political.3.c: "The army must remain the final arbiter"

 mad_political.4.t: "The AREMA Congress"
 mad_political.4.d: "AREMA has returned to national politics. Three currents now compete over what the movement should become: the Ratsiraka tradition, a renewed social programme, or reconciliation between its factions. The programme choice will determine the road ahead."
 mad_political.4.a: "Let the movement choose"

 mad_political.5.t: "The Terms of Reconciliation"
 mad_political.5.d: "With TIM back in the political arena, the government must decide what reconciliation means in practice. An inclusive agreement can bring rival groups back into the political system; conditional reconciliation limits concessions while pursuing reform; and prioritising accountability strengthens demands for justice but risks reopening old divisions."
 mad_political.5.a: "Build an inclusive reconciliation pact"
 mad_political.5.b: "Reconcile, but on our terms"
 mad_political.5.c: "Accountability must come first"

 mad_political.6.t: "The Tiko Question"
 mad_political.6.d: "Ravalomanana's business success helped TIM build resources and administrative credibility, but the ties between Tiko and public office raise questions about conflicts of interest. The party must choose between a strict separation of private business and the state, or support for a Malagasy national champion."
 mad_political.6.a: "Separate Tiko from the state"
 mad_political.6.b: "Build a Malagasy national champion"

 mad_political.7.t: "What Is TGV's Mandate?"
 mad_political.7.d: "TGV rose through popular mobilisation against the established political order and now has to define the mandate it claims for government. The movement can remain the driving force for national renewal, root its authority in elections and civilian institutions, or preserve exceptional presidential powers to overcome institutional resistance. Each choice sets a different balance between movement leadership and constitutional restraint."
 mad_political.7.a: "The movement must remain the engine of renewal"
 mad_political.7.b: "Our mandate must come from the ballot"
 mad_political.7.c: "The presidency must retain exceptional powers"

 # ===== TGV: Thirteen Velirano =====
 MAD_TGV_VELIRANO_CATEGORY: "Thirteen Velirano"
 MAD_TGV_VELIRANO_CATEGORY_desc: "First make promises, then fund delivery. Promises cost political capital; delivery consumes state resources. These decisions exist only while TGV remains in government."
