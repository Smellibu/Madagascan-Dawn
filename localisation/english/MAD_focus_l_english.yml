 MAD_POLICY_RC_REQUIRE_3_TT: "Requires at least 3 Rural Cooperation."

 MAD_POLICY_ROAD_MAINTENANCE_ACTIVE: "The regional road-maintenance programme is already underway."
 MAD_POLICY_FISHERIES_CYCLE_3: "Three coastal fisheries and cold-chain programme cycles have been completed."
 MAD_POLICY_FISHERIES_ACTIVE: "The coastal fisheries and cold-chain programme is already underway."
 MAD_POLICY_VANILLA_CYCLE_3: "Three vanilla and clove warehouse programme cycles have been completed."
 MAD_POLICY_VANILLA_ACTIVE: "The vanilla and clove warehouse programme is already underway."
 MAD_POLICY_APPRENTICESHIP_CYCLE_3: "Three industrial apprenticeship programme cycles have been completed."
 MAD_POLICY_APPRENTICESHIP_ACTIVE: "The industrial apprenticeship programme is already underway."
 MAD_POLICY_DEFENCE_CYCLE_3: "Three defence maintenance programme cycles have been completed."
 MAD_POLICY_DEFENCE_ACTIVE: "The defence maintenance programme is already underway."
 MAD_RATSIRAKA_EXILE_RESOLVED: "Ratsiraka's exile has been resolved."

 MAD_dip_multipolar_policy: "Adopt a Multipolar Indian Ocean Policy"
 MAD_dip_multipolar_policy_desc: "Madagascar's position between eastern and southern Africa gives it interests that reach far beyond any single great power. Establish a foreign policy that uses outside partnerships while preserving room for Malagasy decisions."
 MAD_dip_ioc_cooperation: "Renew Indian Ocean Commission Cooperation"
 MAD_dip_ioc_cooperation_desc: "Rebuild practical cooperation with Mauritius, Comoros and Seychelles. Shared priorities include maritime safety, regional commerce and the ability of small island administrations to coordinate their interests."
 MAD_dip_sadc_trade: "Implement the SADC Trade Protocol"
 MAD_dip_sadc_trade_desc: "Translate regional commitments into better access to neighbouring markets. Customs procedures, standards and cross-border commercial links require sustained work, particularly with South Africa."
 MAD_dip_franco_malagasy_dialogue: "Open a Franco-Malagasy Political Dialogue"
 MAD_dip_franco_malagasy_dialogue_desc: "Madagascar's relationship with France encompasses history, trade, development and unresolved questions of sovereignty. A formal political channel can address difficult issues without confusing diplomacy with dependence."
 MAD_dip_indian_geomatics: "Develop Indian Geospatial Cooperation"
 MAD_dip_indian_geomatics_desc: "Expand technical cooperation with India in mapping, hydrography and geospatial information. Better national surveying supports infrastructure planning, maritime knowledge and the management of Madagascar's extensive territory."
 MAD_dip_china_industrial_partnership: "Establish a China-Madagascar Industrial Partnership"
 MAD_dip_china_industrial_partnership_desc: "Invite Chinese participation in a partnership that can bring capital, machinery and technical knowledge. The terms must determine whether investment builds local capabilities or mainly deepens external dependence."
 MAD_dip_eu_epa: "Implement the EU Economic Partnership Agreement"
 MAD_dip_eu_epa_desc: "Put the Economic Partnership Agreement into practical effect through customs cooperation, export standards and closer commercial relations with European markets. The benefits of access depend on Malagasy producers being able to meet the requirements."
 MAD_dip_mauritius_trade: "Deepen Mauritius Trade Links"
 MAD_dip_mauritius_trade_desc: "Mauritius is a nearby commercial partner with established links to Malagasy markets. A bilateral protocol can make trade and services easier, but the terms must work for domestic firms as well as established regional businesses."
 MAD_dip_cyclone_network: "Create an Indian Ocean Cyclone Network"
 MAD_dip_cyclone_network_desc: "Cyclones cross national boundaries and can overwhelm small island administrations. Shared forecasting, emergency stockpiles and coordinated exercises can improve preparedness before the next storm makes landfall."
 MAD_dip_iles_eparses: "Negotiate the Îles Éparses Dispute"
 MAD_dip_iles_eparses_desc: "The sovereignty dispute over the Îles Éparses remains a long-standing issue in relations with France. Madagascar can pursue a joint technical process or seek wider diplomatic support while retaining its position on sovereignty."
 MAD_dip_swio_maritime_safety: "Create a Southwest Indian Ocean Maritime Safety Compact"
 MAD_dip_swio_maritime_safety_desc: "Build on island cooperation and the political dialogue with France to improve civilian search and rescue, emergency communications and responses to maritime incidents. This compact complements, rather than replaces, military maritime coordination."
 MAD_dip_sustainable_fisheries: "Conclude Sustainable Fisheries Cooperation"
 MAD_dip_sustainable_fisheries_desc: "Foreign fishing access can provide revenue, but poorly managed licensing can undermine the long-term value of Malagasy waters. Decide whether to prioritise licensing income or invest more heavily in local capacity and monitoring."
 MAD_dip_blue_economy: "Develop Madagascar's Blue Economy"
 MAD_dip_blue_economy_desc: "Turn maritime resources into durable domestic activity through scientific surveys, coastal cold chains and local fish processing. The aim is to capture more value onshore rather than relying solely on access fees."
 MAD_dip_continental_shelf: "Prepare the Extended Continental Shelf Dossier"
 MAD_dip_continental_shelf_desc: "A continental-shelf submission requires detailed geological, hydrographic and legal evidence. Fund the scientific work and assemble a technically credible case under the law of the sea."

 MAD_dip_foreign_service: "Malagasy Foreign Service"
 MAD_dip_foreign_service_desc: "A permanent diplomatic service gives Madagascar a more consistent voice abroad and improves its ability to build commercial relationships."
 MAD_dip_customs_modernisation: "Domestic Customs Modernisation"
 MAD_dip_customs_modernisation_desc: "After Mauritius declined the bilateral trade protocol, Madagascar is improving customs procedures and commercial administration at home."
 MAD_dip_strategic_autonomy: "Strategic Autonomy"
 MAD_dip_strategic_autonomy_desc: "Madagascar engages foreign partners without allowing any one relationship to determine national policy. Strategic autonomy protects decision-making space, but can make external support more difficult to secure."
 MAD_dip_development_first: "Development-First Diplomacy"
 MAD_dip_development_first_desc: "Foreign relationships are judged by the capital, skills and market access they bring to Madagascar. This approach welcomes useful partnerships while expecting concrete development outcomes."
 MAD_dip_regional_leadership: "Regional Leadership"
 MAD_dip_regional_leadership_desc: "Madagascar invests diplomatic effort in the institutions and neighbouring states of the southwest Indian Ocean. Regional leadership creates influence through practical cooperation rather than distant alignments."
 MAD_dip_ioc_network: "Indian Ocean Cooperation Network"
 MAD_dip_ioc_network_desc: "At least one island partner has accepted Madagascar's invitation to deepen regional cooperation. The network provides a modest foundation for trade and technical coordination."
 MAD_dip_ioc_active: "Active Indian Ocean Cooperation"
 MAD_dip_ioc_active_desc: "Multiple island partners have accepted Madagascar's invitation. Cooperation now has enough participants to support more regular regional coordination."
 MAD_dip_mauritius_trade_spirit: "Mauritius Trade Protocol"
 MAD_dip_mauritius_trade_spirit_desc: "A bilateral protocol with Mauritius supports commercial exchange and services links between the two neighbouring island economies."
 MAD_dip_cyclone_warning: "Indian Ocean Cyclone Warning Network"
 MAD_dip_cyclone_warning_desc: "Shared forecasting and technical cooperation improve the ability to interpret cyclone information and coordinate preparations across the southwest Indian Ocean."
 MAD_dip_sadc_linkages: "SADC Trade Linkages"
 MAD_dip_sadc_linkages_desc: "Closer trade procedures and regional market access strengthen Madagascar's commercial links with southern Africa."
 MAD_dip_franco_dialogue: "Franco-Malagasy Political Dialogue"
 MAD_dip_franco_dialogue_desc: "A formal channel with France keeps political questions open for discussion while preserving working relations in areas of mutual interest."
 MAD_dip_france_dialogue_accepted: "France has accepted the Franco-Malagasy political dialogue."
 MAD_dip_iles_commission: "Îles Éparses Joint Commission"
 MAD_dip_iles_commission_desc: "A joint technical process enables discussions on maritime boundaries, scientific surveys and practical cooperation without prejudging the sovereignty dispute."
 MAD_dip_iles_campaign: "Internationalise the Îles Éparses Question"

 MAD_dip_iles_campaign_decisions: "Îles Éparses Diplomatic Campaign"
 MAD_dip_maintain_iles_campaign: "Maintain the Îles Éparses Campaign"
 MAD_dip_maintain_iles_campaign_desc: "Fund a final diplomatic initiative to keep Madagascar's position before regional partners."
 MAD_dip_iles_campaign_desc: "Madagascar is seeking wider diplomatic support for its position on the Îles Éparses while keeping open the possibility of a negotiated settlement. The campaign unlocks a single funded decision to renew regional support."
 MAD_dip_swio_safety: "Southwest Indian Ocean Maritime Safety"
 MAD_dip_swio_safety_desc: "Regional partners are coordinating civilian maritime safety, search and rescue and responses to incidents at sea."
 MAD_dip_indian_geomatics_spirit: "Indian Geospatial Cooperation"
 MAD_dip_indian_geomatics_spirit_desc: "Technical cooperation with India improves access to geospatial expertise and strengthens national mapping and maritime survey capacity."
 MAD_dip_china_local_content: "Chinese-Malagasy Industrial Joint Venture"
 MAD_dip_china_local_content_desc: "A co-financed industrial project brings new capacity to Toamasina. Local ownership and supplier participation determine how much of the investment benefits Malagasy firms."
 MAD_dip_china_technical_training: "Chinese Technical Training Programme"
 MAD_dip_china_technical_training_desc: "A machinery and technical training agreement emphasises Malagasy skills and industrial knowledge rather than a foreign-operated turnkey project."
 MAD_dip_eu_harmonisation: "European Standards Harmonisation"
 MAD_dip_eu_harmonisation_desc: "Malagasy exporters are adapting production and administration to the technical requirements of European markets. Larger exporters and established commercial houses are best placed to benefit."
 MAD_dip_eu_safeguards: "Phased European Market Integration"
 MAD_dip_eu_safeguards_desc: "Market access is being expanded gradually, allowing domestic producers time to adjust to competition and new standards."
 MAD_dip_fisheries_licensing: "Foreign Fisheries Licensing"
 MAD_dip_fisheries_licensing_desc: "Licensing access to Malagasy waters generates revenue, but requires credible monitoring and limits that preserve the resource for the future."
 MAD_dip_domestic_fisheries: "Domestic Fisheries Development"
 MAD_dip_domestic_fisheries_desc: "Investment in Malagasy fishing capacity and coastal processing is intended to keep more of the value from marine resources within the country."
 MAD_dip_blue_economy_spirit: "Malagasy Blue Economy"
 MAD_dip_blue_economy_spirit_desc: "Scientific knowledge, sustainable management and local processing are becoming part of a more coherent maritime economy."
 MAD_dip_cyclone_stockpiles: "Regional Emergency Stockpiles"
 MAD_dip_cyclone_stockpiles_desc: "Pre-positioned supplies and better logistics allow emergency responders to sustain operations when a cyclone disrupts normal transport."
 MAD_dip_continental_shelf_dossier: "Continental Shelf Scientific Dossier"
 MAD_dip_continental_shelf_dossier_desc: "The completed scientific and legal dossier supports Madagascar's submission on the outer limits of its continental shelf."

 mad_indian_ocean_research_name: "Indian Ocean Research Network"
 mad_indian_ocean_research_desc: "A technical research-sharing arrangement connecting Madagascar and participating Indian Ocean partners."

 mad_diplomacy.1.t: "Choose Madagascar's Diplomatic Direction"
 mad_diplomacy.1.d: "Madagascar must decide what it expects from its international relationships. We can protect strategic room for manoeuvre, prioritise practical development gains or place regional leadership at the centre of our foreign policy."
 mad_diplomacy.1.a: "Preserve strategic autonomy"
 mad_diplomacy.1.b: "Put development first"
 mad_diplomacy.1.c: "Lead through regional cooperation"

 mad_diplomacy.10.t: "Indian Ocean Cooperation Invitation"
 mad_diplomacy.10.d: "Madagascar has invited Mauritius to strengthen practical cooperation among the island states of the southwest Indian Ocean. The proposal focuses on trade relations, regional coordination and shared maritime interests."
 mad_diplomacy.10.a: "Accept the invitation"
 mad_diplomacy.10.b: "Decline for now"
 mad_diplomacy.11.t: "Indian Ocean Cooperation Invitation"
 mad_diplomacy.11.d: "Madagascar has invited Comoros to strengthen practical cooperation among the island states of the southwest Indian Ocean. The proposal focuses on regional coordination and shared maritime interests."
 mad_diplomacy.11.a: "Accept the invitation"
 mad_diplomacy.11.b: "Decline for now"
 mad_diplomacy.12.t: "Indian Ocean Cooperation Invitation"
 mad_diplomacy.12.d: "Madagascar has invited Seychelles to strengthen practical cooperation among the island states of the southwest Indian Ocean. The proposal focuses on regional coordination and shared maritime interests."
 mad_diplomacy.12.a: "Accept the invitation"
 mad_diplomacy.12.b: "Decline for now"

 mad_diplomacy.20.t: "Madagascar Proposes a Trade Protocol"
 mad_diplomacy.20.d: "Madagascar proposes a bilateral protocol to improve trade and services links between the two neighbouring island economies. If Mauritius accepts, Madagascar will contribute $750 million towards customs, commercial and logistical integration in exchange for a permanent improvement to trade and services."
 mad_diplomacy.20.a: "Conclude the trade protocol"
 mad_diplomacy.20.b: "Decline the proposal"

 mad_diplomacy.30.t: "A New Franco-Malagasy Dialogue"
 mad_diplomacy.30.d: "Madagascar proposes a formal political dialogue to address the difficult questions in the bilateral relationship while keeping practical cooperation open. The initiative is intended to provide a regular channel for frank discussion."
 mad_diplomacy.30.a: "Open the political dialogue"
 mad_diplomacy.30.b: "Decline the proposal"

 mad_diplomacy.31.t: "The Îles Éparses Question"
 mad_diplomacy.31.d: "The sovereignty dispute with France remains unresolved. Madagascar must decide whether to seek a joint technical process or take its case to a wider diplomatic audience."
 mad_diplomacy.31.a: "Propose a joint technical commission"
 mad_diplomacy.31.b: "Internationalise the dispute"

 mad_diplomacy.32.t: "Madagascar Proposes a Joint Commission"
 mad_diplomacy.32.d: "Madagascar has proposed a joint commission to address the Îles Éparses question through technical discussions, scientific surveys and maritime cooperation. The proposal does not require either side to abandon its legal position."
 mad_diplomacy.32.a: "Accept the joint commission"
 mad_diplomacy.32.b: "Reject the commission"

 mad_diplomacy.320.t: "France Accepts the Joint Commission"
 mad_diplomacy.320.d: "France has agreed to establish a joint commission on the Îles Éparses. Madagascar must now decide whether to prioritise the practical benefits of a technical process or preserve a harder sovereignty-first diplomatic position."
 mad_diplomacy.320.a: "Proceed with a joint technical commission"
 mad_diplomacy.320.b: "Maintain a sovereignty-first position"

 mad_diplomacy.33.t: "France Rejects the Commission"
 mad_diplomacy.33.d: "France has declined to establish the proposed joint commission. Madagascar can take the issue to international forums or keep the bilateral channel open while continuing to assert its position."
 mad_diplomacy.33.a: "Seek wider diplomatic support"
 mad_diplomacy.33.b: "Keep the bilateral channel open"
 mad_diplomacy.91.t: "[FROM.GetNameDef] Declines Madagascar's Proposal"
 mad_diplomacy.91.d: "[FROM.GetNameDef] has declined Madagascar's proposal. The offer will not proceed, and the refusal will strain relations with Madagascar."
 mad_diplomacy.91.a: "We will remember this refusal"

 mad_diplomacy.40.t: "Indian Technical Cooperation Proposal"
 mad_diplomacy.40.d: "Madagascar has proposed a technical partnership with India focused on geospatial information, hydrography and scientific surveying. If India accepts, Madagascar will contribute $1 billion towards the joint programme, exchanging financial support for access to expertise and technical cooperation. If Madagascar has also completed its existing JICA cooperation, Japan will receive a separate invitation to join the research network."
 mad_diplomacy.40.a: "Accept the technical partnership"
 mad_diplomacy.40.b: "Decline the proposal"

 mad_diplomacy.50.t: "An Industrial Partnership with Madagascar"
 mad_diplomacy.50.d: "Madagascar proposes a co-financed industrial partnership. If China accepts, it will contribute $5 billion or $3 billion depending on the programme selected. Madagascar must also be able to fund its share; no contribution is taken until a package is chosen."
 mad_diplomacy.50.a: "Finance the industrial partnership"
 mad_diplomacy.50.b: "Decline the proposal"
 mad_diplomacy.51.t: "Set the Terms of Chinese Cooperation"
 mad_diplomacy.51.d: "China has offered to contribute $5 billion to a Malagasy-majority industrial joint venture or $3 billion to machinery and technical training. Madagascar must contribute $2 billion to the joint venture or $1 billion to the training package. The funds are transferred only when the selected terms can be financed."
 mad_diplomacy.51.a: "Build a Malagasy-majority joint venture"
 mad_diplomacy.51.b: "Prioritise machinery and technical training"
 mad_diplomacy.51.c: "Decline both financing packages"

 mad_diplomacy.60.t: "Madagascar Seeks SADC Trade Cooperation"
 mad_diplomacy.60.d: "Madagascar proposes closer implementation of regional trade arrangements, with practical work on customs procedures and market access. South Africa's support would give the initiative an important regional partner."
 mad_diplomacy.60.a: "Support the trade initiative"
 mad_diplomacy.60.b: "Decline the proposal"

 mad_diplomacy.70.t: "Choose How to Implement the EU Agreement"
 mad_diplomacy.70.d: "The Economic Partnership Agreement offers opportunities to improve access to European markets, but implementation has domestic consequences. We can move quickly to harmonise standards or phase in market integration while giving Malagasy producers more time to adjust."
 mad_diplomacy.70.a: "Accelerate standards harmonisation"
 mad_diplomacy.70.b: "Phase in domestic safeguards"

 mad_diplomacy.80.t: "The Future of Malagasy Fisheries"
 mad_diplomacy.80.d: "Cooperation with the European Union can bring licensing revenue from fishing access, but a larger domestic fishing sector could retain more value in Madagascar. The choice will shape how the country benefits from its marine resources."
 mad_diplomacy.80.a: "Prioritise foreign licensing revenue"
 mad_diplomacy.80.b: "Invest in domestic fishing capacity"

 MAD_dip_cyclone_decisions: "Indian Ocean Cyclone Preparedness"
 MAD_dip_shared_forecasting: "Coordinate Cyclone Forecasting"
 MAD_dip_shared_forecasting_desc: "Fund technical coordination and shared forecasting capacity with regional partners. The programme improves the ability to interpret warnings and coordinate preparations before a cyclone reaches the region."
 MAD_dip_preposition_supplies: "Pre-position Emergency Supplies"
 MAD_dip_preposition_supplies_desc: "Create regional arrangements for emergency supplies and logistics. Pre-positioning equipment and essential goods reduces the time required to begin an organised response after a cyclone."
 MAD_dip_regional_response_exercise: "Conduct a Regional Response Exercise"
 MAD_dip_regional_response_exercise_desc: "Exercise the coordination of emergency services, transport and civil authorities with regional partners. The programme tests procedures before they are needed in a real disaster."
 MAD_dip_maritime_safety_drill: "Conduct a Maritime Safety Drill"
 MAD_dip_maritime_safety_drill_desc: "Test communications and coordination for civilian search and rescue and maritime incidents. The drill complements existing naval training without creating a second military operations system."

 MAD_dip_blue_economy_decisions: "Malagasy Blue Economy Programme"
 MAD_dip_marine_resource_survey: "Survey Marine Resources"
 MAD_dip_marine_resource_survey_desc: "Fund hydrographic and marine resource surveys to improve the evidence available for sustainable management, fisheries planning and coastal development."
 MAD_dip_coastal_cold_chain: "Build Coastal Cold-Chain Capacity"
 MAD_dip_coastal_cold_chain_desc: "Support cold storage and handling links between fishing communities, processors and markets. Better preservation can reduce losses and improve the value of locally landed fish."
 MAD_dip_local_fish_processors: "Support Local Fish Processors"
 MAD_dip_local_fish_processors_desc: "Help domestic processors improve equipment, handling and access to markets. A stronger local processing sector keeps more value and skilled employment within Madagascar."

 MAD_dip_shelf_decisions: "Continental Shelf Submission"
 MAD_dip_submit_continental_shelf: "Submit the Extended Continental Shelf Dossier"
 MAD_dip_submit_continental_shelf_desc: "Complete the scientific and legal preparation needed to submit Madagascar's outer continental shelf case to the Commission on the Limits of the Continental Shelf. The submission is a legal process, not an automatic grant of new territory or resources."

 mad_diplomacy.35.t: "France and the Maritime Safety Compact"
 mad_diplomacy.35.d: "Madagascar has invited France to join a civilian maritime safety compact with southwest Indian Ocean partners. The proposal covers search and rescue, emergency communications and coordination during maritime incidents."
 mad_diplomacy.35.a: "Join the maritime safety compact"
 mad_diplomacy.35.b: "Decline the invitation"

 MAD_dip_ioc_cooperation_tt: "One accepted invitation establishes the basic cooperation network. Two or more acceptances upgrade it to active regional cooperation."
 MAD_dip_china_partnership_terms_tt: "If China accepts, choose either a locally anchored industrial joint venture or a machinery and technical-training package. Only the selected five-year national spirit is applied."

 MAD_dip_mauritius_contribution_tt: "If Mauritius accepts, Madagascar contributes $750 million to the trade and services protocol."
 MAD_dip_indian_contribution_tt: "If India accepts, Madagascar contributes $1 billion to the joint geospatial and hydrographic programme."
 MAD_dip_sadc_domestic_implementation_tt: "Implement domestic SADC trade measures and faction responses regardless of South Africa's decision. The bilateral trade agreement and additional influence require South African acceptance."
 MAD_dip_swio_acceptance_tt: "France and each participating IOC partner receive separate invitations. The civilian maritime safety drill is unlocked only if at least two partners accept."
 MAD_dip_swio_exercise_unlocked: "A Southwest Indian Ocean maritime exercise has been unlocked."

 MAD_dip_iles_maritime_research: "Îles Éparses Maritime Research"
 MAD_dip_iles_marine_research: "Îles Éparses Marine Systems Research"
 MAD_dip_indian_electronics_research: "Indian Electronics Cooperation"
 MAD_dip_indian_computing_research: "Indian Computing Cooperation"
