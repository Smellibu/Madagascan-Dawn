 MAD_DROUGHT_EMERGENCY_WATER_desc: "The programme provides six months of emergency-water relief to §Y[FROM.GetName]§!, helping reduce the pressure that drought places on local communities. Only one national emergency-water programme can operate at a time. Relief effectiveness depends on Rural Cooperation: below 35, §Y50%§!; 35–59.99, §Y80%§!; 60–79.99, §Y100%§!; and 80+, §Y120%§!. Dahalo interference can weaken delivery but does not change the six-month duration."

 MAD_DROUGHT_EMERGENCY_WATER_EFFECT_tt: "§Y[FROM.GetName]§! receives §Y6 months§! of emergency-water relief immediately."

