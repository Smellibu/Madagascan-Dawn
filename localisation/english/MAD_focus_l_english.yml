 # --- JIRAMA recovery event ---
 mad_jirama.1.t: "The JIRAMA Recovery Plan"
 mad_jirama.1.d: "The recovery plan has reached the cabinet. JIRAMA still faces a basic choice: make tariffs and collections do more of the work, put public money behind the utility, or make room for competitive private generation and outside capital. Each route improves part of the system while creating a different political and financial burden."
 mad_jirama.1.a: "Make the tariff system pay for power"
 mad_jirama.1.b: "Back JIRAMA from the Treasury"
 mad_jirama.1.c: "Open generation to competition"
 mad_jirama.1.a_tt: "Lower unpaid consumption and fuel waste, improve revenue collection, but reduce stability and anger small businesses and landowners."
 mad_jirama.1.b_tt: "Spend about 1.3% of GDP to recapitalise JIRAMA, improve generation and lower internal investment costs, while upsetting the banking faction."
 mad_jirama.1.c_tt: "Improve renewable project speed and financing conditions, but increase foreign influence and reduce stability."

