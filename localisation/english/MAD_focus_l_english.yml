 # --- Madagascar movie-release events and timed ideas ---
 mad_movie.1.t: "Madagascar Premieres"
 mad_movie.1.d: "On 27 May 2005, the first Madagascar film reaches cinemas. Suddenly the island's name is on screens around the world, and even a cartoon lemur seems to be doing wonders for Western drift and corporate-tax receipts."
 mad_movie.1.a: "I like to move it, move it"

 mad_movie.2.t: "Escape 2 Africa Arrives"
 mad_movie.2.d: "On 7 November 2008, Madagascar: Escape 2 Africa opens in cinemas. The sequel keeps Madagascar in the public eye, giving the island another brief boost in Western drift and corporate-tax income."
 mad_movie.2.a: "The sequel is a hit"

 mad_movie.3.t: "Madagascar 3: Europe's Most Wanted"
 mad_movie.3.d: "On 8 June 2012, the animals return in Madagascar 3: Europe's Most Wanted. The island's unlikely cinematic ambassador is still working overtime, bringing another temporary bump to Western drift and corporate-tax receipts."
 mad_movie.3.a: "The show goes on"

 mad_movie.4.t: "Penguins of Madagascar Premieres"
 mad_movie.4.d: "On 26 November 2014, Penguins of Madagascar—the franchise's fourth theatrical feature, though a spin-off rather than a numbered main-series sequel—opens in cinemas. Somehow the penguins' covert antics also raise Madagascar's profile and taxable corporate income for a year."
 mad_movie.4.a: "Smile and wave, boys"

