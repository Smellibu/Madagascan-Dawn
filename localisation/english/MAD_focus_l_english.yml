 # --- Daewoo lease + agricultural reforms ---
 MAD_daewoo_category: "The Daewoo Lease"
 MAD_daewoo_category_desc: "Project viability: §Y[?MAD_daewoo_viability|0]§!/100 (§Y60§! to sign the project off)\nCurrent terms: [MAD_GetDaewooTier]\n\nEvery qualifier raises viability and softens the lease. Several can only be done if the rest of the government has done its homework."
 MAD_daewoo_tier_toxic: "§RToxic§! - massive corruption, a hostile public, Korean control"
 MAD_daewoo_tier_troubled: "§YTroubled§! - the worst is contained, but the deal still stinks"
 MAD_daewoo_tier_sound: "§GSound§! - the lease works, and the land is being farmed"
 MAD_daewoo_tier_none: " "
 MAD_DAEWOO_REVIEW: "Daewoo: The Lease Review"
 MAD_DAEWOO_REVIEW_desc: "The Daewoo lease was signed in secret, on terms no honest negotiator would have accepted. It can still be made to work: every qualifier below raises the project’s viability, which currently stands at §Y[?MAD_daewoo_viability|0]§! out of 100.\n\nOnce viability reaches §Y60§! the project can be signed off. If the two years run out first, the lease collapses and the government falls."
 MAD_DAEWOO_VIABILITY_60_tt: "Project viability is at least §Y60§!"
 MAD_DAEWOO_KOREAN_PURCHASES_tt: "§YKorean Purchases§! has been completed"
 MAD_DAEWOO_BIANCO_INDEPENDENT_tt: "§YBianco Independent§! has been completed"
 MAD_DAEWOO_ADDENDUM_tt: "§YBianco Politicized§! has been completed, and the contract has not been published"
 MAD_DAEWOO_RAIL_tt: "The §YMahajanga§! or §YToliara§! railway has been built"
 MAD_DAEWOO_VANILLA_SECTOR_tt: "§YVanilla Export Sector§! has been completed"
 MAD_DAEWOO_OUTCOME_WELL_tt: "The Daewoo lease has been signed off as a success"
 MAD_DAEWOO_OUTCOME_FAILED_tt: "The Daewoo lease has collapsed and the government has fallen"
 MAD_agri_reforms_tt: "Agricultural output improves: §G-3%§! agriculture worker requirement, §G+3%§! agricultural productivity"
 MAD_daewoo_deal_tt: "The lease is signed. Its terms will not stay secret for long."
 MAD_agri_sound_tt: "Working farmland: §G-2%§! agriculture worker requirement, §G+4%§! agricultural productivity, §G+5%§! agriculture tax income"
 MAD_agriculture_modifier: "Madagascan Agriculture"
 MAD_agriculture_modifier_desc: "The state of Madagascar’s farms: how many hands they need, how much they yield and what they pay in tax."
 MAD_DAEWOO_RENEGOTIATE: "Renegotiate the Lease Terms"
 MAD_DAEWOO_RENEGOTIATE_desc: "Go back to Seoul with a shorter, smaller, paid lease. Daewoo did not expect the government to know what it was signing.\n\nViability §G+20§!."
 MAD_DAEWOO_LAND_TITLES: "Register the Concession Lands"
 MAD_DAEWOO_LAND_TITLES_desc: "Survey and title the leased land, so that farmers with a claim can be heard before the bulldozers arrive.\n\nViability §G+15§!. The landowners’ anger eases a little."
 MAD_DAEWOO_PUBLISH_CONTRACT: "Publish the Contract"
 MAD_DAEWOO_PUBLISH_CONTRACT_desc: "Put the full lease in front of the public and the courts. The terms are bad, but the secrecy was worse.\n\nViability §G+20§!, stability §G+2%§!."
 MAD_DAEWOO_CLASSIFIED_ADDENDUM: "Sign the Classified Addendum"
 MAD_DAEWOO_CLASSIFIED_ADDENDUM_desc: "The politicised anti-corruption bureau has a use for a deal like this: a private addendum that pays the right people and never sees a courtroom.\n\nMore corruption. Viability §R-10§!."
 MAD_DAEWOO_OUTGROWERS: "Smallholder Outgrower Contracts"
 MAD_DAEWOO_OUTGROWERS_desc: "Tie part of the concession to contracts with local smallholders, and reserve part of the harvest for the domestic market.\n\nViability §G+15§!. Softens the food crisis the cash crops would otherwise cause."
 MAD_DAEWOO_LOGISTICS: "Connect the Concessions to the Ports"
 MAD_DAEWOO_LOGISTICS_desc: "Rail links to the Toliara and Mahajanga ports mean the harvest can leave the country without a thousand kilometres of dirt road.\n\nViability §G+15§!."
 MAD_DAEWOO_LOCAL_PROCESSING: "Require Local Processing"
 MAD_DAEWOO_LOCAL_PROCESSING_desc: "Force Daewoo to mill and pack at least part of the crop in Madagascar, on the back of the vanilla export sector’s expertise.\n\nViability §G+10§!."
 MAD_DAEWOO_LEASE_TOXIC: "Daewoo: A Toxic Lease"
 MAD_DAEWOO_LEASE_TOXIC_desc: "A vast, secret land lease on terms written entirely in the tenant’s favour. Officials are being paid, farmers are being moved, and foreign owners have the final say over land the government does not control. Qualifiers in the Daewoo category can drag it out of this hole."
 MAD_DAEWOO_LEASE_TROUBLED: "Daewoo: A Troubled Lease"
 MAD_DAEWOO_LEASE_TROUBLED_desc: "The worst abuses have been reined in. The terms are still bad, the corruption is still real, but the lease is no longer a scandal waiting to happen."
 MAD_DAEWOO_LEASE_SOUND: "Daewoo: A Working Lease"
 MAD_DAEWOO_LEASE_SOUND_desc: "Renegotiated, published and connected to the ports, the Daewoo concession is producing real crops on real farmland. The corruption has not vanished, but it is contained."
 MAD_DAEWOO_CANCELLED: "Daewoo: Cancelled Lease"
 MAD_DAEWOO_CANCELLED_desc: "Madagascar tore up a foreign land lease. Investors will remember it for a while."
 mad_daewoo.1.t: "The Lease Becomes Public"
 mad_daewoo.1.d: "Word of the Daewoo lease has reached the newspapers and the churches. A foreign company has been promised a vast stretch of farmland for nothing, in a country where many cannot afford rice. There are marches in the capital and murmurs in the barracks.\n\nThe government must decide whether to stand by the deal or tear it up."
 mad_daewoo.1.a: "The protests will not go away"
 mad_daewoo.2.t: "The Lease Works"
 mad_daewoo.2.d: "Renegotiated, published and tied to the ports, the Daewoo project has become something the government can defend. The land is farmed, the harvest leaves by rail, and the loudest critics have run out of scandals.\n\nThe corruption has not gone away, but for the first time the lease is doing more for Madagascar than it costs."
 mad_daewoo.2.a: "A deal, at last"
 mad_daewoo.3.t: "The Lease Collapses"
 mad_daewoo.3.d: "Two years on, the Daewoo lease is still a grievance. The terms were never fixed, the crops go abroad, and the country’s hunger has grown while the concession has flourished. The deal has collapsed under the weight of its own scandal, and with it the government that signed it.\n\nThe voters will have their say, and the state will pay the bill for the broken contract."
 mad_daewoo.3.a: "A deal we should never have made"


 # ===== Drought and famine panel =====
 MAD_drought_category: "Drought and Famine"
 MAD_drought_category_desc: "[MAD_GetDroughtPhase]\nNational severity (the average of the states): §Y[?MAD_drought_severity|0]§!/100 [MAD_GetDroughtTrend]\nMahajanga: §Y[?MAD_drought_266_display|0]§!/100 drought, §Y[?MAD_famine_266_display|0]§!/100 hunger\nAntananarivo: §Y[?MAD_drought_267_display|0]§!/100 drought, §Y[?MAD_famine_267_display|0]§!/100 hunger\nToliara: §Y[?MAD_drought_268_display|0]§!/100 drought, §Y[?MAD_famine_268_display|0]§!/100 hunger\nToamasina: §Y[?MAD_drought_487_display|0]§!/100 drought, §Y[?MAD_famine_487_display|0]§!/100 hunger\nConditions: [MAD_GetDroughtTier]\nPreventative measures: §Y[?MAD_drought_prevention_count|0]§!/7 (five qualifying measures + severity at §Y30§! or below)"
 MAD_drought_phase_open: "§YThe south is drying out.§! Relief buys time but the pressure never stops. Only the preventative measures unlocked in the Drought And Famine branch can turn it around."
