 MAD_MILITARY_SUPPORT_GENDARMERIE: "Support the Gendarmerie"

 MAD_POL_AREMA_STATE_SOCIALISM: "Strategic socialised enterprise"
 MAD_POL_AREMA_MODERN_SOCIALISM: "Modern Malagasy Socialism"
 MAD_POL_TIM_INSTITUTIONAL_LIBERALISM: "Institutional Liberalism"
 MAD_POL_TIM_NATIONAL_CHAMPION_PROGRAMME: "National Champion Model"
 MAD_POL_TGV_INSTITUTIONAL_EMERGENCE: "Institutionalised Emergence"
 MAD_POL_TGV_PRESIDENTIALISM: "Presidential Emergence"
 MAD_POL_TGV_PEM: "Programme Emergence Madagascar"
 MAD_POL_HVM_TECHNOCRATIC_STATE: "Technocratic Development State"
 MAD_POL_ROY_COUNCIL_OFFER: "Royal Council Offer"
 MAD_POL_ROY_COUNCIL_OFFER_desc: "Traditional authorities retain cultural standing in parts of Madagascar, where royal lineages and local councils can influence questions of land, mediation and community identity. Any proposal to give them a formal role must reconcile that heritage with the responsibilities and rights of the modern state."
 MAD_POL_ROY_RECONCILIATION: "Royal Reconciliation"
 MAD_POL_ROY_RECONCILIATION_desc: "Reconciliation between customary authorities and national institutions offers a way to address historical grievances and strengthen local legitimacy. The difficult work is to recognise community traditions without allowing inherited status to override equal treatment, representative government or the legal protections owed to every citizen."
 MAD_POL_MIL_PROFESSIONAL_OFFICERS: "Military Professional Officers"
 MAD_POL_MIL_PROFESSIONAL_OFFICERS_desc: "A professional officer corps is essential for a military that must respond to domestic emergencies while remaining accountable to civilian authority. Clear promotion standards, training and institutional discipline can reduce factionalism and make the armed forces more capable without drawing them further into everyday politics."
 MAD_POL_MIL_LESSON_2009: "Lesson 2009"
 MAD_POL_MIL_LESSON_2009_desc: "The political crisis demonstrated how quickly military loyalties and command structures can become decisive during a struggle over national authority. Reformers argue that clear chains of command, professional standards and respect for constitutional procedures are essential if the armed forces are to remain a national institution."
 MAD_POL_AREMA_REVOLUTIONARY_LEGACY: "Arema Revolutionary Legacy"
 MAD_POL_AREMA_REVOLUTIONARY_LEGACY_desc: "The legacy of earlier state-led development remains influential in debates about sovereignty, social provision and economic control. Supporters emphasise national ownership and public coordination, while critics point to the need for productive enterprises, sound administration and institutions that can adapt when central planning falls short."
 MAD_POL_AREMA_WORKERS_FARMERS: "AREMA: Workers and Farmers"
 MAD_POL_AREMA_WORKERS_FARMERS_desc: "Workers and small farmers form the backbone of Madagascar's livelihoods, yet many face low productivity, insecure incomes and limited access to services. A social-development agenda seeks to connect rural production with public support and employment, while avoiding promises that public budgets cannot sustain."
 MAD_POL_AREMA_STATE_BANKS: "AREMA State Banks"
 MAD_POL_AREMA_STATE_BANKS_desc: "State-directed banking can channel credit towards infrastructure, agriculture and industries that private lenders consider too risky. The approach may fill gaps in long-term finance, but its success depends on transparent lending, professional governance and safeguards against politically connected loans that weaken public balance sheets."
 MAD_POL_AREMA_SOCIAL_CONTRACT: "AREMA Social Contract"
 MAD_POL_AREMA_SOCIAL_CONTRACT_desc: "A renewed social contract asks citizens to accept public obligations in return for dependable services, fair treatment and visible improvements in living standards. In Madagascar, that bargain is difficult to sustain where tax capacity is weak, infrastructure is unreliable and rural communities feel distant from national decision-making."
 MAD_POL_AREMA_NATIONAL_DEVELOPMENT_PACT: "AREMA National Development Pact"
 MAD_POL_AREMA_NATIONAL_DEVELOPMENT_PACT_desc: "A national development pact seeks to align government, employers, workers and rural communities around shared priorities. The challenge is to convert broad commitments into credible programmes with transparent oversight, especially where infrastructure gaps and competing local needs have repeatedly stalled national plans."
 MAD_POL_TIM_COMPETITION_LAW: "TIM Competition Law"
 MAD_POL_TIM_COMPETITION_LAW_desc: "Competition rules are intended to limit abusive market power and make it easier for new firms to enter sectors dominated by a few large players. Enforcement requires a capable regulator, transparent investigations and courts that can resolve disputes before concentration becomes entrenched in essential services."
 MAD_POL_TIM_NATIONAL_TAX_CAPACITY: "TIM National Tax Capacity"
 MAD_POL_TIM_NATIONAL_TAX_CAPACITY_desc: "A stronger revenue administration helps the state collect taxes more consistently and bring economic activity into the formal system. Reform depends on clear rules, accessible registration and enforcement that is predictable rather than arbitrary, so that better collection does not push small businesses further from official channels."
 MAD_POL_TIM_INFRASTRUCTURE_FINANCE: "TIM Infrastructure Finance"
 MAD_POL_TIM_INFRASTRUCTURE_FINANCE_desc: "Madagascar's development ambitions repeatedly run into the cost of roads, ports, power and telecommunications. Financing frameworks seek to identify viable projects and assemble public and private resources, but they must distinguish useful infrastructure from proposals whose operating costs or demand have been overestimated."
 MAD_POL_TIM_MAP_REVIEW: "TIM Map Review"
 MAD_POL_TIM_MAP_REVIEW_desc: "A review of major development projects tests whether previous plans match the country's real needs and delivery capacity. By comparing infrastructure commitments with rural access, energy reliability and agricultural resilience, officials can identify bottlenecks and decide which projects warrant continued public support."
 MAD_POL_TGV_WATER_PROGRAMME: "TGV Water Programme"
 MAD_POL_TGV_WATER_PROGRAMME_desc: "Reliable water access remains a pressing issue for households, farms and growing towns, particularly during dry seasons. A public programme must connect supply infrastructure with maintenance, distribution and local management, because a completed borehole or reservoir offers little protection if communities cannot keep it working."
 MAD_POL_TGV_PROJECT_FINANCE: "TGV Project Finance"
 MAD_POL_TGV_PROJECT_FINANCE_desc: "Large infrastructure projects need a financing structure that matches their long construction periods and uncertain returns. Public funds can set priorities and crowd in investment, but contracts must make responsibilities clear and prevent cost overruns from becoming hidden liabilities for taxpayers."
 MAD_POL_TGV_YOUTH_INDUSTRIALISATION: "TGV Youth Industrialisation"
 MAD_POL_TGV_YOUTH_INDUSTRIALISATION_desc: "A young workforce needs routes from education into stable employment, yet manufacturing and modern services remain constrained by power cuts, transport costs and limited training opportunities. Industrial policy aims to connect vocational skills with firms able to create durable jobs rather than short-lived work schemes."
 MAD_POL_HVM_ADMINISTRATIVE_STATE: "HVM Administrative State"
 MAD_POL_HVM_ADMINISTRATIVE_STATE_desc: "Effective public administration depends on officials who can implement rules consistently, maintain records and deliver services beyond the capital. Strengthening the administrative state means building professional routines and clear accountability, not merely expanding the number of offices or layers of authority."
 MAD_POL_HVM_PUBLIC_FINANCE: "HVM Public Finance"
 MAD_POL_HVM_PUBLIC_FINANCE_desc: "Public finance reform seeks to make budgeting, revenue collection and spending more predictable. Stronger controls can improve the credibility of government commitments, but lasting results depend on transparent procurement, accurate accounts and an ability to direct resources towards services that residents can see and use."
 MAD_POL_HVM_PROJECT_REVIEW: "HVM Project Review"
 MAD_POL_HVM_PROJECT_REVIEW_desc: "An audit of major projects examines whether announced investments have delivered the infrastructure and services they promised. Reviews are especially important where costs are high and delivery is slow, allowing officials to identify stalled contracts, clarify responsibilities and decide whether public money should continue to be committed."
 # ===== Madagascar party-political events =====
 mad_political.1.t: "The Crown Question"
 mad_political.1.d: "The question is no longer whether Madagascar's royal institutions should be recognised, but who may claim authority in their name. Rabarioelina seeks a personal crown, while the traditional Houses reject a unilateral claim and favour a council grounded in customary legitimacy. The decision will determine whether royal authority is concentrated in one ruler or shared among the Houses."
 mad_political.1.a: "Rabarioelina will claim the crown"
 mad_political.1.b: "Let the Houses establish TAMIMA"

 mad_political.2.t: "The Daewoo Controversy Becomes a Political Crisis"
 mad_political.2.d: "The disputed Daewoo agricultural concession has become a national political crisis over land rights, foreign investment and the government's legitimacy. With the deal collapsed or cancelled, the authorities must decide whether to frame the outcome as a defence of sovereignty, invite the armed forces to mediate the transition, or preserve civilian rule while accepting the political backlash."
 mad_political.2.a: "Turn the cancellation into a sovereignty victory"
 mad_political.2.b: "Allow the army to mediate the transition"
 mad_political.2.c: "Defend civilian government and absorb the backlash"

 mad_political.3.t: "What Role Should the Armed Forces Play?"
 mad_political.3.d: "The officer corps must decide whether the armed forces should return to a strictly professional role under civilian authority, act as a constitutional guardian, or claim a final right to intervene when civilian politics breaks down. The choice will shape military involvement in politics and the limits placed on future intervention."
 mad_political.3.a: "Professionalise the armed forces"
 mad_political.3.b: "Become the republic's guardian"
 mad_political.3.c: "The army must remain the final arbiter"

 mad_political.4.t: "The AREMA Congress"
 mad_political.4.d: "AREMA has returned to national politics. Three currents now compete over what the movement should become: the Ratsiraka tradition, a renewed social programme, or reconciliation between its factions. The programme choice will determine the road ahead."
 mad_political.4.a: "Let the movement choose"

 mad_political.5.t: "The Terms of Reconciliation"
 mad_political.5.d: "With TIM back in the political arena, the government must decide what reconciliation means in practice. An inclusive agreement can bring rival groups back into the political system; conditional reconciliation limits concessions while pursuing reform; and prioritising accountability strengthens demands for justice but risks reopening old divisions."
 mad_political.5.a: "Build an inclusive reconciliation pact"
 mad_political.5.b: "Reconcile, but on our terms"
 mad_political.5.c: "Accountability must come first"

 mad_political.6.t: "The Tiko Question"
 mad_political.6.d: "Ravalomanana's business success helped TIM build resources and administrative credibility, but the ties between Tiko and public office raise questions about conflicts of interest. The party must choose between a strict separation of private business and the state, support for a Malagasy national champion, or a regulated relationship between government and major domestic firms."
 mad_political.6.a: "Separate Tiko from the state"
 mad_political.6.b: "Build a Malagasy national champion"
 mad_political.6.c: "Regulate the relationship"

 mad_political.7.t: "What Is TGV's Mandate?"
 mad_political.7.d: "TGV rose through popular mobilisation against the established political order and now has to define the mandate it claims for government. The movement can remain the driving force for national renewal, root its authority in elections and civilian institutions, or preserve exceptional presidential powers to overcome institutional resistance. Each choice sets a different balance between movement leadership and constitutional restraint."
 mad_political.7.a: "The movement must remain the engine of renewal"
 mad_political.7.b: "Our mandate must come from the ballot"
 mad_political.7.c: "The presidency must retain exceptional powers"

 # ===== TGV: Thirteen Velirano =====
 MAD_TGV_VELIRANO_CATEGORY: "Thirteen Velirano"
 MAD_TGV_VELIRANO_CATEGORY_desc: "First make promises, then fund delivery. Promises cost political capital; delivery consumes state resources. These decisions exist only while TGV remains in government."
 MAD_TGV_PROMISE_WATER: "Promise: Water & Electricity"
 MAD_TGV_PROMISE_WATER_desc: "Publicly commit the government to improving access to water and electricity."
 MAD_TGV_PROMISE_INFRASTRUCTURE: "Promise: Infrastructure First"
 MAD_TGV_PROMISE_INFRASTRUCTURE_desc: "Commit to visible flagship roads, transport links and public works."
 MAD_TGV_PROMISE_DIGITAL: "Promise: Digital Madagascar"
 MAD_TGV_PROMISE_DIGITAL_desc: "Commit to building a more connected and digital state."
 MAD_TGV_PROMISE_JOBS: "Promise: Youth Employment"
 MAD_TGV_PROMISE_JOBS_desc: "Commit to turning the youth agenda into employment, training and productive work."
 MAD_TGV_PROMISE_FOOD: "Promise: Food Sovereignty"
 MAD_TGV_PROMISE_FOOD_desc: "Commit to a visible food-security and agricultural programme."

 MAD_TGV_DELIVER_WATER: "Deliver: Water & Electricity"
 MAD_TGV_DELIVER_WATER_desc: "Fund the promised water and electricity programme."
 MAD_TGV_DELIVER_INFRASTRUCTURE: "Deliver: Infrastructure First"
 MAD_TGV_DELIVER_INFRASTRUCTURE_desc: "Fund the promised flagship infrastructure programme."
 MAD_TGV_DELIVER_DIGITAL: "Deliver: Digital Madagascar"
 MAD_TGV_DELIVER_DIGITAL_desc: "Fund the promised digital-state programme."
 MAD_TGV_DELIVER_JOBS: "Deliver: Youth Employment"
 MAD_TGV_DELIVER_JOBS_desc: "Fund the promised youth employment and skills programme."
 MAD_TGV_DELIVER_FOOD: "Deliver: Food Sovereignty"
 MAD_TGV_DELIVER_FOOD_desc: "Fund the promised food-security programme."

 # ===== HVM project review =====
 MAD_HVM_PROJECT_REVIEW_CATEGORY: "Fisan-dratana Project Review"
 MAD_HVM_PROJECT_REVIEW_CATEGORY_desc: "Review the HVM development portfolio before committing to another cycle of projects."
 MAD_HVM_REVIEW_COMPLETE_PORTFOLIO: "Finish the viable portfolio"
 MAD_HVM_REVIEW_COMPLETE_PORTFOLIO_desc: "Protect projects that are working and finish them rather than replacing them with new announcements."
 MAD_HVM_REVIEW_RENEGOTIATE: "Renegotiate the portfolio"
 MAD_HVM_REVIEW_RENEGOTIATE_desc: "Rework financing and implementation instead of abandoning the programme."
 MAD_HVM_REVIEW_PRUNE: "Prune the portfolio"
 MAD_HVM_REVIEW_PRUNE_desc: "Cancel weak projects and concentrate the administrative state on the most defensible commitments."

 # ===== Ideas =====
 MAD_MIL_PROFESSIONAL_COMMAND: "Professional Military Command"
 MAD_MIL_PROFESSIONAL_COMMAND_desc: "The armed forces accept civilian supremacy and concentrate on professionalism, administration and reliable command."
 MAD_AREMA_OLD_GUARD: "AREMA Old Guard"
 MAD_AREMA_OLD_GUARD_desc: "AREMA rebuilds the disciplined revolutionary machine associated with the Ratsiraka era."
 MAD_AREMA_RENEWAL: "Renew AREMA Under Rajaonarivelo"
 MAD_AREMA_RENEWAL_desc: "AREMA reframes Malagasy Socialism around social provision and a new political generation."
 MAD_AREMA_RECONCILIATION: "Reconcile AREMA Under Raharijaona"
 MAD_AREMA_RECONCILIATION_desc: "AREMA seeks a broader national coalition rather than simply restoring its former machinery."
 MAD_AREMA_SOCIAL_CONTRACT: "AREMA Social Contract"
 MAD_AREMA_SOCIAL_CONTRACT_desc: "The party ties its return to visible social provision and a stronger relationship with the public."
 MAD_AREMA_OLD_GUARD_REFORMED: "Adapted Old Guard"
 MAD_AREMA_OLD_GUARD_REFORMED_desc: "The disciplined AREMA machine has been adapted to a functioning modern state, retaining its preference for public control and economic sovereignty."
 MAD_AREMA_RENEWAL_MODERNISED: "Modernised AREMA Renewal"
 MAD_AREMA_RENEWAL_MODERNISED_desc: "AREMA combines social provision with greater productivity and a more workable relationship with investment and private enterprise."
 MAD_AREMA_RECONCILIATION_INSTITUTIONALISED: "Institutionalised Reconciliation"
 MAD_AREMA_RECONCILIATION_INSTITUTIONALISED_desc: "The movement has traded some political cohesion for a durable settlement, stronger administration and easier access to investment."
 MAD_AREMA_NON_ALIGNMENT: "AREMA Non-Alignment"
 MAD_AREMA_NON_ALIGNMENT_desc: "Madagascar returns to a sovereignty-conscious foreign policy: less exposed to outside political influence, but more cautious about foreign capital."
 MAD_AREMA_SECOND_SOCIALISM: "The Second Malagasy Socialism"
 MAD_AREMA_SECOND_SOCIALISM_desc: "AREMA's final settlement combines state ownership and social provision with a more productive economy, while remaining wary of foreign capital."
 MAD_TIM_RECONCILIATION_COMPACT: "TIM Reconciliation Compact"
 MAD_TIM_RECONCILIATION_COMPACT_desc: "A broad political bargain reduces the administrative and social cost of holding the republic together."
 MAD_TIM_RECONCILIATION_CONDITIONAL: "Conditional Reconciliation"
 MAD_TIM_RECONCILIATION_CONDITIONAL_desc: "TIM accepts reconciliation while keeping the reform programme moving and limiting concessions to rivals."
 MAD_TIM_JUSTICE_AND_ACCOUNTABILITY: "TIM Accountability Programme"
 MAD_TIM_JUSTICE_AND_ACCOUNTABILITY_desc: "TIM ties reconciliation to audits, policing and institutional accountability."
 MAD_TIM_TIKO_FIREWALL: "Tiko-State Firewall"
 MAD_TIM_TIKO_FIREWALL_desc: "Government and private business are kept at a deliberate distance."
 MAD_TIM_TIKO_NATIONAL_CHAMPION: "Malagasy National Champion"
 MAD_TIM_TIKO_NATIONAL_CHAMPION_desc: "The government deliberately backs a nationally owned business champion."
 MAD_TIM_TIKO_MIXED: "Regulated Business Compact"
 MAD_TIM_TIKO_MIXED_desc: "The government accepts a managed relationship between private enterprise and national policy."
 MAD_TIM_REPUBLICAN_INSTITUTIONS: "Republican Institutions"
 MAD_TIM_REPUBLICAN_INSTITUTIONS_desc: "TIM consolidates electoral government through a more capable bureaucracy and accountable public institutions."
 MAD_TGV_ELECTORAL_LEGITIMACY: "Electoral Legitimacy"
 MAD_TGV_ELECTORAL_LEGITIMACY_desc: "The movement accepts that lasting legitimacy must be renewed through elections."
 MAD_TGV_REVOLUTIONARY_LEGACY: "Revolutionary Legacy"
 MAD_TGV_REVOLUTIONARY_LEGACY_desc: "TGV retains the movement's anti-establishment legitimacy and treats the 2009 rupture as foundational."
 MAD_TGV_EMERGENCY_MANDATE: "Emergency Mandate"
 MAD_TGV_EMERGENCY_MANDATE_desc: "TGV justifies temporary concentration of executive power as a response to political crisis."
 MAD_TGV_DELIVERY_WATER: "Velirano Delivery: Water & Electricity"
 MAD_TGV_DELIVERY_WATER_desc: "A funded commitment to better basic services."
 MAD_TGV_DELIVERY_INFRASTRUCTURE: "Velirano Delivery: Infrastructure"
 MAD_TGV_DELIVERY_INFRASTRUCTURE_desc: "A funded commitment to flagship infrastructure."
 MAD_TGV_DELIVERY_DIGITAL: "Velirano Delivery: Digital State"
 MAD_TGV_DELIVERY_DIGITAL_desc: "A funded commitment to digital administration and connectivity."
 MAD_TGV_DELIVERY_JOBS: "Velirano Delivery: Youth Employment"
 MAD_TGV_DELIVERY_JOBS_desc: "A funded commitment to employment and skills."
 MAD_TGV_DELIVERY_FOOD: "Velirano Delivery: Food Security"
 MAD_TGV_DELIVERY_FOOD_desc: "A funded commitment to food security."
 MAD_HVM_PROJECT_COMPLETION: "HVM Portfolio Completion"
 MAD_HVM_PROJECT_COMPLETION_desc: "The government finishes viable projects rather than announcing another unfunded programme."
 MAD_HVM_PROJECT_RENEGOTIATED: "HVM Portfolio Renegotiated"
 MAD_HVM_PROJECT_RENEGOTIATED_desc: "HVM focuses on financing discipline and renegotiated implementation."
 MAD_HVM_PROJECT_PRUNING: "HVM Portfolio Discipline"
 MAD_HVM_PROJECT_PRUNING_desc: "HVM concentrates public administration on a smaller number of defensible projects."
 MAD_HVM_FISANDRATANA_FULL: "Fisandratana 2030: Credible Programme"
 MAD_HVM_FISANDRATANA_FULL_desc: "Multiple core reforms have delivered enough results to make the long-term programme credible."
 MAD_HVM_FISANDRATANA_PARTIAL: "Fisandratana 2030: Partial Delivery"
 MAD_HVM_FISANDRATANA_PARTIAL_desc: "Several core reforms are working, but the full programme remains incomplete."
 MAD_HVM_FISANDRATANA_PLANNING: "Fisandratana 2030: Planning State"
 MAD_HVM_FISANDRATANA_PLANNING_desc: "The long-term programme remains more aspirational than delivered."
 MAD_2009_INTERNATIONAL_ISOLATION: "Post-Crisis International Isolation"
 MAD_2009_INTERNATIONAL_ISOLATION_desc: "The unconstitutional transfer of power has led donors and international institutions to restrict normal engagement until constitutional order is restored."

 mad_royal.1.t: "The National Wealth Is a National Trust"
 mad_royal.1.d: "The Royal House programme treats strategic resources as a national trust rather than ordinary assets. The government must now choose between a direct public trust and Malagasy-controlled national champions."
 mad_royal.1.a: "Place strategic wealth in a national trust"
 mad_royal.1.b: "Build Malagasy national champions"
 MAD_ROY_BIBLICAL_SCHOLARSHIP: "Biblical Scholarship"
 mad_royal.4.t: "Who Shall Guard the Sacred Heritage?"
 mad_royal.4.d: "TAMIMA regards the Rova and the wider royal heritage as sacred. The new House government must decide whether custodianship rests primarily with the Houses or with a national heritage trust."
 mad_royal.4.a: "Entrust the heritage to the Houses"
 mad_royal.4.b: "Create a national heritage trust"
 MAD_POL_ROYAL_CONSOLIDATION: "Royal Consolidation"
 MAD_POL_ROYAL_CONSOLIDATION_desc: "A centralised royal administration strengthens the palace's ability to govern, while tying political authority to bureaucratic and internal-security capacity."
 MAD_POL_TAMIMA_GOVERNANCE: "TAMIMA Governance"
 MAD_POL_TAMIMA_GOVERNANCE_desc: "The Houses govern through customary legitimacy, local administration and negotiated social order."
 MAD_HVM_REPUBLICAN_STABILISATION: "Republican Stabilisation"
 MAD_HVM_REPUBLICAN_STABILISATION_desc: "HVM's establishment-first politics turns stability into institutional capacity rather than a temporary burst of public confidence."
 MAD_HVM_RULE_OF_LAW_PROGRAMME: "Rule of Law Programme"
 MAD_HVM_RULE_OF_LAW_PROGRAMME_desc: "The government relies on courts, administration and accountable policing rather than personal rule."

 # ===== Existing party decision categories, tightened to government =====
 MAD_ROY_LEGAL_REFORM: "Commission the Malagasy Legal Code"
 MAD_ROY_LEGAL_REFORM_desc: "Begin the legal replacement programme by commissioning the new Malagasy framework and its implementation through the royal administration."
 MAD_ROY_MONETARY_REFORM: "Implement Monetary Reform"
 MAD_ROY_MONETARY_REFORM_desc: "Carry the fiscal and institutional cost of turning the monetary reform programme into an operating policy."
 MAD_ROY_CUSTOMARY_GOVERNANCE: "Formalise Customary Governance"
 MAD_ROY_CUSTOMARY_GOVERNANCE_desc: "Put customary institutions into the machinery of government and negotiate the cooperation of traditional landholders."
 MAD_TAMIMA_LIVING_FORCES_FORUM: "Convene the Living Forces Forum"
 MAD_TAMIMA_LIVING_FORCES_FORUM_desc: "Bring the traditional, professional, worker and research constituencies together as an organised forum of the Houses."
 MAD_TAMIMA_DINA_IMPLEMENTATION: "Implement Dina Justice"
 MAD_TAMIMA_DINA_IMPLEMENTATION_desc: "Put Dina into practice through local rule-making, enforcement and adjudication under the Houses."
 MAD_TAMIMA_HERITAGE_CUSTODIANSHIP: "Establish House Heritage Custodianship"
 MAD_TAMIMA_HERITAGE_CUSTODIANSHIP_desc: "Reserve administrative capacity for the Houses to oversee the sacred heritage after the custodianship choice has been made."

 MAD_MILITARY_OFFICER_CONFERENCE: "Convene an Officers' Conference"
 MAD_MILITARY_OFFICER_CONFERENCE_desc: "Coordinate the officer corps after the refoundation."
 MAD_MILITARY_CIVILIAN_OVERSIGHT: "Establish Civilian Oversight"
 MAD_MILITARY_CIVILIAN_OVERSIGHT_desc: "Turn military guardianship into an explicit doctrine of civilian oversight."
 MAD_MILITARY_SUPPORT_GENDARMERIE_desc: "Use the armed forces' institutional capacity to reinforce internal security without recreating a political army."

 # ===== Daewoo fallback =====
 MAD_POL_PARTIES_desc: "Political organisations, civic networks and regional coalitions compete to define the country's direction. Their influence depends on whether they can build trust beyond established centres of power, address daily economic concerns and turn political mobilisation into institutions capable of governing consistently."
# --- Royal tree government availability tooltips (MD custom_trigger_tooltip convention) ---
 MAD_ROY_CRPM_IN_POWER_tt: "CRPM is in power"
 MAD_ROY_TAMIMA_IN_POWER_tt: "TAMIMA is in power"
 MAD_ROY_CRPM_OR_TAMIMA_IN_POWER_tt: "CRPM or TAMIMA is in power"

# Political branch availability requirements
 MAD_MIL_IN_POWER_tt: "The FPA is in power"
 MAD_AREMA_IN_POWER_tt: "AREMA is in power"
 MAD_AREMA_CONGRESS_CHOICE_tt: "An AREMA Congress faction has been chosen"
 MAD_AREMA_OLD_GUARD_PATH_tt: "The Old Guard path has been chosen"
 MAD_AREMA_RENEWAL_PATH_tt: "The Renewal path has been chosen"
 MAD_AREMA_RECONCILIATION_PATH_tt: "The Reconciliation path has been chosen"
 MAD_TIM_IN_POWER_tt: "TIM is in power"
 MAD_TGV_IN_POWER_tt: "TGV is in power"
 MAD_HVM_IN_POWER_tt: "HVM is in power"
 MAD_REMENABILA_IN_POWER_tt: "Dahalo are in power"
 MAD_NORTHERN_CATTLE: "Northern Cattle"
 MAD_NORTHERN_CATTLE_desc: "Pastoral traditions connect communities across Madagascar and the nearby islands, while disputes over movement, ownership and security can quickly become political. Control of livestock routes and regional ties has long mattered to livelihoods, but claims beyond the island also bring wider questions of sovereignty and diplomacy."
 MAD_COMORIAN_HERDS: "Comorian Herds"
 MAD_COMORIAN_HERDS_desc: "Links between Madagascar and the Comoros span migration, trade and shared maritime routes. Political claims framed around cattle, settlement or historical ties can strain those relationships, showing how local symbolism may become entangled with wider disputes over borders, identity and regional influence."
 MAD_DROUGHT_FAMINE_RELIEF_12_tt: "Reduces Famine in the affected state by §G12§!."
 MAD_POL_AREMA_PROGRAMME: "Arema programme"

 mad_political.90.t: "Ratsiraka Faces Defeat"
 mad_political.90.d: "A new government has taken shape without AREMA. Didier Ratsiraka must decide whether to flee Madagascar with public funds or reject the government and attempt to regain power by force."
 mad_political.90.a: "Reject the result and fight for AREMA"
 mad_political.90.a_tt: "Ratsiraka-led AREMA starts a civil war from Antananarivo. AREMA retains the capital; the elected government is replicated in the breakaway country."
 mad_political.90.b: "Flee into exile with the public funds"

 mad_political.98.t: "Ratsiraka Flees into Exile"
 mad_political.98.d: "A day after choosing to flee, Didier Ratsiraka makes his escape with public funds. AREMA is banned, leaving the former president in exile until the party is allowed to return."
 mad_political.98.a: "The escape is complete"

 mad_political.91.t: "The Viva Interview"
 mad_political.91.d: "A televised interview with Didier Ratsiraka has given the former president a fresh platform to criticise the government and revive AREMA's political presence. The authorities must decide whether to suppress Viva TV or tolerate the broadcast, balancing control over opposition messaging against the political cost of censorship."
 mad_political.91.a: "Ban Viva TV"
 mad_political.91.b: "Allow the channel to remain open"

 mad_political.92.t: "A Return for Ratsiraka?"
 mad_political.92.d: "AREMA has been allowed to operate again, reopening the question of Didier Ratsiraka's political future. The former president can return to lead the party, or a younger figure can take the reins and leave the old guard's political project behind."
 mad_political.92.a: "Let Ratsiraka return"
 mad_political.92.b: "Do not let him return"
 mad_political.92.a_tt: "Didier Ratsiraka remains the leader of AREMA."

 mad_political.93.t: "The Daewoo Crisis Under Authoritarian Rule"
 mad_political.93.d: "The Daewoo scandal has emerged under a government that does not permit elections, leaving the opposition with few peaceful means of contesting the authorities. The government must choose whether to confront the strongest opposition force at the risk of civil war or restore elections and face an immediate vote."
 mad_political.93.a: "Risk civil war with the opposition"
 mad_political.93.b: "Restore elections and hold a vote"
 MAD_POL_TIM_2007_CONSTITUTION: "The 2007 Constitutional Reform"
 MAD_POL_TIM_2007_CONSTITUTION_desc: "Constitutional reform sought to reshape the balance between national executive authority and regional administration. The debate centred on how to govern a geographically dispersed country, how much discretion to give local institutions and what checks should constrain a powerful presidency."
 MAD_POL_PARTIES: "Political Affairs"
 mad_political.95.t: "Rajoelina Forms TGV"
 mad_political.95.d: "After the crisis, Andry Rajoelina turns the political network built around his public profile into TGV, giving the movement a formal organisation through which to challenge Madagascar's established parties and contest national power."
 mad_political.95.a: "The movement is organised."
 mad_political.96.t: "Rajoelina Forms TGV"
 mad_political.96.d: "In December 2007, Andry Rajoelina wins the mayoralty of Antananarivo and uses his new public platform to organise TGV. The movement has moved from street-level political opposition into a structured force with ambitions beyond the capital."
 mad_political.96.a: "The movement is organised."

 mad_political.97.t: "HVM founded"
 mad_political.97.d: "Hery Rajaonarimampianina breaks with Rajoelina's political movement and launches Hery Vaovao ho an'i Madagasikara (HVM) as a separate vehicle. The split takes support away from TGV and creates a new rival party seeking its own political base."
 mad_political.97.a: "Traitors!"
 MAD_POL_HVM_FRANCO_MALAGASY_PARTNERSHIP: "Franco-Malagasy Partnership"
 MAD_POL_HVM_FRANCO_MALAGASY_PARTNERSHIP_desc: "Relations with France remain important in Madagascar's trade, infrastructure and diplomatic affairs. Cooperation can bring technical expertise and long-term investment, but it also revives questions about external influence, national priorities and whether partnerships deliver lasting capacity to Malagasy institutions."
 MAD_POL_TGV_FRENCH_RAIL: "French Support for Railway Development"
 MAD_POL_TGV_FRENCH_RAIL_desc: "Rail links remain critical where road transport is slow, expensive or vulnerable to seasonal disruption. French-backed support for railway infrastructure reflects the longstanding importance of external financing and technical assistance, while the service's future still depends on maintenance and the ability to attract freight."
 MAD_POL_MILITARY_GOVERNMENT: "Military Government"
 MAD_POL_MILITARY_GOVERNMENT_desc: "Concentrate political authority in a military administration with an emphasis on disciplined government and controlled defence spending."
 MAD_POL_MILITARY_GUARDIAN: "Military Guardian"
 MAD_POL_MILITARY_GUARDIAN_desc: "Maintain the armed forces as a disciplined constitutional backstop while limiting their political role."
 MAD_POL_MARITIME_SECURITY: "Maritime Security"
 MAD_POL_MARITIME_SECURITY_desc: "Professionalise maritime security and turn Madagascar's naval responsibilities into a reliable national capability."
 MAD_MIL_UNIFIED_FORCES: "Unified Forces"
 MAD_MIL_UNIFIED_FORCES_desc: "Unify command, administration and procurement across the armed forces."
 MAD_MIL_PROFESSIONAL_OFFICERS: "Professional Officers"
 MAD_MIL_PROFESSIONAL_OFFICERS_desc: "Build a professional officer corps with stronger training standards and institutional expertise."
 MAD_MIL_SOUTHERN_SECURITY: "Southern Security"
 MAD_MIL_SOUTHERN_SECURITY_desc: "Make security in the south a defined military responsibility while strengthening the institutions that support it."
 MAD_MIL_GENDARMERIE_REFORM: "Gendarmerie Reform"
 MAD_MIL_GENDARMERIE_REFORM_desc: "Rebuild the gendarmerie so domestic security can be handled more efficiently without relying on the army alone."
 MAD_MIL_ENGINEER_CORPS: "The Engineer Corps"
 MAD_MIL_ENGINEER_CORPS_desc: "Expand military engineering capacity and direct it toward defence and national resilience."
 MAD_MIL_MULTILATERAL_DOCTRINE: "Multilateral Defence Doctrine"
 MAD_MIL_MULTILATERAL_DOCTRINE_desc: "Deepen practical defence cooperation with multiple partners while preserving national control over the armed forces."
 MAD_MIL_CLEAN_UNIFORM: "Clean Uniform"
 MAD_MIL_CLEAN_UNIFORM_desc: "Impose higher standards of financial discipline and accountability on the armed forces."
 MAD_MIL_CIVILIAN_GUARDIANSHIP: "Civilian Guardianship"
 MAD_MIL_CIVILIAN_GUARDIANSHIP_desc: "Return day-to-day government to civilians while retaining a constitutional guardianship role for the armed forces."

# -----------------------------------------------------------------------------
# Madagascar Army — integrated branch
# -----------------------------------------------------------------------------
 MAD_ARMY_THE_ARMY_WE_INHERITED: "The Army We Inherited"
 MAD_ARMY_THE_ARMY_WE_INHERITED_desc: "Begin with the service we actually have: underfunded units, uneven readiness and equipment that has outlived its useful life."
 MAD_ARMY_PAY_THE_SOLDIER: "Pay the Soldier"
 MAD_ARMY_PAY_THE_SOLDIER_desc: "A field force cannot modernise while its basic personnel system is unreliable. Put regular manpower and unit readiness first."
 MAD_ARMY_BUILD_TRAINING_CADRE: "Build the Training Cadre"
 MAD_ARMY_BUILD_TRAINING_CADRE_desc: "Create a more consistent training culture so units across the island work from the same practical standards."
 MAD_ARMY_STANDARDISE_FIELD_READINESS: "Standardise Field Readiness"
 MAD_ARMY_STANDARDISE_FIELD_READINESS_desc: "Turn scattered routines into a common field-readiness system without tying the Army to any political faction."
 MAD_ARMY_ISLAND_INFANTRY_DOCTRINE: "Write an Island Infantry Doctrine"
 MAD_ARMY_ISLAND_INFANTRY_DOCTRINE_desc: "Shape a doctrine around Madagascar's roads, mountains, forests, long distances and dispersed settlements."
 MAD_ARMY_COMMAND_QUESTION: "Settle the Command Question"
 MAD_ARMY_COMMAND_QUESTION_desc: "The Army must decide whether initiative remains centred on the CAPSAT network or returns to the General Staff."
 MAD_ARMY_CAPSAT_LOCAL_INITIATIVE: "Empower CAPSAT Field Commanders"
 MAD_ARMY_CAPSAT_LOCAL_INITIATIVE_desc: "Give subordinate commanders more initiative, trusting CAPSAT-style networks and local decisions instead of restoring a rigid senior-officer chain of command."
 MAD_ARMY_CAPSAT_INTERNAL_NETWORKS: "Build CAPSAT Networks"
 MAD_ARMY_CAPSAT_INTERNAL_NETWORKS_desc: "Turn personal and unit-level CAPSAT connections into an informal command network that can mobilise quickly but does not provide the discipline of a central staff."
 MAD_ARMY_CAPSAT_BARRACKS_POLITICS: "Make the Barracks a Political Power"
 MAD_ARMY_CAPSAT_BARRACKS_POLITICS_desc: "Consolidate CAPSAT influence inside the armed forces, trading institutional neutrality and fiscal restraint for political cohesion and a more assertive command culture."
 MAD_ARMY_GENERAL_STAFF_PRIMACY: "Restore the General Staff"
 MAD_ARMY_GENERAL_STAFF_PRIMACY_desc: "Restore the senior-officer hierarchy represented by Edmond Rasolomahandry: a professional chain of command, institutional neutrality and less room for unit-level political initiative."
 MAD_ARMY_CENTRALISED_PROCUREMENT: "Centralise Procurement"
 MAD_ARMY_CENTRALISED_PROCUREMENT_desc: "Put purchasing and equipment standards under the General Staff so the Army can reduce waste, standardise matériel and resist ad hoc foreign influence."
 MAD_ARMY_DOCTRINE_ABOVE_FACTION: "Doctrine Above Faction"
 MAD_ARMY_DOCTRINE_ABOVE_FACTION_desc: "Make doctrine and the formal chain of command more important than personalities, factions or local military networks, with Rasolomahandry's professional model at the centre."
 MAD_ARMY_REFIT_RIFLE_COMPANIES: "Refit Rifle Companies"
 MAD_ARMY_REFIT_RIFLE_COMPANIES_desc: "Rebuild the basic infantry fleet before chasing prestige systems."
 MAD_ARMY_SERVICE_RIFLE_ACQUISITION: "Choose a Service Rifle Supplier"
 MAD_ARMY_SERVICE_RIFLE_ACQUISITION_desc: "Choose a foreign supplier for a common service-rifle package."
 MAD_ARMY_INFANTRY_WEAPONS_RESEARCH: "Research Infantry Weapons"
 MAD_ARMY_INFANTRY_WEAPONS_RESEARCH_desc: "Build a durable research base for the weapons every infantry battalion depends on."
 MAD_ARMY_FIELD_ENGINEERING_STANDARDS: "Set Field Engineering Standards"
 MAD_ARMY_FIELD_ENGINEERING_STANDARDS_desc: "Standardise field works, roads and engineering support so units can keep moving across difficult terrain."
 MAD_ARMY_EYES_ALONG_THE_COAST: "Eyes Along the Coast"
 MAD_ARMY_EYES_ALONG_THE_COAST_desc: "Extend fixed observation and radar coverage around the approaches to the island's main eastern port area."
 MAD_ARMY_MOTORISE_THE_INFANTRY: "Motorise the Infantry"
 MAD_ARMY_MOTORISE_THE_INFANTRY_desc: "Buy a coherent utility-vehicle fleet to move infantry, supplies and support elements between isolated garrisons."
 MAD_ARMY_SIGNALS_INTELLIGENCE_SCHOOL: "Open the Signals Intelligence School"
 MAD_ARMY_SIGNALS_INTELLIGENCE_SCHOOL_desc: "Teach Army personnel to collect, secure and exploit signals without recreating the civilian telecommunications network as a military idea."
 MAD_ARMY_PROTECTED_MOBILITY_TENDER: "Open the Protected Mobility Tender"
 MAD_ARMY_PROTECTED_MOBILITY_TENDER_desc: "Choose between two practical protected-vehicle suppliers for units expected to operate far from fixed bases."
 MAD_ARMY_REBUILD_THE_HELICOPTER_ARM: "Rebuild the Helicopter Arm"
 MAD_ARMY_REBUILD_THE_HELICOPTER_ARM_desc: "Create a sustainable rotary-wing capability through foreign equipment, training and maintenance rather than pretending Madagascar can build helicopters alone."
 MAD_ARMY_LIFT_AND_SUSTAIN: "Build Lift and Sustainment"
 MAD_ARMY_LIFT_AND_SUSTAIN_desc: "Prepare an airlift system that can move people, supplies and medical support between widely separated regions."
 MAD_ARMY_INDIAN_OCEAN_EXERCISE: "Exercise Across the Ocean"
 MAD_ARMY_INDIAN_OCEAN_EXERCISE_desc: "Use a major Indian Ocean field exercise to choose between French-led interoperability, an IOC-wide multinational doctrine, or a strictly Malagasy field doctrine."
 MAD_ARMY_ORGANISE_AIR_PACKAGE: "Organise the Air Package"
 MAD_ARMY_ORGANISE_AIR_PACKAGE_desc: "Choose whether the new air arm should prioritise helicopters, transport aircraft or a balanced mix."
 MAD_ARMY_LAND_FORCES_MODERNISATION_PLAN: "Adopt the Land Forces Modernisation Plan"
 MAD_ARMY_LAND_FORCES_MODERNISATION_PLAN_desc: "The historical repair phase is complete. Remove the inherited burden and open the Army's long-term expansion programme."
 MAD_ARMY_EXPAND_DEFENCE_BUDGET: "Expand Defence Spending"
 MAD_ARMY_EXPAND_DEFENCE_BUDGET_desc: "Increase defence spending and give the Army room to sustain a larger equipment programme."
 MAD_ARMY_DEFENCE_INDUSTRIAL_PLANNING: "Defence Industrial Planning"
 MAD_ARMY_DEFENCE_INDUSTRIAL_PLANNING_desc: "Create a framework for deciding which parts of the defence supply chain Madagascar can support domestically."
 MAD_ARMY_IVATO_AEROSPACE_WORKS: "Build Ivato Aerospace Works"
 MAD_ARMY_IVATO_AEROSPACE_WORKS_desc: "Use the expanded Ivato airfield complex as the foundation for aircraft maintenance and support industries."
 MAD_ARMY_TOAMASINA_DEFENCE_LOGISTICS_HUB: "Build the Toamasina Defence Logistics Hub"
 MAD_ARMY_TOAMASINA_DEFENCE_LOGISTICS_HUB_desc: "Turn Madagascar's principal eastern port corridor into a sustained military logistics base."
 MAD_ARMY_PROTECTED_VEHICLE_ASSEMBLY: "Assemble Protected Vehicles"
 MAD_ARMY_PROTECTED_VEHICLE_ASSEMBLY_desc: "Invite a foreign partner to establish local protected-vehicle assembly and transfer practical production knowledge."
 MAD_ARMY_TACTICAL_UAV_PROGRAMME: "Launch a Tactical UAV Programme"
 MAD_ARMY_TACTICAL_UAV_PROGRAMME_desc: "Build a small reconnaissance-drone capability linked to the Army's new ground surveillance network."
 MAD_ARMY_MECHANISED_INFANTRY_BRIGADE: "Form a Mechanised Infantry Brigade"
 MAD_ARMY_MECHANISED_INFANTRY_BRIGADE_desc: "Concentrate modern protected mobility into a single brigade that can respond rapidly to crises across the island."
 MAD_ARMY_MOBILE_ARTILLERY_REGIMENT: "Form a Mobile Artillery Regiment"
 MAD_ARMY_MOBILE_ARTILLERY_REGIMENT_desc: "Choose the foreign package that best fits an island force built around roads, dispersed batteries and rapid redeployment."
 MAD_ARMY_ISLAND_AIR_DEFENCE: "Build Island Air Defence"
 MAD_ARMY_ISLAND_AIR_DEFENCE_desc: "Place limited anti-aircraft capacity around the country's most important bases and logistics nodes."
 MAD_ARMY_HEAVY_LIFT_AVIATION_COMMAND: "Establish Heavy Lift Aviation Command"
 MAD_ARMY_HEAVY_LIFT_AVIATION_COMMAND_desc: "Create a specialist airlift command able to operate larger transport aircraft and manage long-distance resupply."
 MAD_ARMY_MEDIUM_TRANSPORT_FLEET: "Acquire a Medium Transport Fleet"
 MAD_ARMY_MEDIUM_TRANSPORT_FLEET_desc: "Buy a practical medium transport fleet suited to disaster response, resupply, evacuation and reinforcement."
 MAD_ARMY_AEROSPACE_SUPPLY_CHAIN: "Build the Aerospace Supply Chain"
 MAD_ARMY_AEROSPACE_SUPPLY_CHAIN_desc: "Develop local support for components, avionics, maintenance and other aviation inputs."
 MAD_ARMY_DEFENCE_ELECTRONICS_INDUSTRY: "Build a Defence Electronics Industry"
 MAD_ARMY_DEFENCE_ELECTRONICS_INDUSTRY_desc: "Develop local production and repair capacity for radios, battlefield electronics and unmanned-system components."
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU: "Create a Special Projects Bureau"
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU_desc: "Give difficult military research programmes a small permanent office capable of shepherding prerequisite technologies."
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU_LAND: "Special Projects Bureau: Land Systems"
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU_NETWORK: "Special Projects Bureau: Network Systems"
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU_GUNS: "Special Projects Bureau: Weapons Development"
 MAD_ARMY_INTEGRATED_FIRE_SUPPORT: "Integrate Fire Support"
 MAD_ARMY_INTEGRATED_FIRE_SUPPORT_desc: "Tie artillery, protected mobility and battlefield information into a single ground-fire system."
 MAD_ARMY_MAIN_BATTLE_TANK_PROGRAMME: "Choose a Main Battle Tank"
 MAD_ARMY_MAIN_BATTLE_TANK_PROGRAMME_desc: "Select a foreign main battle tank family and build the doctrine and procurement pipeline around the chosen fleet."
 MAD_ARMY_COASTAL_DEFENCE: "Harden Coastal Defence"
 MAD_ARMY_COASTAL_DEFENCE_desc: "Combine local fortification, air defence and naval cooperation around the most exposed approaches."
 MAD_ARMY_NATIONAL_SUSTAINMENT_NETWORK: "Build a National Sustainment Network"
 MAD_ARMY_NATIONAL_SUSTAINMENT_NETWORK_desc: "Link factories, logistics hubs and field units into a national sustainment system."
 MAD_ARMY_LONG_RANGE_ISR_AND_FIRES: "Develop Long-Range ISR and Fires"
 MAD_ARMY_LONG_RANGE_ISR_AND_FIRES_desc: "Extend reconnaissance and fires beyond the immediate battle area so the Army can operate across the island's distance."
 MAD_ARMY_INDIAN_OCEAN_DEFENCE_ARCHITECTURE: "Choose an Indian Ocean Defence Architecture"
 MAD_ARMY_INDIAN_OCEAN_DEFENCE_ARCHITECTURE_desc: "Decide whether the mature Army should deepen French interoperability, build a wider regional network, or pursue a more self-reliant posture."

 MAD_military_command.1.t: "The Command Question"
 MAD_military_command.1.d: "The armed forces cannot continue with an unresolved command structure. Colonel Noël Rakotonandrasana and CAPSAT represent a network of subordinate commanders who demand greater initiative, while General Edmond Rasolomahandry represents the senior-officer chain of command and the military's institutional hierarchy."
 MAD_military_command.1.a: "Back Rakotonandrasana and CAPSAT"
 MAD_military_command.1.b: "Restore General Rasolomahandry"
 MAD_military_command.5.t: "CAPSAT Refuses to Stand Down"
 MAD_military_command.5.d: "The civilian government rejected CAPSAT's claim to a political role, but the institutional settlement was never fully implemented. CAPSAT units are now moving against the government."
 MAD_military_command.5.a: "Crush the Mutiny"
 MAD_military_command.5.b: "Negotiate With CAPSAT"
 MAD_military_command.5.c: "Surrender to CAPSAT"
 MAD_military_procurement.1.t: "The Service Rifle Contract"
 MAD_military_procurement.1.d: "The infantry needs a more consistent supply of service rifles. Two foreign suppliers are prepared to provide a modest package."
