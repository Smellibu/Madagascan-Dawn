 MAD_PRIVATE_TELECOM_RESEARCH: "Private Telecom Research"
 MAD_PRIVATE_TELECOM_RESEARCH_desc: "Create a private telecommunications research arm, strengthening Madagascar's civilian research capacity."

 MAD_remenabila_takes_command: "Remenabila Takes Command"
 MAD_remenabila_takes_command_desc: "Put Remenabila's Dahalo network in charge and suspend elections, bringing the group's authority directly into government."

 MAD_remenabila_gather_the_dahalo: "Unite the Dahalo Bands"
 MAD_remenabila_gather_the_dahalo_desc: "Remenabila seeks to bring rival cattle-raiding groups under a single command, replacing fragmented local networks with a larger armed organisation. Personal loyalties, coercion and the promise of greater rewards could draw previously independent groups into a common force. Such a coalition would challenge the state's authority across the countryside and turn local insecurity into a much more serious armed threat."

 MAD_remenabila_cattle_must_be_counted: "The Cattle Must Be Counted"
 MAD_remenabila_cattle_must_be_counted_desc: "Bring the cattle trade under tighter control and draw the herds more firmly into Remenabila's political order."

 MAD_remenabila_steal_the_cow: "Steal the Zebu"
 MAD_remenabila_steal_the_cow_desc: "Today you look over at your neighbours land. His is plentiful, how easily it could be yours... "

 MAD_remenabila_more_cows_more_men: "More Cows, More Men"
 MAD_remenabila_more_cows_more_men_desc: "Use the growing herd to expand the fighting force and mobilize more men."

 MAD_remenabila_rule_by_the_herd: "Rule by the Herd"
 MAD_remenabila_rule_by_the_herd_desc: "Consolidate Remenabila's regime around the power of the herd and its followers."

