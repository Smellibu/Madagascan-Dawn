 # --- Rural Cooperation system ---
 MAD_rural_cooperation_category: "Rural Cooperation"
 MAD_rural_cooperation_category_desc: "Rural Cooperation represents the willingness of rural communities to work with the government and its institutions. Higher cooperation helps public programmes operate more effectively, while weak cooperation makes rural administration, development and security more difficult.\nCurrent balance: §Y[?MAD_rural_cooperation|.2]/100§!.\n[MAD_RC_MONTHLY_TOTAL]\nCurrent modifier breakdown:\n[mad_rc_mod_base][mad_rc_mod_secular][mad_rc_mod_unsecular][mad_rc_mod_heritage][mad_rc_mod_non_recognition][mad_rc_mod_inflation_25][mad_rc_mod_inflation_50][mad_rc_mod_inflation_75][mad_rc_mod_corruption_minimal][mad_rc_mod_corruption_low][mad_rc_mod_stability_50][mad_rc_mod_stability_65][mad_rc_mod_government_50][mad_rc_mod_government_60][mad_rc_mod_drought_50][mad_rc_mod_drought_20][mad_rc_mod_dahalo_50][mad_rc_mod_dahalo_25][mad_rc_mod_focus_crown_without_king][mad_rc_mod_focus_roy_fokonolona][mad_rc_mod_focus_customary_justice][mad_rc_mod_focus_many_houses][mad_rc_mod_focus_arema_fokonolona][mad_rc_mod_focus_arema_food][mad_rc_mod_focus_arema_provinces][mad_rc_mod_focus_southern_security][mad_rc_mod_focus_gendarmerie][mad_rc_mod_focus_engineers][mad_rc_mod_focus_tgv_infra][mad_rc_mod_focus_tgv_health][mad_rc_mod_focus_tgv_jirama][mad_rc_mod_focus_tgv_food][mad_rc_mod_focus_thriving_south][mad_rc_mod_grid][mad_rc_mod_lead][mad_rc_mod_decim][mad_rc_mod_daewoo][mad_rc_mod_comazar][mad_rc_mod_cap][mad_rc_mod_meter_upper][mad_rc_mod_meter_lower]"

