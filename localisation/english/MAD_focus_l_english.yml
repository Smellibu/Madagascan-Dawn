 # --- Daewoo lease + agricultural reforms ---
 MAD_daewoo_category: "The Daewoo Lease"
 MAD_daewoo_category_desc: "Project viability: §Y[?MAD_daewoo_viability|0]§!/100 (§Y80§! to sign the project off)\nCurrent terms: [MAD_GetDaewooTier]\n\nEvery qualifier raises viability and softens the lease. Several can only be done if the rest of the government has done its homework."
 MAD_daewoo_tier_toxic: "§RToxic§! - massive corruption, a hostile public, Korean control"
 MAD_daewoo_tier_troubled: "§YTroubled§! - the worst is contained, but the deal still stinks"
 MAD_daewoo_tier_sound: "§GSound§! - the lease works, and the land is being farmed"
 MAD_daewoo_tier_none: " "
 MAD_DAEWOO_REVIEW: "Daewoo: The Lease Review"
 MAD_DAEWOO_REVIEW_desc: "Daewoo Logistics' proposed agricultural concession became one of Madagascar's most controversial foreign investment projects. The South Korean company announced plans for a reported 99-year lease covering approximately 1.3 million hectares, intended for maize and palm-oil production to supply South Korea. The government disputed that a final land agreement had been signed, and the proposal triggered concerns over land rights, national sovereignty and domestic food security."
 MAD_DAEWOO_VIABILITY_80_tt: "Project viability is at least §Y80§!"
 MAD_DAEWOO_VIABILITY_PLUS_20_TT: "Viability: §G+20§!"
 MAD_DAEWOO_VIABILITY_PLUS_15_TT: "Viability: §G+15§!"
 MAD_DAEWOO_VIABILITY_PLUS_10_TT: "Viability: §G+10§!"
 MAD_DAEWOO_VIABILITY_MINUS_10_TT: "Viability: §R-10§!"
 MAD_DAEWOO_DROUGHT_PRESSURE_REDUCTION_TT: "Small reduction in monthly drought pressure."
 MAD_DAEWOO_KOREAN_PURCHASES_tt: "§YKorean Purchases§! has been completed"
 MAD_DAEWOO_BIANCO_INDEPENDENT_tt: "§YBianco Independent§! has been completed"
 MAD_DAEWOO_ADDENDUM_tt: "§YBianco Politicized§! has been completed, the contract has not been published, and the West Coast expansion has not been withdrawn"
 MAD_DAEWOO_ADDENDUM_EXCLUSIVE_tt: "The classified addendum has not been signed"
 MAD_DAEWOO_ADDENDUM_DISTRICT_TT: "Adds one agricultural district in Mahajanga. It is removed if the Daewoo review fails."
 MAD_DAEWOO_RAIL_tt: "The §YMahajanga§! or §YToliara§! railway has been built"
 MAD_DAEWOO_VANILLA_SECTOR_tt: "§YVanilla Export Sector§! has been completed"
 MAD_DAEWOO_OUTCOME_WELL_tt: "The Daewoo lease has been signed off as a success"
 MAD_DAEWOO_OUTCOME_FAILED_tt: "The Daewoo lease has collapsed and the government has fallen"
 MAD_daewoo_deal_tt: "The lease is signed. Its terms will not stay secret for long."
 MAD_agriculture_modifier: "Madagascan Agriculture"
 MAD_agriculture_modifier_desc: "The state of Madagascar's farms: how many hands they need, how much they yield and what they pay in tax."
 MAD_DAEWOO_RENEGOTIATE: "Renegotiate the Lease Terms"
 MAD_DAEWOO_RENEGOTIATE_desc: "Seek better terms from Daewoo; renegotiation alone cannot guarantee fair land arrangements or protect domestic food supplies."
 MAD_DAEWOO_LAND_TITLES: "Register the Concession Lands"
 MAD_DAEWOO_LAND_TITLES_desc: "Clarify property claims in areas affected by the proposed lease, relying on reliable records and enforcement of recognised rights."
 MAD_DAEWOO_LIMIT_CONCESSION: "Withdraw the West Coast Expansion"
 MAD_DAEWOO_LIMIT_CONCESSION_desc: "Withdraw the additional agricultural district from the Malagasian West Coast and concentrate the concession in Southwest Madagascar. The smaller land commitment should be easier to defend to affected communities and the public."
 MAD_DAEWOO_PUBLISH_CONTRACT: "Publish the Contract"
 MAD_DAEWOO_PUBLISH_CONTRACT_desc: "Publish the concession terms so the public can scrutinise the agreement; transparency strengthens accountability but does not itself eliminate corruption."
 MAD_DAEWOO_CLASSIFIED_ADDENDUM: "Sign the Classified Addendum"
 MAD_DAEWOO_CLASSIFIED_ADDENDUM_desc: "Negotiate a confidential supplement that expands Daewoo's West Coast concession with another agricultural district in Mahajanga."
 MAD_DAEWOO_WEST_COAST_WITHDRAWN: "Daewoo's West Coast expansion has been withdrawn."
 MAD_DAEWOO_OUTGROWERS: "Smallholder Outgrower Contracts"
 MAD_DAEWOO_OUTGROWERS_desc: "Require Daewoo to work with Malagasy smallholders and maintain a domestic food quota while the new obligations are negotiated and implemented."
 MAD_DAEWOO_LOGISTICS: "Connect the Concessions to the Ports"
 MAD_DAEWOO_LOGISTICS_desc: "Invest in transport links needed to move production to market; the railway link must be in place and public expenditure must be justified by deliverable benefits."
 MAD_DAEWOO_LOCAL_PROCESSING: "Require Local Processing"
 MAD_DAEWOO_LOCAL_PROCESSING_desc: "Require Daewoo to mill and pack part of its harvest in Madagascar, drawing on local processing capacity and the vanilla sector's experience."
 MAD_DAEWOO_LEASE_TOXIC: "Daewoo: A Toxic Lease"
 MAD_DAEWOO_LEASE_TOXIC_desc: "The concession leaves the foreign operator broad control while land claims, food-security safeguards and public scrutiny remain weak. Land safeguards, public disclosure and local participation can improve the terms."
 MAD_DAEWOO_LEASE_TROUBLED: "Daewoo: A Troubled Lease"
 MAD_DAEWOO_LEASE_TROUBLED_desc: "Several of the concession's worst terms have been amended, but unresolved land claims, corruption risks and weak local benefits remain. Outgrower contracts, local processing and transport links could make the project more useful to Malagasy producers."
 MAD_DAEWOO_LEASE_SOUND: "Daewoo: A Working Lease"
 MAD_DAEWOO_LEASE_SOUND_desc: "The concession operates under renegotiated, published terms, with land safeguards, local outgrower contracts, domestic-market provisions and transport links. The safeguards reduce risks without eliminating them."
 MAD_DAEWOO_CANCELLED: "Daewoo: Cancelled Lease"
 MAD_DAEWOO_CANCELLED_desc: "The government cancelled the proposed foreign agricultural concession amid concerns over land access, consultation and food security."
 mad_daewoo.1.t: "Public Anger Over the Daewoo Lease"
 mad_daewoo.1.d: "Reports about the proposed concession have become a national flashpoint. The prospect of a vast foreign land lease has intensified grievances that reach well beyond agriculture: many people are already frustrated by economic hardship, opaque government decisions, allegations of corruption and the concentration of political and commercial power. Demonstrators and civic groups are rallying around questions of land access, export-crop priorities and food security, while opposition voices increasingly turn the controversy into a wider challenge to the government. The authorities must decide whether to defend the project or abandon it."
 mad_daewoo.1.a: "The protests will not go away"
 mad_daewoo.2.t: "The Daewoo Concession Begins Production"
 mad_daewoo.2.d: "The renegotiated arrangement is underway: the concession's maize and palm-oil operations are producing crops, and transport links help move the harvest to export markets. Publication of the terms and local safeguards have made the project more defensible, but concerns about land access, corruption and the balance between exports and domestic food supply have not disappeared."
 mad_daewoo.2.a: "A deal, at last"
 mad_daewoo.3.d: "Eighteen months on, the Daewoo lease is still a grievance. The terms were never fixed, the crops go abroad, and the country's hunger has grown while the concession has flourished. The deal has collapsed under the weight of its own scandal, and with it the government that signed it.\n\nThe voters will have their say, and the state will pay the bill for the broken contract."
 mad_daewoo.5.t: "The Financial Times Report on the Daewoo Deal"
 mad_daewoo.5.d: "A Financial Times report has brought the proposed Daewoo agricultural concession into public view. The company has claimed plans for a long-term lease covering a vast area of land for export-crop production. Malagasy officials dispute that a final land contract was signed, but the conflicting accounts have raised questions about land access, public consultation and whether export production will take priority over domestic food security. Coming amid anger over economic hardship, opaque decision-making and the concentration of political and business influence, the proposal has become a symbol of wider frustration with the government. The story is now public, and its political consequences can no longer be avoided."
 mad_daewoo.5.a: "The report demands a response"
 mad_daewoo.5.a.tt: "Completes the focus \"Daewoo Fallout\"."

