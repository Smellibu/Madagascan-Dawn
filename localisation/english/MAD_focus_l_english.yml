 MAD_DROUGHT_TIER_3: "Famine Conditions"
 MAD_DROUGHT_TIER_4: "The Kere"
 MAD_DROUGHT_EVACUATIONS: "Evacuations from the Drought Provinces"
 MAD_DROUGHT_RESETTLED: "Resettled Families"
 MAD_FARMER_FUNDING: "Farmer Funding"
 MAD_FUND_THE_FARMERS: "Fund the Farmers"
 MAD_FUND_THE_FARMERS_desc: "The concession is gone. Put the money that would have gone to Seoul into the farmers who stayed."
 MAD_DEAL_KEPT_FAILED: "The Deal Collapses"
 MAD_DEAL_KEPT_FAILED_desc: "The lease fell apart, the government fell with it, and the state is left paying the bill."
 # --- decisions ---
 MAD_DROUGHT_EMERGENCY_WATER: "Truck Water to [FROM.GetName]"
 MAD_DROUGHT_EMERGENCY_WATER_desc: "A 30-day tanker programme for §Y[FROM.GetName]§!. While it runs, no other water-trucking programme can start. After completion, the state gets §Y6 months§! of reduced drought growth."
 MAD_DROUGHT_FOOD_AID_APPEAL: "Food Aid Appeal for [FROM.GetName]"
 MAD_DROUGHT_FOOD_AID_APPEAL_desc: "A 30-day food-aid programme for §Y[FROM.GetName]§!. It reduces local drought and hunger; while it runs, no other food-aid programme can start."
 MAD_DROUGHT_SEED: "Distribute Drought-Tolerant Seed"
 MAD_DROUGHT_SEED_desc: "Sorghum, cassava and short-cycle rice for farmers in the south.\n\nA permanent measure."
 MAD_DROUGHT_EARLY_WARNING: "Build an Early-Warning System"
 MAD_DROUGHT_EARLY_WARNING_desc: "Rainfall monitoring and food-security forecasts, so the government moves before the harvest fails.\n\nA permanent measure; the coming droughts hit less hard."
 MAD_DROUGHT_BOREHOLES: "Drill Boreholes in the Grand Sud"
 MAD_DROUGHT_BOREHOLES_desc: "Wells and solar pumps for the villages of the deep south.\n\nA permanent measure."
 MAD_DROUGHT_SUD_EST: "Water and Roads for the South-East"
 MAD_DROUGHT_SUD_EST_desc: "Reservoirs, feeder roads and grain depots along the railway.\n\nA permanent measure."
 MAD_DROUGHT_CLIMATE_ADAPTATION: "Climate Adaptation Programme"
 MAD_DROUGHT_CLIMATE_ADAPTATION_desc: "Reforestation, soil conservation and terracing, funded for the long term.\n\nA permanent measure."
 MAD_DROUGHT_GRAIN_RESERVE: "Establish a Grain Reserve"
 MAD_DROUGHT_GRAIN_RESERVE_desc: "Warehouses of rice and maize that feed the schools when the harvest fails.\n\nStability §G+1%§!. A permanent measure."
 MAD_DROUGHT_LOCUST_WATCH: "Locust Monitoring Network"
 MAD_DROUGHT_LOCUST_WATCH_desc: "Survey teams and rapid-response spraying against the next plague.\n\nA permanent measure; a locust plague hits far less hard."
 MAD_DROUGHT_RESETTLE: "Resettle Internal Displaced People"
 MAD_DROUGHT_RESETTLE_desc: "Fund transport, housing and recovery support for up to 20,000 internally displaced people, returning them to their original states. Costs §Y1.0 billion§! and can be repeated every 90 days once the drought is under control."
 MAD_DROUGHT_EXPAT_RETURN: "Invite the Diaspora Home"
 MAD_DROUGHT_EXPAT_RETURN_desc: "Fund a return programme for Malagasy expatriates. Each call brings home 10% of the people who survived the original emigration, distributed back to their original states. Up to six calls are available; each costs §Y2.0 billion§!."
 MAD_DROUGHT_FINAL_PUSH: "The Final Push"
 MAD_DROUGHT_FINAL_PUSH_desc: "The drought is beaten. One last programme to lay it to rest for good.\n\nSeverity §G-25§!."
