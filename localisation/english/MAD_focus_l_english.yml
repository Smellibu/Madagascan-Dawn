 MAD_GPM_BUY_WHILE_CHEAP: "Lock In Cheap Fuel Contracts"
 MAD_GPM_BUY_WHILE_CHEAP_desc: "Use low world oil prices to lock in longer-term fuel arrangements and improve resilience."
 MAD_GPM_OIL_CHEAP_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires below §Y3§!."
 MAD_GPM_PREPARE_OIL_SHOCK: "Cut Civilian Fuel Demand"
 MAD_GPM_PREPARE_OIL_SHOCK_desc: "Prepare households and civilian activity to use less fuel before prices rise further."
 MAD_GPM_OIL_ELEVATED_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires above §Y4§!."
 MAD_GPM_OIL_SHOCK_RESPONSE: "Emergency Fuel Rationing"
 MAD_GPM_OIL_SHOCK_RESPONSE_desc: "Reduce fuel use across the economy and armed forces during a major oil shock."
 MAD_GPM_OIL_SHOCK_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires above §Y5§!."
 MAD_GPM_REFERENCE_PRICE_2019: "Adopt Reference Pricing"
 MAD_GPM_REFERENCE_PRICE_2019_desc: "Create a formal fuel-price framework tied to market costs."
 MAD_GPM_AUTOMATIC_PRICING_2025: "Adopt Automatic Fuel Pricing"
 MAD_GPM_AUTOMATIC_PRICING_2025_desc: "Automatically pass market price changes through to domestic fuel prices."

