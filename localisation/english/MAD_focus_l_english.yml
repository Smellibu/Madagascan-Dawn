 ########## GPM - Fuel sector rework ##########
 MAD_FUEL_LIBERALIZATION: "Complete Downstream Liberalisation"
 MAD_GPM: "Organise the Fuel Market"
 MAD_GPM_desc: "Build the institutions that govern fuel imports, distribution and pricing."
 MAD_GPM_CARTEL_FORMS: "Form the GPM"
 MAD_GPM_CARTEL_FORMS_desc: "Bring Madagascar's downstream petroleum companies into a permanent industry association."
 MAD_FUEL_LIBERALIZATION_desc: "Open the downstream petroleum market and allow private distributors to compete freely."
 MAD_GPM_TERMINAL_2009: "Open the Toamasina Fuel Terminal"
 MAD_GPM_TERMINAL_2009_desc: "Expand Madagascar's main petroleum import and distribution hub."
 MAD_RUBIS_BUYS_GALANA: "Accept the Rubis-Galana Deal"
 MAD_RUBIS_BUYS_GALANA_desc: "§HHistorical route§!: allow private fuel distribution to consolidate under the Rubis-Galana ownership structure."
 MAD_GPM_CARTEL_CONTINUES: "Keep Private Distribution"
 MAD_GPM_CARTEL_CONTINUES_desc: "Keep fuel distribution in private hands and deepen the commercial model."
 MAD_BREAK_GPM_CARTEL: "Reassert State Control"
 MAD_BREAK_GPM_CARTEL_desc: "§YAlternative route§!: place strategic fuel logistics under stronger state direction."
 MAD_STATE_FUEL_IMPORTS: "Build State Fuel Imports"
 MAD_STATE_FUEL_IMPORTS_desc: "Establish a stronger state role in fuel procurement and distribution."
 MAD_GPM_NATIONAL_FUEL_RESERVE: "Build a National Fuel Reserve"
 MAD_GPM_NATIONAL_FUEL_RESERVE_desc: "Expand strategic storage and build a larger national fuel buffer."
 MAD_GPM_OWNERSHIP_PATH_tt: "Requires one completed fuel-distribution path."
 MAD_GPM_FUEL_RESERVE_BUILT_tt: "Requires at least §Y3§! fuel-silo levels and a §Ysupply hub§! in Toamasina. The focus adds §G2§! random fuel silos."
 MAD_GPM_BUY_WHILE_CHEAP: "Lock In Cheap Fuel Contracts"
 MAD_GPM_BUY_WHILE_CHEAP_desc: "Use low world oil prices to lock in longer-term fuel arrangements and improve resilience."
 MAD_GPM_OIL_CHEAP_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires below §Y3§!."
 MAD_GPM_PREPARE_OIL_SHOCK: "Cut Civilian Fuel Demand"
 MAD_GPM_PREPARE_OIL_SHOCK_desc: "Prepare households and civilian activity to use less fuel before prices rise further."
 MAD_GPM_OIL_ELEVATED_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires above §Y4§!."
 MAD_GPM_OIL_SHOCK_RESPONSE: "Emergency Fuel Rationing"
 MAD_GPM_OIL_SHOCK_RESPONSE_desc: "Reduce fuel use across the economy and armed forces during a major oil shock."
 MAD_GPM_OIL_SHOCK_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires above §Y5§!."
 MAD_GPM_REFERENCE_PRICE_2019: "Adopt Reference Pricing"
 MAD_GPM_REFERENCE_PRICE_2019_desc: "Create a formal fuel-price framework tied to market costs."
 MAD_GPM_AUTOMATIC_PRICING_2025: "Adopt Automatic Fuel Pricing"
 MAD_GPM_AUTOMATIC_PRICING_2025_desc: "Automatically pass market price changes through to domestic fuel prices."


