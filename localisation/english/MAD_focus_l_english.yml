 # --- 2017 Madagascar pneumonic plague emergency ---
 mad_plague.1.t: "The Pneumonic Plague Outbreak"
 mad_plague.1.d: "Madagascar is no stranger to plague. Bubonic plague has appeared regularly in parts of the country, particularly during the epidemic season. However, a new outbreak is proving considerably more dangerous.\n\nIn August, an infected traveller journeyed from Ankazobe towards Toamasina through Antananarivo. Following several deaths and subsequent infections, the Ministry of Public Health confirmed an outbreak of pneumonic plague in September. Unlike the more familiar bubonic form, pneumonic plague can spread directly between people. Cases are appearing in densely populated cities, including Antananarivo and Toamasina, raising serious concerns about the government's ability to contain the disease.\n\nThe government must decide how extensively to mobilise the health services before the outbreak spreads further."
 mad_plague.1.a: "Mobilise the national health services (0.5% of GDP)"
 mad_plague.1.b: "Concentrate resources on the affected cities"
 mad_plague.2.t: "International Concern over Madagascar's Plague Outbreak"
 mad_plague.2.d: "The pneumonic plague outbreak in Madagascar has attracted growing international attention. Cases have spread across several major urban areas, prompting the World Health Organization and international partners to increase their assistance. Neighbouring countries in the Indian Ocean and eastern and southern Africa are strengthening their surveillance and preparedness arrangements. Madagascar has also introduced additional screening at its international airports. The outbreak remains a serious national emergency, but international partners are seeking to contain the danger without imposing unnecessary restrictions on travel or trade."
 mad_plague.2.a: "International assistance is welcome."
 mad_plague.3.t: "The Plague Outbreak Is Contained"
 mad_plague.3.d: "After several months of intensive public-health efforts, Madagascar's pneumonic plague outbreak is finally beginning to subside. By late November, 2,348 suspected, probable and confirmed cases had been reported, including 202 deaths. The outbreak affected 55 of Madagascar's 114 districts, including areas where plague was not normally endemic.\n\nThe government, supported by the World Health Organization, the Institut Pasteur de Madagascar and international partners, expanded testing, isolation, contact tracing and access to antibiotics. The worst of the urban epidemic is now over. However, plague remains endemic in parts of Madagascar, and the government will need to maintain its surveillance and response capabilities beyond this emergency."
 mad_plague.3.a: "The emergency is over; the lessons must remain."
 MAD_2017_PLAGUE_EMERGENCY: "2017 Pneumonic Plague Emergency"
 MAD_2017_PLAGUE_EMERGENCY_desc: "The outbreak has strained Madagascar's health services and disrupted economic activity. Districts are maintaining emergency reporting, isolation and contact-tracing arrangements while the epidemic is brought under control."
# Modern protest pressure and civil-military crisis
MAD_MODERN_PROTEST_PRESSURE: "Rising Public Expectations"
MAD_MODERN_PROTEST_PRESSURE_desc: "The failures of essential public services have sharpened public expectations. Demands for reliable electricity, water, healthcare, education, policing and basic administration are becoming harder for the government to ignore. For a limited period, the public expects more from every part of the state, while dissatisfaction continues to accumulate."
MAD_MODERN_PROTEST_CATEGORY: "Public Expectations"
MAD_MODERN_PROTEST_PRESSURE_MISSION: "Public Expectations and Discontent"
MAD_MODERN_PROTEST_PRESSURE_MISSION_desc: "The government has one year to respond to the rising demands placed on public services. Protest strength is being monitored as dissatisfaction continues to accumulate."
MAD_MODERN_TRANSITIONAL_COUNCIL: "Transitional Military Council"
MAD_MODERN_TRANSITIONAL_COUNCIL_desc: "The new authorities present military intervention as a temporary transition, seeking a measure of public legitimacy while the structure and limits of the interim administration are negotiated."

mad_political.100.t: "Public Expectations Rise"
mad_political.100.d: "Repeated failures in essential services have brought public dissatisfaction into sharper focus. Electricity and water interruptions have become symbols of a wider frustration with the state's ability to provide basic services. Demands are spreading beyond the immediate outages to include the quality of healthcare, education, policing and administration. The government has a limited period in which to show that it can respond."
mad_political.100.a: "The government cannot ignore these demands."
mad_political.103.t: "A Crisis in the Streets"
mad_political.103.d: "Demonstrations are no longer confined to individual service failures. Protesters are questioning the government's competence and demanding a political response. The administration must decide whether to commit resources to immediate relief, remove the ministers held responsible, or maintain the police deployments and curfews already being used to contain the unrest."
mad_political.103.a: "Fund an emergency service response."
mad_political.103.b: "Dismiss the cabinet and offer dialogue."
mad_political.103.c: "Maintain police deployments and curfews."
mad_political.104.t: "The Government's Orders"
mad_political.104.d_dialogue_rejected: "The government has offered dialogue, but the protest movement has rejected talks with an administration it holds responsible for the crisis. The demands now reach beyond individual ministers. The president must decide whether to ask the army command to mediate or order the army to suppress the demonstrations."
mad_political.104.d_continuing: "The first response has not contained the demonstrations. The crisis is now testing the government's authority over the armed forces. The president can ask the army command to mediate and help restore a political process, or order the army to suppress the demonstrations."
mad_political.104.a: "Ask the armed forces to broker a settlement."
mad_political.104.b: "Order the army to suppress the demonstrations."
mad_political.105.t: "The Command Takes a Position"
mad_political.105.d_general_staff_mediation: "The government has asked the General Staff to mediate. Its officers are prepared to broker a settlement, but insist that the dispute cannot be treated as a routine policing operation. The president must decide whether to accept a civilian agreement or reject the command's intervention in politics."
mad_political.105.d_capsat_mediation: "The government has asked CAPSAT to mediate. Its officers are prepared to broker a settlement, but insist that the dispute cannot be treated as a routine policing operation. The president must decide whether to accept a civilian agreement or reject the command's intervention in politics."
mad_political.105.d_general_staff_defection: "The order to suppress the demonstrations has reached the General Staff, but its officers refuse to carry it out. They are asserting an independent position in the crisis and siding with the demands for political change. The president must decide whether to yield to the command's intervention or defy it."
mad_political.105.d_capsat_defection: "The order to suppress the demonstrations has reached CAPSAT, but its officers refuse to carry it out. They are asserting an independent position in the crisis and siding with the demands for political change. The president must decide whether to yield to the command's intervention or defy it."
mad_political.105.a: "Accept a negotiated civilian settlement."
mad_political.105.b: "Reject the military's mediation."
mad_political.105.c: "Yield to the armed forces' intervention."
mad_political.105.d: "Defy the command."
mad_political.106.t: "The Presidency and the Assembly"
mad_political.106.d: "The conflict has moved beyond the cabinet and the armed forces. The Assembly is asserting its constitutional role while the presidency contests the loss of authority. The president must decide whether to accept parliamentary proceedings, attempt to dissolve the legislature, or refuse the military takeover and call the remaining loyal forces to defend the government."
mad_political.106.a: "Accept the Assembly's impeachment proceedings."
mad_political.106.b: "Attempt to dissolve the Assembly."
mad_political.106.c: "Resist the military takeover and defend the government."
mad_political.106.c_tt: "The civilian government moves its capital away from Antananarivo before the military breakaway seizes state 267. The breakaway receives 70% of the land army and the leader selected by the CAPSAT or General Staff command. If the civilian government wins, Antananarivo is restored as the capital."
mad_political.107.t: "The Interim Authority"
mad_political.107.d: "With the executive unable to command the armed forces and the Assembly contesting the presidency, a new military authority is taking shape. Its leaders must decide whether to present themselves as a transitional council tasked with organising a broader political settlement, or assume direct military administration."
mad_political.107.a: "Establish a transitional council."
mad_political.107.b: "Establish direct military administration."
mad_political.110.t: "The Protest Crisis Concludes"
mad_political.110.d_military: "The armed forces have assumed direct military administration. Andry Rajoelina has fled to Dubai, and the TGV party has been banned."
mad_political.110.d_catalyst_failed: "The 365-day protest-pressure period has ended without reaching the threshold for a national crisis. The temporary Split Leadership arrangement is lifted."
mad_political.110.d_other: "The protest crisis has reached its conclusion. The temporary state of divided political authority has ended, and the Split Leadership arrangement is no longer in effect."
mad_political.110.a: "The crisis is concluded."

# Military-political tree: historical programme stages
MAD_POL_MIL_PRE2002_OFFICER_CORPS: "The Officer Corps and the Republic"
MAD_POL_MIL_PRE2002_OFFICER_CORPS_desc: "The 1996 General Statute of Military Personnel sought to establish a common framework for the armed forces of the Third Republic, requiring obedience, political neutrality and professional discipline. Yet the officer corps still carried the legacy of the Second Republic, when senior military careers were closely intertwined with the presidency and access to positions within the state. With the next generation of senior appointments approaching, the government must decide whether the military's statutory obligations will take precedence over presidential confidence and personal patronage."
MAD_POL_MIL_PRE2002_DEVELOPMENT_STAFF: "The Army of Development"
MAD_POL_MIL_PRE2002_DEVELOPMENT_STAFF_desc: "Established under Ratsiraka's reorganisation of the armed forces, the Armée de développement was intended to carry the socialist revolution into Madagascar's countryside. Through its engineering and civic-service roles, the military would support the Fokonolona, extend public services and bring development to the provinces. Yet the military's development apparatus also became intertwined with the careers of senior officers, who could be placed in state institutions and nationalized enterprises. The question is whether this legacy of military-led development should remain an instrument of the executive or be brought under civilian political direction."
MAD_POL_MIL_PRE2002_GENDARMERIE: "The Gendarmerie's Place in the State"
MAD_POL_MIL_PRE2002_GENDARMERIE_desc: "Since 1996, the Gendarmerie has had its own State Secretariat within the Ministry of Armed Forces. This gives its leadership a distinct administrative and political channel without taking it outside the military establishment. The government must decide whether to preserve this arrangement, replace it with a dedicated military command, or strengthen civilian direction over the security services."
MAD_POL_MIL_SECURITY_SECTOR_REVIEW: "The 2007 Security Reform Dispute"
MAD_POL_MIL_SECURITY_SECTOR_REVIEW_desc: "A security-sector reform package was developed with Western consultants as senior officers grew increasingly hostile to top-down executive management of the services, especially appointments, promotion and seniority. The dispute concerned who would direct reorganisation and how the armed forces would be consulted, not the implementation of a completed coastguard or disaster-response plan."
MAD_POL_MIL_LESSON_2002: "The Cost of a Contested Mandate"
MAD_POL_MIL_LESSON_2002_desc: "The 2002 crisis showed how political competition could divide the armed forces, draw reservists and militias into the confrontation, and turn career networks into rival claims to national authority. Loyalty to individual patrons rather than a constitutional state can paralyse an institution when the country most needs it to hold together."
MAD_POL_MIL_LESSON_2009: "The Barracks and the Transfer of Power"
MAD_POL_MIL_LESSON_2009_desc: "The 2009 transfer exposed the gap between formal military authority and the ability to impose a political settlement. A military directorate could be named as the successor while an organised barracks network retained the leverage to decide who governed. The relationship between CAPSAT and the General Staff must be settled openly."
MAD_POL_TGV_MAPUTO_CHARTER: "The Maputo Charter"
MAD_POL_TGV_MAPUTO_CHARTER_desc: "Negotiated by Madagascar's four principal political movements, the Maputo Charter set out an inclusive framework for a political transition. Article 22 proposed an eight-member Committee for Reflection on Defence and National Security, with two representatives from each movement, to discuss national defence, cohesion and discipline in the security forces, and the development of a republican army."
MAD_MIL_PRE2002_PERSONNEL_PROGRAMME: "Personnel Statute Applied Consistently"
MAD_MIL_PRE2002_PERSONNEL_PROGRAMME_desc: "A time-limited programme applies the existing promotion and seniority framework more consistently, improving training standards and professional development without inventing an independent appointments commission."
MAD_MIL_PRE2002_PRESIDENTIAL_NETWORK: "Presidential Sponsorship of Senior Officers"
MAD_MIL_PRE2002_PRESIDENTIAL_NETWORK_desc: "A time-limited network of executive sponsorship gives senior officers access and political leverage, but raises the cost of maintaining their appointments and patronage relationships."
MAD_MIL_SECURITY_SECTOR_REFORM: "Directed Security-Sector Reorganisation"
MAD_MIL_SECURITY_SECTOR_REFORM_desc: "A time-limited top-down reorganisation reduces personnel and police costs and strengthens preventive rural security, but opposition from the officer corps reflects the threat to established appointments."
MAD_MIL_MOBILE_RESPONSE_CAPACITY: "Mobile Response and Coastal Protection"
MAD_MIL_MOBILE_RESPONSE_CAPACITY_desc: "A time-limited programme builds modest coastal and mobile-response capacity through a costed public infrastructure project. Improved facilities and access can support disaster response, maritime awareness and preventive coverage."
MAD_MILITARY_RURAL_GENDARMERIE_REVIEW: "Rebalance Rural Gendarmerie Patrols"
MAD_MILITARY_RURAL_GENDARMERIE_REVIEW_desc: "A limited, costed pilot improves rural coverage and local cooperation, testing practical approaches to prevention and coordination in districts where the gendarmerie has a limited presence."
MAD_MILITARY_MOBILE_RESPONSE_PROJECT: "Fund Mobile Response Infrastructure"
MAD_MILITARY_MOBILE_RESPONSE_PROJECT_desc: "Fund a coastal infrastructure project that supports disaster response, maritime awareness and preventive coverage. Construction and equipment improvements will strengthen the services' ability to operate along the coast."
MAD_military_refoundation.1.t: "Law 96-029 and the Senior Command"
MAD_military_refoundation.1.d: "Law 96-029 of 6 December 1996 established the Statut général des militaires, affirming the Armed Forces' service to the Nation and requiring obedience, reserve and political neutrality. Article 15 barred military personnel from publicly expressing political opinions. Yet the statute did not remove presidential discretion over senior appointments: promotion to general-officer ranks remained by choice and was formalized by decree in the Council of Ministers. The government must decide whether to apply the statute's professional obligations consistently or retain presidential influence over the senior command."
MAD_military_refoundation.1.a: "Uphold Law 96-029 and the Officer Corps' Neutrality"
MAD_military_refoundation.1.b: "Retain Presidential Influence over the Senior Command"
MAD_military_refoundation.2.t: "The 2007 Security Reform Dispute"
MAD_military_refoundation.2.d: "Western consultants were developing a security-sector reform package as senior officers grew increasingly hostile to Ravalomanana's top-down management of the services, particularly appointments, promotion and seniority. The dispute concerned the authority and process for reorganising the security sector, and the degree to which the armed forces would be consulted. It was not the implementation of a completed coastguard or mobile disaster-response programme."
MAD_military_refoundation.2.a: "Impose the Proposed Reorganisation"
MAD_military_refoundation.2.b: "Negotiate with the Services and Defer Implementation"
MAD_military_refoundation.3.t: "The Maputo Charter's Security Provisions"
MAD_military_refoundation.3.d: "With the transition still fragile, the organisation of the security services remains a political question as well as an operational one. The Maputo Charter's Article 22 offered the four movements a forum to address defence policy, cohesion and discipline in the armed forces. TGV must decide whether to advance that consultative approach or keep security coordination within the executive."
MAD_military_refoundation.3.a: "Pursue the eight-member CRDSN proposal"
MAD_military_refoundation.3.b: "Keep security coordination within the executive"
 MAD_POL_MIL_CIVILIAN_ADMINISTRATION: "A Civilian Administration"
 MAD_POL_MIL_CIVILIAN_ADMINISTRATION_desc: "Where the settlement gives the FPA executive responsibility, it must avoid placing every department under serving officers. Civilian ministers and technical specialists should lead finance, public works, health, education, energy and economic policy. Under a negotiated settlement, the FPA can contribute to this civilian-led programme through its agreed role in government."
 MAD_POL_MIL_DIGITAL_ADMINISTRATION: "Digitise Public Administration"
 MAD_POL_MIL_DIGITAL_ADMINISTRATION_desc: "Connect public accounts, procurement, customs and administrative records so the state can track spending, improve service delivery and make officials answerable. Digital systems build on the first integrity measures and the Independent Public Accounts Review."
 MAD_POL_MIL_PUBLIC_SERVICES: "Restore Essential Services"
 MAD_POL_MIL_PUBLIC_SERVICES_desc: "Public confidence will not recover while water, electricity, health, education and basic social protection remain unreliable. The administration must prioritise repair and delivery, including urgent food insecurity in the South, rather than count announcements as achievements."
 MAD_POL_MIL_MARKET_REFORM: "Open the Productive Economy"
 MAD_POL_MIL_MARKET_REFORM_desc: "The Refoundation Programme promises a more open business environment, the removal of monopolistic barriers and tax reform. The FPA must decide whether to widen productive opportunities or preserve a closed system of politically connected firms. Delivering these changes will require reforms to market access, taxation and the influence of established business groups."
 MAD_POL_MIL_REGIONAL_ADMIN: "Bring Administration Closer to the Regions"
 MAD_POL_MIL_REGIONAL_ADMIN_desc: "Decentralisation should change the state's capacity outside the capital, not merely move offices on paper. Regional administration, rural services and public-order coordination must work together. The reform should make local authorities better able to deliver services and coordinate with the gendarmerie."
MAD_military_refoundation.4.t: "National Consultation for Refoundation"
MAD_military_refoundation.4.d: "Retain executive-centred security coordination"
MAD_military_refoundation.4.a: "Revive the Maputo CRDSN"
MAD_military_refoundation.4.b: "Establish a civic and religious security forum"
 MAD_MIL_POST_2025_ROUTE_TT: "Available when the FPA is in government or after the qualifying negotiated civilian settlement."
 MAD_MIL_PUBLIC_INTEGRITY_I: "Public Integrity I"
 MAD_MIL_PUBLIC_INTEGRITY_I_desc: "Initial procurement and integrity rules reduce the fiscal burden of corruption and the cost of maintaining the security establishment."
 MAD_MIL_PUBLIC_INTEGRITY_II: "Public Integrity II"
 MAD_MIL_PUBLIC_INTEGRITY_II_desc: "Independent public-accounts review adds audit capacity and makes administrative and police oversight less costly."
 MAD_MIL_PUBLIC_INTEGRITY_III: "Public Integrity III"
 MAD_MIL_PUBLIC_INTEGRITY_III_desc: "Digital administration strengthens transparency and auditability, extending the integrity programme across public administration and police administration."
 MAD_MIL_NATIONAL_RECONSTRUCTION_I: "National Reconstruction I"
 MAD_MIL_NATIONAL_RECONSTRUCTION_I_desc: "An initial recovery programme supports productivity and the restoration of infrastructure and essential public works."
 MAD_MIL_NATIONAL_RECONSTRUCTION_II: "National Reconstruction II"
 MAD_MIL_NATIONAL_RECONSTRUCTION_II_desc: "Market reform links infrastructure recovery to private enterprise and a modest domestic defence-industrial research base."
 MAD_MIL_NATIONAL_RECONSTRUCTION_III: "National Reconstruction III"
 MAD_MIL_NATIONAL_RECONSTRUCTION_III_desc: "A mature engineering and production programme raises infrastructure and arms output while improving industrial productivity and workforce efficiency."
 MAD_MIL_PUBLIC_ACCOUNTS_REQUIREMENT_TT: "Requires completion of the Independent Public Accounts Review and the Public Integrity II idea."
MAD_military_refoundation.4.d_crdsn: "The TGV administration has already pursued Article 22 of the Maputo Charter. It must now decide whether to revive the CRDSN, establish a civic and religious security forum, reform the existing HCDN and SPDSN, or keep coordination under the executive."
MAD_military_refoundation.4.d_executive: "The administration previously kept security coordination within the executive rather than pursue the Maputo CRDSN proposal. It can continue that approach, establish a civic and religious forum, or reform the existing HCDN and SPDSN."
MAD_military_refoundation.4.d_default: "The Refoundation Programme has opened a national consultation on defence and internal security. The government can establish a civic and religious forum, reform the existing HCDN and SPDSN, or retain executive-centred coordination."
MAD_military_refoundation.4.c: "Reform the HCDN and Permanent Secretariat"
MAD_military_refoundation.5.t: "The Direction of Security Reform"
MAD_military_refoundation.5.d: "The selected security arrangement has now been put in place. The government must decide whether its work should be subject to stronger civilian oversight and public accountability or remain directed through executive-led coordination. Under the reformed HCDN and SPDSN, parliamentary Defence and Public Security commission members may take part in consultation."
MAD_military_refoundation.5.a: "Strengthen civilian oversight and public accountability"
MAD_military_refoundation.5.b: "Reinforce executive-led operational coordination"
MAD_MIL_CRDSN_COMMITTEE: "Defence and National Security Committee"
MAD_MIL_CRDSN_COMMITTEE_desc: "Modelled on Article 22 of the Maputo Charter, the committee brings two representatives from each of the four political movements into a consultative body on national defence, security-force cohesion and discipline, and the development of a republican army."
MAD_MIL_CIVIC_SECURITY_FORUM: "Civic and Religious Security Forum"
MAD_MIL_CIVIC_SECURITY_FORUM_desc: "A standing forum brings civic, religious and local representatives into discussion of public order and rural security, creating a channel for cooperation between communities, local authorities and the security services."
MAD_MIL_HCDN_SPDSN_COORDINATION: "Reformed National Defence Coordination"
MAD_MIL_HCDN_SPDSN_COORDINATION_desc: "The High Council of National Defence and its Permanent Secretariat provide a standing interministerial framework for preparing and coordinating national defence and security policy across government and the security services."
MAD_MIL_SECURITY_COMMITTEE_MANDATE: "The Maputo CRDSN consultative mandate has been implemented."
MAD_MIL_CIVIC_SECURITY_FORUM_ESTABLISHED: "A civic and religious security forum has been established."
MAD_MIL_HCDN_SPDSN_REFORMED: "The HCDN and its Permanent Secretariat have been reformed."
MAD_DAHALO_THREAT_MINUS_1_TT: "Dahalo threat changes by §Y-1§!."

  MAD_MIL_UNLOCK_RURAL_GENDARMERIE_REVIEW_TT: "Unlocks the decision: §YRebalance Rural Gendarmerie Patrols§!"

MAD_military_refoundation.17.t: "The Gendarmerie's Institutional Position"
MAD_military_refoundation.17.d: "The State Secretariat for the Gendarmerie, established in 1996, gives the service a separate senior office within the Ministry of Armed Forces. In 1994, mixed commands bringing together the Army, Gendarmerie and National Police were used as part of a wider attempt to increase civilian control. Yet the Third Republic never established durable civilian prerogatives or parliamentary oversight over the armed forces. The government can retain the Secretariat, replace it with a dedicated Gendarmerie Command, or extend civilian coordination into a more formal system of oversight."
MAD_military_refoundation.17.a: "Retain the State Secretariat"
MAD_military_refoundation.17.b: "Replace It with a National Gendarmerie Command"
MAD_military_refoundation.17.c: "Extend Civilian Coordination of Internal Security"

MAD_MIL_PRE2002_GENDARMERIE_SECRETARIAT: "Separate Gendarmerie Secretariat"
MAD_MIL_PRE2002_GENDARMERIE_SECRETARIAT_desc: "The State Secretariat preserves the Gendarmerie's distinct representation inside the Ministry of Armed Forces. Its senior leadership retains a dedicated channel into the government, maintaining a separate institutional voice while remaining part of the military establishment. This arrangement offers political access but carries additional administrative costs."

MAD_MIL_PRE2002_GENDARMERIE_COMMAND: "National Gendarmerie Command"
MAD_MIL_PRE2002_GENDARMERIE_COMMAND_desc: "A dedicated National Gendarmerie Command replaces the ministerial secretariat as the service's senior institution. Positioned alongside the Army General Staff within the Ministry of Defence, it consolidates the Gendarmerie's place in the military hierarchy, strengthens command cohesion and increases the political weight of the armed services."

MAD_MIL_PRE2002_GENDARMERIE_CIVILIAN_COORDINATION: "Civilian Security Coordination"
MAD_MIL_PRE2002_GENDARMERIE_CIVILIAN_COORDINATION_desc: "A government-led framework coordinates the Army, Gendarmerie and National Police under civilian policy direction. Building on the mixed commands used in 1994, the arrangement gives civilian authorities a clearer role in setting internal-security policy and establishes stronger parliamentary scrutiny. The framework improves civilian legitimacy and stability, but requires a larger administrative apparatus."

