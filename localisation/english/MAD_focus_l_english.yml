 MAD_DROUGHT_EARLY_WARNING: "Build an Early-Warning System"
 MAD_DROUGHT_EARLY_WARNING_desc: "Rainfall monitoring and food-security forecasts, so the government moves before the harvest fails. Establish a warning network."
 MAD_DROUGHT_BOREHOLES: "Drill Boreholes in the Grand Sud"
 MAD_DROUGHT_BOREHOLES_desc: "Wells and solar pumps for the villages of the Grand Sud."
