 # --- Daewoo lease + agricultural reforms ---
 MAD_daewoo_category: "The Daewoo Lease"
 MAD_daewoo_category_desc: "Project viability: §Y[?MAD_daewoo_viability|0]§!/100 (§Y80§! to sign the project off)\nCurrent terms: [MAD_GetDaewooTier]\n\nEvery qualifier raises viability and softens the lease. Several can only be done if the rest of the government has done its homework."
 MAD_daewoo_tier_toxic: "§RToxic§! - massive corruption, a hostile public, Korean control"
 MAD_daewoo_tier_troubled: "§YTroubled§! - the worst is contained, but the deal still stinks"
 MAD_daewoo_tier_sound: "§GSound§! - the lease works, and the land is being farmed"
 MAD_daewoo_tier_none: " "
 MAD_DAEWOO_REVIEW: "Daewoo: The Lease Review"
 MAD_DAEWOO_REVIEW_desc: "Run a 730-day review of the proposed concession's financial viability, land requirements and likely effects on Malagasy agriculture. The concession must reach 80 viability to be retained; the review helps establish whether better terms can make that possible."
 MAD_DAEWOO_VIABILITY_80_tt: "Project viability is at least §Y80§!"
 MAD_DAEWOO_KOREAN_PURCHASES_tt: "§YKorean Purchases§! has been completed"
 MAD_DAEWOO_BIANCO_INDEPENDENT_tt: "§YBianco Independent§! has been completed"
 MAD_DAEWOO_ADDENDUM_tt: "§YBianco Politicized§! has been completed, and the contract has not been published"
 MAD_DAEWOO_RAIL_tt: "The §YMahajanga§! or §YToliara§! railway has been built"
 MAD_DAEWOO_VANILLA_SECTOR_tt: "§YVanilla Export Sector§! has been completed"
 MAD_DAEWOO_OUTCOME_WELL_tt: "The Daewoo lease has been signed off as a success"
 MAD_DAEWOO_OUTCOME_FAILED_tt: "The Daewoo lease has collapsed and the government has fallen"
 MAD_agri_reforms_tt: "Agricultural output improves: §G-3%§! agriculture worker requirement, §G+3%§! agricultural productivity"
 MAD_daewoo_deal_tt: "The lease is signed. Its terms will not stay secret for long."
 MAD_agri_sound_tt: "Working farmland: §G-2%§! agriculture worker requirement, §G+4%§! agricultural productivity, §G+5%§! agriculture tax income"
 MAD_agriculture_modifier: "Madagascan Agriculture"
 MAD_agriculture_modifier_desc: "The state of Madagascar's farms: how many hands they need, how much they yield and what they pay in tax."
 MAD_DAEWOO_RENEGOTIATE: "Renegotiate the Lease Terms"
 MAD_DAEWOO_RENEGOTIATE_desc: "Spend 50 Political Power to seek better terms from Daewoo. Renegotiation improves concession viability by 20, but cannot by itself guarantee fair land arrangements or protect domestic food supplies."
 MAD_DAEWOO_LAND_TITLES: "Register the Concession Lands"
 MAD_DAEWOO_LAND_TITLES_desc: "Clarify property claims in areas affected by the proposed lease. This improves concession viability by 15 and landowners' opinion by 10, but depends on reliable records and enforcement of recognised rights."
 MAD_DAEWOO_PUBLISH_CONTRACT: "Publish the Contract"
 MAD_DAEWOO_PUBLISH_CONTRACT_desc: "Publish the concession terms so the public can scrutinise the agreement. With BIANCO independent, disclosure improves viability by 20 and Stability by 2%; transparency strengthens accountability but does not itself eliminate corruption."
 MAD_DAEWOO_CLASSIFIED_ADDENDUM: "Sign the Classified Addendum"
 MAD_DAEWOO_CLASSIFIED_ADDENDUM_desc: "Negotiate a confidential supplement to the agreement. This grants 40 Political Power but reduces concession viability by 10, increases corruption and lowers Rural Cooperation by 4, trading public trust and project soundness for short-term political room."
 MAD_DAEWOO_OUTGROWERS: "Smallholder Outgrower Contracts"
 MAD_DAEWOO_OUTGROWERS_desc: "Spend $2 billion to require Daewoo to work with Malagasy smallholders and maintain a domestic food quota. The arrangement improves viability by 15 but initially reduces Rural Cooperation by 4 while the new obligations are negotiated and implemented."
 MAD_DAEWOO_LOGISTICS: "Connect the Concessions to the Ports"
 MAD_DAEWOO_LOGISTICS_desc: "Spend $2 billion on transport links needed to move production to market. This improves viability by 15 and requires the railway link to be in place, but public expenditure must be justified by the project's deliverable benefits."
 MAD_DAEWOO_LOCAL_PROCESSING: "Require Local Processing"
 MAD_DAEWOO_LOCAL_PROCESSING_desc: "Require Daewoo to mill and pack part of its harvest in Madagascar, drawing on local processing capacity and the vanilla sector's experience. This improves viability by 10 and requires the Vanilla Export Sector focus."
 MAD_DAEWOO_LEASE_TOXIC: "Daewoo: A Toxic Lease"
 MAD_DAEWOO_LEASE_TOXIC_desc: "The concession leaves the foreign operator broad control while land claims, food-security safeguards and public scrutiny remain weak. Corruption-related costs rise by 30%, Stability falls by 6%, resistance to foreign influence weakens by 20%, and agricultural tax gains fall by 5%. Land safeguards, public disclosure and local participation can improve the terms."
 MAD_DAEWOO_LEASE_TROUBLED: "Daewoo: A Troubled Lease"
 MAD_DAEWOO_LEASE_TROUBLED_desc: "Several of the concession's worst terms have been amended, but unresolved land claims, corruption risks and weak local benefits remain. Corruption-related costs rise by 15%, Stability falls by 3%, resistance to foreign influence weakens by 12%, and agricultural tax gains fall by 2%. Outgrower contracts, local processing and transport links could make the project more useful to Malagasy producers."
 MAD_DAEWOO_LEASE_SOUND: "Daewoo: A Working Lease"
 MAD_DAEWOO_LEASE_SOUND_desc: "The concession operates under renegotiated, published terms, with land safeguards, local outgrower contracts, domestic-market provisions and transport links. Corruption-related costs remain 4% higher and resistance to foreign influence is 6% weaker, but agricultural productivity rises by 5%, agricultural labour requirements fall by 2%, and agricultural tax gains rise by 5%. The safeguards reduce risks without eliminating them."
 MAD_DAEWOO_CANCELLED: "Daewoo: Cancelled Lease"
 MAD_DAEWOO_CANCELLED_desc: "The government cancelled the proposed foreign agricultural concession amid concerns over land access, consultation and food security. For two years, incoming investment costs and durations are 50% higher as investors reassess the risks of committing capital to Madagascar."
 mad_daewoo.1.t: "Public Anger Over the Daewoo Lease"
 mad_daewoo.1.d: "Reports about the proposed concession have become a national controversy. Demonstrators and churches condemn the prospect of a vast foreign lease in a country where many households struggle to afford rice; concern about land access, export-oriented crops and food security is spreading through the cities and security forces. The government must decide whether to defend the project or tear it up."
 mad_daewoo.1.a: "The protests will not go away"
 mad_daewoo.2.t: "The Daewoo Concession Begins Production"
 mad_daewoo.2.d: "The renegotiated arrangement is underway: the concession's maize and palm-oil operations are producing crops, and transport links help move the harvest to export markets. Publication of the terms and local safeguards have made the project more defensible, but concerns about land access, corruption and the balance between exports and domestic food supply have not disappeared."
 mad_daewoo.2.a: "A deal, at last"
 mad_daewoo.3.d: "Two years on, the Daewoo lease is still a grievance. The terms were never fixed, the crops go abroad, and the country's hunger has grown while the concession has flourished. The deal has collapsed under the weight of its own scandal, and with it the government that signed it.\n\nThe voters will have their say, and the state will pay the bill for the broken contract."
 mad_daewoo.5.t: "The Financial Times Report on the Daewoo Deal"
 mad_daewoo.5.d: "A Financial Times report has brought the proposed Daewoo agricultural concession into public view. The company has claimed plans for a long-term lease covering a vast area of land for export-crop production. Malagasy officials dispute that a final land contract was signed, but the conflicting accounts have raised questions about land access, public consultation and whether export production will take priority over domestic food security. The story is now public, and the political consequences of the deal can no longer be avoided."
 mad_daewoo.5.a: "The report demands a response"
 mad_daewoo.5.a.tt: "Completes the focus \"Daewoo Fallout\"."

