# Historical military-policy programmes, 2005-2024
MAD_POL_MIL_2005_RESTRUCTURING: "The 2005 Armed Forces Restructuring Programme"
MAD_POL_MIL_2005_RESTRUCTURING_desc: "The TIM government moves the Armed Forces Restructuring Programme from draft to implementation. It strengthens the military's role in national defence and sovereignty, expands maritime capacity at Mahajanga, and reinforces civilian direction over the armed forces."
MAD_POL_MIL_INTERNAL_CONTROL_2021_23: "Establish the État-major des Armées"
MAD_POL_MIL_INTERNAL_CONTROL_2021_23_desc: "The existing military command structure no longer adequately reflects the needs of the Malagasy Armed Forces. We will replace the État-major Général de l'Armée Malagasy with a new État-major des Armées (EMA), establishing a superior joint command responsible for coordinating the Army, Air Force and Navy. Each service will receive its own dedicated headquarters, while the new central command will oversee force preparation, organisation and operational coordination. This restructuring will establish clearer lines of responsibility and provide the foundation for a more coherent national defence establishment."

MAD_military_refoundation.7.t: "General Fidy's Challenge"
MAD_military_refoundation.7.d: "On 17 November 2006, retired General Andrianafidisoa, known as Fidy, distributed leaflets calling for President Ravalomanana to stand down and announcing a provisional military directorate. Fidy argued that the government was unconstitutional, but only a small group of officers and reservists joined him. The TIM government must decide whether to order his arrest, address the constitutional grievance or reduce the armed forces' capacity to intervene in politics."
MAD_military_refoundation.7.a: "Order Fidy's arrest"
MAD_military_refoundation.7.b: "Address the constitutional grievances"
MAD_military_refoundation.7.c: "Strengthen civilian control over the armed forces"
MAD_military_refoundation.9.t: "Military Pressure on the HAT"
MAD_military_refoundation.9.d: "In April and May 2010, military leaders pressed for a political resolution while the armed-forces minister was dismissed amid coup rumours and a gendarmerie mutiny followed. The transitional government must decide whether to accommodate senior officers, negotiate clearer civilian command arrangements or assert civilian authority despite the risk of further confrontation."
MAD_military_refoundation.9.a: "Accommodate the officer corps"
MAD_military_refoundation.9.b: "Negotiate a civilian command compact"
MAD_military_refoundation.9.c: "Reject the military's demands"
MAD_military_refoundation.10.t: "The November 2010 Military Challenge"
MAD_military_refoundation.10.d: "In November 2010, a group of officers challenged the High Authority of the Transition. After nearly three days of negotiations, the standoff was resolved. The government must decide whether to reintegrate the dissident officers, suppress the challenge or grant military leaders a formal mediation role."
MAD_military_refoundation.10.a: "Negotiate and reintegrate the dissident officers"
MAD_military_refoundation.10.b: "Suppress the military challenge"
MAD_military_refoundation.10.c: "Give military leadership a formal mediation role"
MAD_military_refoundation.11.t: "The SADC Roadmap and the Military's Mandate"
MAD_military_refoundation.11.d: "The military's political role remains part of the struggle over the SADC transition roadmap and the return to constitutional government. The government can accept the electoral timetable and withdraw the armed forces from political arbitration, or retain a military guarantee over the transition's key decisions."
MAD_military_refoundation.11.a: "Accept the transition timetable and withdraw from political arbitration"
MAD_military_refoundation.11.b: "Retain the military as guarantor of the transition"
MAD_military_refoundation.12.t: "The National Security Reform Plan"
MAD_military_refoundation.12.d: "The national security reform process seeks a whole-of-government framework for preparing and coordinating national defence and security policy. The policy letter adopted in January 2016 and the National Security Reform Plan published in September 2017 provide a basis for better interministerial coordination, risk assessment and coherent institutional responsibilities."
MAD_military_refoundation.12.a: "Adopt the National Security Reform Plan"
MAD_military_refoundation.12.b: "Keep security reform fragmented between the services"
MAD_military_refoundation.13.t: "The HCDN and Permanent Secretariat"
MAD_military_refoundation.13.d: "Act 2016-059 established the High Council of National Defence, and Decree 2017-242 created its Permanent Secretariat for National Defence and Security. Together, the Council and Secretariat provide a standing framework for coordinating defence and security policy across the government. The government must decide whether to implement this statutory system or retain executive-centred coordination."
MAD_military_refoundation.13.a: "Establish the statutory national defence coordination system"
MAD_military_refoundation.13.b: "Keep national security coordination within the executive"
MAD_military_refoundation.14.t: "Internal Control and Military Governance"
MAD_military_refoundation.14.d: "The 2021-23 Armed Forces restructuring plan placed internal control, risk management and professional conduct at the centre of military governance. It called for procedures to prevent, report and investigate misconduct and for stronger practice in human resources, ethics, military investigations, finance and operations. The government must decide whether to implement those systems or leave the plan as administrative guidance."
MAD_military_refoundation.14.a: "Implement internal control and risk management"
MAD_military_refoundation.14.b: "Keep the programme as administrative guidance"
MAD_military_refoundation.16.t: "The Military Directorate's Mandate"
MAD_military_refoundation.16.d: "Ordinance 2009-001 assigned full powers to the Military Directorate. Ordinance 2009-002, also dated 17 March 2009, transferred those powers to Andry Rajoelina and provided for a transition towards the Fourth Republic within a maximum of 24 months. The Directorate's proposed responsibilities included national consultations, constitutional preparation, electoral and political-party legislation, and elections within that period."
MAD_military_refoundation.16.a: "Retain the Military Directorate and its 24-month programme"
MAD_military_refoundation.16.b: "Limit the Directorate to restoring order and preparing a transfer"

MAD_MIL_HAT_OFFICER_ACCOMMODATION: "HAT Officer-Corps Accommodation"
MAD_MIL_HAT_OFFICER_ACCOMMODATION_desc: "The transitional administration maintains officer support through political and financial accommodation, sustaining military influence while increasing the cost of the security establishment."
MAD_MIL_CIVILIAN_COMMAND_COMPACT: "Civilian Command Compact"
MAD_MIL_CIVILIAN_COMMAND_COMPACT_desc: "A negotiated understanding clarifies civilian authority and the services' institutional responsibilities, easing the cost of coordination while preserving a professional military role."
MAD_MIL_HAT_TRANSITION_GUARANTOR: "Military Transition Guarantor"
MAD_MIL_HAT_TRANSITION_GUARANTOR_desc: "The military has assumed a formal mediation role in the transition. This adds political leverage but weakens the distinction between military command and civilian political arbitration."
MAD_MIL_TGV_TRANSITION_GUARANTOR: "TGV Transition Guarantee"
MAD_MIL_TGV_TRANSITION_GUARANTOR_desc: "Military leadership retains a guarantee over the transition's major political decisions, giving officers leverage over the timetable and the return to constitutional government."
MAD_MIL_NATIONAL_SECURITY_REFORM_PLAN: "National Security Reform Plan"
MAD_MIL_NATIONAL_SECURITY_REFORM_PLAN_desc: "A whole-of-government policy framework improves administrative coordination, risk assessment and the coherence of national defence and security responsibilities."
MAD_MIL_HCDN_SPDSN_BASE: "HCDN and SPDSN Established"
MAD_MIL_HCDN_SPDSN_BASE_desc: "The High Council of National Defence and its Permanent Secretariat provide a standing interministerial framework for preparing and coordinating national defence and security policy across government."
MAD_MIL_EXECUTIVE_SECURITY_CONTINUITY_IDEA: "Executive Security Coordination"
MAD_MIL_EXECUTIVE_SECURITY_CONTINUITY_IDEA_desc: "Security policy and interministerial coordination remain directed through the executive, with the relevant ministries and security services working under central government direction. Strategic decisions remain concentrated within the presidency and cabinet, while implementation proceeds through existing administrative channels."
MAD_MIL_INTERNAL_CONTROL_FRAMEWORK: "Armed Forces Internal-Control Framework"
MAD_MIL_INTERNAL_CONTROL_FRAMEWORK_desc: "Internal control, risk management, professional conduct and procedures for reporting and investigating misconduct strengthen the Armed Forces' internal governance."
MAD_MIL_INTERNAL_INSPECTION_CAPACITY: "Expanded Military Inspection Services"
MAD_MIL_INTERNAL_INSPECTION_CAPACITY_desc: "The Ministry of Defence has expanded inspection capacity across the Land, Air and Naval branches, appointing inspectors to strengthen internal oversight and accountability."
MAD_MIL_GFSI_RAPID_RESPONSE: "Groupement des Forces Spéciales d'Intervention"
MAD_MIL_GFSI_RAPID_RESPONSE_desc: "A national reserve of special intervention forces operates under the General Staff's operational command for military security and specialised rapid-response operations."
MAD_MIL_DIRECTORATE_TRANSITION: "Military Directorate Transition Mandate"
MAD_MIL_DIRECTORATE_TRANSITION_desc: "The Military Directorate exercises a temporary transitional mandate. Its expanded administrative responsibilities increase bureaucracy and strain stability while giving the military a formal role in preparing a transfer of power."
MAD_MIL_CREATE_GFSI: "Establish the Groupement des Forces Spéciales d'Intervention"
MAD_MIL_CREATE_GFSI_desc: "Create the 2021 national reserve of special intervention forces under the General Staff's operational command, providing a specialised rapid-response and military security capability."
MAD_MILITARY_INSPECTORATE_IMPLEMENTATION: "Expand the Military Inspection Services"
MAD_MILITARY_INSPECTORATE_IMPLEMENTATION_desc: "Implement the 2024 inspection recommendations by appointing five inspectors in each of the Land, Air and Naval branches, extending internal oversight beyond the Land Army."
 MAD_POL_TGV_OFFICERS_OF_MARCH: "Reward the Officers of March"
 MAD_POL_TGV_OFFICERS_OF_MARCH_desc: "The 3 November 2009 promotion round advanced Noël Girardin Rakotonandrasana, André Ndriarijaona, Jean Bruno Wilfrid Razafindrakoto and Richard Ravalomanana into the general officer corps. These appointments consolidated the senior military leadership that had supported the March transfer of power. André Ndriarijaona had already been appointed Army Chief of Staff in March."
 MAD_POL_TGV_2013_OFFICER_PROMOTIONS: "Elevate the Senior Command"
 MAD_POL_TGV_2013_OFFICER_PROMOTIONS_desc: "The 2012–13 promotion rounds expanded the senior command. Richard Ravalomanana received his divisional-general promotion on 1 December 2012, followed by Tafara Edmond and Rafenomanjato Mamy Jerison on 1 January 2013, and Béni Xavier Rasolofonirina on 1 September 2013. These appointments further reshaped the military leadership during the transition towards the HVM administration."
 MAD_POL_HVM_OFFICER_PROMOTIONS: "Expand the General Officer Corps"
 MAD_POL_HVM_OFFICER_PROMOTIONS_desc: "The HVM administration continued to expand the general officer corps. A promotion list for the second half of 2015 was announced in February 2016, followed by a further 58 promotions in 2017. These rounds enlarged the senior command and reshaped the leadership of the Armed Forces during Rajaonarimampianina's presidency."

# CNME establishment and successor FIS
MAD_POL_TGV_ESTABLISH_FIS: "Establish the FIS"
MAD_POL_TGV_ESTABLISH_FIS_desc: "Decide whether to establish a more powerful executive-directed Special Intervention Force or a force subject to stronger judicial oversight. The choice will shape the risks and costs of future internal-security operations."
MAD_military_refoundation.8.t: "Establish the Joint National Investigation Committee"
MAD_military_refoundation.8.d: "The transitional administration must determine how the Commission nationale mixte d'enquête (CNME), a joint investigative body drawing on military and gendarmerie personnel, will be organised. One model emphasises administrative integrity, reporting and coordination; the other places the committee under closer executive direction. The choice will shape its oversight, administrative burden and relationship with the security services."
MAD_military_refoundation.8.a: "Create the CNME with administrative integrity safeguards"
MAD_military_refoundation.8.b: "Create the CNME under executive security coordination"
MAD_military_refoundation.20.t: "Establishing the FIS"
MAD_military_refoundation.20.d: "The government must decide how the Forces d'intervention spéciale (FIS) should operate. One option places the force under direct executive command, while the other gives it stronger judicial oversight. The institutional model will shape its costs, effectiveness and the prospects for the planned operation against Dahalo networks."
MAD_military_refoundation.20.a: "Empower the executive-run FIS"
MAD_military_refoundation.20.b: "Create a judicially supervised successor FIS"

MAD_TGV_CNME_INTEGRITY_MODEL: "CNME: Administrative Integrity Model"
MAD_TGV_CNME_INTEGRITY_MODEL_desc: "The CNME combines military and gendarmerie investigative personnel with formal reporting, case documentation and administrative safeguards. Its procedures strengthen traceability and accountability across joint investigations, while requiring additional coordination between participating services."
MAD_TGV_CNME_EXECUTIVE_MODEL: "CNME: Executive Coordination Model"
MAD_TGV_CNME_EXECUTIVE_MODEL_desc: "The CNME operates under close executive direction, allowing the presidency to set investigative priorities and coordinate participating security services. Centralised oversight streamlines administrative arrangements and keeps operational decisions within the executive."
MAD_TGV_FIS_PARALLEL_SECURITY: "Executive-Directed FIS and DST"
MAD_TGV_FIS_PARALLEL_SECURITY_desc: "The Forces d'intervention spéciale (FIS) operates alongside the Direction de la sécurité du territoire (DST) under direct executive command. The arrangement concentrates authority over specialised intervention and internal-security operations within the presidency, with the two services forming a coordinated instrument of state security."
MAD_TGV_FIS_ACCOUNTABLE_SECURITY: "Judicially Supervised FIS and DST"
MAD_TGV_FIS_ACCOUNTABLE_SECURITY_desc: "The successor FIS operates alongside the DST under judicial oversight. Clear legal procedures and independent review govern its operations, strengthening accountability while preserving a specialised national intervention capability."
MAD_TGV_FIS_PARALLEL_SECURITY_LIMITED: "Executive-Directed FIS and DST (Limited)"
MAD_TGV_FIS_PARALLEL_SECURITY_LIMITED_desc: "A smaller FIS operates alongside the DST under direct executive command. Its restricted scope keeps the intervention capability focused on selected national-security tasks while maintaining centralised operational direction."
MAD_TGV_FIS_ACCOUNTABLE_SECURITY_LIMITED: "Judicially Supervised FIS and DST (Limited)"
MAD_TGV_FIS_ACCOUNTABLE_SECURITY_LIMITED_desc: "A smaller successor FIS operates alongside the DST under judicial oversight. Defined legal procedures and independent review govern its specialised operations, preserving a limited intervention capability within an accountable framework."

MAD_DAHALO_TANDROKA_REQUIRES_FIS_TT: "Requires an established successor FIS. Complete the TGV focus Establish the FIS first."
MAD_DAHALO_FIS_DST_BACK: "Retain and Back the FIS and DST"
MAD_DAHALO_FIS_DST_BACK_desc: "Following Operation Tandroka's failure, the government retains both the FIS and DST within the national security apparatus. The services continue to provide specialised intervention and internal-security capabilities, with their future operations shaped by the lessons of the failed campaign."
MAD_DAHALO_FIS_DST_DISMANTLE: "Dismantle the FIS and DST"
MAD_DAHALO_FIS_DST_DISMANTLE_desc: "Following the failure of Operation Tandroka, the government disbands the FIS and ends the DST's parallel operational role, returning intelligence coordination to the established security framework."
MAD_DAHALO_FIS_REVIEW_PENDING: "Review of the FIS and DST is available."
MAD_DAHALO_FIS_REVIEW_RESOLVED: "The post-Tandroka review of the FIS and DST has been resolved."
MAD_TGV_FIS_ESTABLISHED: "The successor FIS has been established."
MAD_TGV_DST_ESTABLISHED: "The Internal Security Service (DST) remains active."
MAD_TGV_FIS_DIRECT_COMMAND: "The FIS is under direct executive command."
MAD_TGV_FIS_JUDICIAL_OVERSIGHT: "The FIS operates under judicial oversight."
MAD_TGV_FIS_DISMANTLED: "The FIS and DST have been dismantled."
MAD_DAHALO_FIS_POST_TANDROKA_LIABILITY: "The FIS and DST remain in place after Operation Tandroka's failure."
MAD_APOLLO21_EVENT_FIRED: "The Apollo 21 event has fired."
MAD_APOLLO21_SECURITY_RESPONSE: "The government has adopted a national-security response to Apollo 21."
MAD_APOLLO21_JUDICIAL_RESPONSE: "The government has placed Apollo 21 under judicial oversight."

mad_apollo21.1.t: "Apollo 21"
mad_apollo21.1.d: "On 20 July 2021, Malagasy authorities arrested six people in an investigation into an alleged attack on state security. Two days later, the public prosecutor said the suspects had planned to eliminate or neutralise several people, including President Andry Rajoelina. The government described the affair as a foiled plot, but officials did not disclose how advanced it was or provide enough public information to independently establish the full extent of the alleged conspiracy. The investigation places the administration under pressure to protect the presidency while demonstrating that the case will be handled lawfully."
mad_apollo21.1.a: "Treat Apollo 21 as a national-security emergency"
mad_apollo21.1.b: "Place the investigation under judicial oversight"
MAD_APOLLO21_SECURITY_POSTURE: "Apollo 21: National-Security Posture"
MAD_APOLLO21_SECURITY_POSTURE_desc: "The government has strengthened the security response following the alleged Apollo 21 conspiracy. The measures bring a temporary political and administrative benefit, alongside higher police expenditure."
MAD_APOLLO21_JUDICIAL_REVIEW: "Apollo 21: Judicial Review"
MAD_APOLLO21_JUDICIAL_REVIEW_desc: "The government has kept the Apollo 21 investigation under stronger judicial oversight, improving institutional credibility and the administration's anti-corruption capacity."
MAD_military_refoundation.2.c: "Empower the military"

mad_political.111.t: "A Popular Uprising Against the Government"
mad_political.111.d: "The government's attempt to reorganise the security services has become a rallying point for a much wider uprising against the government. Senior officers' opposition to the reforms, and the confrontation between the presidency and the security establishment, help bring sections of the military onto the side of the demonstrators. Public anger has also been building over economic hardship, allegations of corruption and conflicts of interest, increasingly centralised decision-making, and restrictions on opposition media and political activity. Demonstrators, civil society groups and rival political movements have converged around demands for accountability and a change of government, even though they do not share a single programme. As mass protests spread, soldiers at Camp CAPSAT mutiny and refuse orders to repress civilians, bringing the armed forces into direct confrontation with the government. The authorities must decide whether to defend civilian rule, hand power to the military or accept a transitional movement led by the opposition."
mad_political.111.a: "Reassert national sovereignty"
mad_political.111.b: "Hand power to the armed forces"
mad_political.111.c: "Accept a TGV-led transitional government"
 MAD_hvm_national_development_plan: "Adopt the 2015–2019 National Development Plan"
 MAD_hvm_national_development_plan_desc: "The National Development Plan 2015–2019 set Madagascar's medium-term priorities across five pillars: governance and rule of law; macroeconomic stability; inclusive growth and territorial development; human capital; and natural capital and disaster resilience. It provided the framework for coordinating sector strategies and public investment during the HVM administration."
 MAD_hvm_anti_corruption_courts: "Establish Specialised Anti-Corruption Courts"
 MAD_hvm_anti_corruption_courts_desc: "Laws No. 2016-020 and 2016-021 established the legal framework for specialised anti-corruption courts, known as Pôles Anti-Corruption (PAC). The first PAC opened in Antananarivo in June 2018, giving corruption and related economic offences a dedicated judicial forum."
 MAD_hvm_special_economic_zones: "Create Special Economic Zones"
 MAD_hvm_special_economic_zones_desc: "Law No. 2017-023, adopted on 28 November 2017, established the legal and institutional framework for Special Economic Zones. Fiscal and non-fiscal incentives were intended to attract Malagasy and foreign investment, expand value-added production and exports, and connect larger firms with local suppliers."
 MAD_hvm_social_protection_policy: "Adopt the National Social Protection Policy"
 MAD_hvm_social_protection_policy_desc: "The National Social Protection Policy, formulated in 2015, established a nationwide framework to reduce vulnerability, improve access to essential services and progressively extend contributory social insurance. Its coordination arrangements, formalised in 2017, were intended to align social-protection policy across government ministries."
 MAD_hvm_education_sector_plan: "Adopt the Education Sector Plan"
 MAD_hvm_education_sector_plan_desc: "The government approved the Education Sector Plan 2018–2022 in June 2017, bringing together the national, technical and higher-education ministries. Its central proposal was nine years of basic education in three three-year cycles, supported by curriculum reform, teacher development and changes to school organisation and the calendar."
 MAD_hvm_human_rights_protections: "Advance Human Rights Protections"
 MAD_hvm_human_rights_protections_desc: "Law No. 2014-007 of 22 July 2014 established the Independent National Human Rights Commission. Law No. 2014-035, promulgated by Hery Rajaonarimampianina on 9 January 2015, abolished the death penalty, while Law No. 2014-040 of 20 January 2015 strengthened the legal framework against human trafficking."

 MAD_POL_AREMA_RAT_PRSP: "Launch the Poverty Reduction Strategy"
 MAD_POL_AREMA_RAT_PRSP_desc: "The Interim Poverty Reduction Strategy Paper, adopted on 20 November 2000, organised the government's programme around pro-poor growth, essential services and stronger public institutions. It called for support to smallholder agriculture, rural roads and markets, micro-credit and labour-intensive work, while prioritising primary education, basic healthcare and drinking water. Madagascar's entry into the enhanced HIPC initiative opened debt-service savings for health, education, rural roads and water. The full PRSP was still being finalised in late 2001, so the focus centres on the interim strategy and its priority actions."
 MAD_POL_AREMA_RAT_AUTONOMOUS_PROVINCES: "Establish the Autonomous Provinces"
 MAD_POL_AREMA_RAT_AUTONOMOUS_PROVINCES_desc: "The 1998 constitutional reform created six autonomous provinces as the centrepiece of Ratsiraka's decentralisation programme. Provincial councils were elected in December 2000, and governors and their councils were installed in June 2001. The government planned an interprovincial conference, a public-finance law defining the fiscal relationship between the centre and the provinces, and provincial administrative and financial tribunals. By 2002, the new provincial institutions were operating, while important questions over their powers and financing remained unresolved."
 MAD_POL_AREMA_RAT_PRIVATISATION: "Advance Public Enterprise Privatisation"
 MAD_POL_AREMA_RAT_PRIVATISATION_desc: "The government continued its comprehensive privatisation programme. Bids for the sale of TELMA were launched in July 2001, with completion expected in early 2002; tenders for the cotton company HASYMA were scheduled for November, and a privatisation strategy for the sugar company SIRAMA was being prepared for 2002. Air Madagascar's management was restructured in July 2001, with cost reductions, network rationalisation and a proposed opening of its capital to new shareholders. The programme was advanced, but the political crisis interrupted its planned timetable."
 MAD_POL_AREMA_PUBLIC_SECURITY: "Restore Public Security"
 MAD_POL_AREMA_PUBLIC_SECURITY_desc: "In his 2018 presidential campaign, Didier Ratsiraka named the restoration of public security as one of his principal priorities. The pledge placed the protection of people and communities at the centre of the state's responsibilities, alongside improved living conditions and a renewed commitment to the rule of law. AREMA would make reliable public safety a visible measure of government performance."
 MAD_POL_AREMA_RULE_OF_LAW: "Reaffirm the Rule of Law"
 MAD_POL_AREMA_RULE_OF_LAW_desc: "Ratsiraka's 2018 campaign promised to establish an État de droit. He presented legality and credible public institutions as essential to restoring confidence in government, alongside public security and improved social conditions. AREMA would place respect for legal procedures and the authority of the law at the centre of public administration."
 MAD_POL_AREMA_ELECTORAL_REFORM: "Implement the MDM Electoral Sequence"
 MAD_POL_AREMA_ELECTORAL_REFORM_desc: "At its January 2010 convention, the Mouvement pour la Démocratie à Madagascar (MDM), led by Pierrot Rajaonarivelo, proposed a constitutional referendum followed by a direct presidential election. Legislative elections would follow, and the government formed by the new legislature would then set the timetable for regional and municipal elections. The proposal linked the restoration of constitutional government to a defined sequence of national and local elections."
 MAD_POL_TIM_EDUCATION_TRANSFORMATION: "Transform Public Education"
 MAD_POL_TIM_EDUCATION_TRANSFORMATION_desc: "The Education for All programme abolished school fees in public primary schools, expanded access to textbooks and school materials, and channelled support through parent-school associations. It also reorganised district school administration and expanded teacher training, with the aim of raising enrolment while improving the quality and completion of primary education."
 MAD_POL_TIM_PUBLIC_FINANCE: "Modernise Public Financial Management"
 MAD_POL_TIM_PUBLIC_FINANCE_desc: "From 2004 the government introduced a new public-finance framework and programme budgeting, strengthening budget preparation, treasury accounting and the tracking of poverty-reduction spending. A revised Procurement Code, stronger internal and external controls, and integrated financial-management systems formed part of the effort to make public spending more traceable and aligned with national priorities."
 MAD_POL_TIM_2018_MANIFESTO: "The 2018 Manifesto"
 MAD_POL_TIM_2018_MANIFESTO_desc: "For the 2018 presidential campaign, Ravalomanana's Manifesto proposed inclusive national reconciliation and constitutional reform, stronger rule of law, effective decentralisation centred on the fokontany, and a new economic programme known as Madagascar Action Plan II. It envisaged local development plans and budgets alongside nationally coordinated projects and support for enterprise creation."
 MAD_POL_TIM_DEVELOPMENT_BANK: "Establish a National Development Bank"
 MAD_POL_TIM_DEVELOPMENT_BANK_desc: "The 2018 programme proposed a national development bank to mobilise long-term finance for Malagasy industry and productive investment. It linked improved access to finance with stronger domestic production, better market access for rural output and reform of the national power company, while also calling for fair competition and more deliberate management of imports."
 MAD_POL_TIM_YOUTH_ENTERPRISE: "Support Youth and Women's Enterprise"
 MAD_POL_TIM_YOUTH_ENTERPRISE_desc: "The 2018 Manifesto called for practical support to enterprises led by young people and women, including artisans, cooperatives and small and medium-sized businesses. Assistance was to be organised at local, communal, regional and national levels, linked to local development plans and accompanied by proposals for a national service and a voluntary development service."
 MAD_POL_TIM_MAP_PLUS: "Launch the MAP Plus Programme"
 MAD_POL_TIM_MAP_PLUS_desc: "In 2023 Ravalomanana presented MAP Plus as an updated development programme built on effective decentralisation. Its immediate priorities were nutrition, employment, security, electricity, purchasing power, health, education and national solidarity, followed by medium-term actions over five years. The programme emphasised region-specific solutions and faster delivery to local communities."
 MAD_POL_TIM_LAND_SOVEREIGNTY: "Keep Malagasy Land in Malagasy Hands"
 MAD_POL_TIM_LAND_SOVEREIGNTY_desc: "At the opening of his 2018 campaign, Ravalomanana pledged that Malagasy land would no longer be handed to foreign interests and should be returned to the Malagasy people. Malagasy law barred foreign investors from direct land ownership but allowed renewable leases of up to 99 years, leaving large agricultural areas open to long-term foreign control. Turning the pledge into policy would require reviewing major agricultural leases and concessions, safeguarding Malagasy farmers' access to productive land and applying the Manifesto's proposed consultations and regional, communal and fokontany development plans to land-use decisions."

 MAD_POL_AREMA_MERIT_PUBLIC_SERVICE: "Make Competence the Basis of Public Appointments"
 MAD_POL_AREMA_MERIT_PUBLIC_SERVICE_desc: "In his 2006 presidential programme, Pierrot Rajaonarivelo called for clientelism to give way to competence. The proposal placed professional ability at the centre of public administration. This focus represents the pledge through public appointments and advancement based on ability rather than political connections."
 MAD_POL_AREMA_THIRD_CHAMBER: "Create an Advisory Chamber of Traditional Authorities"
 MAD_POL_AREMA_THIRD_CHAMBER_desc: "Rajaonarivelo's 2006 platform proposed a third parliamentary chamber composed of notables in direct relationship with the population. The MDM convention of January 2010 developed the idea into an advisory chamber for the guardians of Malagasy customs and traditions, including tangalamena, ampanjaka and mpitankazomanga or princes. They would give advice on the country's major economic and social development priorities, bringing customary authority and local knowledge into national deliberation."
 MAD_POL_AREMA_REVIVE_REGIONAL_ENTERPRISES: "Revive Regional Enterprises and Create Youth Jobs"
 MAD_POL_AREMA_REVIVE_REGIONAL_ENTERPRISES_desc: "During the 2013 presidential campaign, Pierrot Rajaonarivelo argued that regionally based public enterprises created during the Second Republic should be returned to productive use. He named Hasyma, Sirama, Siranala and Kafema, separately called for the revival of Sotema and Analaiva, and proposed an ad hoc committee to relaunch Sirama. He linked the recovery of these industrial firms with rebuilding production outside Antananarivo and creating jobs for young people."
 MAD_POL_AREMA_LAND_TENURE_REFORM: "Resolve Rural Land Disputes"
 MAD_POL_AREMA_LAND_TENURE_REFORM_desc: "On 7 October 2013, during his presidential campaign, Pierrot Rajaonarivelo said resolving land disputes would be a priority, particularly in rural areas such as Arivonimamo. The commitment concerned contested land claims affecting families and communities, rather than land certification or agricultural productivity in general. It sought to settle disputes and give rural residents and local operators greater certainty over the land they used."
 MAD_POL_AREMA_PANGALANES_DEVELOPMENT: "Develop the Pangalanes Canal"
 MAD_POL_AREMA_PANGALANES_DEVELOPMENT_desc: "On 15 October 2013, Pierrot Rajaonarivelo's MDM presidential campaign, supported by an AREMA faction, presented the Canal des Pangalanes as a lever for regional development. The programme sought to make better use of the waterway as part of the economic infrastructure of eastern Madagascar, supporting the communities and local activity connected to the canal. The proposal placed the Pangalanes within a wider strategy of developing the particular economic strengths of each region."