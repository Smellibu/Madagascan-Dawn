 # ===== HVM project review =====
 MAD_HVM_PROJECT_REVIEW_CATEGORY: "Fisan-dratana Project Review"
 MAD_HVM_PROJECT_REVIEW_CATEGORY_desc: "Review the HVM development portfolio before committing to another cycle of projects."
 MAD_HVM_REVIEW_COMPLETE_PORTFOLIO: "Finish the viable portfolio"
 MAD_HVM_REVIEW_COMPLETE_PORTFOLIO_desc: "Protect projects that are working and finish them rather than replacing them with new announcements."
 MAD_HVM_REVIEW_RENEGOTIATE: "Renegotiate the portfolio"
 MAD_HVM_REVIEW_RENEGOTIATE_desc: "Rework financing and implementation instead of abandoning the programme."
 MAD_HVM_REVIEW_PRUNE: "Prune the portfolio"
 MAD_HVM_REVIEW_PRUNE_desc: "Cancel weak projects and concentrate the administrative state on the most defensible commitments."

 # ===== Ideas =====
 MAD_MIL_PROFESSIONAL_COMMAND: "Professional Military Command"
 MAD_MIL_PROFESSIONAL_COMMAND_desc: "The armed forces accept civilian supremacy and concentrate on professionalism, administration and reliable command."
 MAD_AREMA_OLD_GUARD: "AREMA Old Guard"
 MAD_AREMA_OLD_GUARD_desc: "AREMA rebuilds the disciplined revolutionary machine associated with the Ratsiraka era."
 MAD_AREMA_RENEWAL: "Renew AREMA Under Rajaonarivelo"
 MAD_AREMA_RENEWAL_desc: "AREMA reframes Malagasy Socialism around social provision and a new political generation."
 MAD_AREMA_RECONCILIATION: "AREMA Matotra Realignment"
 MAD_AREMA_RECONCILIATION_desc: "The Raharijaona-led current adopts a pragmatic political line, looking for cooperation with the Ravalomanana-aligned camp and stronger relations with commercial partners rather than restoring the Ratsiraka old-guard organisation. In this alternative route, the Matotra current becomes the direction of the national AREMA leadership."
 MAD_AREMA_SOCIAL_CONTRACT: "AREMA Social Contract"
 MAD_AREMA_SOCIAL_CONTRACT_desc: "The party ties its return to visible social provision and a stronger relationship with the public."
 MAD_AREMA_OLD_GUARD_REFORMED: "Adapted Old Guard"
 MAD_AREMA_OLD_GUARD_REFORMED_desc: "The disciplined AREMA machine has been adapted to a functioning modern state, retaining its preference for public control and economic sovereignty."
 MAD_AREMA_RENEWAL_MODERNISED: "Modernised AREMA Renewal"
 MAD_AREMA_RENEWAL_MODERNISED_desc: "AREMA combines social provision with greater productivity and a more workable relationship with investment and private enterprise."
 MAD_AREMA_RECONCILIATION_INSTITUTIONALISED: "Matotra Realignment Institutionalised"
 MAD_AREMA_RECONCILIATION_INSTITUTIONALISED_desc: "The pragmatic political realignment is embedded in the party's leadership and institutions. AREMA keeps a distinct identity while maintaining durable working relations with the Ravalomanana-aligned political camp and the commercial partners on whom the strategy depends."
 MAD_AREMA_NON_ALIGNMENT: "AREMA Non-Alignment"
 MAD_AREMA_NON_ALIGNMENT_desc: "Madagascar returns to a sovereignty-conscious foreign policy: less exposed to outside political influence, but more cautious about foreign capital."
 MAD_AREMA_SECOND_SOCIALISM: "The Second Malagasy Socialism"
 MAD_AREMA_SECOND_SOCIALISM_desc: "AREMA's final settlement combines state ownership and social provision with a more productive economy, while remaining wary of foreign capital."
 MAD_TIM_RECONCILIATION_COMPACT: "TIM Reconciliation Compact"
 MAD_TIM_RECONCILIATION_COMPACT_desc: "A broad political bargain reduces the administrative and social cost of holding the republic together."
 MAD_TIM_RECONCILIATION_CONDITIONAL: "Conditional Reconciliation"
 MAD_TIM_RECONCILIATION_CONDITIONAL_desc: "TIM accepts reconciliation while keeping the reform programme moving and limiting concessions to rivals."
 MAD_TIM_JUSTICE_AND_ACCOUNTABILITY: "TIM Accountability Programme"
 MAD_TIM_JUSTICE_AND_ACCOUNTABILITY_desc: "TIM ties reconciliation to audits, policing and institutional accountability."
 MAD_TIM_TIKO_FIREWALL: "Tiko-State Firewall"
 MAD_TIM_TIKO_FIREWALL_desc: "Government and private business are kept at a deliberate distance."
 MAD_TIM_TIKO_NATIONAL_CHAMPION: "Malagasy National Champion"
 MAD_TIM_TIKO_NATIONAL_CHAMPION_desc: "The government deliberately backs a nationally owned business champion."
 MAD_TIM_REPUBLICAN_INSTITUTIONS: "Republican Institutions"
 MAD_TIM_REPUBLICAN_INSTITUTIONS_desc: "TIM consolidates electoral government through a more capable bureaucracy and accountable public institutions."
 MAD_TGV_ELECTORAL_LEGITIMACY: "Electoral Legitimacy"
 MAD_TGV_ELECTORAL_LEGITIMACY_desc: "The movement accepts that lasting legitimacy must be renewed through elections."
 MAD_TGV_REVOLUTIONARY_LEGACY: "Revolutionary Legacy"
 MAD_TGV_REVOLUTIONARY_LEGACY_desc: "TGV retains the movement's anti-establishment legitimacy and treats the 2009 rupture as foundational."
 MAD_TGV_EMERGENCY_MANDATE: "Emergency Mandate"
 MAD_TGV_EMERGENCY_MANDATE_desc: "TGV justifies temporary concentration of executive power as a response to political crisis."
 MAD_TGV_DELIVERY_WATER: "Velirano Delivery: Water & Electricity"
 MAD_TGV_DELIVERY_WATER_desc: "A funded commitment to better basic services."
 MAD_TGV_DELIVERY_INFRASTRUCTURE: "Velirano Delivery: Infrastructure"
 MAD_TGV_DELIVERY_INFRASTRUCTURE_desc: "A funded commitment to flagship infrastructure."
 MAD_TGV_DELIVERY_DIGITAL: "Velirano Delivery: Digital State"
 MAD_TGV_DELIVERY_DIGITAL_desc: "A funded commitment to digital administration and connectivity."
 MAD_TGV_DELIVERY_JOBS: "Velirano Delivery: Youth Employment"
 MAD_TGV_DELIVERY_JOBS_desc: "A funded commitment to employment and skills."
 MAD_TGV_DELIVERY_FOOD: "Velirano Delivery: Food Security"
 MAD_TGV_DELIVERY_FOOD_desc: "A funded commitment to food security."
 MAD_HVM_PROJECT_COMPLETION: "HVM Portfolio Completion"
 MAD_HVM_PROJECT_COMPLETION_desc: "The government finishes viable projects rather than announcing another unfunded programme."
 MAD_HVM_PROJECT_RENEGOTIATED: "HVM Portfolio Renegotiated"
 MAD_HVM_PROJECT_RENEGOTIATED_desc: "HVM focuses on financing discipline and renegotiated implementation."
 MAD_HVM_PROJECT_PRUNING: "HVM Portfolio Discipline"
 MAD_HVM_PROJECT_PRUNING_desc: "HVM concentrates public administration on a smaller number of defensible projects."
 MAD_HVM_FISANDRATANA_FULL: "Fisandratana 2030: Credible Programme"
 MAD_HVM_FISANDRATANA_FULL_desc: "Multiple core reforms have delivered enough results to make the long-term programme credible."
 MAD_HVM_FISANDRATANA_PARTIAL: "Fisandratana 2030: Partial Delivery"
 MAD_HVM_FISANDRATANA_PARTIAL_desc: "Several core reforms are working, but the full programme remains incomplete."
 MAD_HVM_FISANDRATANA_PLANNING: "Fisandratana 2030: Planning State"
 MAD_HVM_FISANDRATANA_PLANNING_desc: "The long-term programme remains more aspirational than delivered."
 MAD_2009_INTERNATIONAL_ISOLATION: "Post-Crisis International Isolation"
 MAD_2009_INTERNATIONAL_ISOLATION_desc: "The unconstitutional transfer of power has led donors and international institutions to restrict normal engagement until constitutional order is restored."

 mad_royal.1.t: "The National Wealth Is a National Trust"
 mad_royal.1.d: "The Royal House programme treats strategic resources as a national trust rather than ordinary assets. The government must now choose between a direct public trust and Malagasy-controlled national champions."
 mad_royal.1.a: "Place strategic wealth in a national trust"
 mad_royal.1.b: "Build Malagasy national champions"
 MAD_ROY_BIBLICAL_SCHOLARSHIP: "Biblical Scholarship"
 mad_royal.4.t: "Who Shall Guard the Sacred Heritage?"
 mad_royal.4.d: "TAMIMA regards the Rova and the wider royal heritage as sacred. The new House government must decide whether custodianship rests primarily with the Houses or with a national heritage trust."
 mad_royal.4.a: "Entrust the heritage to the Houses"
 mad_royal.4.b: "Create a national heritage trust"
 MAD_POL_ROYAL_CONSOLIDATION: "Royal Consolidation"
 MAD_POL_ROYAL_CONSOLIDATION_desc: "A centralised royal administration strengthens the palace's ability to govern, while tying political authority to bureaucratic and internal-security capacity."
 MAD_POL_TAMIMA_GOVERNANCE: "TAMIMA Governance"
 MAD_POL_TAMIMA_GOVERNANCE_desc: "The Houses govern through customary legitimacy, local administration and negotiated social order."
 MAD_HVM_REPUBLICAN_STABILISATION: "Republican Stabilisation"
 MAD_HVM_REPUBLICAN_STABILISATION_desc: "HVM's establishment-first politics turns stability into institutional capacity rather than a temporary burst of public confidence."
 MAD_HVM_RULE_OF_LAW_PROGRAMME: "Rule of Law Programme"
 MAD_HVM_RULE_OF_LAW_PROGRAMME_desc: "The government relies on courts, administration and accountable policing rather than personal rule."

 # ===== Existing party decision categories, tightened to government =====
 MAD_ROY_LEGAL_REFORM: "Commission the Malagasy Legal Code"
 MAD_ROY_LEGAL_REFORM_desc: "Begin the legal replacement programme by commissioning the new Malagasy framework and its implementation through the royal administration."
 MAD_ROY_MONETARY_REFORM: "Implement Monetary Reform"
 MAD_ROY_MONETARY_REFORM_desc: "Carry the fiscal and institutional cost of turning the monetary reform programme into an operating policy."
 MAD_ROY_CUSTOMARY_GOVERNANCE: "Formalise Customary Governance"
 MAD_ROY_CUSTOMARY_GOVERNANCE_desc: "Put customary institutions into the machinery of government and negotiate the cooperation of traditional landholders."
 MAD_TAMIMA_LIVING_FORCES_FORUM: "Convene the Living Forces Forum"
 MAD_TAMIMA_LIVING_FORCES_FORUM_desc: "Bring the traditional, professional, worker and research constituencies together as an organised forum of the Houses."
 MAD_TAMIMA_DINA_IMPLEMENTATION: "Implement Dina Justice"
 MAD_TAMIMA_DINA_IMPLEMENTATION_desc: "Put Dina into practice through local rule-making, enforcement and adjudication under the Houses."
 MAD_TAMIMA_HERITAGE_CUSTODIANSHIP: "Establish House Heritage Custodianship"
 MAD_TAMIMA_HERITAGE_CUSTODIANSHIP_desc: "Reserve administrative capacity for the Houses to oversee the sacred heritage after the custodianship choice has been made."

MAD_POL_TGV_IMPLEMENT_SECURITY_CONSULTATION: "Implement the National Security Consultation"
MAD_POL_TGV_IMPLEMENT_SECURITY_CONSULTATION_desc: "The programme puts the selected national security arrangement into practice. Depending on the consultation's outcome, it will revive the Maputo CRDSN, establish a civic and religious security forum, or strengthen the existing HCDN and its Permanent Secretariat."
 MAD_MIL_PUBLIC_ACCOUNTS_REVIEW: "Independent Public Accounts Review"
 MAD_MIL_PUBLIC_ACCOUNTS_REVIEW_desc: "An independent review of public accounts, procurement and administrative spending gives the Public Integrity programme an enforceable audit mechanism."
MAD_MILITARY_SUPPORT_GENDARMERIE_desc: "The Gendarmerie is central to maintaining public order beyond the main towns. Better support can strengthen its rural presence, improve cooperation with local communities and help coordinate preventive action against banditry and insecurity."

 # ===== Daewoo fallback =====
 MAD_POL_PARTIES_desc: "Political organisations, civic networks and regional coalitions compete to define the country's direction. Their influence depends on whether they can build trust beyond established centres of power, address daily economic concerns and turn political mobilisation into institutions capable of governing consistently."
# --- Royal tree government availability tooltips (MD custom_trigger_tooltip convention) ---
 MAD_ROY_CRPM_IN_POWER_tt: "CRPM is in power"
 MAD_ROY_TAMIMA_IN_POWER_tt: "TAMIMA is in power"
 MAD_ROY_CRPM_OR_TAMIMA_IN_POWER_tt: "CRPM or TAMIMA is in power"

# Political branch availability requirements
 MAD_MIL_IN_POWER_tt: "The FPA is in power"
 MAD_AREMA_IN_POWER_tt: "AREMA is in power"
 MAD_AREMA_CONGRESS_CHOICE_tt: "An AREMA Congress faction has been chosen"
 MAD_AREMA_OLD_GUARD_PATH_tt: "The Old Guard path has been chosen"
 MAD_AREMA_RENEWAL_PATH_tt: "The Renewal path has been chosen"
 MAD_AREMA_RECONCILIATION_PATH_tt: "The Reconciliation path has been chosen"
 MAD_TIM_IN_POWER_tt: "TIM is in power"
 MAD_TGV_IN_POWER_tt: "TGV is in power"
 MAD_HVM_IN_POWER_tt: "HVM is in power"
 MAD_REMENABILA_IN_POWER_tt: "Dahalo are in power"
 MAD_NORTHERN_CATTLE: "Northern Cattle"
 MAD_NORTHERN_CATTLE_desc: "Pastoral traditions connect communities across Madagascar and the nearby islands, while disputes over movement, ownership and security can quickly become political. Control of livestock routes and regional ties has long mattered to livelihoods, but claims beyond the island also bring wider questions of sovereignty and diplomacy."
 MAD_COMORIAN_HERDS: "Comorian Herds"
 MAD_COMORIAN_HERDS_desc: "Links between Madagascar and the Comoros span migration, trade and shared maritime routes. Political claims framed around cattle, settlement or historical ties can strain those relationships, showing how local symbolism may become entangled with wider disputes over borders, identity and regional influence."
 MAD_DROUGHT_FAMINE_RELIEF_12_tt: "Reduces Famine in the affected state by §G12§!."
 MAD_POL_AREMA_PROGRAMME: "Arema programme"

 mad_political.90.t: "Ratsiraka Faces Defeat"
 mad_political.90.d: "A new government has taken shape without AREMA. Didier Ratsiraka must decide whether to flee Madagascar with public funds or reject the government and attempt to regain power by force."
 mad_political.90.a: "Reject the result and fight for AREMA"
 mad_political.90.a_tt: "Ratsiraka-led AREMA starts a civil war from Antananarivo. AREMA retains the capital; the elected government is replicated in the breakaway country."
 mad_political.90.b: "Flee into exile with the public funds"

 mad_political.98.t: "Ratsiraka Flees into Exile"
 mad_political.98.d: "A day after choosing to flee, Didier Ratsiraka makes his escape with public funds. AREMA is banned, leaving the former president in exile until the party is allowed to return."
 mad_political.98.a: "The escape is complete"

 mad_political.91.t: "The Viva Interview"
 mad_political.91.d: "A televised interview with Didier Ratsiraka has given the former president a fresh platform to criticise the government and revive AREMA's political presence. The broadcast has become another flashpoint in an already widening confrontation. Public anger extends beyond partisan rivalry, reflecting frustration with restrictions on opposition media, centralised rule and government decisions seen as favouring a narrow circle. The authorities must decide whether to suppress Viva TV or tolerate the broadcast, weighing the desire to silence critics against the risk of deepening the popular backlash."
 mad_political.91.a: "Ban Viva TV"
 mad_political.91.b: "Allow the channel to remain open"

 mad_political.92.t: "A Return for Ratsiraka?"
 mad_political.92.d: "AREMA has been allowed to operate again, reopening the question of Didier Ratsiraka's political future. The former president can return to lead the party, or a younger figure can take the reins and leave the old guard's political project behind."
 mad_political.92.a: "Let Ratsiraka return"
 mad_political.92.b: "Do not let him return"
 mad_political.92.a_tt: "Didier Ratsiraka remains the leader of AREMA."

 mad_political.93.t: "The Government Crisis Under Authoritarian Rule"
 mad_political.93.d: "The same popular discontent is now building under a government that does not permit elections, leaving opponents few peaceful means of challenging its authority. Economic hardship, allegations of corruption and conflicts of interest, centralised decision-making and restrictions on political freedoms have all fuelled the growing opposition. The Daewoo concession has become a symbol of that wider failure, not its sole cause. The authorities must choose whether to confront the strongest opposition force, risking civil war, or restore elections and face an immediate vote."
 mad_political.93.a: "Risk civil war with the opposition"
 mad_political.93.a_tt: "The strongest eligible opposition party, §Y[MAD_GetDaewooCivilWarParty]§!, will lead the civil war."
 mad_political.93.b: "Restore elections and hold a vote"
 MAD_POL_TIM_2007_CONSTITUTION: "Approve the 2007 Constitution"
 MAD_POL_TIM_2007_CONSTITUTION_desc: "The referendum of 4 April 2007 approved a revised constitution that removed the autonomous provinces and made Madagascar's 22 regions the highest level of administrative subdivision. It formalised the regional structure introduced after 2002, while leaving the financing and precise responsibilities of regional administrations to be developed through subsequent legislation and practice."
 MAD_POL_PARTIES: "Political Affairs"
 mad_political.95.t: "Rajoelina Forms TGV"
 mad_political.95.d: "As the confrontation with the authorities escalates, Andry Rajoelina begins organising the supporters, opposition figures and dissatisfied citizens rallying around him into TGV. The movement gains a formal structure through which to challenge Madagascar's established parties and contest national power."
 mad_political.95.a: "The movement is organised."
 mad_political.96.t: "Rajoelina Forms TGV"
 mad_political.96.d: "After winning the mayoralty of Antananarivo, Andry Rajoelina uses his new public platform to organise TGV. The movement moves from a personal political network into a more structured force with ambitions beyond the capital."
 mad_political.96.a: "The movement is organised."

 mad_political.97.t: "HVM founded"
 mad_political.97.d: "Hery Rajaonarimampianina breaks with Rajoelina's political movement and launches Hery Vaovao ho an'i Madagasikara (HVM) as a separate vehicle. The split takes support away from TGV and creates a new rival party seeking its own political base."
 mad_political.97.a: "Traitors!"
 MAD_POL_HVM_FRANCO_MALAGASY_PARTNERSHIP: "Franco-Malagasy Partnership"
 MAD_POL_HVM_FRANCO_MALAGASY_PARTNERSHIP_desc: "Relations with France remain important in Madagascar's trade, infrastructure and diplomatic affairs. Cooperation can bring technical expertise and long-term investment, but it also revives questions about external influence, national priorities and whether partnerships deliver lasting capacity to Malagasy institutions."
 MAD_POL_TGV_FRENCH_RAIL: "French Support for Railway Development"
 MAD_POL_TGV_FRENCH_RAIL_desc: "Rail links remain critical where road transport is slow, expensive or vulnerable to seasonal disruption. French-backed support for railway infrastructure reflects the longstanding importance of external financing and technical assistance, while the service's future still depends on maintenance and the ability to attract freight."
 MAD_POL_MILITARY_GOVERNMENT: "Reserved Veto Mandate"
 MAD_POL_MILITARY_GOVERNMENT_desc: "The FPA retains a formal veto over the direction and timing of the transition. Political authority remains concentrated in the military-origin governing party, carrying fiscal and legitimacy costs."
 MAD_POL_MILITARY_GUARDIAN: "Electoral Military Party Mandate"
 MAD_POL_MILITARY_GUARDIAN_desc: "The FPA remains a governing political party while allowing electoral competition. The armed forces retain their institutional role, but the party's authority is tested through constitutional politics rather than a permanent veto."
 MAD_POL_MARITIME_SECURITY: "Maritime Security"
 MAD_POL_MARITIME_SECURITY_desc: "Professionalise maritime security and turn Madagascar's naval responsibilities into a reliable national capability."
 MAD_MIL_UNIFIED_FORCES: "Unified Forces"
 MAD_MIL_UNIFIED_FORCES_desc: "Unify command, administration and procurement across the armed forces."
 MAD_MIL_PROFESSIONAL_OFFICERS: "Professional Officers"
 MAD_MIL_PROFESSIONAL_OFFICERS_desc: "Build a professional officer corps with stronger training standards and institutional expertise."
 MAD_MIL_SOUTHERN_SECURITY: "Southern Security"
 MAD_MIL_SOUTHERN_SECURITY_desc: "Make security in the south a defined military responsibility while strengthening the institutions that support it."
 MAD_MIL_GENDARMERIE_REFORM: "Gendarmerie Reform"
 MAD_MIL_GENDARMERIE_REFORM_desc: "Rebuild the gendarmerie so domestic security can be handled more efficiently without relying on the army alone."
 MAD_MIL_ENGINEER_CORPS: "The Engineer Corps"
 MAD_MIL_ENGINEER_CORPS_desc: "Expand military engineering capacity and direct it toward defence and national resilience."
 MAD_MIL_MULTILATERAL_DOCTRINE: "Multilateral Defence Doctrine"
 MAD_MIL_MULTILATERAL_DOCTRINE_desc: "Deepen practical defence cooperation with multiple partners while preserving national control over the armed forces."
 MAD_MIL_CLEAN_UNIFORM: "Clean Uniform"
 MAD_MIL_CLEAN_UNIFORM_desc: "Impose higher standards of financial discipline and accountability on the armed forces."
 MAD_MIL_CIVILIAN_GUARDIANSHIP: "Civilian Guardianship"
 MAD_MIL_CIVILIAN_GUARDIANSHIP_desc: "Return day-to-day government to civilians while retaining a constitutional guardianship role for the armed forces."

# -----------------------------------------------------------------------------
# Madagascar Army — integrated branch
# -----------------------------------------------------------------------------
 MAD_ARMY_THE_ARMY_WE_INHERITED: "The Army We Inherited"
 MAD_ARMY_THE_ARMY_WE_INHERITED_desc: "Madagascar's armed forces are spread across a large territory, with units responsible for territorial security, internal deployments and support to the civilian authorities. Much of the equipment is ageing, maintenance is inconsistent and readiness varies considerably between formations. The first task is to understand the force that actually exists, restore the institutions that sustain it and establish a dependable foundation for reform."
 MAD_ARMY_PAY_THE_SOLDIER: "Pay the Soldier"
 MAD_ARMY_PAY_THE_SOLDIER_desc: "Military reform begins with the people serving in the ranks. Reliable pay, accurate personnel records and properly administered allowances are essential to maintaining morale and preventing the everyday neglect that undermines military discipline. Soldiers must be able to rely on the institution they serve before they can be expected to uphold its standards."
 MAD_ARMY_BUILD_TRAINING_CADRE: "Build the Training Cadre"
 MAD_ARMY_BUILD_TRAINING_CADRE_desc: "Training standards vary between units, and experience gained in one formation is not always passed on to the wider Army. A permanent training cadre can establish common instruction, develop experienced non-commissioned officers and spread practical knowledge throughout the force. The aim is to build an Army whose professionalism does not depend solely on the quality of individual commanders."
 MAD_ARMY_STANDARDISE_FIELD_READINESS: "Standardise Field Readiness"
 MAD_ARMY_STANDARDISE_FIELD_READINESS_desc: "Units need consistent procedures for equipment inspections, communications, field exercises and maintenance. Establishing common readiness standards will make it easier for commanders to understand which formations are prepared for deployment and which still require attention. Professional readiness must become an institutional routine rather than an occasional achievement."
 MAD_ARMY_ISLAND_INFANTRY_DOCTRINE: "Write an Island Infantry Doctrine"
 MAD_ARMY_ISLAND_INFANTRY_DOCTRINE_desc: "Madagascar's geography demands an infantry doctrine suited to a large island with difficult interior terrain, long distances, dispersed settlements and limited transport infrastructure. The Army must be able to operate in forested highlands, remote rural districts and coastal regions without relying on assumptions drawn from continental warfare. Mobility, endurance, local knowledge and coordination with other security services should shape its approach."
 MAD_ARMY_COMMAND_QUESTION: "Settle the Command Question"
 MAD_ARMY_COMMAND_QUESTION_desc: "The Army's future command structure is inseparable from the question of military professionalism. CAPSAT's administrative and technical networks have demonstrated that influence within the armed forces does not always follow the formal hierarchy. The government must decide whether to accommodate this informal system or strengthen the authority of the General Staff."
 MAD_ARMY_CAPSAT_LOCAL_INITIATIVE: "Give CAPSAT a Greater Command Role"
 MAD_ARMY_CAPSAT_LOCAL_INITIATIVE_desc: "CAPSAT's administrative and technical position gives its leadership contacts throughout the armed forces. Giving it a greater role in command decisions would bring those established networks closer to operational authority and could help mobilise personnel quickly in a crisis. It would also place an organisation outside the regular operational hierarchy at the centre of military decision-making."
 MAD_ARMY_CAPSAT_INTERNAL_NETWORKS: "Consolidate the CAPSAT Network"
 MAD_ARMY_CAPSAT_INTERNAL_NETWORKS_desc: "CAPSAT's administrative and technical position gives it contacts throughout the armed forces, while its barracks provide a focal point for its personnel and supporters. Consolidating those relationships into an informal command network could allow it to mobilise quickly, but would further blur the distinction between support services and operational authority."
 MAD_ARMY_CAPSAT_BARRACKS_POLITICS: "Make the Barracks a Political Power"
 MAD_ARMY_CAPSAT_BARRACKS_POLITICS_desc: "CAPSAT's influence can no longer be confined to the administration of military personnel and technical services. Its supporters argue that the organisation should have a greater voice in national affairs, with the barracks becoming a centre of political as well as military influence. This would consolidate its position within the state, but further weaken the separation between the armed forces and civilian politics."
 MAD_ARMY_GENERAL_STAFF_PRIMACY: "Reassert General Staff Authority"
 MAD_ARMY_GENERAL_STAFF_PRIMACY_desc: "The General Staff must once again become the centre of military command. The approach associated with Edmond Rasolomahandry places appointments, operational planning and orders within a recognised institutional hierarchy rather than informal networks. Reasserting its authority would help restore a unified Army in which military responsibilities are defined by office and rank."
 MAD_ARMY_CENTRALISED_PROCUREMENT: "Centralise Procurement"
 MAD_ARMY_CENTRALISED_PROCUREMENT_desc: "Fragmented purchasing and inconsistent equipment standards make it difficult to maintain a coherent force. Centralising procurement under the General Staff would allow the Army to establish common requirements, coordinate replacement programmes and plan for spare parts and maintenance. A professional procurement system should also make foreign military partnerships serve defined national requirements rather than individual relationships."
 MAD_ARMY_DOCTRINE_ABOVE_FACTION: "Doctrine Above Faction"
 MAD_ARMY_DOCTRINE_ABOVE_FACTION_desc: "The Army's doctrine must belong to the institution rather than to any commander or political faction. Establishing common professional standards would give the General Staff a lasting framework for training, procurement and operational planning. The objective is an Army capable of surviving changes in political leadership without its command structure being repeatedly reorganised around competing personalities."
 MAD_ARMY_REFIT_RIFLE_COMPANIES: "Refit Rifle Companies"
 MAD_ARMY_REFIT_RIFLE_COMPANIES_desc: "Infantry companies remain the foundation of the Army, but their effectiveness depends on reliable weapons, supporting equipment and consistent maintenance. Existing units should be brought back to a common operational standard before the government commits to more ambitious equipment programmes. A dependable infantry force is built through the condition of its ordinary companies, not simply through the acquisition of prestigious systems."
 MAD_ARMY_SERVICE_RIFLE_ACQUISITION: "Choose a Service Rifle Supplier"
 MAD_ARMY_SERVICE_RIFLE_ACQUISITION_desc: "Madagascar needs a reliable service-rifle supply that can be supported over the long term. Foreign suppliers must be judged not only by the weapons they can deliver, but also by their ability to provide ammunition, spare parts, armourer training and a dependable replacement pipeline. The aim is to reduce the logistical burden created by a mixed and ageing weapons inventory."
 MAD_ARMY_INFANTRY_WEAPONS_RESEARCH: "Research Infantry Weapons"
 MAD_ARMY_INFANTRY_WEAPONS_RESEARCH_desc: "Establish a lasting technical foundation for the infantry weapons on which the Army depends. Understanding the design, manufacture, maintenance and performance of small arms will help Malagasy institutions assess foreign equipment and develop their own technical expertise. This work should build practical knowledge that can eventually support domestic repair and production."
 MAD_ARMY_FIELD_ENGINEERING_STANDARDS: "Set Field Engineering Standards"
 MAD_ARMY_FIELD_ENGINEERING_STANDARDS_desc: "Madagascar's engineers are essential to keeping the Army mobile across difficult terrain and an uneven transport network. Common standards for route clearance, bridge repair, field fortifications and supporting infrastructure would make it easier for formations to operate away from established bases. Engineering must be treated as a permanent part of operational planning rather than an emergency response."
 MAD_ARMY_EYES_ALONG_THE_COAST: "Eyes Along the Coast"
 MAD_ARMY_EYES_ALONG_THE_COAST_desc: "Madagascar's main eastern port approaches carry important commercial and maritime traffic, but maintaining a reliable picture of activity along the coast is difficult. Fixed observation and radar installations would help identify vessels approaching important ports and improve coordination between naval and land-based security units. Maritime awareness must extend beyond the immediate reach of patrol vessels."
 MAD_ARMY_MOTORISE_THE_INFANTRY: "Motorise the Infantry"
 MAD_ARMY_MOTORISE_THE_INFANTRY_desc: "Long distances between garrisons and isolated settlements make it difficult to move soldiers and supplies quickly. A common utility-vehicle fleet would improve the Army's ability to move patrols, engineers and logistical support between regions. The priority is dependable transport that can be maintained locally and used across the country's varied road conditions."
 MAD_ARMY_SIGNALS_INTELLIGENCE_SCHOOL: "Open the Signals Intelligence School"
 MAD_ARMY_SIGNALS_INTELLIGENCE_SCHOOL_desc: "Modern operations require personnel able to collect and analyse communications intelligence while protecting the Army's own communications. A dedicated school would train specialists in radio monitoring, traffic analysis, secure communications and the handling of sensitive information. These skills should strengthen cooperation between operational commanders and the wider intelligence establishment."
 MAD_ARMY_PROTECTED_MOBILITY_TENDER: "Open the Protected Mobility Tender"
 MAD_ARMY_PROTECTED_MOBILITY_TENDER_desc: "Units operating far from established bases need vehicles able to protect their occupants while retaining the mobility required by Madagascar's road network. Foreign suppliers can offer different approaches to protection, reliability and maintenance. The Army must assess these packages against the needs of its formations and its ability to support the vehicles long after delivery."
 MAD_ARMY_REBUILD_THE_HELICOPTER_ARM: "Rebuild the Air Force Helicopter Fleet"
 MAD_ARMY_REBUILD_THE_HELICOPTER_ARM_desc: "Madagascar's helicopters provide an important link between isolated communities, military units and the country's main support facilities. Their value extends beyond security operations to medical evacuation, disaster response and the movement of personnel where roads are poor or impassable. Rebuilding the Air Force's rotary-wing capability requires dependable aircraft, trained crews and a maintenance system capable of keeping them operational."
 MAD_ARMY_LIFT_AND_SUSTAIN: "Build Lift and Sustainment"
 MAD_ARMY_LIFT_AND_SUSTAIN_desc: "Aircraft are useful only when the organisation supporting them can keep personnel and supplies moving. Airlift planning must account for fuel, maintenance, cargo handling, forward landing facilities and medical support. Better coordination between the Army and Air Force would make it possible to sustain deployments across distant regions without relying entirely on overland transport."
 MAD_ARMY_INDIAN_OCEAN_EXERCISE: "Choose an Indian Ocean Training Partnership"
 MAD_ARMY_INDIAN_OCEAN_EXERCISE_desc: "Madagascar's security cannot be considered in isolation from its maritime neighbourhood. Cooperation with France and regional partners can expose Malagasy personnel to different approaches to joint operations, communications and logistical planning. The country must decide whether its future doctrine should be shaped primarily by established foreign partnerships, a wider regional framework or the experience of its own armed forces."
 MAD_ARMY_ORGANISE_AIR_PACKAGE: "Organise the Air Package"
 MAD_ARMY_ORGANISE_AIR_PACKAGE_desc: "The Air Force must decide which capabilities should form the core of its future development. Helicopters provide access to remote communities and difficult terrain, while transport aircraft offer greater range and the ability to move larger quantities of personnel and equipment. A coherent force requires a deliberate balance between these roles, supported by training, maintenance and a sustainable operating structure."
 MAD_ARMY_LAND_FORCES_MODERNISATION_PLAN: "Adopt the Land Forces Modernisation Plan"
 MAD_ARMY_LAND_FORCES_MODERNISATION_PLAN_desc: "The Army has spent years addressing the weaknesses inherited by its personnel system, command structure and basic equipment. Those reforms now provide the foundation for a much wider transformation. Madagascar must look beyond the maintenance of scattered garrisons and internal-security deployments, building a modern land force capable of protecting the country's territory, supporting its wider defence strategy and operating as part of a coordinated national military system."
 MAD_ARMY_EXPAND_DEFENCE_BUDGET: "Expand Defence Spending"
 MAD_ARMY_EXPAND_DEFENCE_BUDGET_desc: "A modern military cannot be built through occasional purchases and short-lived programmes. Madagascar must establish a sustained defence investment policy that supports equipment acquisition, training, maintenance and the infrastructure required to keep a larger force operational. The objective is to make military modernisation a permanent national undertaking rather than a succession of isolated projects."
 MAD_ARMY_DEFENCE_INDUSTRIAL_PLANNING: "Defence Industrial Planning"
 MAD_ARMY_DEFENCE_INDUSTRIAL_PLANNING_desc: "Madagascar's defence programme must be supported by an industrial strategy capable of retaining skills and technical knowledge within the country. Domestic production, repair and assembly should be developed in fields where the island can establish a durable advantage, while foreign partnerships provide access to technologies that cannot initially be produced locally. The long-term objective is a defence industry able to support the armed forces without depending entirely on overseas suppliers."
 MAD_ARMY_IVATO_AEROSPACE_WORKS: "Build Ivato Aerospace Works"
 MAD_ARMY_IVATO_AEROSPACE_WORKS_desc: "Ivato is to become the centre of a national aerospace industry. Aircraft maintenance, structural repair, avionics integration and technical training will be brought together in a modern industrial complex, providing the foundation for more advanced work in the future. Partnerships with established aerospace firms can help Madagascar develop the expertise required to support an increasingly capable Air Force and a domestic aviation sector."
 MAD_ARMY_TOAMASINA_DEFENCE_LOGISTICS_HUB: "Build the Toamasina Defence Logistics Hub"
 MAD_ARMY_TOAMASINA_DEFENCE_LOGISTICS_HUB_desc: "Toamasina's position as Madagascar's principal commercial port makes it central to the country's future military logistics. Developing the surrounding infrastructure into a defence logistics hub will connect overseas procurement, domestic industry and the armed forces through a more capable supply network. It will also provide a stronger eastern base from which equipment, personnel and supplies can be distributed across the island."
 MAD_ARMY_PROTECTED_VEHICLE_ASSEMBLY: "Create a Protected Vehicle Support Industry"
 MAD_ARMY_PROTECTED_VEHICLE_ASSEMBLY_desc: "Madagascar's modernisation programme requires more than imported vehicles. Foreign partnerships can bring in protected vehicles while supporting Malagasy maintenance training, technical services and industrial investment. Developing local workshops and a dependable supply of components will allow the Army to keep its fleet in service and create a foundation for more advanced production in the future."
 MAD_ARMY_TACTICAL_UAV_PROGRAMME: "Launch a Tactical UAV Programme"
 MAD_ARMY_TACTICAL_UAV_PROGRAMME_desc: "Establish a national programme for unmanned reconnaissance aircraft, bringing together airframe development, sensor integration, communications and ground-control systems. Tactical UAVs will give Malagasy commanders a more persistent picture of activity across remote territory and maritime approaches, while the development programme creates opportunities for domestic electronics and aerospace firms. The ambition is to move beyond imported equipment towards a Malagasy capability for designing and supporting unmanned systems."
 MAD_ARMY_MECHANISED_INFANTRY_BRIGADE: "Form a Protected-Mobility Brigade"
 MAD_ARMY_MECHANISED_INFANTRY_BRIGADE_desc: "Madagascar's new land force requires formations able to move quickly, operate with greater protection and sustain themselves away from established bases. Concentrating modern vehicles, infantry, engineers and logistical support into a dedicated brigade will create a more flexible force for territorial defence and rapid response. This formation will become the foundation for a wider mechanised capability as the country's equipment and industrial base expand."
 MAD_ARMY_MOBILE_ARTILLERY_REGIMENT: "Expand the Field Artillery Regiment"
 MAD_ARMY_MOBILE_ARTILLERY_REGIMENT_desc: "The Army's artillery must be capable of supporting formations operating across widely separated regions. Re-equipping and expanding the Field Artillery Regiment will provide a more dependable source of indirect fire support, backed by improved maintenance, ammunition supply and training. Foreign procurement can establish the foundation for a larger artillery arm, while Malagasy planners develop the doctrine needed to integrate it with mobile infantry and reconnaissance units."
 MAD_ARMY_ISLAND_AIR_DEFENCE: "Expand National Air Defence"
 MAD_ARMY_ISLAND_AIR_DEFENCE_desc: "Madagascar's growing military infrastructure and strategic facilities require a more comprehensive system of air defence. Existing anti-aircraft formations must be developed into a wider network protecting major bases, industrial centres, ports and logistical facilities. The island's security will increasingly depend on the ability to detect and respond to threats before they reach the country's most important installations."
 MAD_ARMY_HEAVY_LIFT_AVIATION_COMMAND: "Establish an Air Mobility Command"
 MAD_ARMY_HEAVY_LIFT_AVIATION_COMMAND_desc: "A stronger Malagasy military requires a dedicated organisation for coordinating air transport across the island and the wider Indian Ocean. An Air Mobility Command will bring together aircraft operations, logistics, forward support and specialist aircrew, allowing the armed forces to move personnel and equipment over long distances. It will provide the organisational foundation for a much larger transport aviation service."
 MAD_ARMY_MEDIUM_TRANSPORT_FLEET: "Acquire a Medium Transport Fleet"
 MAD_ARMY_MEDIUM_TRANSPORT_FLEET_desc: "Expand Madagascar's transport aviation into a fleet capable of supporting national deployments, disaster relief and operations across the Indian Ocean. A common family of medium transport aircraft will simplify maintenance and training while giving the Air Force greater capacity to move personnel, equipment and essential supplies. These aircraft will become a central part of the country's ability to respond rapidly to events across its territory."
 MAD_ARMY_AEROSPACE_SUPPLY_CHAIN: "Build the Aerospace Supply Chain"
 MAD_ARMY_AEROSPACE_SUPPLY_CHAIN_desc: "Ivato's aerospace programme must be supported by a network of Malagasy suppliers, engineering firms and technical institutions. Developing domestic capabilities in components, avionics, materials and aircraft maintenance will allow more of the value of aerospace work to remain within the country. The ambition is to build an industrial ecosystem capable of supporting advanced aviation programmes rather than relying on a single maintenance facility."
 MAD_ARMY_DEFENCE_ELECTRONICS_INDUSTRY: "Build a Defence Electronics Industry"
 MAD_ARMY_DEFENCE_ELECTRONICS_INDUSTRY_desc: "Modern military equipment depends on secure communications, reliable sensors and increasingly sophisticated electronic systems. Madagascar will develop a domestic defence-electronics sector capable of producing and maintaining radios, surveillance equipment, control systems and components for unmanned platforms. Foreign technology partnerships will help establish the initial industrial base, while Malagasy engineers build the expertise needed to support future systems."
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU: "Establish a Defence Advanced Research Directorate"
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU_desc: "Madagascar's growing military ambitions require a permanent institution capable of coordinating complex research and development programmes. The Directorate will bring together military planners, engineers, universities and industrial partners to oversee advanced communications, protected vehicles, weapons systems and other strategic technologies. Its purpose is to turn separate procurement and research projects into a coherent national programme of military innovation."
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU_LAND: "Special Projects Bureau: Land Systems"
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU_NETWORK: "Special Projects Bureau: Network Systems"
 MAD_ARMY_SPECIAL_PROJECTS_BUREAU_GUNS: "Special Projects Bureau: Weapons Development"
 MAD_ARMY_INTEGRATED_FIRE_SUPPORT: "Integrate Fire Support"
 MAD_ARMY_INTEGRATED_FIRE_SUPPORT_desc: "A modern land force must coordinate artillery, reconnaissance, communications and mobile formations rather than treat them as separate capabilities. Integrated fire support will connect battlefield information with the units responsible for delivering and directing supporting fire. This will allow Madagascar to develop a more responsive combined-arms force, capable of coordinating its resources across a much wider operational area."
 MAD_ARMY_MAIN_BATTLE_TANK_PROGRAMME: "Choose a Main Battle Tank"
 MAD_ARMY_MAIN_BATTLE_TANK_PROGRAMME_desc: "Madagascar's armour must evolve beyond a small collection of legacy light vehicles into a coherent modern capability. Selecting a main battle tank family will establish the foundation for a heavier armoured force, supported by specialised crews, maintenance facilities, technical training and a dependable foreign supply relationship. The programme represents a significant change in the Army's role and the level of military power the country intends to maintain."
 MAD_ARMY_COASTAL_DEFENCE: "Harden Coastal Defence"
 MAD_ARMY_COASTAL_DEFENCE_desc: "Madagascar's security depends on controlling access to its ports, industrial centres and strategically important coastline. A coordinated coastal-defence system will combine fortified positions, air defence, maritime surveillance and cooperation with the Navy. The island must be capable of protecting its principal approaches and ensuring that its growing military and industrial infrastructure cannot be isolated by threats from the sea."
 MAD_ARMY_NATIONAL_SUSTAINMENT_NETWORK: "Build a National Sustainment Network"
 MAD_ARMY_NATIONAL_SUSTAINMENT_NETWORK_desc: "The expansion of the armed forces must be matched by an equally capable national sustainment system. Connecting industrial facilities, major ports, supply depots and military formations will allow equipment to be maintained and forces supported across the island. This network will make Madagascar's larger military establishment less dependent on individual facilities and more capable of sustaining operations over extended periods."
 MAD_ARMY_LONG_RANGE_ISR_AND_FIRES: "Develop Long-Range Surveillance and Targeting"
 MAD_ARMY_LONG_RANGE_ISR_AND_FIRES_desc: "Madagascar's defence strategy must extend beyond the immediate battlefield. A national surveillance and targeting network will combine information from aerial platforms, coastal sensors and secure communications to provide commanders with a wider picture of activity across the island and its surrounding waters. This will form the information backbone of a modern force, connecting reconnaissance, command and the units responsible for responding to emerging threats."
 MAD_ARMY_INDIAN_OCEAN_DEFENCE_ARCHITECTURE: "Choose an Indian Ocean Defence Architecture"
 MAD_ARMY_INDIAN_OCEAN_DEFENCE_ARCHITECTURE_desc: "Madagascar's military transformation is intended to give the country a greater role in the security of the Indian Ocean. A mature defence establishment must decide how it will work with established powers, build regional security relationships and protect its own strategic independence. Whether through deeper French cooperation, a wider Indian Ocean partnership or a more self-reliant national posture, Madagascar will establish its place as a significant regional military actor."

 MAD_military_command.1.t: "The Command Question"
 MAD_military_command.1.d: "The armed forces cannot continue with an unresolved command structure. Colonel Noël Rakotonandrasana and CAPSAT represent a network of subordinate commanders who demand greater initiative, while General Edmond Rasolomahandry represents the senior-officer chain of command and the military's institutional hierarchy."
 MAD_military_command.1.a: "Back Rakotonandrasana and CAPSAT"
 MAD_military_command.1.b: "Restore General Rasolomahandry"
 MAD_military_command.5.t: "CAPSAT Refuses to Stand Down"
 MAD_military_command.5.d: "The civilian government rejected CAPSAT's claim to a political role, but the institutional settlement was never fully implemented. CAPSAT units are now moving against the government."
 MAD_military_command.5.a: "Crush the Mutiny"
 MAD_military_command.5.b: "Give CAPSAT a Place in the Settlement"
 MAD_military_command.5.c: "Transfer the Government to the FPA"
 MAD_military_procurement.1.t: "The Service Rifle Contract"
 MAD_military_procurement.1.d: "The infantry needs a more consistent supply of service rifles. Two foreign suppliers are prepared to provide a modest package."
 MAD_military_procurement.1.a: "Buy the R4 rifles"
 MAD_military_procurement.1.b: "Buy the FN FNC rifles"
 MAD_military_procurement.3.t: "Exercise the Indian Ocean"
 MAD_military_procurement.3.d: "The Army can turn regional exercises into a deliberate doctrine choice. France offers deep interoperability, the Indian Ocean Commission offers a balanced multinational framework, and a Malagasy-only exercise can build a doctrine designed around the island's own conditions."
 MAD_military_procurement.3.a: "French-led interoperability"
 MAD_military_procurement.3.b: "IOC multinational doctrine"
 MAD_military_procurement.3.c: "Strictly Malagasy field doctrine"
 MAD_military_procurement.5.t: "The Protected Mobility Tender"
 MAD_military_procurement.5.d: "The Army can afford a modest protected-mobility programme. The tender compares the UAE-held M3 Panhard, South African Ratel-20 and Turkish ACV-15 AAPC."
 MAD_military_procurement.5.a: "Buy the M3 Panhard"
 MAD_military_procurement.5.b: "Buy the Ratel-20"
 MAD_military_procurement.4.t: "Organise the Air Package"
 MAD_military_procurement.4.d: "The groundwork for an air-mobile force is in place. The next step is deciding whether to put the money into helicopters, airlift, or a balanced fleet."
 MAD_military_procurement.4.a: "Expand the helicopter arm"
 MAD_military_procurement.4.b: "Purchase the French Airbus C-295 fleet"
 MAD_military_procurement.4.c: "Build a balanced air package"
 MAD_military_industry.1.t: "A Protected Vehicle Industry"
 MAD_military_industry.1.d: "A larger defence budget makes local protected-vehicle assembly practical. Foreign partners are prepared to provide designs and production expertise."
 MAD_military_industry.1.a: "Assemble the Ratel-20"
 MAD_military_industry.1.b: "Assemble the ACV-15 AAPC"
 MAD_military_industry.2.t: "The Mobile Artillery Regiment"
 MAD_military_industry.2.d: "The Army can now sustain a serious mobile-fire-support programme. France, Turkey and India offer different combinations of price, industry and doctrine."
 MAD_military_industry.2.a: "Purchase the TRF1"
 MAD_military_industry.2.b: "Purchase the M114"
 MAD_military_industry.2.c: "Purchase the IFG"
 MAD_military_industry.4.t: "An Indian Ocean Defence Architecture"
 MAD_military_industry.4.d: "Madagascar now has enough institutional depth to decide what kind of regional military it intends to become. The final choice is between French interoperability, a wider Indian Ocean network, and strategic autonomy."
 MAD_military_industry.4.a: "French interoperability"
 MAD_military_industry.4.b: "Indian Ocean regional architecture"
 MAD_military_industry.4.c: "Strategic autonomy"

