 MAD_DROUGHT_OVER_tt: "The drought is over (severity has reached §Y0§!)"
 MAD_corruption_4_tt: "Corruption is at level §Y4§! or below"
 MAD_drought_trucks_tt: "For §Y6§! months a rising drought in this state climbs at only 30% of its pace, then §R+4§! there"
 MAD_drought_prevention_tt: "A permanent §Gpreventative measure§!: it takes a slice off the drought’s monthly pressure"
 MAD_drought_early_warning_tt: "The historical droughts to come hit much less hard"
 MAD_drought_locust_watch_tt: "A locust plague hits much less hard"
 MAD_drought_unlock_root_tt: "Unlocks the state-targeted §Ywater§! and §Yfood-aid§! relief measures in the Drought and Famine panel"
 MAD_drought_unlock_seed_tt: "Unlocks the decision: §YDistribute Drought-Tolerant Seed§!"
 MAD_drought_unlock_warning_tt: "Unlocks the decision: §YBuild an Early-Warning System§!"
 MAD_drought_unlock_boreholes_tt: "Unlocks the decision: §YDrill Boreholes in the Grand Sud§!"
 MAD_drought_unlock_sudest_tt: "Unlocks the decision: §YWater and Roads for the South-East§!"
 MAD_drought_unlock_climate_tt: "Unlocks the decision: §YClimate Adaptation Programme§!"
 MAD_drought_unlock_grain_tt: "Unlocks the decision: §YEstablish a Grain Reserve§!"
 MAD_drought_unlock_locust_tt: "Unlocks the decision: §YLocust Monitoring Network§!"
 MAD_drought_unlock_cash_tt: "Unlocks the decision: §YMvola Cash Transfers to the South§!"
 MAD_drought_won_tt: "The drought recedes by an extra §G2.5§! severity every month and its pressure stops climbing. Unlocks §YThe Final Push§!"
 MAD_drought_lost_tt: "The drought cannot be beaten any more. Its decisions carry on until the number reaches §Y0§!"
 MAD_daewoo_drought_kept_tt: "Drought: §R+4§! severity; §R+0.20§! monthly pressure."
 MAD_daewoo_drought_well_tt: "Drought: §R+4§! severity; §R+0.15§! monthly pressure."
 # --- events ---
 mad_drought.10.t: "The Rains Fail"
 mad_drought.10.d: "The rainy season has come and gone with barely a shower in the south. Wells are dropping and the first herds are being sold for whatever they will fetch.\n\nThe better the roads, the sooner the trucks can get through."
 mad_drought.10.a: "Prepare the response"
 mad_drought.11.t: "Food Prices Spike"
 mad_drought.11.d: "The price of rice and cassava has jumped in the markets of Toliara and Fianarantsoa. Families are skipping meals and the bakeries are turning people away."
 mad_drought.11.a: "A hungry season"
 mad_drought.12.t: "The Locusts Return"
 mad_drought.12.d: "Swarms of locusts are moving over the west and south, stripping the fields as they go. FAO teams say a third of the country’s farmland could be affected."
 mad_drought.12.a: "Fight the swarms"
 # --- drought / famine event effect tooltips ---
 mad_drought.10_tt: "Drought worsens from the failed rains: §R+6§! base southern shock before infrastructure and state-exposure scaling. Hunger: §Gno direct change§!."
 mad_drought.11_tt: "Drought severity: §R+3§! countrywide before state-exposure scaling. Hunger: §Gno direct change§!."
 mad_drought.12_tt: "Locust swarm: drought and hunger worsen in all four modeled states. Base swarm severity is §R9§!; CNA measures reduce it, and drought impact is further scaled by each state’s exposure. Hunger uses the reduced swarm value directly."
 mad_drought.13_tt: "Toliara drought: §R+8§! drought and §R+10§! hunger with Early Warning; otherwise §R+13§! drought and §R+13§! hunger."
 mad_drought.14_tt: "Toliara drought: §R+10§! drought and §R+16§! hunger with Early Warning; otherwise §R+18§! drought and §R+22§! hunger."
 mad_drought.15_tt: "Toliara: §R+16§! drought and §R+14§! hunger."
 mad_drought.16_tt: "Toliara: §R+15§! drought and §R+15§! hunger."
 mad_drought.17_tt: "Toliara: §R+10§! drought and §R+11§! hunger."
 mad_drought.18_tt: "Toliara: §R+17§! drought and §R+15§! hunger."
 mad_drought.19_tt: "Toliara: §R+18§! drought and §R+18§! hunger."
 mad_drought.30_tt: "One eligible state: §R+9§! drought and §R+5§! hunger."
 mad_drought.31_tt: "One coastal state: §R+7§! drought and §R+10§! hunger. Infrastructure also takes §R1§! damage and national stability falls §R1%§!."
 mad_drought.32_tt: "One state already above §Y54.99§! drought: §R+18§! hunger. Drought itself does not change."
 mad_drought.33_tt: "One state with working wells: §R+8§! drought. Its drought exposure also increases by §R0.15§!; hunger does not change directly."

 mad_drought.13.t: "An El Nino Drought"
 mad_drought.13.d: "A powerful El Nino has brought the worst dry season in the south for decades. Crops have failed in three regions and the first families are on the move."
 mad_drought.13.a: "A national emergency"
 mad_drought.14.t: "The Kere"
 mad_drought.14.d: "After successive failed harvests the Grand Sud is in famine. In Androy and Anosy the word is kere, hunger, and people are eating cactus fruit and clay.\n\nThe world is watching."
 mad_drought.14.a: "Whatever it takes"
 mad_drought.20.t: "The Drought Is Over"
 mad_drought.20.d: "The rains have returned and the boreholes and granaries are holding. For the first time in years the south is no longer waiting on the sky.\n\nThe drought has ended."
 mad_drought.20.a: "At last"
 mad_drought.21.t: "The South Empties"
 mad_drought.21.d: "A year of hunger has emptied villages across the Grand Sud. The people have gone to the cities, to the coast and abroad, and there is no coming back to what they left.\n\nThe fight against the drought cannot be won any more, only endured."
 mad_drought.21.a: "The south has been lost"
 mad_drought.22.t: "The Drought Is Contained"
 mad_drought.22.d: "The boreholes, the seed and the granaries are holding. For the first time the trend in the south is downwards.\n\nThe drought has been contained."
 mad_drought.22.a: "The worst is over"

