l_english:

 ##########Focuses - MAD##########

 ########## GPM - Fuel sector rework ##########
 MAD_FUEL_LIBERALIZATION: "Complete Downstream Liberalisation"
 MAD_GPM: "Organise the Downstream Fuel Sector"
 MAD_GPM_desc: "Madagascar's downstream petroleum sector depends on reliable imports, storage, transport and distribution. Bringing its major operators into a common forum can improve coordination and reduce supply disruptions, but the influence of established firms also makes fair access and competition important concerns."
 MAD_GPM_CARTEL_FORMS: "Establish the GPM"
 MAD_GPM_CARTEL_FORMS_desc: "Establish the Groupement Pétrolier de Madagascar (GPM) as a professional association for the downstream petroleum industry. A common forum can coordinate import schedules, storage and distribution, while giving established operators a stronger collective voice in discussions with the state."
 MAD_FUEL_LIBERALIZATION_desc: "Open the downstream petroleum market and allow private distributors to compete freely."
 MAD_GPM_TERMINAL_2009: "Expand Toamasina's Fuel Import Terminal"
 MAD_GPM_TERMINAL_2009_desc: "Expand the petroleum-handling capacity serving Toamasina, Madagascar's principal import gateway. Better infrastructure around the port can ease supply bottlenecks and strengthen the link between imported fuel and domestic distribution."
 MAD_RUBIS_BUYS_GALANA: "Accept the Rubis-Galana Deal"
 MAD_RUBIS_BUYS_GALANA_desc: "§YHistorical route§!: allow private fuel distribution to consolidate under the Rubis-Galana ownership structure."
 MAD_GPM_CARTEL_CONTINUES: "Keep Private Fuel Distribution"
 MAD_GPM_CARTEL_CONTINUES_desc: "Keep fuel distribution in private hands following the Rubis-Galana acquisition. Private investment can improve productivity and expand storage, but the market remains concentrated among a small number of major operators, limiting competitive pressure and strengthening incumbent influence."
 MAD_BREAK_GPM_CARTEL: "Reassert State Control of Fuel Supply"
 MAD_BREAK_GPM_CARTEL_desc: "§YAlternative route§!: place strategic fuel logistics under stronger state direction."
 MAD_STATE_FUEL_IMPORTS: "Expand State Fuel Procurement"
 MAD_STATE_FUEL_IMPORTS_desc: "Expand state procurement and fuel-storage capacity so the government has greater control over availability during supply disruptions. The programme strengthens the public role in strategic fuel supply, but requires the treasury to fund infrastructure and maintain a dependable distribution system."
 MAD_GPM_NATIONAL_FUEL_RESERVE: "Build a National Fuel Reserve"
 MAD_GPM_NATIONAL_FUEL_RESERVE_desc: "Build a strategic fuel buffer to cushion Madagascar against interruptions to imports and sudden changes in world prices. Additional storage increases the country's capacity to maintain supply during a disruption, but requires capital and the infrastructure needed to store fuel safely."
 MAD_GPM_OWNERSHIP_PATH_tt: "Requires one completed fuel-distribution path."
 MAD_GPM_FUEL_RESERVE_BUILT_tt: "Requires at least §Y3§! fuel-silo levels and a §Ysupply hub§! in Toamasina. The focus adds §G2§! random fuel silos."
 MAD_GPM_BUY_WHILE_CHEAP: "Secure Fuel Imports at Low Prices"
 MAD_GPM_BUY_WHILE_CHEAP_desc: "Take advantage of favourable world oil prices to improve fuel-supply terms and strengthen the country's capacity to meet future demand. The benefits depend on acting while prices are low and on having adequate storage and distribution capacity to use the supplies effectively."
 MAD_GPM_OIL_CHEAP_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires below §Y3.5§!."
 MAD_GPM_PREPARE_OIL_SHOCK: "Prepare the Economy for an Oil Shock"
 MAD_GPM_PREPARE_OIL_SHOCK_desc: "Prepare for a sustained rise in international oil prices by reducing dependence on non-electric fuels and improving the country's capacity to manage supply. These measures create more room for the economy to absorb a shock, but cannot shield Madagascar indefinitely from higher import costs."
 MAD_GPM_OIL_ELEVATED_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires above §Y4§!."
 MAD_GPM_OIL_SHOCK_RESPONSE: "Introduce Emergency Fuel Rationing"
 MAD_GPM_OIL_SHOCK_RESPONSE_desc: "Respond to acute fuel-price pressure with emergency measures to reduce non-electric fuel consumption and improve access to available supplies. The response helps preserve economic activity, but restrictions and higher costs place additional pressure on consumers and industry."
 MAD_GPM_OIL_SHOCK_tt: "World oil price: §Y[?global.oil_price|2]§!. Requires above §Y5§!."
 MAD_GPM_REFERENCE_PRICE_2019: "Adopt a Fuel Reference-Price Framework"
 MAD_GPM_REFERENCE_PRICE_2019_desc: "Adopt a clear reference-price framework for fuel pricing, giving the government, distributors and consumers a more transparent benchmark for changes in import costs. Its credibility depends on publishing the basis for adjustments and revising the benchmark when underlying costs change."
 MAD_GPM_AUTOMATIC_PRICING_2025: "Introduce Automatic Fuel-Price Adjustments"
 MAD_GPM_AUTOMATIC_PRICING_2025_desc: "Introduce regular fuel-price adjustments so that domestic prices can respond more predictably to changes in supply costs. A credible mechanism can reduce the pressure created by prolonged price controls, but higher international costs may still reach consumers and require careful management."

 cna_pressure_reduction_tt: "Permanently reduces monthly pressure"

 MAD_natural_resource_extraction: "Natural Resource Extraction"
 MAD_natural_resource_extraction_desc: "Madagascar's mineral, forestry and energy reserves have attracted sustained interest from local communities, state planners and overseas firms. The central challenge is to turn extraction into durable development without leaving damaged landscapes, weak infrastructure and little value for nearby communities."
 MAD_COMPANIES: "Madagascan Companies"
 MAD_COMPANIES_desc: "From transport and energy to communications and mining, Madagascar's large employers shape daily life far beyond their balance sheets. Their investment decisions influence jobs, public services and regional access, while weak infrastructure and uncertain regulation limit what domestic firms can deliver."
 MAD_counter_the_dahalo: "Counter The Dahalo"
 MAD_counter_the_dahalo_desc: "Cattle raiding by armed Dahalo groups has long exposed the limits of policing across the southern countryside. Communities face the loss of their herds and livelihoods, while security operations struggle with rough terrain, informal networks and the difficulty of distinguishing raiders from residents."
 MAD_lost_decade: "Lost Decade"
 MAD_lost_decade_desc: "Repeated political disruption, fragile institutions and uneven investment have left Madagascar struggling to turn its natural wealth into broad prosperity. Poor roads, unreliable electricity and limited access to credit continue to weigh on household incomes and on the productivity of local businesses."
 MAD_AMBATOVY_JV_FORMED: "Forming Ambatovy mining corp"
 MAD_AMBATOVY_JV_FORMED_desc: "The Ambatovy nickel-and-cobalt project is one of Madagascar's largest industrial ventures, linking a mine near Moramanga with processing facilities and an export route to the coast. Its complex international ownership reflects the capital, technology and long-term commitments required to develop the deposit."
 MAD_NATURE_PRESERVATION: "Nature Preservation"
 MAD_NATURE_PRESERVATION_desc: "Madagascar's unusual concentration of endemic species makes its forests, wetlands and coastal habitats globally important. Conservation has to compete with charcoal production, slash-and-burn agriculture, illegal logging and extractive projects, while local communities still need land and income to sustain themselves."
 MAD_iem_roadmap: "Iem Roadmap"
 MAD_iem_roadmap_desc: "The Initiative for the Emergence of Madagascar set out a broad agenda for modernising infrastructure, improving human capital and making public institutions more capable. Its ambition is to connect rural producers and growing towns to reliable power, transport, education and commercial opportunities."
 MAD_QMM_CONSTRUCTION: "Build QMM's Mineral-Sands Operation"
 MAD_QMM_CONSTRUCTION_desc: "Develop QIT Madagascar Minerals' mineral-sands operation near Taolagnaro in the Anosy region. The operation extracts ilmenite and associated heavy minerals for export through Ehoala Port; new facilities bring industrial activity and export capacity but require safeguards for local water, lagoons and livelihoods."
 MAD_Toliara_rare_earths: "Begin the Ranobe Mineral-Sands Project"
 MAD_Toliara_rare_earths_desc: "Begin development of the distinct Ranobe mineral-sands project about 45 km north of Toliara. Its heavy-mineral sands contain ilmenite and zircon, with monazite carrying rare-earth elements; later work can improve the survey and develop dedicated monazite recovery."
 MAD_Bemolanga_oil_sands_project: "Advance the Bemolanga Oil-Sands Project"
 MAD_Bemolanga_oil_sands_project_desc: "Begin staged assessment of the large bitumen-bearing oil-sands deposit in western Madagascar. Commercial extraction is technically demanding and expensive, requiring a viable separation process and realistic transport and market plans."
 MAD_QMM_MONAZITE_PROCESSING: "Expand QMM Monazite Recovery"
 MAD_QMM_MONAZITE_PROCESSING_desc: "Add a dedicated recovery step for monazite associated with QMM's mineral-sands operation near Taolagnaro. Monazite contains rare-earth elements and is separate from the main ilmenite product, so processing requires its own recovery and handling chain."
 MAD_TOLIARA_RANOBE_SURVEY: "Survey the Ranobe Mineral-Sands Deposit"
 MAD_TOLIARA_RANOBE_SURVEY_desc: "Conduct further geological and feasibility surveys at Ranobe, approximately 45 km north of Toliara. Map the recoverable heavy-mineral sands and estimate ilmenite, zircon and monazite content before committing to additional extraction or processing capacity."
 MAD_TOLIARA_MONAZITE_PROCESSING: "Develop Monazite Recovery at Ranobe"
 MAD_TOLIARA_MONAZITE_PROCESSING_desc: "Evaluate and install a process to separate rare-earth-bearing monazite from the Ranobe mineral-sands stream. This is a downstream processing stage, distinct from surveying the deposit and extracting the main ilmenite and zircon products."
 MAD_BEMOLANGA_BITUMEN_APPRAISAL: "Appraise Bemolanga Bitumen Recovery"
 MAD_BEMOLANGA_BITUMEN_APPRAISAL_desc: "Assess Bemolanga's geology, recoverable bitumen, extraction methods, energy requirements and capital costs. The appraisal should establish whether a pilot can demonstrate a technically and commercially viable way to recover bitumen from the oil sands."
 MAD_BEMOLANGA_PILOT_EXTRACTION: "Pilot Bemolanga Bitumen Extraction"
 MAD_BEMOLANGA_PILOT_EXTRACTION_desc: "Run a limited demonstration of the recovery method to measure yield, energy demand, environmental impact and operating costs. A pilot informs later investment but does not by itself establish that a commercial-scale oil-sands operation is viable."
 MAD_BEMOLANGA_CONVENTIONAL_EXPLORATION: "Explore for Conventional Hydrocarbons Beyond Bemolanga"
 MAD_BEMOLANGA_CONVENTIONAL_EXPLORATION_desc: "Extend geological exploration beyond Bemolanga's oil-sands deposit to look for conventional petroleum accumulations. This is a separate exploration target from the bitumen-bearing sands, not a later stage in processing them."
 MAD_BEMOLANGA_HEAVY_OIL_PILOT: "Scale Up Tsimiroro Heavy-Oil Trials"
 MAD_BEMOLANGA_HEAVY_OIL_PILOT_desc: "Expand trial production at Tsimiroro, Madagascar's heavy-oil field, to test recovery at a larger scale and evaluate yield, costs and transport needs. Tsimiroro's heavy oil is distinct from Bemolanga's oil sands and bitumen."
 MAD_BEMOLANGA_ROADS: "Build Access Roads to Tsimiroro"
 MAD_BEMOLANGA_ROADS_desc: "Improve road access to the Tsimiroro heavy-oil field in western Madagascar so equipment and oil can reach the wider transport network. Better access supports project logistics, but road construction alone does not establish commercial viability."

 MAD_Telma: "TelMa"
 MAD_Telma_desc: "Telma grew from a national telecommunications operator into a central provider of mobile, fixed-line and internet services. Its network connects businesses, public agencies and households, but coverage gaps and the high cost of connectivity remain a barrier to a fully digital economy."
 MAD_Madarail: "Madarail"
 MAD_Madarail_desc: "Madagascar's railway network links the capital and eastern port with agricultural districts and isolated communities. Track deterioration, limited rolling stock and uncertain concession arrangements have repeatedly constrained freight and passenger services, even though rail remains important where roads are poor or seasonally impassable."
 MAD_AIR: "Madagascan Airlines"
 MAD_AIR_desc: "Air Madagascar carries passengers across an island where long distances and difficult roads make air links important for commerce and public services. The national carrier has faced debt, ageing aircraft and operational disruption, leaving its future tied to reliable management and a sustainable route network."
 MAD_aremas_republic: "AREMA's Republic"
 MAD_aremas_republic_desc: "A state-centred vision of the republic places national sovereignty, social provision and public ownership at the heart of development. Its legacy remains visible in debates over how much the government should direct investment, protect strategic enterprises and distribute the benefits of economic growth."
 MAD_2009_Transitional: "2009 Transitional"
 MAD_2009_Transitional_desc: "A prolonged political standoff culminated in a transfer of power outside the established constitutional succession. The transition left international recognition contested and deepened uncertainty over foreign assistance, investment and democratic legitimacy, with consequences for public administration and the wider economy."
 MAD_formalize_dina_courts: "Formalize Dina Courts"
 MAD_formalize_dina_courts_desc: "Dina are locally rooted agreements used by communities to set rules and resolve disputes. Formal recognition can strengthen customary mediation and local accountability, but it also raises questions about due process, consistency with national law and safeguards against coercion or unequal treatment."
 MAD_NATURELLE: "Naturelle"
 MAD_NATURELLE_desc: "Build a development strategy around Madagascar's natural resources, environmental assets and long-term productivity. Naturelle lays the groundwork for higher welfare, steadier growth and a more sustainable economy while modestly strengthening political stability."
 MAD_PROTECTED_AREAS_EXPANSION: "Protected Areas Expansion"
 MAD_PROTECTED_AREAS_EXPANSION_desc: "Madagascar's endemic wildlife and forests have made conservation a global concern. Protected landscapes remain under pressure from land clearing, charcoal production, illegal timber extraction and mineral development, while park authorities must balance ecological protection with the needs of communities living nearby."
 MAD_Drought_and_famine: "Drought And Famine"
 MAD_Drought_and_famine_desc: "Drought and food insecurity in the Grand Sud demand a coordinated national response. Water access, emergency food relief, crop resilience and local monitoring are brought into a shared administrative framework, rather than being treated as isolated emergencies."
 MAD_ilmenite_mine: "Ilmenite Mine"
 MAD_ilmenite_mine_desc: "The mineral-sands project near Taolagnaro extracts ilmenite used in the manufacture of titanium dioxide. The mine has brought export infrastructure and local employment, but its proximity to sensitive coastal ecosystems has made water quality, biodiversity and the distribution of economic benefits lasting public concerns."
 MAD_Agricultural_reforms: "Agricultural Reforms"
 MAD_Agricultural_reforms_desc: "Smallholder farmers produce much of Madagascar's food, especially rice, yet face fragmented holdings, limited irrigation, poor market access and vulnerability to cyclones and drought. Reform debates centre on land security, agricultural extension, storage and ways to raise yields without deepening rural inequality."
 MAD_AMBATOVY_OPERATIONAL: "Getting Ambatovy Operational"
 MAD_AMBATOVY_OPERATIONAL_desc: "Bringing Ambatovy into sustained production requires coordinated mining, refining, pipelines, power and port logistics. The project's output depends on a long industrial chain reaching from the eastern highlands to export markets, with performance exposed to maintenance problems, global metal prices and transport disruptions."
 MAD_EHOALA_PORT: "Ehoala Port"
 MAD_EHOALA_PORT_desc: "The deep-water port at Ehoala was developed alongside the mineral-sands operation near Taolagnaro. It created a new export gateway on the southeastern coast and expanded commercial access to the region, while linking local development more closely to the performance of a major extractive project."
 MAD_Tsimiroro_heavy_oil_field: "Tsimiroro Heavy Oil Field"
 MAD_Tsimiroro_heavy_oil_field_desc: "The Tsimiroro deposit in western Madagascar contains heavy oil that is difficult to extract, transport and refine. Its commercial prospects depend on specialist technology, infrastructure and market conditions, making appraisal essential before a remote resource can become a dependable source of domestic energy or export income."
 MAD_TELMA_SOLD_TO_CONSORTIUM: "TelMa Sold To Consortium"
 MAD_TELMA_SOLD_TO_CONSORTIUM_desc: "The transfer of the telecommunications operator to private investors brought new capital and management into a sector with limited network coverage. The transaction also raised questions about market power, access to essential communications and the balance between commercial returns and public-service obligations."
 MAD_RNCFM_PRIVATIZE: "Concede RNCFM Operations to a Private Operator"
 MAD_RNCFM_PRIVATIZE_desc: "Place the operation of Madagascar's national railway under a private concession, with the aim of improving management, maintenance and freight reliability. A concession can bring operational expertise and encourage investment, but performance depends on the agreement's terms and the operator's ability to maintain the network."
 MAD_LUFTHANSA: "Lufthansa debt restructuring"
 MAD_LUFTHANSA_desc: "Madagascar's national airline has relied on outside expertise to address maintenance, fleet management and financial pressures. Cooperation with an experienced international aviation company offers a route to more dependable operations, but the airline's long-term position still depends on debt discipline and a serviceable fleet."
 MAD_the_2001_election: "The 2001 Election"
 MAD_the_2001_election_desc: "A disputed presidential vote produced competing claims to national authority and a prolonged confrontation over the result. Political uncertainty disrupted transport, trade and public finances, illustrating how contested electoral outcomes can weaken institutions and delay the normal work of government."
 MAD_2009_Sanctions: "2009 Sanctions"
 MAD_ZEBU_CERTIFICATES: "Zebu Certificates"
 MAD_ZEBU_CERTIFICATES_desc: "Zebu cattle are a central store of wealth and a source of livelihood across much of rural Madagascar. Reliable ownership records can help distinguish legitimate herds from stolen animals, support civil claims and make it harder to move raided cattle through markets as though they were lawfully acquired."
 MAD_Japanese_bypass: "Build the RN7–RN2 Bypass with Japanese Support"
 MAD_Japanese_bypass_desc: "Develop the Japanese-supported RN7–RN2 bypass around Antananarivo to ease congestion and improve movement between major transport corridors. Better road connections can reduce delays and strengthen logistics, although the benefits depend on completing and maintaining the necessary road and bridge works."
 MAD_Rocade_ring_road: "Rocade Ring Road"
 MAD_Rocade_ring_road_desc: "Construct the Rocade ring road around Antananarivo to move traffic away from the city centre and improve urban logistics. Better roads reduce bottlenecks, support infrastructure efficiency and make the capital easier to connect with the wider economy."
 MAD_Promote_drought_tolerant_crops: "Promote Drought Tolerant Crops"
 MAD_Promote_drought_tolerant_crops_desc: "Farmers in the south have long relied on crops able to survive irregular rainfall and poor soils. Drought-tolerant varieties, diversified planting and locally suitable seed systems can reduce the risk of complete harvest failure, but depend on trusted extension workers and access to seed before a crisis peaks."
 MAD_RICE_PRICE_STABILISATION: "Rice Price Stabilisation"
 MAD_RICE_PRICE_STABILISATION_desc: "Use price controls and targeted concessions to cushion households from rice-price shocks. The intervention offers immediate relief but distorts incentives, imposes a modest welfare cost on the wider economy, and reduces tax receipts from agricultural districts."
 MAD_FISCAL_DISCIPLINE: "Fiscal Discipline"
 MAD_FISCAL_DISCIPLINE_desc: "Reinforce public financial controls and take a tougher monetary stance against inflation. Raising the central bank policy rate can restrain price pressures, although tighter money also raises the cost of borrowing."
 MAD_FISCAL_DISCIPLINE_POLICY_RATE_TT: "Increase the central bank policy rate by §Y5 percentage points§!, up to a maximum of §Y30%§!."
 MAD_school_feeding_problems: "School Feeding Problems"
 MAD_school_feeding_problems_desc: "When harvests fail and household food stocks run low, children's nutrition and attendance at school can deteriorate together. School meals can protect learning and nutrition during a crisis, though programmes depend on dependable procurement, local supply chains and food that reaches the most exposed communities."
 MAD_Toliara_Deep_Sea_port: "Toliara Deep Sea Port"
 MAD_Toliara_Deep_Sea_port_desc: "Plans for a deep-water export terminal on the southwest coast are closely tied to proposed mineral-sands development. The project promises a new route for bulk cargo, while raising local questions about fishing grounds, land use, water resources and the safeguards needed around fragile coastal habitats."
 MAD_the_court_rules: "The Court Rules"
 MAD_the_court_rules_desc: "A court ruling over a major industrial dispute tests the reach of environmental law and the state's willingness to hold investors to account. For nearby communities, the outcome is about more than legal procedure: it shapes trust in regulators, access to redress and the terms on which development proceeds."
 MAD_ratsiraka_digs_in: "Ratsiraka Digs In"
 MAD_ratsiraka_digs_in_desc: "A contest over political authority hardened into a national standoff, with rival claims to legitimacy and competing centres of administration. The crisis strained public services and transport links and left businesses unsure which institutions could guarantee continuity, enforce contracts or settle disputes."
 MAD_ICTSI_CONCESSION: "ICTSI Concession"
 MAD_ICTSI_CONCESSION_desc: "Toamasina is Madagascar's principal maritime gateway, handling a large share of the country's international trade. A concession to an international container-terminal operator brought new management into port operations, with the challenge of improving cargo handling while maintaining access for domestic exporters and importers."
 MAD_vanilla_export_sector: "Develop the Vanilla Export Sector"
 MAD_vanilla_export_sector_desc: "Strengthen the commercial side of Madagascar's vanilla trade. Better market access and productive capacity can raise export earnings and encourage investment, while the sector's long-term success still depends on reliable quality, fair participation by growers and transparent trade rules."
 MAD_DAEWOO_DEAL: "Daewoo Agricultural Concession"
 MAD_DAEWOO_DEAL_desc: "Consider Daewoo Logistics' proposal for large-scale maize and palm-oil production under a long-term land lease. The promised investment, employment and transport links compete with concerns about customary land rights, public consultation and whether export crops would displace domestic food production."
 MAD_POVERTY_PAPER: "Adopt the National Poverty-Reduction Plan"
 MAD_POVERTY_PAPER_desc: "Adopt a national poverty-reduction framework to guide public spending on infrastructure, essential services and livelihoods. A national plan can coordinate priorities across ministries, but its value depends on financing and delivering projects rather than publishing targets alone."
 MAD_AMBATOVY_COVID_SUSPENSION: "Ambatovy Covid Suspension"
 MAD_AMBATOVY_COVID_SUSPENSION_desc: "Pandemic travel restrictions and disruptions to supply chains forced Ambatovy to suspend operations, exposing the vulnerability of a complex mine and refinery to global shocks. The interruption affected exports and workers while underscoring how heavily national revenue can depend on a handful of large industrial projects."
 MAD_ECOTOURISM_INVESTMENT: "Ecotourism Investment"
 MAD_ECOTOURISM_INVESTMENT_desc: "Madagascar's lemurs, rainforests, reefs and distinctive landscapes attract visitors from around the world. Carefully managed ecotourism can support local employment and conservation, but benefits depend on reliable transport, trained guides, functioning services and safeguards that prevent tourism pressure from damaging the places visitors come to see."
 MAD_QMM_LAGOON_POLLUTION_SCANDAL: "Qmm Lagoon Pollution Scandal"
 MAD_QMM_LAGOON_POLLUTION_SCANDAL_desc: "Reports of water-quality changes and fish deaths near the QMM mining area in the southeast raised public concern about the effects of mineral-sands extraction on lagoons and local livelihoods. The dispute sharpened calls for transparent monitoring, credible scientific evidence and timely remedies when communities report environmental harm."
 MAD_TELECOM_LAW_2005: "Telecom Law 2005"
 MAD_TELECOM_LAW_2005_desc: "Opening the telecommunications market requires clear licensing rules, fair interconnection and a regulator able to enforce service standards. The reform debate reflects the tension between attracting investment into expensive networks and preventing the dominant operator from controlling access to essential communications infrastructure."
 MAD_MADARAIL_OWNERSHIP_CHURN: "Madarail Ownership Churn"
 MAD_MADARAIL_OWNERSHIP_CHURN_desc: "The railway concession has passed through changes in ownership and management as investors weigh the cost of rehabilitation against uncertain traffic. Each transition renews hopes for better freight service, but long-term recovery depends on maintenance, predictable financing and confidence among farmers, shippers and port operators."
 MAD_PAGOSE: "Reform JIRAMA Governance and Operations (PAGOSE)"
 MAD_PAGOSE_desc: "Use PAGOSE's governance and operational reforms to improve JIRAMA's financial management, service reliability and day-to-day operations. The programme aims to make the utility more sustainable while improving the quality and coordination of electricity service."
 MAD_EGOSIP_LOAN: "Finance JIRAMA Grid Repairs"
 MAD_EGOSIP_LOAN_desc: "Borrow to finance urgent JIRAMA grid repairs and energy-sector investment. The loan brings funds forward and reduces the immediate financing constraint, but future debt service trims the returns from investment."
 MAD_Mandroseza_PLANT: "Rehabilitate Mandroseza"
 MAD_Mandroseza_PLANT_desc: "Modernise the Mandroseza plant serving the capital. The focus prepares the work; the real rehabilitation is a treasury-funded construction decision that takes time to complete."
 MAD_Sahofika_DAM: "Sahofika Financials"
 MAD_Sahofika_DAM_desc: "Lock in the financing structure for the Sahofika hydro project. The state's contribution unlocks a long construction period in exchange for a major renewable generation increase."
 MAD_DECIM: "Launch DECIM's Solar and Smart-Grid Programme"
 MAD_DECIM_desc: "Launch the 2023-2028 DECIM programme to hybridise isolated thermal grids with solar generation, batteries and smarter network management. The programme also supports metering and distribution extensions, helping reduce dependence on costly thermal generation and improve local service."
 MAD_LEAD_PROJECT: "Expand Low-Cost Electricity Access (LEAD)"
 MAD_LEAD_PROJECT_desc: "Expand electricity access for households, businesses and essential facilities such as health centres. LEAD supports connections and last-mile infrastructure, turning the access target into usable service rather than merely adding capacity to the main grid."
 MAD_LEAD_EXPANSION: "Connect the Last Mile"
 MAD_LEAD_EXPANSION_desc: "Extend the economic gains from new connections into local businesses and households. Better welfare and local tax collection follow once access exists."
 MAD_Volobe_Amont_DAM: "Close the Volobe Deal"
 MAD_Volobe_Amont_DAM_desc: "Complete the financial close for Volobe Amont and establish the project as a bankable public-private generation project. Construction remains a separate long-term decision."
 MAD_EDF_JOINS_VOLOBE: "Bring EDF Into Volobe"
 MAD_EDF_JOINS_VOLOBE_desc: "Deepen French participation in Volobe Amont. EDF's involvement improves project financing conditions and adds another source of technical and investment capacity."
 MAD_ADDED_SOLAR: "Hybrid Solar for Isolated Grids"
 MAD_ADDED_SOLAR_desc: "Add solar generation to isolated JIRAMA systems. DECIM support lowers the cost of the transition, while the full solar package requires its own construction decision."
 MAD_DECIM_SMART_GRID: "Turn DECIM Smart"
 MAD_DECIM_SMART_GRID_desc: "Modernise the grid itself with better control, metering and distribution technology. The focus improves the utility immediately and unlocks the paid rollout."
 MAD_RURAL_SMART_METER_CONNECTION: "Smart Meters in the Countryside"
 MAD_RURAL_SMART_METER_CONNECTION_desc: "Bring modern metering into rural areas so new connections become measurable, billable and easier to maintain."
 MAD_offshore_wind: "Pilot Offshore Wind"
 MAD_offshore_wind_desc: "Explore a late-game offshore wind pilot once Madagascar has a smarter grid. It is expensive and experimental, but offers another route to renewable generation."

 MAD_AR1_HIGHWAY: "Build the Antananarivo–Toamasina AR1 Highway"
 MAD_AR1_HIGHWAY_desc: "Advance the AR1 highway corridor linking Antananarivo and Toamasina, Madagascar's principal port city. A more efficient road connection could improve access to imports and export routes, reduce transport bottlenecks and support activity along the corridor. Delivering those benefits requires substantial construction investment and continued maintenance."
 MAD_set_prices: "Stabilise Vanilla Prices"
 MAD_set_prices_desc: "Use state-backed price setting to give vanilla growers more predictable returns and reduce exposure to abrupt market swings. The approach offers greater stability and strengthens growers' position, but can reduce the efficiency and export income of a more market-led trade."
 MAD_self_regulate_vanilla: "Allow Market-Led Vanilla Pricing"
 MAD_self_regulate_vanilla_desc: "Let producers and traders respond more directly to market prices, favouring flexibility, productivity and commercial returns. A market-led approach can attract investment and reward successful production, but leaves growers and the wider economy more exposed to sharp price fluctuations."
 MAD_DEAL_KEPT: "Daewoo Concession Retained"
 MAD_DEAL_KEPT_desc: "The government has chosen to retain the proposed Daewoo agricultural concession. Large-scale maize and palm-oil production could bring investment, employment and export infrastructure, but the result depends on enforceable land safeguards, transparent terms, participation by Malagasy smallholders and protection of domestic food supplies."
 MAD_DEAL_BROKEN: "Daewoo Concession Cancelled"
 MAD_DEAL_BROKEN_desc: "The government has cancelled the proposed Daewoo agricultural concession after objections to its land arrangements and lack of public consultation. Cancellation prevents the project from proceeding on its proposed terms, but does not by itself resolve rural land insecurity or food shortages. Support for Malagasy farmers and transparent rules for future investment remain necessary."
 MAD_ACCEPT_FOREIGN_OWNERSHIP: "Accept Foreign Ownership"
 MAD_ACCEPT_FOREIGN_OWNERSHIP_desc: "Open Madagascar further to foreign ownership and outside capital. Easier investment and faster project financing can bring new money into the economy, but greater foreign participation also gives international investors more influence over Madagascar's economic direction."
 MAD_TOURISM_INCOME_BOOST: "Tourism Income Boost"
 MAD_TOURISM_INCOME_BOOST_desc: "Tourism brings foreign currency to Madagascar and supports hotels, guides, transport operators and small businesses. Its economic value depends on protecting the natural assets that attract visitors and spreading income beyond a few established destinations, especially in regions where alternative sources of formal employment are scarce."
 MAD_TELMA_AXIAN_CONSOLIDATES: "TelMa Axian Consolidates"
 MAD_TELMA_AXIAN_CONSOLIDATES_desc: "AXIAN's expansion into telecommunications and digital services strengthened the links between mobile networks, finance and business infrastructure. The growing ecosystem can widen access to data and electronic transactions, but its influence also puts renewed attention on competition, consumer protection and the reach of services outside major towns."
 MAD_TELMA_KEEP_FOREIGN_OWNED: "TelMa Keep Foreign Owned"
 MAD_TELMA_KEEP_FOREIGN_OWNED_desc: "Private ownership has brought outside capital and commercial expertise into Madagascar's telecommunications sector. The continuing challenge is to extend modern data services beyond profitable urban centres while ensuring that control of essential communications infrastructure does not undermine competition or make access unaffordable for households and small firms."
 MAD_MADARAIL_STATE_TAKEOVER: "Madarail State Takeover"
 MAD_MADARAIL_STATE_TAKEOVER_desc: "As investment falters and concession negotiations break down, the government faces pressure to take direct responsibility for a vital but fragile railway. A public takeover can restore clear accountability, yet it also puts the cost of track, rolling stock and day-to-day operations squarely on the state."
 MAD_GERMAN_AIR_INVESTMENT: "German Air Investment"
 MAD_Austral_offer: "Austral Offer"
 MAD_AIRLINE_MILITARY_LINKS: "Airline Military Links"
 MAD_army_traverse_mountains: "Army Traverse Mountains"
 MAD_army_traverse_mountains_desc: "Security patrols moving through Madagascar's mountainous interior face steep slopes, limited roads and communities spread across difficult terrain. The geography favours mobile groups familiar with local routes, making intelligence, transport and sustained cooperation with residents as important as the number of troops deployed."
 MAD_BANDIT_ARMY: "Bandit Army"
 MAD_BANDIT_ARMY_desc: "Persistent cattle theft and armed raiding have created informal networks capable of resisting ordinary policing. When security operations rely on poorly targeted force, they can deepen local grievances and make communities less willing to share information, leaving the state with a broader challenge of restoring trust as well as order."
 MAD_Grand_sud_est_program: "Grand Sud Est Program"
 MAD_Grand_sud_est_program_desc: "The Grand Sud and southeastern districts face overlapping pressures from drought, weak rural roads and limited access to services. Long-term recovery depends on linking water infrastructure, transport, food security and community resilience, so assistance can reach settlements before a local shock becomes a wider humanitarian emergency."
 MAD_MADARAIL_NETWORK_EXPANSION: "Madarail Network Expansion"
 MAD_MADARAIL_NETWORK_EXPANSION_desc: "Freight corridors connecting the highlands with Toamasina are important for exports and imported supplies. Extending and rehabilitating the railway could open markets for inland producers, but each new section requires reliable maintenance and a realistic plan for traffic across Madagascar's difficult geography."
 MAD_extend_ar1: "Extend the AR1 Corridor"
 MAD_extend_ar1_desc: "Continue development of the Antananarivo–Toamasina transport corridor to improve economic links beyond the initial highway section. Better corridor connections can support productivity and logistics, although the focus's economic effects should not be mistaken for proof that an entire additional section of highway has been physically completed."
 MAD_MIAMI_WATERFRONT: "Deliver the Miami Toamasina Waterfront Project"
 MAD_MIAMI_WATERFRONT_desc: "Continue the Miami waterfront redevelopment in Toamasina, improving public access to the coast and creating space for recreation, sports, gardens and commercial activity. The project can improve public spaces and tourism appeal while strengthening the city's urban waterfront."
 MAD_CNV_CVM: "Strengthen the Comité Vanille de Madagascar"
 MAD_CNV_CVM_desc: "Strengthen public oversight of Madagascar's vanilla value chain. The Comité Vanille de Madagascar (CVM) can supervise different stages of the trade, validate the list of exporters eligible for licensing and address grievances. Coordination with the Conseil National de la Vanille (CNV), including producer and collector registration, can improve accountability when rules are applied consistently and fairly."
 MAD_liberalise_market: "Open the Vanilla Market to Private Investment"
 MAD_liberalise_market_desc: "Reduce barriers to private participation and make it easier for firms to invest across Madagascar's vanilla trade. More competition and capital can raise productivity and returns, but a more market-led approach gives the state less direct control over how benefits and risks are distributed."
 MAD_DEAL_KEPT_MANAGED_WELL: "Deal Kept Managed Well"
 MAD_DEAL_KEPT_MANAGED_WELL_desc: "Keeping the agricultural concession would require strict oversight of land use, labour conditions and the movement of crops into domestic markets. A managed arrangement attempts to capture investment and infrastructure benefits while responding to the concerns that made the original deal a symbol of opaque, top-down development."
 MAD_KOREAN_PURCHASES: "Korean Purchases"
 MAD_KOREAN_PURCHASES_desc: "Deepen economic ties with South Korea through new investment in Madagascar. Korean capital strengthens industrial and agricultural development, while the expanding relationship brings additional Korean influence and ties Madagascar more closely to Asian investors."
 MAD_USA_PURCHASES: "Usa Purchases"
 MAD_USA_PURCHASES_desc: "Encourage American investment into Madagascar's commercial economy, particularly services, technology and modern business. New American capital can improve productivity and access to expertise while building a stronger economic relationship between the two countries."
 MAD_GERMANY_PURCHASES: "Germany Purchases"
 MAD_GERMANY_PURCHASES_desc: "Expand the German economic presence in Madagascar through new investment and commercial cooperation. German capital supports industrial development and makes future investment easier, while the closer relationship increases Germany's influence over Madagascar's economy."
 MAD_KOREAN_PURCHASES_OFFER_tt: "Requires South Korean opinion of Madagascar to be at least §Y80§!. Acceptance costs the Korean treasury §R$7.50 Billion§! and creates §G$10.00 Billion§! of Korean international investment in Madagascar. Acceptance unlocks the Korean economic package in Madagascar."
 MAD_USA_PURCHASES_OFFER_tt: "Requires American opinion of Madagascar to be at least §Y80§!. Acceptance costs the American treasury §R$7.50 Billion§! and creates §G$10.00 Billion§! of American international investment in Madagascar. Acceptance unlocks the American economic package in Madagascar."
 MAD_GERMANY_PURCHASES_OFFER_tt: "Requires German opinion of Madagascar to be at least §Y80§!. Acceptance costs the German treasury §R$7.50 Billion§! and creates §G$10.00 Billion§! of German international investment in Madagascar. Acceptance unlocks the German economic package in Madagascar."
 MAD_BREAK_FIBER_MONOPOLY: "Break Fiber Monopoly"
 MAD_BREAK_FIBER_MONOPOLY_desc: "A dominant broadband operator can delay new connections and keep prices high where alternative networks are scarce. Competition reforms seek to open infrastructure to other providers, giving businesses and households more options while forcing regulators to resolve disputes over access, investment and network quality."
 MAD_RAIL_FCE_REHAB: "Rail Fce Rehab"
 MAD_RAIL_FCE_REHAB_desc: "The Fianarantsoa–Côte Est railway is a lifeline for communities in the southeastern highlands, where road access is limited and frequently disrupted. Maintaining the line is labour-intensive, but its trains connect rural settlements with markets and essential supplies that would otherwise be difficult to move."
 MAD_GERMAN_PLANES: "German Planes"
 MAD_Austral_deal_falls_through: "Austral Deal Falls Through"
 MAD_AIR_EXPANSION: "Madagascan Airlines Expansion"
 MAD_capture_spiritual_advisor: "Capture Spiritual Advisor"
 MAD_capture_spiritual_advisor_desc: "The search for the elusive cattle-raiding leader Remenabila turns towards a respected spiritual intermediary with ties across the southern countryside. Officials hope that local knowledge may reveal the networks around the fugitive, while the approach tests whether negotiation and community trust can succeed where patrols have struggled."
 MAD_MARCH_OF_THE_COWBOYS: "March Of The Cowboys"
 MAD_MARCH_OF_THE_COWBOYS_desc: "Armed cattle-raiding groups move across open grazing country using mobility, local knowledge and social ties to evade conventional patrols. Security forces face a difficult choice between sustained operations and the risk of disrupting legitimate pastoral life, especially where stolen cattle are woven into wider local economies."
 MAD_Fighting_climate_change: "Fighting Climate Change"
 MAD_Fighting_climate_change_desc: "Cyclones, erratic rainfall, erosion and drought expose Madagascar's communities to increasingly costly environmental shocks. Climate adaptation has to connect early warning with resilient farming, forest and soil protection, reliable water supplies and infrastructure able to withstand the next disaster."
 MAD_export_ideas: "Export Ideas"
 MAD_export_ideas_desc: "Digital connectivity creates opportunities to sell professional services beyond Madagascar, from software and remote business support to creative work. Turning that potential into lasting exports requires dependable internet, practical training, secure payment systems and links between skilled workers and overseas customers."
 MAD_VANILLA_PRICE_STABILITY: "Vanilla Price Stability"
 MAD_VANILLA_PRICE_STABILITY_desc: "Keep the vanilla trade predictable and protect the economy from violent swings in export prices."
 MAD_VANILLA_BOOM_BUST_CYCLE: "Vanilla Boom Bust Cycle"
 MAD_VANILLA_BOOM_BUST_CYCLE_desc: "Embrace volatile vanilla prices for stronger growth and returns when the market is booming."
 MAD_Winning_the_fight: "Winning The Fight"
 MAD_Winning_the_fight_desc: "A sustained response to drought begins to reach the communities most exposed to failed harvests. Better preparedness and more resilient local livelihoods can reduce the scale of a food emergency, though the region remains vulnerable whenever rainfall, water access and household purchasing power deteriorate together."
 MAD_losing_the_fight: "Losing The Fight"
 MAD_losing_the_fight_desc: "Repeated harvest shocks and a weak relief response leave households with fewer ways to survive in the drought-stricken south. As food insecurity persists, families move towards towns or across borders in search of work and assistance, placing new pressure on host communities and public services."
 MAD_DIGITAL_MADAGASCAR: "Digital Madagascar"
 MAD_DIGITAL_MADAGASCAR_desc: "Digital services are becoming central to banking, public administration and everyday commerce, but reliable access remains uneven across Madagascar. Expanding the digital economy depends on stronger networks, affordable connections, local technical skills and systems that allow rural businesses and citizens to participate safely."
 MAD_extension_fce: "Extension Fce"
 MAD_extension_fce_desc: "The Fianarantsoa–Côte Est railway links the highlands to the eastern coast through difficult terrain. Its narrow-gauge track serves settlements that lack dependable road access, and plans to extend the corridor reflect the long-standing effort to connect isolated producers with regional markets and port facilities."
 MAD_GERMAN_FLEET_MODERNIZED: "German military planes"
 MADAGASCAR_AIRLINES: "Madagascar Airlines"
 MAD_AIR_REGIONAL_HUB: "Madagascan Airlines Regional Hub"
 MAD_Dead_with_a_swagger: "Dead With A Swagger"
 MAD_Dead_with_a_swagger_desc: "Reports of Remenabila's death ripple through the southern cattle country, unsettling the networks that rallied around his reputation. The moment offers the state a rare opportunity to re-establish authority, though lasting security will depend on what replaces the informal power structures surrounding the raiding economy."
 MAD_cowthief_in_chief: "Cowthief In Chief"
 MAD_cowthief_in_chief_desc: "Instead of pursuing a decisive military victory, officials seek accommodation with powerful cattle-raiding networks. Bringing influential figures into formal public life may reduce immediate violence, but risks legitimising illicit wealth and leaving the underlying disputes over cattle, land and state authority unresolved."
 MAD_BIANCO: "Bianco"
 MAD_BIANCO_desc: "Establish BIANCO as a permanent national anti-corruption institution. A stronger investigative body improves public confidence and creates a foundation for cleaner administration, better economic governance and greater accountability across Madagascar's political and commercial institutions."
 MAD_Thriving_south: "Thriving South"
 MAD_Thriving_south_desc: "Communities in the Grand Sud begin to recover as water access, food security and rural livelihoods become more resilient. The region's future still depends on sustained investment and local capacity, but reliable prevention and response can make the difference between a difficult season and a prolonged humanitarian crisis."
 MAD_OLD_RELIABLE: "Old Reliable"
 MAD_BIANCO_INVESTIGATIONS: "Bianco Investigations"
 MAD_BIANCO_INVESTIGATIONS_desc: "Begin a serious campaign of corruption investigations. BIANCO's work strengthens public confidence and state authority, but confronting entrenched interests can create friction with landowners, business groups and other actors who benefit from the existing system."
 MAD_AIR_BRAND_RESTORED: "Madagascan Airlines Brand Restored"
 MAD_BIANCO_INDEPENDENT: "Bianco Independent"
 MAD_BIANCO_INDEPENDENT_desc: "Protect BIANCO's independence from political interference. An autonomous anti-corruption agency can improve investor confidence, strengthen economic governance and increase public trust while reducing the ability of powerful interests to shape investigations."
 MAD_BIANCO_POLITICIZED: "Bianco Politicized"
 MAD_BIANCO_POLITICIZED_desc: "Bring BIANCO under stronger political control and use its investigations selectively. The government gains greater room for political manoeuvre, but corruption rises, public trust weakens and foreign investors gain more leverage over Madagascar's economic affairs."
 MAD_Ivato_terminal_runway_upgrade: "Ivato Terminal Runway Upgrade"
 MAD_ECONOMY: "Madagascan economic decisions"
 TAG_AMBATOVY_BUILD: "Construct Ambatovy mine"
 TAG_AMBATOVY_BUILD_desc: "The nickel-cobalt mine has the potential to be one of the largest projects in the country and the foreign investment lining up to build it only reinforces that."

 ##########Events - MAD_LUFTHANSA_OFFER##########
 MAD_LUFTHANSA_OFFER.1.t: "Madagascan Airlines sale"
 MAD_LUFTHANSA_OFFER.1.d: "Madagascan airlines is looking to sell to its close business partner Lufthansa. The executives there seem to be unsure of the deal, the German government could step in and subsidise the deal, getting influence in the region and potentially a good deal."
 MAD_LUFTHANSA_OFFER.a: "Encourage the deal"
 MAD_LUFTHANSA_OFFER.b: "We are not interested"
 MAD_LUFTHANSA_OFFER.2.t: "German and Lufthansa buy Madagascan Airlines"
 MAD_LUFTHANSA_OFFER.2.d: "Encouraged by the German government, Lufthansa has bought our ailing state carrier"
 MAD_LUFTHANSA_OFFER_ACCEPT.a: "Excellent news"
 MAD_LUFTHANSA_OFFER.3.t: "Airline sale decline"
 MAD_LUFTHANSA_OFFER.3.d: "Lufthansa were not convinced to go through with the sale of our state Airline"
 MAD_LUFTHANSA_OFFER_DECLINE.a: "Difficult times ahead"
 MAD_Fort_Dauphin_Taolagnaro: "Fort Dauphin Taolagnaro"
 MAD_Fort_Dauphin_Taolagnaro_desc: "Taolagnaro sits on a narrow peninsula on Madagascar's southeastern coast, where the mineral-sands industry has brought new transport and commercial activity. The town's prospects are increasingly tied to the mine and port, sharpening debate over land, water, employment and the protection of sensitive coastal habitats."
 MAD_TOAMASINA: "Toamasina Port"
 MAD_TOAMASINA_desc: "Develop Toamasina as Madagascar's main commercial gateway. Expanding the port and surrounding infrastructure improves the flow of imports and exports, strengthens logistics and creates a stronger base for future investment along the capital-to-coast economic corridor."
 MAD_The_Capital: "The Capital"
 MAD_The_Capital_desc: "Continue developing Antananarivo as the political and economic centre of Madagascar. Investment in the capital improves infrastructure and commercial capacity, helping the country's main urban hub support administration, trade and further national development."
 MAD_TOAMASINA_PORT: "Construct the Toamasina Deep-Water Port"
 MAD_TOAMASINA_PORT_desc: "Expand Toamasina into a modern deep-water gateway for Madagascar's trade and investment, with better port capacity and stronger links to the national economy."
 MAD_Ambatovy1: "Ambatovy mine"
 MAD_ANTANANARIVO: "Antananarivo"
 MAD_AMBATOVY_FORMING: "Forming Ambatovy mining corp"
 MAD_INVITE_KOREANS: "Invite Korea Resources"
 MAD_INVITE_JAPANESE: "Invite Sumitomo"
 MAD_INVITE_DYNATEC: "Invite Dynatec"
 MAD_STATE_INVESTMENT: "Invest state money into the project"
 mad_ambatovy.1.t: "The Ambatovy Venture Reaches a Turning Point"
 mad_ambatovy.1.d_dynatec: "Dynatec has signalled that it wants to withdraw from the Ambatovy venture. A new operator is prepared to take over its role, while the state can instead purchase the departing company's stake and assume a larger share of the project."
 mad_ambatovy.1.d_consortium: "The selected partners have assembled a viable ownership structure for Ambatovy. The government must now decide whether to leave operations with a private operator or purchase a larger share of the corporate consortium for the state."
 mad_ambatovy.1.a: "Let Sherritt step in"
 mad_ambatovy.1.b: "Increase the State's Stake"
 MAD_ambatovy_total_plus30_state_tt: "+30% Total control of Ambatovy"
 MAD_ambatovy_corp_minus40_tt: "-40% Corporate control of Ambatovy"
 MAD_ambatovy_state_plus40_tt: "+40% State control of Ambatovy"
 MAD_AMBATOVY_MISSION: "Forming the corporate structure"
 MAD_AMBATOVY_MISSION_desc: "Corporate control: [?MAD_AMBATOVY_CORP|0]\nState control: [?MAD_AMBATOVY_STATE_FUNDS|0]\nTotal control: [?MAD_AMBATOVY_TOTAL|0]    "
 MAD_AMBATOVY_FORMING_desc: "Once control of the Ambatovy mine reaches 100%, options to finish the mine will be available \n Corporate control: [?MAD_AMBATOVY_CORP|0]% \n State control: [?MAD_AMBATOVY_STATE_FUNDS|0]% \nTotal control: [?MAD_AMBATOVY_TOTAL|0]%"
 MAD_BUILD_MINE: "Construct the Ambatovy Mine"
 MAD_SELL_MINE: "Sell state shares in Ambatovy Mine"
 MAD_economy_modifier: "Madagascan Economy"
 MAD_GERMANS_ACCEPTED_LUFTHANSA: "Successful sale of Madagascan Airlines"
 MAD_GERMANS_REJECTED_LUFTHANSA: "Our efforts for our state airline have faltered"
 MAD_AMBATOVY_EXPANSION: "Ambatovy Expansion"
 MAD_AMBATOVY_EXPANSION_desc: "Expansion at Ambatovy would deepen Madagascar's role in the global nickel and cobalt supply chain. Any increase in output depends on processing capacity, dependable power, water management and transport links, while leaving the country exposed to shifts in world demand and scrutiny of the project's environmental footprint."
 MAD_airforce_prod: "Madagascan Airforce Prod"
 MAD_german_assisted_airforce: "German Assisted Airforce"
 MAD_STATE_AIR_MISSION_TOOLTIP: "Starts decision: Help our airline succeed. \n Build the necessary infrastructure for Madagascan Airlines to flourish, or see it fail in state control for years to come"
 MAD_AIR_STATE_CONTROL_MISSION: "Help our airline succeed"
 MAD_AIR_STATE_CONTROL_MISSION_desc: "Ensure the next few years are a success for Madagascan Airlines otherwise we will be forced to look for another private buyer"
 MAD_AIR_STATE_CONTROL_MISSIONS: "Madagascan Airlines"
 MAD_TELMA_RENATIONALIZE: "TelMa Renationalize"
 MAD_TELMA_RENATIONALIZE_desc: "Calls to return the telecommunications operator to public ownership reflect concerns about the control of essential networks and the direction of investment. A renationalisation would place service priorities more directly in government hands, but would also bring the burden of financing upgrades and managing a fast-changing industry."
 MAD_TELMA_HUNT_REMENABILA_SUPPORT: "TelMa Hunt Remenabila Support"
 MAD_TELMA_HUNT_REMENABILA_SUPPORT_desc: "Security planners seek help from telecommunications networks to trace communications around the Remenabila manhunt. Better coordination may narrow the information gap across a wide and poorly connected region, while raising difficult questions about privacy, oversight and how intelligence is shared between public bodies."
 MAD_TELMA_FIBER_MONOPOLY_PERSISTS: "TelMa Fiber Monopoly Persists"
 MAD_TELMA_FIBER_MONOPOLY_PERSISTS_desc: "With few alternatives to the incumbent network, businesses and consumers remain dependent on one provider for much of their fixed-line connectivity. The lack of competitive pressure can delay upgrades and leave rural users behind, turning the structure of the market into a central question for digital development."
 MAD_BREAK_TELMA_MONOPOLY: "Break TelMa Monopoly"
 MAD_BREAK_TELMA_MONOPOLY_desc: "The case for ending the fixed-line monopoly rests on opening network access and allowing providers to compete for customers. New entrants still need fair interconnection terms and a regulator capable of enforcing them, otherwise formal liberalisation can leave the incumbent's practical advantages untouched."
 MAD_PROTECT_NATIONAL_CHAMPION: "Protect National Champion"
 MAD_PROTECT_NATIONAL_CHAMPION_desc: "A nationally important telecommunications firm can be portrayed as a strategic asset whose profits and infrastructure should remain under domestic direction. Protective policies may preserve a strong incumbent, but they also risk entrenching market power and slowing the arrival of new services and competitors."
 MAD_TELMA_SIGINT_SHARING: "TelMa Sigint Sharing"
 MAD_TELMA_SIGINT_SHARING_desc: "Communications infrastructure can supply signals that help authorities track maritime and security activity across a vast island territory. Sharing such intelligence may improve coordination, but reliable safeguards are needed to distinguish legitimate security monitoring from intrusive collection without clear purpose or oversight."
 MAD_TELMA_MARITIME_DOMAIN_NETWORK: "TelMa Maritime Domain Network"
 MAD_TELMA_MARITIME_DOMAIN_NETWORK_desc: "Madagascar's long coastline and position beside busy Indian Ocean routes make maritime awareness a practical challenge. Linking coastal communications, reporting and surveillance can help authorities understand activity at sea, from lawful fishing and commercial traffic to smuggling and other security concerns."
 MAD_TELMA_NATIONAL_C2_BACKBONE: "TelMa National C2 Backbone"
 MAD_TELMA_NATIONAL_C2_BACKBONE_desc: "Emergency response and national security both depend on communications that keep agencies connected when distance and infrastructure failures obstruct coordination. A national command-and-control backbone aims to link field reports with decision-makers, reducing the risk that local events are missed or responses arrive too late."
 MAD_TELMA_LEGACY: "TelMa Legacy"
 MAD_TELMA_LEGACY_desc: "The legacy of the national telecommunications operator is visible in the fixed lines, mobile services and internet links on which businesses and households rely. Its future will be judged not only by ownership, but by whether the network becomes more dependable, accessible and responsive to changing technology."
 MAD_MVOLA_CASH_TRANSFERS: "Mvola Cash Transfers"
 MAD_MVOLA_CASH_TRANSFERS_desc: "Mobile money has allowed Malagasy households to send, receive and store small payments without relying entirely on bank branches. During a drought or other emergency, digital transfers can deliver support more quickly, provided recipients have access to a handset, an agent network and a usable identity record."
