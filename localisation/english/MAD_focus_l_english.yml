 # --- Madagascar movie-release events and timed ideas ---
 mad_movie.1.t: "Madagascar Premieres"
 mad_movie.1.d: "On 27 May 2005, the first Madagascar film reaches cinemas. Suddenly the island's name is on screens around the world, and even a cartoon lemur seems to have become an unofficial tourism ambassador."
 mad_movie.1.a: "I like to move it, move it"

 mad_movie.2.t: "Escape 2 Africa Arrives"
 mad_movie.2.d: "On 7 November 2008, Madagascar: Escape 2 Africa opens in cinemas. The sequel keeps Madagascar in the public eye, reminding audiences around the world of the island's name and its unlikely animated residents."
 mad_movie.2.a: "The sequel is a hit"

 mad_movie.3.t: "Madagascar 3: Europe's Most Wanted"
 mad_movie.3.d: "On 8 June 2012, the animals return in Madagascar 3: Europe's Most Wanted. The island's unlikely cinematic ambassador is still working overtime, this time taking the adventure across Europe."
 mad_movie.3.a: "The show goes on"

 mad_movie.4.t: "Penguins of Madagascar Premieres"
 mad_movie.4.d: "On 26 November 2014, Penguins of Madagascar opens in cinemas. It is the franchise's fourth theatrical feature, though a spin-off rather than a numbered main-series sequel. Somehow the penguins' covert antics have once again put Madagascar in the spotlight, despite the complete absence of lemurs from the operation."
 mad_movie.4.a: "Smile and wave, boys"

