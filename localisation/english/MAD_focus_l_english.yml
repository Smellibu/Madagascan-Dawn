 # ===== Madagascar party-political events =====
 mad_political.1.t: "The Crown Question"
 mad_political.1.d: "The royal movement has reached the point where ceremony is no longer enough. Rabarioelina wants the authority of a personal crown, while the traditional Houses argue that Malagasy custom cannot simply be subordinated to one claimant. The choice will determine whether the restoration becomes a personal monarchy or a council built around the Houses and customary legitimacy."
 mad_political.1.a: "Rabarioelina will claim the crown"
 mad_political.1.b: "Let the Houses establish TAMIMA"

 mad_political.2.t: "The Daewoo Controversy Becomes a Political Crisis"
 mad_political.2.d: "The Daewoo land project has become a symbol of everything opponents accuse the government of getting wrong: foreign control of Malagasy land, elite decision-making and the failure to build public legitimacy around a controversial agreement. The cancellation or collapse of the project now feeds a wider confrontation. We must decide whether to turn it into a sovereignty victory, allow the armed forces to mediate the transition, or defend civilian government and accept the political cost."
 mad_political.2.a: "Turn the cancellation into a sovereignty victory"
 mad_political.2.b: "Allow the army to mediate the transition"
 mad_political.2.c: "Defend civilian government and absorb the backlash"

 mad_political.3.t: "What Role Should the Armed Forces Play?"
 mad_political.3.d: "After 2002 and 2009, the officer corps must decide what its political role should be. Professionalisation means returning to a disciplined military under civilian rule. Guardianship makes the armed forces a constitutional backstop. Final arbitration accepts that the army may decide when civilian politics breaks down."
 mad_political.3.a: "Professionalise the armed forces"
 mad_political.3.b: "Become the republic's guardian"
 mad_political.3.c: "The army must remain the final arbiter"

 mad_political.4.t: "The AREMA Congress"
 mad_political.4.d: "AREMA has returned to national politics. Three currents now compete over what the movement should become: the Ratsiraka tradition, a renewed social programme, or reconciliation between its factions. The programme choice will determine the road ahead."
 mad_political.4.a: "Let the movement choose"

 mad_political.5.t: "The Terms of Reconciliation"
 mad_political.5.d: "TIM has returned to national politics, but rebuilding the republic means deciding what reconciliation actually entails. An inclusive bargain could calm the political system; conditional reconciliation could keep reform moving while limiting concessions; an insistence on accountability could strengthen institutions while reopening old wounds."
 mad_political.5.a: "Build an inclusive reconciliation pact"
 mad_political.5.b: "Reconcile, but on our terms"
 mad_political.5.c: "Accountability must come first"

 mad_political.6.t: "The Tiko Question"
 mad_political.6.d: "TIM's greatest political advantage is also its greatest vulnerability. Ravalomanana's business empire provided resources and administrative confidence, but it also blurred the boundary between public office and private enterprise. The party must decide whether to impose a hard firewall, build a Malagasy national champion, or negotiate a regulated relationship between the state and business."
 mad_political.6.a: "Separate Tiko from the state"
 mad_political.6.b: "Build a Malagasy national champion"
 mad_political.6.c: "Regulate the relationship"

 mad_political.7.t: "What Does 2009 Mean?"
 mad_political.7.d: "The movement that emerged around Rajoelina cannot avoid the question of 2009. Was it a necessary rupture with a failed order, a constitutional lesson that the ballot must replace the street, or an emergency precedent for concentrating power when normal institutions break down?"
 mad_political.7.a: "Preserve the revolutionary legacy"
 mad_political.7.b: "Legitimacy must come from elections"
 mad_political.7.c: "Rule temporarily by emergency mandate"

