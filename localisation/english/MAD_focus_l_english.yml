 mad_foreign_investment.12.d: "The United States has accepted Madagascar's proposal and committed $7.5 billion of its own funds to the agreed investment programme. The agreement marks a substantial expansion of economic ties between the two countries."
 mad_foreign_investment.12.a: "Welcome the investment"
 mad_foreign_investment.13.t: "The United States Declines the Investment Offer"
 mad_foreign_investment.13.d: "The United States has declined Madagascar's proposed investment package. The expected capital will not arrive, and the refusal risks straining bilateral economic relations."
