 MAD_FAHALEMANA: "Fahalemana"
 MAD_FAHALEMANA_desc: "In 2015, expand the rural-security campaign into a coordinated national effort. Its reach can suppress armed cattle raiding, but its long-term result depends on gendarmerie coordination, intelligence and the cooperation of local communities."
 MAD_ESTABLISH_USAD: "Establish the USAD"
 MAD_ESTABLISH_USAD_desc: "Create a specialist anti-Dahalo unit within the National Gendarmerie, giving rural security operations a permanent organisation, clearer responsibility and a route to share intelligence between districts."
 MAD_OPERATION_MAZAVA: "Operation Mazava"
 MAD_OPERATION_MAZAVA_desc: "Coordinate a mobile security operation with airlift and helicopter support. Better reach can shorten the time needed to move teams and supplies into remote areas, but mobility alone cannot replace local intelligence or disciplined policing."
 MAD_DAHALO_TANDROKA_OPERATION: "Launch Operation Tandroka"
 MAD_DAHALO_TANDROKA_OPERATION_desc: "Run a 120-day campaign around the southern cattle-raiding corridors. Rural cooperation, gendarmerie reform and the chosen command structure influence whether the operation produces lasting results or a costly, contested sweep."
 MAD_DAHALO_FAHALEMANA: "Launch Operation Fahalemana"
 MAD_DAHALO_FAHALEMANA_desc: "Commit resources to a broad rural-security campaign. The operation can reduce insecurity substantially, but its results depend on coordination, usable intelligence and whether security forces preserve the trust of the communities they enter."
 MAD_DAHALO_ESTABLISH_USAD: "Establish the USAD"
 MAD_DAHALO_ESTABLISH_USAD_desc: "Fund the specialised Unité Spéciale Anti-Dahalo. A permanent gendarmerie unit improves the state's ability to sustain anti-cattle-theft work beyond a single operation."
 MAD_DAHALO_OPERATION_MAZAVA: "Launch Operation Mazava"
 MAD_DAHALO_OPERATION_MAZAVA_desc: "Use transport helicopters and airlift capacity to support a time-limited operation, combining faster movement with ground intelligence. The mission still relies on rural cooperation and coordination between the military and gendarmerie."

 MAD_USAD_TRAINING_CADRE: "Train the USAD Cadre"
 MAD_USAD_TRAINING_CADRE_desc: "Train specialist investigators, patrol leaders and trackers before committing the unit to a sustained campaign. Additional training improves the likelihood that later operations turn intelligence into results."
 MAD_USAD_GROUND_LOGISTICS: "Equip USAD Ground Logistics"
 MAD_USAD_GROUND_LOGISTICS_desc: "Purchase vehicles, radios, fuel storage and field-support equipment. Better ground logistics make operations without airlift more viable and improve the delivery of food and emergency supplies."
 MAD_USAD_COMMUNITY_LIAISON: "Establish Community Liaison Teams"
 MAD_USAD_COMMUNITY_LIAISON_desc: "Build local reporting networks and channels for complaints and cattle-recovery claims. These teams improve cooperation before operations and help limit the damage when an operation goes badly."
 MAD_DAHALO_OPERATION_MAZAVA_GROUND: "Launch Operation Mazava — Ground Column"
 MAD_DAHALO_OPERATION_MAZAVA_GROUND_desc: "Use a ground-only alternative when helicopters or dedicated airlift are unavailable. The column takes longer and costs more Rural Cooperation, but USAD logistics and community liaison can make it worthwhile."
 mad_dahalo.17.d_success: "The campaign around Betroka has concluded successfully. The result has strengthened the security presence, returned some Rural Cooperation and reduced the risk that the cattle routes will be abandoned again."
 mad_dahalo.17.d_failure: "The operation has achieved only limited gains. Raids have declined in some places, but coercive sweeps, weak intelligence or poor local coordination have damaged Rural Cooperation and made future operations harder."
 mad_dahalo.18.d_success: "The gendarmerie operation has achieved its main objectives. Institutional preparation and local cooperation have turned tactical pressure into a more durable security presence."
 mad_dahalo.18.d_failure: "The operation ended in a contested result. Dahalo networks have been disrupted, but complaints, disruption and heavy-handed enforcement have reduced Rural Cooperation, making subsequent operations more difficult."
 mad_dahalo.19.d_success: "Fahalemana has succeeded in reducing rural insecurity. The extent of the gain depends on how much Dahalo threat remained when the operation ended; sustained cooperation has also recovered part of the trust committed at launch."
 mad_dahalo.19.d_failure: "Fahalemana has failed to secure a lasting settlement. High remaining Dahalo threat has limited the gains, while complaints and disruption have damaged Rural Cooperation. Rebuilding trust will matter as much as the next deployment."
 mad_dahalo.20.d_success: "Operation Mazava has achieved its objectives. The operation reduced Dahalo activity and helped deliver emergency supplies. Rural Cooperation improves, especially where USAD liaison and ground logistics were funded."
 mad_dahalo.20.d_failure: "Operation Mazava has achieved only partial results. The remaining Dahalo threat has limited the relief mission, and the operation has damaged Rural Cooperation. A ground-only effort is especially costly when local logistics and liaison have not been funded."
 mad_dahalo.21.t: "Prepare Operation Tandroka"
 mad_dahalo.21.d: "Readiness, reform and current Dahalo threat give this operation a §Y[?MAD_dahalo_campaign_success_chance|0] percent§! chance of success before the final approach is chosen. The probability is capped at 80%; preparation improves the odds but never guarantees success."
 mad_dahalo.21.a: "Prioritise local informants (up to +8 percentage points; limit backlash)"
 mad_dahalo.21.b: "Use a forceful sweep (up to +14 percentage points; greater backlash if it fails)"
 mad_dahalo.22.t: "Prepare Coup d'Arrêt"
 mad_dahalo.22.d: "The gendarmerie must decide whether to prioritise community information or a fast, forceful sweep. Current readiness gives a §Y[?MAD_dahalo_campaign_success_chance|0] percent§! chance before that final choice; no preparation can guarantee success."
 mad_dahalo.22.a: "Coordinate with village leaders (up to +8 points; limit backlash)"
 mad_dahalo.22.b: "Press the offensive (up to +14 points; greater backlash if it fails)"
 mad_dahalo.23.t: "Prepare Operation Fahalemana"
 mad_dahalo.23.d: "The present Dahalo threat directly affects this campaign's prospects. Low threat, gendarmerie reform and cooperation improve its current §Y[?MAD_dahalo_campaign_success_chance|0] percent§! success chance; at high threat, even a prepared campaign can fail."
 mad_dahalo.23.a: "Build the operation around local intelligence (+8 points; limit backlash)"
 mad_dahalo.23.b: "Concentrate forces for a rapid sweep (+14 points; greater backlash if it fails)"
 mad_dahalo.24.t: "Prepare Operation Mazava"
 mad_dahalo.24.d: "USAD investments, operational readiness and the current Dahalo threat give the air-supported mission a §Y[?MAD_dahalo_campaign_success_chance|0] percent§! chance of success. Choose whether to prioritise local intelligence or speed and coercive pressure."
 mad_dahalo.24.a: "Coordinate deliveries and local intelligence (+8 points; limit backlash)"
 mad_dahalo.24.b: "Use a rapid forceful sweep (+14 points; greater backlash if it fails)"
 mad_dahalo.25.t: "Prepare the Mazava Ground Column"
 mad_dahalo.25.d: "Without full air mobility, the ground column starts from a lower readiness level. USAD investment, local cooperation and the current Dahalo threat give it a §Y[?MAD_dahalo_campaign_success_chance|0] percent§! chance before the final approach is chosen."
 mad_dahalo.25.a: "Coordinate with communities and relief teams (+8 points; limit backlash)"
 mad_dahalo.25.b: "Prioritise speed and coercive pressure (+14 points; greater backlash if it fails)"

 mad_dahalo.17.t: "Operation Tandroka Concludes"
 mad_dahalo.17.d: "The campaign around Betroka has concluded. Its result reflects whether operational readiness was matched by rural cooperation, reliable intelligence and coordination between security forces and local authorities."
 mad_dahalo.17.a: "The campaign has produced lasting gains"
 mad_dahalo.17.b: "The sweep has had only limited success"
 mad_dahalo.18.t: "Coup d'Arrêt Reaches Its End"
 mad_dahalo.18.d: "The gendarmerie operation in the southwest has concluded. Where local cooperation and institutional preparation held, the authorities can turn tactical gains into a more durable security presence. Without that foundation, armed networks may disperse and regroup."
 mad_dahalo.18.a: "Intelligence and cooperation have paid off"
 mad_dahalo.18.b: "The operation has been costly and contested"
 mad_dahalo.19.t: "Operation Fahalemana Concludes"
 mad_dahalo.19.d: "The broader rural-security deployment has reached its end. Better coordination and community cooperation have improved the prospects for lasting security, while a poorly prepared campaign leaves the state facing complaints, disruption and the risk that armed groups return after troops move on."
 mad_dahalo.19.a: "A coordinated operation has strengthened rural security"
 mad_dahalo.19.b: "The campaign has reduced the threat, but at a cost"
 mad_dahalo.20.t: "Operation Mazava Concludes"
 mad_dahalo.20.d: "The air-supported operation has concluded. Helicopter mobility and coordinated ground teams can extend the reach of security forces, but only reliable intelligence and cooperation on the ground can turn mobility into lasting results."
 mad_dahalo.20.a: "Air mobility has strengthened the operation"
 mad_dahalo.20.b: "The operation achieved only partial results"
 MAD_DAHALO_ARMS_CRACKDOWN_UNLOCK_TT: "Unlocks the Seize Illegal Arms decision and the ringleader hunt."
 MAD_REMENABILA_LOCATE_UNLOCK_TT: "Unlocks the Locate Remenabila decision."
 MAD_REMENABILA_MOUNTAIN_PURSUIT_UNLOCK_TT: "Unlocks the Pursue Him Through the Mountains decision."
 MAD_REMENABILA_CAPTURE_SPIRITUAL_ADVISER_UNLOCK_TT: "Unlocks the Capture His Spiritual Adviser decision."
 MAD_REMENABILA_FINAL_HUNT_UNLOCK_TT: "Unlocks the Final Hunt for Remenabila decision."

 mad_dahalo.1.t: "The Dahalo Rise"
 mad_dahalo.1.d: "The bands we deliberately armed are no longer merely an instrument of rural security. With the Dahalo network restored to full strength, local commanders have rejected further restraint and risen openly in the Grand Sud. Toliara is in revolt, and the state now faces the consequences of having armed the movement."
 mad_dahalo.1.a: "The Grand Sud is in revolt."
 MAD_DAHALO_REBEL_GOVERNMENT: "Dahalo Council"
 MAD_DAHALO_REBEL_LEADER_DESC: "The Dahalo command council that seized Toliara after the armed movement reached its maximum strength."

 mad_dahalo.2.t: "Remenabila Takes Power"
 mad_dahalo.2.d: "Remenabila has crossed the final line between influence and government. His network now controls the state, elections have been suspended, and the Dahalo are no longer merely an armed power outside the political order. They are now the regime."
 mad_dahalo.2.a: "The new order begins."

 mad_dahalo.10.t: "A Zebu Herd Is Raided"
 mad_dahalo.10.d: "Dahalo bands have raided a major herd in the Toliara region. The immediate loss is felt in the countryside: fewer animals remain for breeding and trade, while the movement of livestock and food into the southern settlements becomes harder."
 mad_dahalo.10.a: "Replace the lost herd"
 mad_dahalo.10.b: "We cannot afford it"
 mad_dahalo.10.tt: "The raid increases Dahalo strength and worsens famine in Toliara. The long-term agricultural damage is limited, but repeated raids can leave a lasting scar."

 mad_dahalo.11.t: "A Cattle Convoy Is Ambushed"
 mad_dahalo.11.d: "A cattle convoy moving along one of the southern routes has been attacked. Traders are demanding escorts, and the cost of moving animals through the region is rising. Escorting costs [MAD_RC_COST_8_OR_6] Rural Cooperation plus the treasury payment; the alternative remains available at any cooperation level."
 mad_dahalo.11.a: "Escort the convoys"
 mad_dahalo.11.b: "The roads must stay open"

 mad_dahalo.12.t: "Villages Raise Their Own Guard"
 mad_dahalo.12.d: "Villages in the countryside are organising their own armed watches. They are filling a security gap left by the state's limited reach, but formal recognition would also move part of rural security outside the regular forces."
 mad_dahalo.12.a: "Recognise the local defence groups"
 mad_dahalo.12.b: "Integrate them into the gendarmerie"
 mad_dahalo.12.c: "Disarm them"

 mad_dahalo.13.t: "Private Security Offers a Rural Solution"
 mad_dahalo.13.d: "Private security providers are offering to take on part of the rural security burden. Madagascar already has an established private-security industry, and some firms have experience protecting clients and responding rapidly where the state cannot maintain a permanent presence."
 mad_dahalo.13.a: "Hire the private security firms"
 mad_dahalo.13.b: "Expand the gendarmerie instead"
 mad_dahalo.13.c: "No private army"

 mad_dahalo.14.t: "A Southern Project Demands Protection"
 mad_dahalo.14.d: "A foreign-backed project in the south is demanding guarantees that its roads, personnel and facilities will be protected. The security problem is now becoming an investment problem as well."
 mad_dahalo.14.a: "Pay for private site security"
 mad_dahalo.14.b: "Send the security forces"
 mad_dahalo.14.c: "Accept the risk"

 mad_dahalo.15.t: "An Army Column Is Ambushed"
 mad_dahalo.15.d: "A military column operating against the Dahalo has been caught in an ambush. The army can continue the operation, but the loss of men, equipment and confidence is becoming harder to ignore."
 mad_dahalo.15.a: "Recover and keep moving"

 mad_dahalo.16.t: "A Lead on Remenabila"
 mad_dahalo.16.d: "An informant claims to know where Remenabila's network is moving. The information is plausible but unverified. Acting now could save months of searching; waiting would allow the source to be tested."
 mad_dahalo.16.a: "Act on the lead"
 mad_dahalo.16.b: "Keep the source under watch"

 MAD_MOUNTAIN_WARFARE_TRAINING: "Mountain Warfare Training"
 MAD_MOUNTAIN_WARFARE_TRAINING_desc: "Years of pursuing bandits through Madagascar's highlands have forced the army to adapt its logistics, marching discipline and fieldcraft to rough terrain. Our troops are better able to cross the mountains and hills of Madagascar without exhausting themselves or their fuel supplies."

 MAD_DAHALO_ESCORT_RELIEF_CONVOYS: "Escort Relief Convoys"
 MAD_DAHALO_ESCORT_RELIEF_CONVOYS_desc: "Protect food, water and other physical relief moving into the Grand Sud.; the 60-day operation restores relief delivery and suppresses interference."
 MAD_DAHALO_NEGOTIATE_HERDMASTER_CORRIDORS: "Negotiate Herdmaster Corridors"
 MAD_DAHALO_NEGOTIATE_HERDMASTER_CORRIDORS_desc: "Use the cattle networks to move relief through the south. It is faster and reaches people who distrust the state, but it concedes influence to the Dahalo and makes the insecurity harder to suppress."

