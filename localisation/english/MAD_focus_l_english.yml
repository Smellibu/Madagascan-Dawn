 # THE STATE-LEVEL EVENTS
 # ================================================================
 mad_drought.30.t: "The Rains Fail in [MAD_drought_event_state.GetName]"
 mad_drought.30.d: "The short rains fail over [MAD_drought_event_state.GetName]. The state's drought exposure has made the shortfall especially damaging, and this new shock further strains crops, food supplies and rural livelihoods."
 mad_drought.30.a: "The dry spell deepens."
 mad_drought.31.t: "Cyclone Damage in [MAD_drought_event_state.GetName]"
 mad_drought.31.d: "A cyclone has struck the coast of [MAD_drought_event_state.GetName], bringing destructive rainfall and flooding. Runoff strips topsoil, damages crops and infrastructure, and worsens food insecurity even as it brings water."
 mad_drought.31.a: "The wrong kind of water."
 mad_drought.32.t: "Famine Conditions in [MAD_drought_event_state.GetName]"
 mad_drought.32.d: "Food insecurity in [MAD_drought_event_state.GetName] has crossed into severe famine conditions. The latest nutrition and household reports show that families are running out of food and need urgent relief."
 mad_drought.32.a: "Send everything we can spare."
 mad_drought.33.t: "Wells Run Dry in [MAD_drought_event_state.GetName]"
 mad_drought.33.d: "Hand pumps in [MAD_drought_event_state.GetName] are drawing air as the water table falls below existing wells. The wells no longer supply dependable water, leaving households and farms more exposed to the continuing drought."
 mad_drought.33.a: "We must find another source of water."

 mad_drought.34.t: "A Welcome Return of the Rains in [MAD_drought_event_state.GetName]"
 mad_drought.34.d: "After a prolonged dry spell, the seasonal rains have returned to [MAD_drought_event_state.GetName]. This is not enough to end Madagascar's wider drought, but it brings substantial local relief to water supplies and crops."
 mad_drought.34.a: "Make the most of the rain."
 mad_drought.35.t: "A Better-than-Expected Harvest in [MAD_drought_event_state.GetName]"
 mad_drought.35.d: "Despite difficult growing conditions, farmers in [MAD_drought_event_state.GetName] have brought in a better-than-expected harvest. Resilient crops, local farming practices and careful use of available water have limited the food losses this season. The stronger harvest eases local food insecurity and gives the affected area a modest reprieve from the drought."
 mad_drought.35.a: "A welcome harvest."

