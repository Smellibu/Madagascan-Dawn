 mad_drought.30.t: "The Rains Fail Again"
 mad_drought.30.d: "The short rains have come to nothing across one region. The meteorological service says the deficit is the worst there in a decade; the villages had already worked that out for themselves.\n\nOne state’s drought number climbs sharply."
 mad_drought.30.a: "The map gets darker in one place."
 mad_drought.31.t: "Cyclone"
 mad_drought.31.d: "The cyclone came ashore in the night. It brought more water in six hours than the region had seen in two years - and it took the topsoil, the seed and the bridges out with it on the way back.\n\nWater is not the same thing as rain."
 mad_drought.31.a: "The wrong kind of water."
 mad_drought.32.t: "It Has Stopped Being Hunger"
 mad_drought.32.d: "The nutrition survey has come back from one of the worst-hit states. The numbers have crossed the line where the word changes: this is no longer food insecurity, it is famine, and it is being measured in children.\n\nThe hunger meter in that state jumps."
 mad_drought.32.a: "Send everything we have."
 mad_drought.33.t: "The Wells Run Dry"
 mad_drought.33.d: "The hand pumps in one state are pulling air. The water table has dropped below the depth the boreholes were drilled to - the wells are still there, and they are no longer wells.\n\nThat state loses its well bonus."
 mad_drought.33.a: "Drill deeper, if we can afford to."

