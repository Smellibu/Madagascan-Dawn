 MAD_DROUGHT_CLIMATE_ADAPTATION: "Climate Adaptation Programme"
 MAD_DROUGHT_CLIMATE_ADAPTATION_desc: "Reforestation, soil conservation and terracing address the recurring climate pressure that drives the drought."
 MAD_DROUGHT_GRAIN_RESERVE: "Establish a Grain Reserve"
 MAD_DROUGHT_GRAIN_RESERVE_desc: "Warehouses of rice and maize release food stocks when harvests fail, helping protect the four drought-affected regions, especially in the Grand Sud."
 MAD_DROUGHT_LOCUST_WATCH: "Locust Monitoring Network"
 MAD_DROUGHT_LOCUST_WATCH_desc: "Formalise the monitoring network so earlier detection can reduce damage from future locust swarms and their lingering effects."
 MAD_DROUGHT_FINAL_PUSH: "The Final Push"
 MAD_DROUGHT_FINAL_PUSH_desc: "The drought is beaten. One last programme to lay it to rest for good."
