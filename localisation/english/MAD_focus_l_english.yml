 MAD_drought_spray_clean_tt: "§GMetarhizium§! kills the locusts and nothing else: the zebu, the bees and the paddies are untouched"
 MAD_drought_spray_dirty_tt: "§ROrganophosphate§!: it works, but it takes the bees and the fish with it. Stability §R-1%§!"
