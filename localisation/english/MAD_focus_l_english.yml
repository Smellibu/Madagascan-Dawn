 mad_drought.13.t: "An El Nino Drought"
 mad_drought.13.d: "A powerful El Nino has brought the worst dry season in the south for decades. Crops have failed in three regions and the first families are on the move."
 mad_drought.13.a: "A national emergency"
 mad_drought.14.t: "The Kere"
 mad_drought.14.d: "After successive failed harvests the Grand Sud is in famine. In Androy and Anosy the word is kere, hunger, and people are eating cactus fruit and clay.\n\nThe world is watching."
 mad_drought.14.a: "Whatever it takes"
 mad_drought.20.t: "The Drought Is Over"
 mad_drought.20.d: "The rains have returned and the boreholes and granaries are holding. For the first time in years the south is no longer waiting on the sky.\n\nThe drought has ended."
 mad_drought.20.a: "At last"
 mad_drought.22.t: "The Drought Is Contained"
 mad_drought.22.d: "The boreholes, the seed and the granaries are holding. For the first time the trend in the south is downwards.\n\nThe drought has been contained."
 mad_drought.22.a: "The worst is over"
 mad_drought.displacement.t: "Drought Displacement"
 mad_drought.displacement.a: "We must help those who remain."
 mad_drought.23.d: "Of the [?MAD_drought_transfer_gross_266|0] people who left [event_target:MAD_drought_transfer_source_266.GetName], [?MAD_drought_transfer_survivors_266|0] found new pastures in [event_target:MAD_drought_transfer_destination_266.GetName]. [?MAD_drought_transfer_deaths_266|0] people did not survive the displacement."
 mad_drought.24.d: "Of the [?MAD_drought_transfer_gross_267|0] people who left [event_target:MAD_drought_transfer_source_267.GetName], [?MAD_drought_transfer_survivors_267|0] found new pastures in [event_target:MAD_drought_transfer_destination_267.GetName]. [?MAD_drought_transfer_deaths_267|0] people did not survive the displacement."
 mad_drought.25.d: "Of the [?MAD_drought_transfer_gross_268|0] people who left [event_target:MAD_drought_transfer_source_268.GetName], [?MAD_drought_transfer_survivors_268|0] found new pastures in [event_target:MAD_drought_transfer_destination_268.GetName]. [?MAD_drought_transfer_deaths_268|0] people did not survive the displacement."
