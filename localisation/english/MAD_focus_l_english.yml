 MAD_POL_ROYAL_CONSTITUTION: "Royal Constitutional Order"
 MAD_POL_ROYAL_CONSTITUTION_desc: "A Royalist political programme reinforcing the constitutional role of the Crown. Its political benefits belong to the Royalist programme; secular or state-church cooperation is tracked by a separate constitutional idea."
 MAD_POL_SECULAR_GOVERNMENT: "Secular Constitution and Government"
 MAD_POL_SECULAR_GOVERNMENT_desc: "The state keeps spiritual authorities outside formal government. MPs may still consult religious leaders privately, but the constitutional order does not openly bind government to the clergy. While the Clergy interest group is active, its opinion falls by 0.5 per month.\nMonthly Rural Cooperation: §R-0.50§!\nBureaucracy, education and corruption-change costs are reduced."
 MAD_POL_UNSECULAR_GOVERNMENT: "Open State-Church Cooperation"
 MAD_RURAL_AREMA_NOT_IN_POWER_TT: "AREMA is not in power"
 MAD_POL_UNSECULAR_GOVERNMENT_desc: "Government openly recognises spiritual leaders as partners in public life. While the Clergy interest group is active, its opinion rises by 0.5 per month.\nMonthly Rural Cooperation: §G+0.50§!\nCorruption-change costs rise by 15%, education costs rise by 10%, and stability falls by 3%."
 MAD_RURAL_UNSECULARISE_GOVERNMENT: "Unsecularise the Constitution and Government"
 MAD_RURAL_UNSECULARISE_GOVERNMENT_desc: "Replace the secular constitutional model with open state-church cooperation. While the Clergy interest group is active, its opinion rises by 0.5 per month for as long as this idea remains active. Corruption-change costs rise by 15%, education costs rise by 10%, and stability falls by 3%. Unavailable while AREMA governs before its Reconciliation focus; unavailable for one year after either constitutional model is changed, including a change required by the government. Hidden while the Christocratic State idea is active."
 MAD_RURAL_SECULARISE_GOVERNMENT: "Secularise the Constitution and Government"
 MAD_RURAL_SECULARISE_GOVERNMENT_desc: "Restore the secular constitutional model. While the Clergy interest group is active, its opinion falls by 0.5 per month for as long as this idea remains active. Bureaucracy, education and corruption-change costs fall. Unavailable while CRPM or TAMIMA governs after Sacred Constitution; unavailable for one year after either constitutional model is changed, including a change required by the government. Hidden while the Christocratic State idea is active."
 MAD_RURAL_SECULAR_CLERGY_OPINION_TT: "The Clergy interest group's monthly opinion shift changes from +0.5 to -0.5 while the secular model is active."
 MAD_REMENABILA_GATHER_DAHALO_POPULATION_IDEA: "Recruit from the Dahalo"
 MAD_REMENABILA_GATHER_DAHALO_POPULATION_IDEA_desc: "The Remenabila movement consolidates local cattle-raiding networks into its manpower base, increasing the recruitable population by 1 percentage point."
 MAD_REMENABILA_MORE_COWS_POPULATION_IDEA: "The Herd Feeds the Ranks"
 MAD_REMENABILA_MORE_COWS_POPULATION_IDEA_desc: "The expansion of cattle-taking and herd control deepens the movement's rural recruitment pool, increasing the recruitable population by 3 percentage points."

 MAD_POL_ANDRIANA_HERITAGE_RECOGNISED: "Recognised Historic Royal Houses"
 MAD_POL_ANDRIANA_HERITAGE_RECOGNISED_desc: "An alternative-history policy granting historic royal houses a recognised ceremonial and consultative place in public life; it does not claim a real post-2000 Malagasy statute existed. While active, Nationalist drift is +0.03.\nMonthly Rural Cooperation: §G+0.25§!\nBureaucracy costs rise by 5%, and corruption-change costs rise by 15%. The idea is suspended without effects while CRPM or TAMIMA holds power, then restored when that government leaves if recognition remains the chosen policy."
 MAD_POL_ANDRIANA_NON_RECOGNITION: "Republican Non-Recognition of Royal Houses"
 MAD_POL_AREMA_REPUBLICAN_SECULARISM: "Legacy AREMA Policy (Migration Only)"
 MAD_POL_AREMA_REPUBLICAN_SECULARISM_desc: "Obsolete compatibility placeholder from an earlier version. It has no effects and is automatically removed; AREMA's constitutional restriction is enforced by the secularisation decision."
 MAD_POL_ANDRIANA_NON_RECOGNITION_desc: "The republic does not formally recognise historic royal houses as public institutions. This reduces bureaucracy costs by 5%.\nMonthly Rural Cooperation: §R-0.25§!\nThe idea is suspended without effects while CRPM or TAMIMA holds power, then restored when that government leaves if non-recognition remains the chosen policy."
 MAD_ANDRIANA_HERITAGE_RC_MONTHLY_TT: "Monthly Rural Cooperation: §G+0.25§!"
 MAD_ANDRIANA_NON_RECOGNITION_RC_MONTHLY_TT: "Monthly Rural Cooperation: §R-0.25§!"
 MAD_POL_SECULAR_GOVERNMENT_RC_MONTHLY_TT: "Monthly Rural Cooperation: §R-0.50§!"
 MAD_POL_UNSECULAR_GOVERNMENT_RC_MONTHLY_TT: "Monthly Rural Cooperation: §G+0.50§!"
 MAD_MADARAIL_COMAZAR_FREIGHT_CONCESSION: "Comazar Freight Guarantee"
 MAD_MADARAIL_COMAZAR_FREIGHT_CONCESSION_desc: "A binding public-freight commitment helps secure Comazar's railway investment, but reserves traffic for guaranteed volumes and reduces rural delivery capacity.\nMonthly Rural Cooperation: §R-0.25§!\nThis penalty applies while the concession idea remains active."
 MAD_MADARAIL_COMAZAR_RC_MONTHLY_TT: "Monthly Rural Cooperation: §R-0.25§!"
 MAD_RURAL_RECOGNISE_ANDRIANA_HOUSES: "Recognise the Historic Royal Houses"
 MAD_RURAL_RECOGNISE_ANDRIANA_HOUSES_desc: "Establish formal ceremonial and consultative recognition of historic royal houses as an alternative-history policy, not a claim that a real post-2000 act did so. Adds +0.03 Nationalist drift, but increases bureaucracy costs by 5% and corruption-change costs by 15%. Hidden while CRPM or TAMIMA holds power; the chosen policy returns if they later leave office."
 MAD_RURAL_WITHDRAW_ANDRIANA_RECOGNITION: "Withdraw Recognition of the Historic Royal Houses"
 MAD_RURAL_WITHDRAW_ANDRIANA_RECOGNITION_desc: "End formal recognition of historic royal houses. Bureaucracy costs fall by 5%. Hidden while CRPM or TAMIMA holds power; the chosen policy returns if they later leave office."
 MAD_RURAL_LOCAL_DEVELOPMENT_BOOST: "Local Development Works"
 MAD_RURAL_LOCAL_DEVELOPMENT_BOOST_desc: "For 120 days, local grants increase infrastructure construction speed by 15%."
