 MAD_FUEL_LIBERALIZATION: "Complete Downstream Liberalisation"
 MAD_GPM: "Organise the Fuel Market"
 MAD_GPM_desc: "Build the institutions that govern fuel imports, distribution and pricing."
 MAD_GPM_CARTEL_FORMS: "Form the GPM"
 MAD_GPM_CARTEL_FORMS_desc: "Bring Madagascar's downstream petroleum companies into a permanent industry association."
 MAD_FUEL_LIBERALIZATION_desc: "Open the downstream petroleum market and allow private distributors to compete freely."
 MAD_GPM_TERMINAL_2009: "Open the Toamasina Fuel Terminal"
 MAD_GPM_TERMINAL_2009_desc: "Expand Madagascar's main petroleum import and distribution hub."
