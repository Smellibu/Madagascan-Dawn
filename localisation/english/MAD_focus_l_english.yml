 # ================================================================
 # THE CNA AND THE LOCUSTS
 # ================================================================
 MAD_CNA_GENETIC_ENGINEERING: "CNA Genetic-Engineering Programme"
 MAD_CNA: "Establish the National Locust Control Centre"
 MAD_CNA_desc: "Create the Centre National Antiacridien (CNA) as Madagascar's dedicated national body for locust monitoring and control. Give it a stable budget and technical authority to coordinate preventive measures and emergency response before swarms devastate crops."
 MAD_Continue_the_path: "Expand Locust Survey and Control"
 MAD_Continue_the_path_desc: "Consolidate the first phase of the CNA programme by supporting agricultural productivity and easing rural labour demands. The investment establishes a stronger base for future monitoring and control campaigns, but the country still needs dedicated surveillance and response capacity."
 MAD_become_the_locust: "Support Farmers through Locust Relief"
 MAD_become_the_locust_desc: "Use locust harvesting and the control programme to support agricultural recovery and relieve pressure on rural households. The focus improves agricultural productivity and agricultural tax income, provides a small increase in War Support, and reduces hunger in Toliara by 12 points."
 MAD_map_infestations: "Map Locust Infestations"
 MAD_map_infestations_desc: "Build a clearer picture of swarm movements and breeding conditions across agricultural areas. Better mapping supports more targeted responses, improves agricultural productivity, provides a one-use genetics research bonus and unlocks the Locust Monitoring Network decision."
 MAD_biopesticides: "Develop Biological Locust Control"
 MAD_biopesticides_desc: "Invest in biological pest control to reduce dependence on broad chemical spraying. The programme improves agricultural productivity, lowers agricultural labour requirements and reduces recurring locust-related drought pressure; it also reduces national drought severity by 2."
 MAD_locust_invasion_response: "Prepare for Locust Invasions"
 MAD_locust_invasion_response_desc: "Prepare aircraft and ground teams to respond quickly when swarms spread. The programme reduces recurring locust pressure, lowers national drought severity by 2 and unlocks targeted locust-spraying decisions, but requires substantial initial funding."
 MAD_preventative_measures: "Fund Permanent Locust Prevention"
 MAD_preventative_measures_desc: "Fund sustained preventive measures once national drought severity has fallen below 50. The programme reduces recurring locust pressure, lowers drought severity by 2, improves agricultural productivity and eases labour requirements, while increasing Stability by 2%."
 MAD_drought_unlock_spray_tt: "Unlocks the per-state decision: §YSpray§!"
 MAD_drought_unlock_wells_tt: "Unlocks the per-state decision: §YSink Wells§!"
