 ### Vanilla export market cycle
 mad_vanilla.1.t: "A Vanilla Market Turn"
 mad_vanilla.1.d_boom: "Vanilla prices have surged on the international market. Exporters are suddenly flush with orders and cash, but the government must decide whether to expand production while the opportunity lasts or protect the gains already made."
 mad_vanilla.1.d_bust: "The vanilla market has turned against Madagascar. Prices have fallen sharply, squeezing growers and exporters alike. The government can spend to cushion the shock or accept the correction and wait for the market to recover."
 mad_vanilla.1.a: "Reinvest in the boom"
 mad_vanilla.1.b: "Bank the profits"
 mad_vanilla.1.c: "Support the vanilla growers"
 mad_vanilla.1.d: "Let the market correct itself"
 mad_vanilla.1.reinvest_tt: "Reinvest in the boom: temporarily gain +10% international market income and +4% return on investment, plus +2% stability and +10 political power."
 mad_vanilla.1.bank_tt: "Bank the profits: temporarily gain +6% international market income, +2% return on investment and +0.25 expected welfare, plus +4% stability and 1 treasury unit."
 mad_vanilla.1.support_tt: "Support growers: spend 2 treasury and take a smaller temporary downturn of -4% international market income, -1% return on investment and -0.10 expected welfare, while gaining +1% stability."
 mad_vanilla.1.correct_tt: "Let the market correct: take the full temporary downturn of -8% international market income, -3% return on investment and -0.25 expected welfare, plus -3% stability and -25 political power."

 MAD_QMM_LAGOON_COVER_UP: "Protect QMM"
 MAD_QMM_LAGOON_CLEANUP: "Investigate and Clean Up"
 mad_qmm.1.t: "The QMM Lagoon Scandal"
 mad_qmm.1.d: "Reports from the waters around the QMM operation are becoming impossible to ignore. Questions over wastewater, the environmental buffer and the safety of local fisheries now threaten a project tied closely to Madagascar's development plans. The scandal has already reduced Rural Cooperation by 10. Covering it up costs another 5; a credible cleanup restores 5. The government must decide whether to protect the project from further scrutiny or force a public investigation and cleanup."
 mad_qmm.1.a: "Keep this out of the papers"
 mad_qmm.1.b: "Open the books and clean it up"

 MAD_JIRAMA: "Audit the Grid"
 MAD_JIRAMA_desc: "Map the generation and distribution problems before deciding where scarce capital should go. The programme improves the system slightly and opens the utility branch."
 MAD_JIRAMA_MAINTENANCE: "Repair Before Expansion"
 MAD_JIRAMA_MAINTENANCE_desc: "Put money into maintenance before chasing new megawatts. Existing equipment becomes more productive and thermal generation wastes less fuel."
 MAD_JIRAMA_BILL_COLLECTION: "Read Every Meter"
 MAD_JIRAMA_BILL_COLLECTION_desc: "Commercial losses are power that JIRAMA generates but never gets paid for. Metering and collection reduce electricity waste and improve revenue, while businesses face tighter enforcement."
 MAD_JIRAMA_GRID_REINFORCEMENT: "Transformers First"
 MAD_JIRAMA_GRID_REINFORCEMENT_desc: "Prepare a national reinforcement of the distribution system. The focus itself improves the network slightly; the actual grid upgrade is financed through a treasury decision."
 MAD_RURAL_ENERGY: "Extend the Last Mile"
 MAD_RURAL_ENERGY_desc: "Take reliable electricity beyond the main urban networks. The policy reduces rural energy costs and unlocks the actual connection programme."
 MAD_HYDROLECT_FUEL_PP: "Run the Hydro First"
 MAD_HYDROLECT_FUEL_PP_desc: "Use Madagascar's hydroelectric fleet harder and lean less on expensive thermal generation. Better utilisation also makes later renewable investment cheaper to operate."
 MAD_JIRAMA_ANDEKALEKA: "Expand Andekaleka"
 MAD_JIRAMA_ANDEKALEKA_desc: "Prepare the Andekaleka expansion and rehabilitation. The focus improves hydro readiness; the full expansion is paid for and completed through a two-year construction decision."
 MAD_JIRAMA_VOLOBE_AMONT: "Finance Volobe Amont"
 MAD_JIRAMA_VOLOBE_AMONT_desc: "Get the financing package moving for Volobe Amont. This prepares the project and improves financing conditions; the final deal and construction still require years of work."
 MAD_JIRAMA_PRIVATIZATION_FORK: "Who Owns the Wires?"
 MAD_JIRAMA_PRIVATIZATION_FORK_desc: "Choose how Madagascar will manage its electricity utility: commercial discipline and private capital, or a stronger publicly backed JIRAMA."
 MAD_JIRAMA_CORPORATIZE: "Turn JIRAMA into a Utility Company"
 MAD_JIRAMA_CORPORATIZE_desc: "Separate utility management from direct political control, attract private capital and make JIRAMA easier to finance. Investors gain influence and political support comes at a cost."
 MAD_JIRAMA_STAY_PUBLIC: "Keep the Grid Public"
 MAD_JIRAMA_STAY_PUBLIC_desc: "Keep JIRAMA publicly owned and give the state a cheaper route to finance renewable projects and internal investment."
 MAD_JIRAMA_IMF_PLAN: "JIRAMA Reform Framework"
 MAD_JIRAMA_IMF_PLAN_desc: "Set out the recovery framework around lower losses, efficient generation, financial reform and increased access. This is the reform architecture; the next focus is the political decision on how to implement it."
 MAD_IMF_REVIEW_2025: "Adopt the JIRAMA Recovery Plan"
 MAD_IMF_REVIEW_2025_desc: "Bring the JIRAMA recovery plan to a final political decision. This triggers the branch's one major event: tariffs, state recapitalisation or competitive private contracts."
 MAD_JIRAMA_GENERATION_RECOVERY_MISSION: "Meet the JIRAMA Generation Target"
 MAD_JIRAMA_GENERATION_RECOVERY_MISSION_desc: "Within three years after the first generation-project focus, complete at least two generation projects and raise total electricity generation to at least 140% of electricity consumption. Meeting both requirements in time unlocks Fund the Expansion; missing the deadline unlocks Run an Austerity Rescue."
 MAD_JIRAMA_RECOVERY_FAILS: "Run an Austerity Rescue"
 MAD_JIRAMA_RECOVERY_FAILS_desc: "Available if the three-year JIRAMA generation mission expires before both targets are met. Use hard cost control, fuel savings and cheaper internal investment to keep JIRAMA functioning. The utility improves, but household and business pain makes the politics uglier."
 MAD_JIRAMA_RECOVERY_SUCCEEDS: "Fund the Expansion"
 MAD_JIRAMA_RECOVERY_SUCCEEDS_desc: "With generation and network projects already underway, commit to investment-led expansion. The stronger system now supports faster productivity and renewable growth."
 MAD_JIRAMA_TWO_GENERATION_PROJECTS_tt: "At least two generation projects have been completed"
 MAD_JIRAMA_GENERATION_140_PERCENT_tt: "Electricity generation is at least 140% of electricity consumption"
 MAD_ELECTRICITY_FOR_ALL: "Light the Whole Island"
 MAD_ELECTRICITY_FOR_ALL_desc: "Make reliable electricity a national development objective. The final package lowers energy burdens, raises productivity and turns the earlier generation and access investments into an economy-wide advantage."

 # --- JIRAMA project decisions ---
 MAD_JIRAMA_PROJECTS: "JIRAMA Capital Programme"
 MAD_JIRAMA_PROJECTS_desc: "Capital generation, grid and rural electrification projects. Rural Grid, LEAD Connections and DECIM Solar consume Rural Cooperation when construction starts and return part of it when delivered.\nCurrent Rural Cooperation: §Y[?MAD_rural_cooperation|0]/100§!. Completed rural projects also improve monthly recovery."
 MAD_JIRAMA_BUILD_GRID: "Reinforce the National Grid"
 MAD_JIRAMA_BUILD_GRID_desc: "Reinforce the main transmission and distribution network. Takes 18 months."
 MAD_JIRAMA_BUILD_RURAL_GRID: "Build the Rural Grid"
 MAD_JIRAMA_BUILD_RURAL_GRID_desc: "Extend energy infrastructure into the rural network. Takes one year."
 MAD_JIRAMA_BUILD_MANDROSEZA: "Rehabilitate Mandroseza"
 MAD_JIRAMA_BUILD_MANDROSEZA_desc: "Modernise the Mandroseza complex. Takes 18 months."
 MAD_JIRAMA_BUILD_ANDEKALEKA: "Expand Andekaleka"
 MAD_JIRAMA_BUILD_ANDEKALEKA_desc: "Complete the Andekaleka expansion. Takes two years."
 MAD_JIRAMA_BUILD_SAHOFIKA: "Construct Sahofika"
 MAD_JIRAMA_BUILD_SAHOFIKA_desc: "Bring the Sahofika expansion online. Takes two years."
 MAD_JIRAMA_BUILD_VOLOBE: "Construct Volobe Amont"
 MAD_JIRAMA_BUILD_VOLOBE_desc: "Commission Volobe Amont. Takes four years."
 MAD_JIRAMA_BUILD_LEAD_ACCESS: "Build LEAD Connections"
 MAD_JIRAMA_BUILD_LEAD_ACCESS_desc: "Build energy infrastructure for the capital and southern access network. Takes two years."
 MAD_JIRAMA_BUILD_DECIM_SOLAR: "Build DECIM Solar"
 MAD_JIRAMA_BUILD_DECIM_SOLAR_desc: "Develop solar generation for isolated grids and JIRAMA's renewable mix. Takes two years."
 MAD_JIRAMA_BUILD_SMART_GRID: "Roll Out the Smart Grid"
 MAD_JIRAMA_BUILD_SMART_GRID_desc: "Modernise control and distribution infrastructure. Takes one year."
 MAD_JIRAMA_BUILD_OFFSHORE_WIND: "Build the Offshore Wind Pilot"
 MAD_JIRAMA_BUILD_OFFSHORE_WIND_desc: "Develop a small offshore wind programme. Takes two years."

 # --- JIRAMA recovery event ---
 mad_jirama.1.t: "The JIRAMA Recovery Plan"
 mad_jirama.1.d: "The recovery plan has reached the cabinet. JIRAMA still faces a basic choice: make tariffs and collections do more of the work, put public money behind the utility, or make room for competitive private generation and outside capital. Each route improves part of the system while creating a different political and financial burden."
 mad_jirama.1.a: "Make the tariff system pay for power"
 mad_jirama.1.b: "Back JIRAMA from the Treasury"
 mad_jirama.1.c: "Open generation to competition"

 MAD_JIRAMA_BUILD_SMART_METERS: "Roll Out Rural Smart Meters"
 MAD_JIRAMA_BUILD_SMART_METERS_desc: "Replace weak metering and distribution links with a modern rural network. Takes one year. If Toamasina has no building slot when the project finishes, receive a one-use 35% Internet technology research bonus instead."
 MAD_JIRAMA_SMART_METERS_TECH_FALLBACK_TT: "Toamasina had no available building slot: gain a one-use §Y35%§! research bonus for §YInternet technologies§! instead."
 MAD_JIRAMA_BUILD_EDF_ENGINEERING: "Hire EDF Engineering Support"
 MAD_JIRAMA_BUILD_EDF_ENGINEERING_desc: "Run a year-long EDF engineering contract to improve renewable project delivery and utility expertise."
 MAD_DECIM_RENEWABLES: "DECIM Renewable Engineering"
 MAD_CONTINUE_WITH_LUFTHANSA: "Continue With Lufthansa"
 MAD_CONTINUE_WITH_LUFTHANSA_desc: "Continuing cooperation with an established aviation partner offers the national airline access to technical expertise and operational experience. The arrangement may help restore confidence in maintenance and scheduling, but lasting viability still depends on sound financial management and a fleet suited to domestic and regional demand."
 MAD_AIR_STATE_CONTROL: "Madagascan Airlines State Control"
 MAD_AIR_STATE_CONTROL_desc: "The national carrier remains closely associated with public service on routes that private operators may not find profitable. Returning it to direct state control can reinforce that mission, while leaving the government responsible for management discipline, aircraft availability and the cost of keeping isolated communities connected."
 MAD_STUB_2009_crisis: "Mad Stub 2009 Crisis"
 MAD_STUB_2009_crisis_desc: "The political crisis disrupted institutions, public confidence and international relationships just as the economy needed stable administration. Its aftershocks reached public services and private investment, while the task of restoring constitutional credibility remained inseparable from restoring ordinary government functions."
 MAD_enter_Remenabila: "Enter Remenabila"
 MAD_enter_Remenabila_desc: "The pursuit of Remenabila moves into the districts where cattle theft and informal authority have become difficult for the state to dislodge. Any operation must work through sparse roads, local loyalties and terrain that favours those who know the countryside better than outside forces."
 MAD_FIGHTING_CERTIFICATE_FRAUD: "Fighting Certificate Fraud"
 MAD_FIGHTING_CERTIFICATE_FRAUD_desc: "False cattle certificates can disguise stolen zebu as legitimate property and allow illicit herds to pass through markets. Auditing registration records and prosecuting fraud can close one route for laundering stolen animals, though enforcement must be fair to pastoralists whose ownership records are incomplete."
 MAD_dahalo_military_ops: "Dahalo Military Ops"
 MAD_dahalo_military_ops_desc: "Military operations against Dahalo groups seek to restore order in areas where repeated cattle raids have weakened confidence in local policing. Their success depends on accurate intelligence and sustained presence, since indiscriminate raids can alienate residents and drive the same networks into neighbouring districts."
 MAD_IOM_poverty_measures: "Iom Poverty Measures"
 MAD_IOM_poverty_measures_desc: "Displacement and rural poverty force families to abandon livelihoods and move in search of work or assistance. Measures developed with migration specialists focus on the needs of vulnerable households and the communities receiving them, where reintegration depends on shelter, documentation and access to services."
 MAD_Ivato_second_runway: "Ivato Second Runway"
 MAD_Ivato_second_runway_desc: "Ivato International Airport is Madagascar's principal air gateway, linking the capital with regional and long-haul destinations. Expanding runway capacity can ease pressure on a key transport hub, but its value depends on air-traffic management, maintenance, airline confidence and demand that can support regular services."
 MAD_anticipating_faming_strategy: "Anticipating Faming Strategy"
 MAD_anticipating_faming_strategy_desc: "Food crises are less damaging when authorities act before local shortages become acute. Early planning links rainfall information, crop conditions, food stocks and transport access so that officials can identify exposed districts and organise relief before households are forced to sell assets or leave their homes."
 MAD_Soalala_iron_mine: "Soalala Iron Mine"
 MAD_Soalala_iron_mine_desc: "The Soalala area in northwest Madagascar has long been associated with a major iron-ore prospect. Turning the deposit into a producing mine would require substantial transport and port infrastructure, secure access to energy and water, and confidence that global market conditions justify a project of that scale."
 MAD_STUB_2025_crisis: "Mad Stub 2025 Crisis"
 MAD_STUB_2025_crisis_desc: "Mounting economic and institutional pressures place renewed attention on the government's ability to respond to public discontent. Restoring confidence requires credible decisions on living costs, public services and accountability, rather than short-term announcements that leave the causes of frustration unresolved."
 MAD_TOAMASINA_JICA_EXPANSION: "Toamasina Jica Expansion"
 MAD_vanilla_quality_control: "Vanilla Quality Control"
 MAD_vanilla_quality_control_desc: "Madagascar is renowned for producing high-grade vanilla, but quality varies with pollination, harvesting, curing and storage. Consistent standards and traceability help exporters meet demanding buyers' requirements, protect the country's reputation and reduce the risk that poor batches undermine prices for growers across the producing regions."
 MAD_vanilla_quantity: "Vanilla Quantity"
 MAD_vanilla_quantity_desc: "Vanilla is a vital cash crop for many farmers in northeastern Madagascar, where earnings can fluctuate sharply with world prices and the harvest. Expanding output offers opportunities, but production remains vulnerable to cyclones, theft, labour-intensive pollination and the temptation to harvest pods before they are mature."
 MAD_DAEWOO_FALLOUT: "The Daewoo Lease Controversy"
 MAD_DAEWOO_FALLOUT_desc: "Press coverage has brought the proposed long-term agricultural concession into national politics. Disputes over land access, export-crop priorities and public consultation have damaged trust in the government and raised questions about how future investment agreements should be negotiated."
 MAD_CUT_CORPORATE_TAX: "Cut Corporate Tax"
 MAD_CUT_CORPORATE_TAX_desc: "Lower corporate taxes are often presented as a way to encourage firms to reinvest earnings and attract new capital. The trade-off is immediate pressure on public revenue, especially where the tax base is narrow and the government must still fund roads, schools, health services and basic administration."
 MAD_MADARAIL_INVESTORS_STAY: "Madarail Investors Stay"
 MAD_MADARAIL_INVESTORS_STAY_desc: "Railway investors agree to continue operating after negotiations over the concession's terms. Their commitment keeps private expertise and capital in play, but the partnership still has to demonstrate that it can rehabilitate assets, serve shippers reliably and balance commercial discipline with the needs of remote communities."
 MAD_MADARAIL_INVESTORS_DESIST: "Madarail Investors Desist"
 MAD_MADARAIL_INVESTORS_DESIST_desc: "The railway concession's investors withdraw after negotiations fail to produce acceptable terms. Their departure leaves uncertainty over the network's upkeep and day-to-day operation, renewing pressure on the state to decide how to keep an essential transport link running without a dependable private partner."
 MAD_WORK_WITH_GERMANS: "Work With Germans"
 MAD_WORK_WITH_GERMANS_desc: "Cooperation with German aviation interests offers a route to technical assistance, fleet support and commercial expertise for Madagascar's struggling airline. The partnership may improve operational reliability, but external help cannot substitute for disciplined budgets, realistic route planning and a clear division of responsibility for maintenance."
 MAD_SELL_TO_AUSTRAL: "Sell To Austral"
 MAD_STATE_CONTROL_SUCCEEDS: "State Control Succeeds"
 MAD_STATE_CONTROL_SUCCEEDS_desc: "The state-led airline model begins to stabilise after a period of financial and operational strain. Public control keeps national connectivity at the centre of the carrier's mission, while its durability depends on maintenance standards, realistic scheduling and management that can account for both commercial and public-service obligations."
 MAD_Hunt_for_red_with_a_swagger: "Hunt For Red With A Swagger"
 MAD_Hunt_for_red_with_a_swagger_desc: "The hunt for Remenabila intensifies as security teams use new leads to narrow the search across the southern countryside. The challenge is to turn local information into a lawful, precise operation, rather than provoke further violence or push the cattle-raiding network deeper into neighbouring communities."
 MAD_PERMIT_ARMS: "Permit Arms"
 MAD_PERMIT_ARMS_desc: "Permitting more arms to circulate can be presented as a way to let communities defend themselves, but it also risks escalating violence in areas already affected by cattle raiding. Once weapons enter informal markets, authorities may find them difficult to track and much harder to remove."
 MAD_ARREST_ARMS: "Arrest Arms"
 MAD_ARREST_ARMS_desc: "Authorities move against the circulation of weapons associated with cattle raids and rural violence. Enforcement can reduce the firepower available to armed groups, but seizures must be backed by reliable evidence and fair policing so that law-abiding residents are not treated as suspects by default."
 MAD_Tandroka: "Tandroka"
 MAD_Tandroka_desc: "Prepare the security campaign around Betroka, where armed cattle theft had become a persistent concern. This focus establishes readiness; the following timed decision commits resources and rural cooperation, while the operation's result depends on coordination and the trust of local communities."
 MAD_Grand_Sud_program: "Grand Sud Program"
 MAD_Grand_Sud_program_desc: "The Grand Sud faces recurrent water shortages, poor harvests and long distances to markets and services. A coordinated development programme has to link boreholes, roads, storage, agricultural advice and local administration, because isolated projects rarely protect households when several parts of the rural economy fail at once."
 MAD_Soalala_Iron_port: "Soalala Iron Port"
 MAD_Soalala_Iron_port_desc: "Developing Soalala's iron ore would require a reliable route from the remote deposit to a port capable of handling bulk cargo. The proposed industrial corridor promises to reshape trade in the northwest, but its viability rests on costly infrastructure, environmental management and sustained demand for the ore."
 MAD_GERMAN_AIR_INVESTMENT_desc: "German capital establishes an aviation workshop and civilian industrial capacity in Antananarivo. The air research facility is built there if a site is available, or in another suitable Malagasy state, improving Madagascar's ability to operate and research aircraft."
 MAD_GERMAN_PLANES_desc: "Accept a German delivery of 30 large transport aircraft and use the expanded fleet to build transport-aircraft expertise and air experience."
 MAD_GERMAN_FLEET_MODERNIZED_desc: "Standardise the imported fleet around common maintenance and operating procedures while expanding Ivato's military air capacity."
 MAD_german_assisted_airforce_desc: "German assistance turns Madagascar's aviation establishment into a small professional military air service, with an air research facility placed in Antananarivo when available or elsewhere in a suitable Malagasy state, fighter research and air-force expertise."
 MAD_SELL_TO_AUSTRAL_desc: "Transfer the struggling carrier into an Air Austral partnership, receiving a cash payment and easier access to foreign investment in exchange for greater private ownership."
 MAD_Austral_offer_desc: "Take the regional network package: expand airport capacity at Antananarivo and Toamasina while improving investment access, productivity and foreign influence."
 MAD_Austral_deal_falls_through_desc: "The Air Austral agreement collapses. The expected partner and restructuring programme disappear, leaving a two-year period of disruption before the national carrier is relaunched."
 MAD_AIRLINE_MILITARY_LINKS_desc: "Bring the state airline into military logistics so civilian aviation can support transport and operational planning when the armed forces need it."
 MAD_AIR_EXPANSION_desc: "Expand Madagascar's domestic aviation network with new air-base capacity in the major regional centres, giving the national network greater reach."
 MAD_AIR_REGIONAL_HUB_desc: "Turn Ivato into a genuine regional aviation hub by expanding Antananarivo and Toamasina airport capacity and improving the country's ability to attract investment."
 MAD_airforce_prod_desc: "Create a small domestic aircraft maintenance and assembly base, pairing a military factory with air-equipment research and a new air specialisation capability."
 MADAGASCAR_AIRLINES_desc: "Relaunch the national carrier after the failed Austral agreement, rebuild its Ivato base and restore the investment and equipment pipeline needed for expansion."
 MAD_OLD_RELIABLE_desc: "Rebuild the carrier around maintenance discipline and operational reliability, reducing aircraft accidents and improving mission efficiency."
 MAD_AIR_BRAND_RESTORED_desc: "Restore Madagascar Airlines' international reputation, strengthening stability, productivity, foreign influence and access to outside investment."
 MAD_Ivato_terminal_runway_upgrade_desc: "Build a larger terminal and runway complex at Ivato, increasing airport capacity and improving national air-force reach, mission efficiency and experience."
 MAD_airforce_modifier: "Madagascan Air Force"

 MAD_dahalo_category: "Dahalo Security"
 MAD_dahalo_category_desc: "Dahalo insecurity remains a permanent drag on the countryside until the network is broken or Remenabila takes power.\nRural cooperation: §Y[?MAD_rural_cooperation|0]/100§! (operations use it; Gendarmerie Reform cuts operation costs by 25%).\nCurrent threat: §Y[?MAD_dahalo_threat|0]/100§!\nSeverity: [GetMAD_DahaloSeverity]"
 MAD_dahalo_modifier: "Dahalo Insecurity"
 MAD_dahalo_modifier_desc: "The economic and internal-security effects imposed by Dahalo activity. The severity changes with the current Dahalo threat level."
 MAD_DAHALO_SEVERITY_SEVERE: "§RSevere§!"
 MAD_DAHALO_SEVERITY_HIGH: "§RHigh§!"
 MAD_DAHALO_SEVERITY_MODERATE: "§YModerate§!"
 MAD_DAHALO_SEVERITY_LOW: "§YLow§!"
 MAD_DAHALO_SEVERITY_MINIMAL: "§GMinimal§!"
 MAD_DAHALO_SEVERITY_DORMANT: "§GSuppressed§!"

 MAD_DAHALO_RURAL_PATROLS: "Gendarmerie Cattle Patrols"
 MAD_DAHALO_RURAL_PATROLS_desc: "Run a 45-day gendarmerie patrol along southern cattle routes. Repeatable."
 MAD_DAHALO_HERD_REGISTRY: "National Herd Registry"
 MAD_DAHALO_HERD_REGISTRY_desc: "Tie cattle movements to the new certificate system, making stolen herds harder to move through legitimate markets."
 MAD_DAHALO_CERTIFICATE_CRACKDOWN: "Crack Down on Certificate Fraud"
 MAD_DAHALO_CERTIFICATE_CRACKDOWN_desc: "Investigate forged ownership papers and the officials, traders and intermediaries who make cattle theft profitable."
 MAD_DAHALO_MILITARY_SWEEP: "Southern Anti-Dahalo Sweep"
 MAD_DAHALO_MILITARY_SWEEP_desc: "Commit army units to a 45-day sweep across southern cattle corridors. Repeatable, but expensive."
 MAD_DAHALO_TANDROKA_TRACKERS: "Organise the Trackers"
 MAD_DAHALO_TANDROKA_TRACKERS_desc: "Build a permanent network of guides and trackers able to follow Dahalo bands beyond the roads and into difficult terrain."
 MAD_DAHALO_ARMS_CRACKDOWN: "Seize Illegal Arms"
 MAD_DAHALO_ARMS_CRACKDOWN_desc: "Turn the new arms controls against bandit networks, confiscating weapons and closing the supply channels that sustain them."
 MAD_DAHALO_RINGLEADER_FIRST: "Hunt the First Ringleader"
 MAD_DAHALO_RINGLEADER_FIRST_desc: "Use the new tracking network to identify and eliminate one of the Dahalo network's senior field commanders."
 MAD_DAHALO_RINGLEADER_SECOND: "Break the Southern Command"
 MAD_DAHALO_RINGLEADER_SECOND_desc: "With one ringleader gone, exploit captured information to dismantle another layer of the network's command structure."
 MAD_DAHALO_RINGLEADER_FINAL: "Hunt the Last Ringleader"
 MAD_DAHALO_RINGLEADER_FINAL_desc: "Commit the remaining intelligence and army resources to destroying the last major Dahalo leadership node."
 MAD_DAHALO_SECURE_SOUTHERN_CATTLE_ROADS: "Secure the Southern Cattle Roads"
 MAD_DAHALO_SECURE_SOUTHERN_CATTLE_ROADS_desc: "With the major bands broken, restore the cattle roads to routine administration and end the extraordinary security regime."
 MAD_REMENABILA_LOCATE: "Locate Remenabila"
 MAD_REMENABILA_LOCATE_desc: "Start a long-running intelligence operation to establish Remenabila's location."
 MAD_REMENABILA_MOUNTAIN_PURSUIT: "Pursue Him Through the Mountains"
 MAD_REMENABILA_MOUNTAIN_PURSUIT_desc: "Move the hunt off the roads and into the terrain where the network has traditionally been hardest to reach."
 MAD_REMENABILA_CAPTURE_SPIRITUAL_ADVISER: "Capture His Spiritual Adviser"
 MAD_REMENABILA_CAPTURE_SPIRITUAL_ADVISER_desc: "Use the network around Remenabila to identify and seize a key adviser who can expose the remaining leadership structure."
 MAD_REMENABILA_FINAL_HUNT: "The Final Hunt for Remenabila"
 MAD_REMENABILA_FINAL_HUNT_desc: "Commit the state to a full-year manhunt. The decision resolves after the operation has run its course."
 MAD_DAHALO_ARM_THE_BANDS: "Arm the Local Bands"
 MAD_DAHALO_ARM_THE_BANDS_desc: "Permit and supply local armed bands as an emergency accommodation route when trust is depleted, but bring manpower at the price of greater Dahalo strength."
 MAD_DAHALO_CATTLE_LEVY: "Cattle Levy"
 MAD_DAHALO_CATTLE_LEVY_desc: "Use the cattle network to raise money and men in a crisis, but the income comes at the price of greater rural insecurity."
 MAD_DAHALO_COUP_D_ARRET: "Launch Coup d'Arrêt"
 MAD_DAHALO_COUP_D_ARRET_desc: "Prepare the 2014 gendarmerie campaign in the southwest. Completing this focus unlocks a timed operation whose result depends on rural cooperation and institutional preparation."
 MAD_COUP_D_ARRET_UNLOCK_TT: "Unlocks the Coup d'Arrêt operation decision."
 MAD_DAHALO_STATUS_TT: "Dahalo threat: §Y[?MAD_dahalo_threat|0]/100§!\nHigher threat reduces agricultural productivity and tax income, raises agricultural labour requirements, makes foreign investment slower and more expensive, lowers stability and increases expected internal-security spending. At 40+ threat, physical drought and famine relief deliveries to the Grand Sud become increasingly vulnerable to theft; higher threat makes each delivery less effective."
 MAD_DAHALO_THREAT_CHANGE_TT: "Dahalo threat changes by the amount shown."
