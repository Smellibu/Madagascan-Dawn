 MAD_madarail_category: "Madarail"

 # --- Investor cycle: mission + decision ---
 MAD_MADARAIL_INVESTOR_TENURE: "Madarail: The Investors’ Patience"
 MAD_MADARAIL_INVESTOR_TENURE_desc: "The consortium’s current suitor will only commit to Madarail if the government keeps it happy. Investor confidence is at §Y[?MAD_madarail_confidence|0]§! out of 100 - it must reach §Y75§! before the investors will commit.\n\nOffer this suitor’s concessions to raise confidence. Offers are only promises: what you conceded takes effect, along with its costs, only once the investors commit. Complete this mission when confidence is high enough. If 150 days pass without a commitment, the suitor leaves, the offers lapse and a new bidder must be chosen. When all three suitors have come and gone, the investors leave for good."
 MAD_MADARAIL_LET_INVESTORS_WALK: "Let the Investors Walk"
 MAD_MADARAIL_LET_INVESTORS_WALK_desc: "The government could stop courting the consortium and let it leave on its own terms. The network will suffer badly until the state takes it back and repairs the damage, but it opens the road to nationalisation."

 MAD_MADARAIL_STAY_UNLOCKED_tt: "The investors have committed to staying"
 MAD_MADARAIL_DESIST_UNLOCKED_tt: "The investors have left the concession"
 MAD_madarail_stay_unlocked_tt: "The §YInvestors Stay§! focus becomes available"
 MAD_madarail_desist_unlocked_tt: "The §YInvestors Desist§! focus becomes available\nThe exodus will cripple the network until the state takes it over and rehabilitates it"


 # --- Ideas: private-era operators (best to worst) ---



 # --- Ideas: state-era operator ---
 MAD_MADARAIL_OPERATOR_STATE_AUSTERE: "Madarail: State-Run (Austere)"
 MAD_MADARAIL_OPERATOR_STATE_AUSTERE_desc: "The state runs Madarail directly, having seized it without compensating the departing investors. Trains run on a shoestring, but they run, and the treasury takes its cut."

 MAD_MADARAIL_OPERATOR_STATE_FUNDED: "Madarail: State-Run (Recapitalised)"
 MAD_MADARAIL_OPERATOR_STATE_FUNDED_desc: "The state runs Madarail directly, having paid off the concession’s debts and recapitalised the network on the way to taking it over. Proper rolling stock, proper yards, proper wages."

 # --- Ideas: the investors’ exit ---
 MAD_MADARAIL_INVESTOR_EXODUS: "Madarail: Investor Exodus"
 MAD_MADARAIL_INVESTOR_EXODUS_desc: "The investors have withdrawn their capital, their managers and their spare parts. Track maintenance has all but stopped, timetables have collapsed and the concession’s creditors are circling. Only state ownership will put the network back on its feet."

 MAD_MADARAIL_EXODUS_AFTERMATH: "Madarail: Legacy of the Exodus"
 MAD_MADARAIL_EXODUS_AFTERMATH_desc: "The state has taken the railway back, but years of neglect and the investors’ hurried exit are still visible on every kilometre of track. A full rehabilitation of the network will finally put it right."

 # --- Focuses added/changed for the new layout ---
 MAD_MADARAIL_TERMINAL_EXPANSION: "Expand the Rail Terminals"
 MAD_MADARAIL_TERMINAL_EXPANSION_desc: "With its concession secure, the consortium is ready to invest in yards, sidings and transfer terminals - on its own timetable and to its own commercial advantage. The state keeps the tracks; the investors keep the margins."
 MAD_RAIL_NATIONAL_NETWORK: "A Railway for the Whole Island"
 MAD_RAIL_NATIONAL_NETWORK_desc: "Joining Antsirabe to Fianarantsoa proves what Madagascar’s engineers have long said: that the island’s railways were never a network, only fragments. The government commits to reaching the coasts the colonial planners never did."
 MAD_FCE_EXTENSION_DECISION_tt: "Unlocks the decision to build the §YAntsirabe - Fianarantsoa§! line\n(15 billion, one year to build)"
 MAD_RAIL_NETWORK_DECISIONS_tt: "Unlocks four decisions to build new lines to §YToliara§!, §YMahajanga§!, §YAmbovombe§! and §YAntsiranana§!\n(15 billion each, one year to build, +80 productivity in the state served)"

 # --- Railway decisions ---

 MAD_MADARAIL_BUILD_FCE_EXTENSION: "Build the Antsirabe - Fianarantsoa Line"
 MAD_MADARAIL_BUILD_FCE_EXTENSION_desc: "Colonial planners drew this 281 km line in 1920 to join the northern network to the isolated Fianarantsoa - Cote Est railway. Engineers kept reviving it into the 1970s, and a memorandum of understanding revived it again on paper. It has never been built.\n\nTakes a year. The state it serves gains 80 productivity."

 MAD_MADARAIL_BUILD_TOLIARA_LINE: "Build the Fianarantsoa - Toliara Line"
 MAD_MADARAIL_BUILD_TOLIARA_LINE_desc: "Run a line down the RN7 corridor from Fianarantsoa to the port of Toliara, reusing what survives of the railways the south already tried: a 1924 line out of Toliara that was laid for 22 of a planned 94 km, and the 1940s Sakoa coal line, of which 90 of 156 km were built and on which no train ever ran.\n\nTakes a year. The state it serves gains 80 productivity."

 MAD_MADARAIL_BUILD_MAHAJANGA_LINE: "Build the Antananarivo - Mahajanga Line"
 MAD_MADARAIL_BUILD_MAHAJANGA_LINE_desc: "The northwest coast has never had a railway worth the name - only a ten-kilometre spur from the Namakia refinery to the quay. A line down the RN4 corridor would finally give the capital a second sea outlet and the port of Mahajanga, already being upgraded, something to feed it.\n\nTakes a year. The state it serves gains 80 productivity."

 MAD_MADARAIL_BUILD_AMBOVOMBE_LINE: "Build the Fianarantsoa - Ambovombe Line"
 MAD_MADARAIL_BUILD_AMBOVOMBE_LINE_desc: "Nobody, colonial or independent, ever put a railway into the arid deep south. A line from Fianarantsoa through Ihosy into Androy would open the far south to trade and the mineral traffic of the Taolagnaro coast.\n\nTakes a year. The state it serves gains 80 productivity."

 MAD_MADARAIL_BUILD_ANTSIRANANA_LINE: "Build the Northern Railway"
 MAD_MADARAIL_BUILD_ANTSIRANANA_LINE_desc: "The far north only ever had a handful of narrow-gauge Decauville lines around Diego-Suarez and a short spur serving the Ambilobe sugar mill. A proper metre-gauge line along the RN6 through Ambilobe and Ambanja would tie the great natural harbour of Antsiranana into the national network at last.\n\nTakes a year. The state it serves gains 80 productivity."

 # --- Event mad_madarail.1: terms of nationalisation ---
 mad_madarail.1.t: "The Terms of Nationalisation"
 mad_madarail.1.d: "Madarail’s investors are ready to walk away from a network they can no longer afford to run. The government must decide how to take it back: simply seize the concession and deal with the consequences, or settle the company’s debts first and take it over on a cleaner footing."
 mad_madarail.1.a: "Seize it - we owe them nothing"
 mad_madarail.1.b: "Pay off the debts and take it over properly"

 # --- Investor cycle events ---
 mad_madarail.3.t: "The Bidders"
 mad_madarail.3.d: "The Madarail concession is up for grabs, and the suitors are circling. Whoever takes it will hold it for 150 days, and each has its own price.\n\n§YComazar§! - international rail specialists. The best operator by far, and the hardest to win over: they start with little confidence and expect operational autonomy.\n§YVecturis§! - a financial investor. Wants guaranteed returns, and will strip assets and raise tariffs if allowed.\n§YThe Holding consortium§! - local and foreign capital. Easy to please, but delivers the least.\n\nOnce seated, a suitor’s concession decisions raise its confidence. Reach §Y75§! and the investors will commit to staying. Your offers only take effect - along with their costs - if they do, and they lapse if the suitor leaves. Each suitor can be chosen only once."
 mad_madarail.3.a: "Bring in Comazar"



 mad_madarail.7.t: "The Investors Stay"
 mad_madarail.7.d: "The suitor in charge has seen enough. With confidence high and its demands met, its board has voted to keep the Madarail concession, recommit capital and stop shopping for a buyer.\n\nEvery concession the government offered now takes effect, costs included, and the state can begin to formalise the renewed partnership."
 mad_madarail.7.a: "A partnership renewed"

 mad_madarail.8.t: "The Investors Walk"
 mad_madarail.8.d: "The government has told the consortium it will not stand in the way of an exit. Within weeks the operator has withdrawn its managers, its spare parts and its remaining capital.\n\nThe network is running down and the concession’s creditors are circling. The state will have to take the railway back, and it will be some time before the damage is undone."
 mad_madarail.8.a: "So be it"

 mad_madarail.9.t: "The Last Operator Leaves"
 mad_madarail.9.d: "Three suitors have come and gone and none was ever persuaded to commit. With no one left to bid, the final shareholders have announced their exit.\n\nThe network is running down and the concession’s creditors are circling. The state will have to take the railway back, and it will be some time before the damage is undone."
 mad_madarail.9.a: "The investors are gone"

 # --- Railway completion events ---
 mad_madarail.20.t: "Antsirabe and Fianarantsoa Are Joined"
 mad_madarail.20.d: "After a century of drawings, memoranda and abandoned surveys, the first train has run from Antsirabe to Fianarantsoa. For the first time the northern network and the Fianarantsoa - Cote Est line are one railway."
 mad_madarail.20.a: "At last"

 mad_madarail.21.t: "The Railway Reaches Toliara"
 mad_madarail.21.d: "Trains now run from Fianarantsoa across the southwestern plateau to the port of Toliara. Where the Sakoa coal line’s rusting track once led nowhere, the state has laid a railway that goes somewhere."
 mad_madarail.21.a: "The southwest is connected"

 mad_madarail.22.t: "The Railway Reaches Mahajanga"
 mad_madarail.22.d: "The first train from the capital has rolled into Mahajanga. The northwest coast finally has a railway, and the port a way to move what it handles."
 mad_madarail.22.a: "The northwest is connected"

 mad_madarail.23.t: "The Railway Reaches Ambovombe"
 mad_madarail.23.d: "The railway has crossed the arid south and reached Ambovombe. What was once a journey of days by road is now a train ride."
 mad_madarail.23.a: "The deep south is connected"

 mad_madarail.24.t: "The Railway Reaches Antsiranana"
 mad_madarail.24.d: "The Northern Railway is open. Antsiranana, whose only trains were ever the narrow-gauge Decauvilles of the colonial era, is now tied into the national network."
 mad_madarail.24.a: "The north is connected"

 # --- Concessions and the new investor-cycle texts ---
 MAD_MADARAIL_CONFIDENCE_MET_tt: "Investor confidence is at least §Y75§!"
 MAD_MADARAIL_CONCEDE_COMAZAR_STOCK: "Fund New Locomotives and Rolling Stock"
 MAD_MADARAIL_CONCEDE_COMAZAR_STOCK_desc: "Offer to co-fund new locomotives and wagons for Comazar’s fleet.\n\nConfidence §G+25§!. This is only an offer: if Comazar commits, it costs §Y5 billion§! and gives +4% rail way speed and +3% terminal speed, but internal investments cost 2% more."
 MAD_MADARAIL_CONCEDE_COMAZAR_AUTONOMY: "Grant Comazar Operational Autonomy"
 MAD_MADARAIL_CONCEDE_COMAZAR_AUTONOMY_desc: "Offer Comazar the freedom to run scheduling, staffing and maintenance without ministry interference.\n\nConfidence §G+30§!. If Comazar commits, ownership shifts toward private and the railway gains +5% rail way speed, but -2% infrastructure tax gain."
 MAD_MADARAIL_CONCEDE_COMAZAR_FREIGHT: "Guarantee Freight Volumes"
 MAD_MADARAIL_CONCEDE_COMAZAR_FREIGHT_desc: "Offer to commit public cargo, and press the mining companies, to minimum volumes on Madarail.\n\nConfidence §G+25§!. If Comazar commits: +0.15 productivity and +1% workforce, but -5% infrastructure tax gain and internal investments cost 5% more."
 MAD_MADARAIL_CONCEDE_VECTURIS_RETURNS: "Guarantee Investor Returns"
 MAD_MADARAIL_CONCEDE_VECTURIS_RETURNS_desc: "Offer Vecturis’s backers a guaranteed minimum return on their capital.\n\nConfidence §G+30§!. If Vecturis commits, it costs §Y2 billion§!: foreign investment costs 5% less and -3% infrastructure tax gain."
 MAD_MADARAIL_CONCEDE_VECTURIS_ASSETS: "Permit Asset Sales"
 MAD_MADARAIL_CONCEDE_VECTURIS_ASSETS_desc: "Offer to let Vecturis sell off depots, land and surplus stock.\n\nConfidence §G+25§!. If Vecturis commits, ownership shifts toward private: +5% infrastructure tax gain, but -5% rail way speed."
 MAD_MADARAIL_CONCEDE_VECTURIS_TARIFFS: "Raise Freight Tariffs"
 MAD_MADARAIL_CONCEDE_VECTURIS_TARIFFS_desc: "Offer to let Vecturis raise freight tariffs to what the market will bear.\n\nConfidence §G+25§!. If Vecturis commits, §R-2% stability§!: -0.3 productivity, +5% infrastructure tax gain, +2% terminal speed."
 MAD_MADARAIL_CONCEDE_HOLDING_COVER: "Provide Political Cover"
 MAD_MADARAIL_CONCEDE_HOLDING_COVER_desc: "Offer the government’s protection for the Holding consortium’s contracts and its friends.\n\nConfidence §G+30§!. If the consortium commits, ownership shifts toward private, §R-2% stability§!: +2% rail way speed, +2% terminal speed."
 MAD_MADARAIL_CONCEDE_HOLDING_HOLIDAY: "Grant a Tax Holiday"
 MAD_MADARAIL_CONCEDE_HOLDING_HOLIDAY_desc: "Offer to exempt the consortium’s terminal investments from tax.\n\nConfidence §G+25§!. If the consortium commits: +4% terminal speed, but -10% infrastructure tax gain, -4% corporate tax gain."
 MAD_MADARAIL_CONCEDE_HOLDING_LOANS: "Arrange State-Bank Loans"
 MAD_MADARAIL_CONCEDE_HOLDING_LOANS_desc: "Offer state banks’ loans to the consortium on favourable terms.\n\nConfidence §G+25§!. If the consortium commits, it costs §Y2.5 billion§!: +3% rail way speed, +2% terminal speed."
 mad_madarail.3.b: "Bring in Vecturis"
 mad_madarail.3.c: "Bring in the Holding consortium"

