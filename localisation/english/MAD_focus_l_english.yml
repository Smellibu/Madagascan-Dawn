 MAD_RURAL_COOPERATION_GUI_BAR_TT: "Rural Cooperation ranges from 0 to 100. Higher cooperation improves drought and emergency-water relief: below 35, relief is 50% less effective; from 35 to below 60, 20% less effective; from 60 to below 80, effectiveness is unchanged; at 80 or above, effectiveness is 20% higher. Monthly change reflects the base recovery rate, constitutional and royal-house policies, Stability, ruling-ideology popularity, drought severity, Dahalo threat, focus milestones, completed rural projects, inflation penalties and active Daewoo or Comazar concessions. Dahalo interference can further weaken emergency-water delivery. The meter cannot fall below 0 or rise above 100."
 MAD_RURAL_COOPERATION_REBUILT_TT: "Successful delivery returns part of the Rural Cooperation committed at launch."
 MAD_RURAL_COOPERATION_SPENT_TT: "Rural Cooperation is committed to this operation at launch."
 MAD_RURAL_CONVENE_RURAL_CONSULTATIONS: "Convene Rural Consultations"
 MAD_RURAL_CONVENE_RURAL_CONSULTATIONS_desc: "Run 60 days of village and district consultations. Repeats after a 180-day cooldown."
 MAD_RURAL_CONSULTATIONS_REWARD_TT: "Consultations have been delivered."
 MAD_RURAL_SERVICES_COMPACT: "Southern Services Compact"
 MAD_RURAL_SERVICES_COMPACT_desc: "A one-off 180-day delivery compact linking the south to services, food relief and local administration. Requires the Drought and Famine focus and a completed Toliara/Ambovombe rail link, Rural Grid or LEAD Connections project. At the end, choose a community-led, gendarmerie-backed or services/logistics model; each route provides a different practical relief package."
 MAD_RURAL_SERVICES_COMPACT_TT: "Requires a completed southern railway, Rural Grid or LEAD Connections project."
 MAD_RURAL_SERVICES_EVENT_T: "Who Should Deliver the Southern Services Compact?"
 MAD_RURAL_SERVICES_EVENT_D: "The Southern Services Compact has completed its 180-day mobilisation of village institutions, logistics and security. The government must now choose how to deliver its results: through community leadership, a gendarmerie-backed approach, or a focus on services and logistics. Each option offers a different balance of cooperation, public order and practical relief."
 MAD_RURAL_SERVICES_EVENT_A: "Let communities lead the delivery"
 MAD_RURAL_SERVICES_EVENT_A_desc: "Restores up to 12 Rural Cooperation (up to 15 with a qualifying local-governance focus), reduces Toliara hunger by 12, grants +2% stability and 15 Political Power. The return respects the 100-point cap."
 MAD_RURAL_SERVICES_EVENT_B: "Put the gendarmerie behind it"
 MAD_RURAL_SERVICES_EVENT_B_desc: "Restores up to 8 Rural Cooperation, reduces live Dahalo threat by 10 and Toliara hunger by 8, grants +2% stability and 5 Army XP. The return respects the 100-point cap."
 MAD_RURAL_SERVICES_EVENT_C: "Prioritise services and logistics"
 MAD_RURAL_SERVICES_EVENT_C_desc: "Restores up to 10 Rural Cooperation, reduces Toliara and Mahajanga hunger by 8 each, adds one infrastructure in Toliara if space permits, and grants +1% stability. The return respects the 100-point cap."
 MAD_RURAL_LOCAL_DEVELOPMENT_GRANTS: "Fund Local Development Projects"
 MAD_RURAL_LOCAL_DEVELOPMENT_GRANTS_desc: "Run 120 days of district-level development grants. Delivery also improves local stability. Repeats after a 180-day cooldown; unavailable when Cooperation is already high."
 MAD_RURAL_LOCAL_DEVELOPMENT_REWARD_TT: "Local development grants have been delivered."
 MAD_RURAL_AUDIT_MINING_REVENUE: "Audit Mining Revenue Distribution"
 MAD_RURAL_AUDIT_MINING_REVENUE_desc: "After establishing the mining local-benefit programme, run a 90-day audit of revenue distribution. Completion reduces corruption and slightly improves stability, subject to the 100-point cap. Repeats once per year."
 MAD_RURAL_MINING_AUDIT_REWARD_TT: "The audit reduces corruption and slightly improves stability."
 MAD_RURAL_COORDINATE_AGRICULTURAL_RELIEF: "Coordinate Agricultural Relief"
 MAD_RURAL_COORDINATE_AGRICULTURAL_RELIEF_desc: "After Drought and Famine, coordinate 90 days of relief while national drought severity exceeds 25. Completion reduces Toliara drought by up to 8 and famine by up to 6, subject to the system's normal minimum severity. Repeats after a 180-day cooldown."
 MAD_RURAL_AGRICULTURAL_RELIEF_REWARD_TT: "Coordinated relief reduces Toliara drought and famine and refreshes the national severity readout."

