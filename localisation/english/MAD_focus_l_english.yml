 MAD_RURAL_COOPERATION_GUI_MONTHLY_VALUE: "[?MAD_rural_cooperation_monthly_change|=+2]/mo"
 MAD_RURAL_COOPERATION_GUI_BAR_TT: "Rural Cooperation ranges from 0 to 100 and sets the starting effectiveness of drought relief: 65% below 35, 85% from 35 to below 60, 100% from 60 to below 80, and 110% at 80 or above. In the Grand Sud, Dahalo threat subtracts 15, 25 or 35 percentage points from physical deliveries; Sud-Est logistics reduces the deduction by 15 points and escorted convoys remove it. The combined rate cannot fall below 40%. Emergency-water protection applies 70% of this combined rate to positive drought growth. Cash transfers and locally constructed wells are exempt from Dahalo supply interference. Monthly change reflects the base recovery rate, constitutional and royal-house policies, Stability, ruling-ideology popularity, drought severity, Dahalo threat, focus milestones, completed rural projects, inflation penalties and active Daewoo or Comazar concessions. The meter cannot fall below 0 or rise above 100."
 MAD_RURAL_COOPERATION_REBUILT_TT: "Successful delivery returns part of the Rural Cooperation committed at launch."
 MAD_RURAL_COOPERATION_SPENT_TT: "Rural Cooperation is committed to this operation at launch."
 MAD_RURAL_CONVENE_RURAL_CONSULTATIONS: "Convene Rural Consultations"
 MAD_RURAL_CONVENE_RURAL_CONSULTATIONS_desc: "Run village and district consultations."
 MAD_RURAL_CONSULTATIONS_REWARD_TT: "Consultations have been delivered."
 MAD_RURAL_SERVICES_COMPACT: "Southern Services Compact"
 MAD_RURAL_SERVICES_COMPACT_desc: "A delivery compact linking the south to services, food relief and local administration. At completion, choose a community-led, gendarmerie-backed or services-and-logistics model; each route provides a different practical relief package."
 MAD_RURAL_SERVICES_COMPACT_TT: "Requires a completed southern railway, Rural Grid or LEAD Connections project."
 MAD_RURAL_SERVICES_EVENT_T: "Who Should Deliver the Southern Services Compact?"
 MAD_RURAL_SERVICES_EVENT_D: "The Southern Services Compact has completed its 180-day mobilisation of village institutions, logistics and security. The government must now choose how to deliver its results: through community leadership, a gendarmerie-backed approach, or a focus on services and logistics. Each option offers a different balance of cooperation, public order and practical relief."
 MAD_RURAL_SERVICES_EVENT_A: "Let communities lead the delivery"
 MAD_RURAL_SERVICES_EVENT_A_desc: "Restores up to 12 Rural Cooperation (up to 15 with a qualifying local-governance focus), reduces Toliara famine by 12, grants +2% stability and 15 Political Power. The return respects the 100-point cap."
 MAD_RURAL_SERVICES_EVENT_B: "Put the gendarmerie behind it"
 MAD_RURAL_SERVICES_EVENT_B_desc: "Restores up to 8 Rural Cooperation, reduces live Dahalo threat by 10 and Toliara famine by 8, grants +2% stability and 5 Army XP. The return respects the 100-point cap."
 MAD_RURAL_SERVICES_EVENT_C: "Prioritise services and logistics"
 MAD_RURAL_SERVICES_EVENT_C_desc: "Restores up to 10 Rural Cooperation, reduces Toliara and Mahajanga famine by 8 each, adds one infrastructure in Toliara if space permits, and grants +1% stability. The return respects the 100-point cap."
 MAD_RURAL_LOCAL_DEVELOPMENT_GRANTS: "Fund Local Development Projects"
 MAD_RURAL_LOCAL_DEVELOPMENT_GRANTS_desc: "Run district-level development grants."
 MAD_RURAL_LOCAL_DEVELOPMENT_REWARD_TT: "Local development grants have been delivered."
 MAD_RURAL_AUDIT_MINING_REVENUE: "Audit Mining Revenue Distribution"
 MAD_RURAL_AUDIT_MINING_REVENUE_desc: "Audit revenue distribution after establishing the mining local-benefit programme."

