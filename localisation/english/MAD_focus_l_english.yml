 # --- the readout ---
 MAD_DROUGHT_STATE_REPORT: "[FROM.GetName]: [FROM.MAD_GetStateDroughtTier]"
 MAD_DROUGHT_STATE_REPORT_desc: "§YDrought§!: §Y[?FROM.MAD_state_drought|0]§!/100 - [FROM.MAD_GetStateDroughtTier]\n§YHunger§!: §Y[?FROM.MAD_state_famine|0]§!/100 - [FROM.MAD_GetStateFamineTier]\n[FROM.MAD_GetStateExposureLine]\n\nA readout only. Use the measures below to do something the oncoming droughts."
 # --- local relief ---
 MAD_DROUGHT_LOCAL_WATER_TRUCKING: "Truck Water to [FROM.GetName]"
 MAD_DROUGHT_LOCAL_WATER_TRUCKING_desc: "Tankers and bladders on the RN7 and the RN10, for this state alone.\n\n§G-6§! drought in §Y[FROM.GetName]§! only. Repeatable every 120 days.\n\n§RIt buys weeks, not years.§! The pressure comes back next month."
 MAD_DROUGHT_LOCAL_FOOD_CONVOY: "Food Convoy to [FROM.GetName]"
 MAD_DROUGHT_LOCAL_FOOD_CONVOY_desc: "WFP lorries and a distribution point in this state.\n\n§G-14§! hunger and §G-2§! drought in §Y[FROM.GetName]§! only. Stability §G+1%§!. Repeatable every 120 days.\n\nFood is not water: this empties the hunger meter, it barely touches the drought."
 MAD_DROUGHT_LOCAL_CASH_FOR_WORK: "Cash for Work in [FROM.GetName]"
 MAD_DROUGHT_LOCAL_CASH_FOR_WORK_desc: "Pay households through Mvola to dig their own water retention works, instead of trucking grain to them.\n\n§G-18§! hunger in §Y[FROM.GetName]§! only. Stability §G+1%§!. Repeatable every 90 days.\n\nThe cheapest and strongest answer to hunger you have. Requires §YMvola Cash Transfers§!.\n\nCooperation changes famine-relief effectiveness: below 35, reductions are 50% weaker; 35-59.99, 20% weaker; 60-79.99, unchanged; 80+, 20% stronger."
 # --- local, permanent ---
 MAD_DROUGHT_LOCAL_SEED_DISTRIBUTION: "Seed for [FROM.GetName]"
 MAD_DROUGHT_LOCAL_SEED_DISTRIBUTION_desc: "Sorghum, cassava and short-cycle rice for this state's planting season. §G-5§! drought, §G-6§! hunger, and this state's fields cope §G5%§! better with every future shock. §YOnce per state.§!\n\nCooperation changes the immediate drought/famine relief: below 35, reductions are 50% weaker; 35-59.99, 20% weaker; 60-79.99, unchanged; 80+, 20% stronger."
 MAD_DROUGHT_LOCAL_WELLS: "Sink Wells in [FROM.GetName]"
 MAD_DROUGHT_LOCAL_WELLS_desc: "Boreholes and solar pumps, so the water is already here and does not have to be driven in.\n\nTakes §Y90 days§!. Then §G-10§! drought, this state takes §G15%§! less from every shock, hunger builds §G40%§! more slowly. §YOnce per state.§!\n\n§RThe water table can still drop.§!\n\nCooperation changes the immediate local drought relief: below 35, reductions are 50% weaker; 35-59.99, 20% weaker; 60-79.99, unchanged; 80+, 20% stronger."
 MAD_DROUGHT_LOCAL_LOCUST_SPRAY: "Spray [FROM.GetName]"
 MAD_DROUGHT_LOCAL_LOCUST_SPRAY_desc: "Put the aircraft and ground teams over this state.\n\n§G-7§! drought and §G-8§! hunger in §Y[FROM.GetName]§! only. Repeatable every 180 days.\n\nRequires §YLocust Invasion Response§!. With §YBiopesticides§!, Rural Cooperation increases by §G+0.5§!. Without them, conventional spraying costs §R−2§! Rural Cooperation and §R−1%§! Stability.\n\nRural Cooperation affects relief: below 35, reductions are 50% weaker; 35-59.99, 20% weaker; 60-79.99, unchanged; 80+, 20% stronger. Dahalo supply interference still applies."
 MAD_drought_local_wells_tt: "In §Y90 days§!: §G-10§! drought here, §G-15%§! exposure to future shocks, and hunger builds more slowly"
 MAD_drought_spray_clean_tt: "Biopesticides avoid the Stability penalty."
 MAD_drought_spray_dirty_tt: "Conventional spraying: Stability §R−1%§!."
