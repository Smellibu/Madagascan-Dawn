 MAD_crop_death: "Crop Death"
 MAD_crop_death_desc: "The harvest did not fail, it stopped existing. What is left of the Grand Sud walks north, leaving empty farms behind and putting enormous pressure on Madagascar’s largest cities."
 MAD_crop_death_south_tt: "§RThe Grand Sud loses 20% of its people:§! §R-20%§! local manpower, §R-20%§! building slots, §R-15%§! construction speed and §R-10%§! supply in every southern state"
