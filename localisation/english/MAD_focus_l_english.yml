 # --- events ---
 mad_drought.10.t: "The Rains Fail"
 mad_drought.10.d: "The rainy season has come and gone with barely a shower in the south. Wells are dropping and the first herds are being sold for whatever they will fetch.\n\nThe better the roads, the sooner the trucks can get through."
 mad_drought.10.a: "Prepare the response"
 mad_drought.11.t: "Food Prices Spike"
 mad_drought.11.d: "The price of rice and cassava has jumped in the markets of Toliara and Fianarantsoa. Families are skipping meals and the bakeries are turning people away."
 mad_drought.11.a: "A hungry season"
 mad_drought.12.t: "The Locusts Return"
 mad_drought.12.d: "Swarms of Malagasy migratory locusts are spreading across the west and south, stripping vegetation and threatening the next harvest. FAO reports that more than half of the country's cultivated land and pastures have already been infested, with as much as two-thirds of the island expected to face infestation by September. Millions of people are at risk as the plague threatens an already vulnerable agricultural economy."
 mad_drought.12.a: "Fight the swarms"
 # --- drought / famine event effect tooltips ---
 mad_drought.33_tt: "[MAD_drought_event_state.GetName]: increased drought exposure."

 mad_drought.13.t: "An El Nino Drought"
 mad_drought.13.d: "A powerful El Nino has brought the worst dry season in the south for decades. Crops have failed in three regions and water sources are falling. The greatest pressure is in Toliara and the Grand Sud."
 mad_drought.13.a: "A national emergency"
 mad_drought.14.t: "The Kere"
 mad_drought.14.d: "After successive failed harvests the Grand Sud is in famine. In Androy and Anosy the word is kere, hunger, and people are eating cactus fruit and clay.\n\nThe world is watching."
 mad_drought.14.a: "Whatever it takes"
 mad_drought.20.t: "The Drought Is Over"
 mad_drought.20.d: "The rains have returned and the boreholes and granaries are holding. For the first time in years the south is no longer waiting on the sky.\n\nThe drought has ended."
 mad_drought.20.a: "At last"
 mad_drought.21.t: "The South Empties"
 mad_drought.21.d: "A year of hunger has emptied villages across the Grand Sud. The people have gone to the cities, to the coast and abroad, and there is no coming back to what they left.\n\nThe fight against the drought cannot be won any more, only endured."
 mad_drought.21.a: "The south has been lost"
 mad_drought.22.t: "The Drought Is Contained"
 mad_drought.22.d: "The boreholes, the seed and the granaries are holding. For the first time the trend in the south is downwards.\n\nThe drought has been contained."
 mad_drought.22.a: "The worst is over"

