 MAD_ARMY_REESTABLISH_DGIDIE: "Reform the DGIDIE"
 MAD_ARMY_REESTABLISH_DGIDIE_desc: "The DGIDIE forms part of Madagascar's internal security apparatus, with responsibilities extending to domestic and external intelligence. Its history is closely tied to the concentration of intelligence powers around the presidency and political security. Reform must establish professional intelligence collection, analysis and national-security coordination rather than the monitoring of political opponents. Clear responsibilities and accountable oversight are essential if the service is to earn public confidence."

 MAD_ARMY_COORDINATE_INTELLIGENCE_SERVICES: "Coordinate the Intelligence Services"
 MAD_ARMY_COORDINATE_INTELLIGENCE_SERVICES_desc: "Create reliable channels for sharing information between the armed forces, gendarmerie, police and territorial authorities. Better coordination will strengthen counter-intelligence and internal security."

 MAD_ARMY_EXPAND_FOREIGN_LIAISONS: "Expand Foreign Liaison"
 MAD_ARMY_EXPAND_FOREIGN_LIAISONS_desc: "Develop professional liaison relationships with friendly intelligence services and improve the ability to assess developments beyond Madagascar's borders."

 MAD_ARMY_BUILD_SIGNALS_CRYPTANALYSIS: "Build Signals and Cryptanalysis"
 MAD_ARMY_BUILD_SIGNALS_CRYPTANALYSIS_desc: "Invest in secure communications, codebreaking and technical intelligence. A small state cannot match major powers in scale, but it can improve the quality and security of the information it collects."


 MAD_POLICY_RC_REQUIRE_1_TT: "Requires at least 1 Rural Cooperation."
 MAD_POLICY_RC_REQUIRE_2_TT: "Requires at least 2 Rural Cooperation."
 MAD_POLICY_RC_REQUIRE_4_TT: "Requires at least 4 Rural Cooperation."

 MAD_POLICY_ROAD_MAINTENANCE: "Regional Road Maintenance Programme"
 MAD_POLICY_ROAD_MAINTENANCE_desc: "Fund district maintenance crews and local road-maintenance contracts. This programme maintains the network already in place rather than constructing another road project."
 MAD_POLICY_FISHERIES_COLD_CHAIN: "Coastal Fisheries and Cold-Chain Agreements"
 MAD_POLICY_FISHERIES_COLD_CHAIN_desc: "Finance landing-site improvements, ice, storage and basic processing around an established port. Choose public facilities or private processing and storage contracts."
 MAD_POLICY_VANILLA_WAREHOUSE_SCHEME: "Vanilla and Clove Warehouse-Receipt Scheme"
 MAD_POLICY_VANILLA_WAREHOUSE_SCHEME_desc: "Help producers store high-value crops, use warehouse receipts as collateral and negotiate sales beyond the immediate harvest period. Choose a public marketing warehouse network or private warehousing and forward-contracting."
 MAD_POLICY_APPRENTICESHIP_COMPACT: "Industrial Apprenticeship and Placement Compact"
 MAD_POLICY_APPRENTICESHIP_COMPACT_desc: "Co-finance technical apprenticeships with state training institutions or employer-led placements. The public model expands publicly funded training; the private model subsidises placements with participating employers."
 MAD_POLICY_DEFENCE_MAINTENANCE: "Defence Depot and Equipment Maintenance Contracts"
 MAD_POLICY_DEFENCE_MAINTENANCE_desc: "Fund refurbishment, depot tooling and maintenance capacity after Madagascar has established a domestic defence-industrial base. Choose state-operated depots or private maintenance contractors."

 MAD_POLICY_ROYAL_BONDS: "Crown-Backed Regional Development Bonds"
 MAD_POLICY_ROYAL_BONDS_desc: "Use the Crown, regional houses and local institutions to guarantee a bond issue for public works outside the capital. This gives customary institutions a financing role without changing land title or the constitutional settlement."
 MAD_POLICY_TAMIMA_EXPORT_SYNDICATES: "TAMIMA Chartered Export Syndicates"
 MAD_POLICY_TAMIMA_EXPORT_SYNDICATES_desc: "Give merchant houses a formal framework to pool capital, organise export logistics and provide working credit to Malagasy exporters. This strengthens private commercial networks but risks concentrating access among established houses."
 MAD_POLICY_MILITARY_ENGINEER_MANDATE: "Military Engineer Corps National Works Mandate"
 MAD_POLICY_MILITARY_ENGINEER_MANDATE_desc: "Place a defined national works programme under the Engineer Corps, focused on bridges, logistics nodes and technically demanding public infrastructure. It expands the military's public-works role without changing command appointments or the CAPSAT/General Staff balance."
 MAD_POLICY_AREMA_MILLING_BOARD: "AREMA Public Milling and Storage Board"
 MAD_POLICY_AREMA_MILLING_BOARD_desc: "Create a state board to finance and operate strategic rice-milling, storage and local processing capacity. The board would link state investment with the procurement, storage and processing of domestic rice."
 MAD_POLICY_TIM_EXPORT_CREDIT: "Export Credit and Supply-Chain Guarantee"
 MAD_POLICY_TIM_EXPORT_CREDIT_desc: "After the 2008 global financial shock, guarantee working capital for exporters and suppliers exposed to falling external demand. The guarantee is channelled through private banks and firms, with the state underwriting part of the risk."
 MAD_POLICY_TGV_VELIRANO_BONDS: "Velirano Infrastructure Delivery Bonds"
 MAD_POLICY_TGV_VELIRANO_BONDS_desc: "Issue sovereign-backed project bonds for the selected Velirano infrastructure portfolio. This can accelerate public delivery, but adds to the state's financing burden."
 MAD_POLICY_HVM_SME_COINVESTMENT: "Malagasy SME Co-Investment Window"
 MAD_POLICY_HVM_SME_COINVESTMENT_desc: "Match private Malagasy SME investment with a limited public co-investment window, including participation by external development-finance partners. This supports private enterprise while retaining a state role in allocating and monitoring the facility."
 MAD_POLICY_GRAZING_RESTITUTION: "Southern Grazing Claims and Restitution Tribunal"
 MAD_POLICY_GRAZING_RESTITUTION_desc: "After the Dahalo campaign and Fahalemana process, address disputed grazing access, lost livestock and local compensation claims. Establish either a public tribunal to assess claims and oversee restitution or privately administered mutual compensation associations to negotiate settlements."
 MAD_POLICY_PLAGUE_SURVEILLANCE: "National Epidemic Surveillance Charter"
 MAD_POLICY_PLAGUE_SURVEILLANCE_desc: "Following the 2017 pneumonic-plague emergency, establish permanent district reporting, contact-tracing and rapid-response arrangements through the health system."
 MAD_POLICY_PLAGUE_SURVEILLANCE_ENACTED: "The national epidemic surveillance charter has been enacted."
 MAD_POLICY_STRATEGIC_SUPPLY_RESERVE: "Strategic Supplier and Domestic Production Reserve"
 MAD_POLICY_STRATEGIC_SUPPLY_RESERVE_desc: "After the 2020 pandemic disruption, build a strategic reserve and use state purchasing contracts to sustain domestic suppliers of essential goods."
 MAD_POLICY_STRATEGIC_SUPPLY_RESERVE_ENACTED: "The strategic supplier and domestic production reserve has been established."

 mad_policy_programmes.1.t: "Who Maintains the Roads?"
 mad_policy_programmes.1.d: "The maintenance programme is ready to move from planning to execution. We can use public district crews under direct state supervision, or contract local private operators against performance standards. Either model requires sustained local participation; the choice determines who controls the work and where the economic benefit is retained."
 mad_policy_programmes.1.a: "Use public district maintenance crews"
 mad_policy_programmes.1.b: "Award performance-based private contracts"
 mad_policy_programmes.2.t: "Who Runs the Cold Chain?"
 mad_policy_programmes.2.d: "The coastal fisheries programme can be organised around publicly operated landing and ice facilities, or privately operated storage and processing contracts. Both models address spoilage and market access, but they distribute control and investment risk differently."
 mad_policy_programmes.2.a: "Build a public landing-site and ice network"
 mad_policy_programmes.2.b: "Contract private cold-storage and processors"
 mad_policy_programmes.3.t: "How Should the Harvest Be Financed?"
 mad_policy_programmes.3.d: "Warehouse receipts can help producers avoid selling the entire crop immediately after harvest. A public marketing network could coordinate storage and sales, while private warehouses and forward contracts could mobilise commercial credit and export buyers."
 mad_policy_programmes.3.a: "Create a public commodity warehouse network"
 mad_policy_programmes.3.b: "Use private warehouses and forward contracts"
 mad_policy_programmes.4.t: "Who Trains the Next Industrial Workforce?"
 mad_policy_programmes.4.d: "The apprenticeship compact is ready. Public technical institutes can provide places directly, or employers can organise placements with a state wage subsidy and agreed training standards."
 mad_policy_programmes.4.a: "Expand publicly funded technical apprenticeships"
 mad_policy_programmes.4.b: "Subsidise employer-led apprenticeship places"
 mad_policy_programmes.5.t: "Who Maintains the Defence Equipment?"
 mad_policy_programmes.5.d: "The defence maintenance programme can be based on state depots and public refurbishment teams, or private contractors operating under procurement and readiness standards. The government must decide whether maintenance capacity will be organised through public services or contracted providers."
 mad_policy_programmes.5.a: "Keep depot maintenance under state control"
 mad_policy_programmes.5.b: "Use private maintenance contractors"
 mad_policy_programmes.6.t: "How Should Grazing Claims Be Settled?"
 mad_policy_programmes.6.d: "The security campaign cannot by itself settle disputes over grazing corridors, missing cattle and damaged livelihoods. A public tribunal could establish uniform claims and restitution procedures. Alternatively, recognised mutual associations could negotiate compensation and local access agreements with less direct state administration."
 mad_policy_programmes.6.a: "Establish a public grazing and restitution tribunal"
 mad_policy_programmes.6.b: "Recognise private mutual compensation associations"

