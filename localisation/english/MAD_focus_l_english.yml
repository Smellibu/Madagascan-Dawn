 # Naval reconstruction and SECREN shipbuilding
# Focuses — Malagasy naval reconstruction
 MAD_REQUEST_FRENCH_CORVETTES: "Acquire French Tripartite Minehunters"
 MAD_REQUEST_FRENCH_CORVETTES_desc: "France's Tripartite-class minehunters offer Madagascar an opportunity to acquire specialised vessels for protecting port approaches and keeping important maritime routes clear of mine threats. The transfer of Pégase and Orion would provide an immediate mine-countermeasure capability while the Navy develops its wider fleet and SECREN rebuilds its domestic ship-support capacity. Operating these vessels would require specialist crews, equipment and a dependable maintenance arrangement with France."
 MAD_NAVAL_FORCE_REVIEW: "Review the Fleet"
 MAD_NAVAL_FORCE_REVIEW_desc: "A review of the fleet's condition reveals the practical limits of Madagascar's maritime presence: ageing hulls, scarce spares, and crews whose readiness is constrained by maintenance more than ambition."
 MAD_RESTORE_SECREN_NAVAL_SUPPORT: "Restore Naval Support at Antsiranana"
 MAD_RESTORE_SECREN_NAVAL_SUPPORT_desc: "SECREN at Antsiranana carries forward Madagascar's industrial history in ship repair and construction. Restoring its workshops and technical workforce offers a national foundation for maintaining vessels without relying on foreign yards for every major repair."
 MAD_REORGANISE_NAVAL_DETACHMENTS: "Reorganise Naval Detachments"
 MAD_REORGANISE_NAVAL_DETACHMENTS_desc: "Madagascar's long coastline and widely separated ports complicate patrols from a single centre. Regional naval detachments can bring crews, local knowledge and response vessels closer to the waters they are expected to monitor."
 MAD_MARITIME_INFORMATION_FUSION: "Connect the Maritime Information Network"
 MAD_MARITIME_INFORMATION_FUSION_desc: "Fisheries authorities, customs officers and naval patrols often observe different parts of the same maritime picture. Sharing reports and coordinating with regional information centres makes suspicious traffic easier to track across jurisdictions."
 MAD_NAVAL_MAINTENANCE_TRAINING: "Train the Naval Engineers"
 MAD_NAVAL_MAINTENANCE_TRAINING_desc: "A vessel on paper does not guarantee a vessel at sea. Engineers, technical ratings and consistent maintenance routines determine whether a small fleet remains available through saltwater corrosion, long distances and irregular supply chains."
 MAD_COASTAL_SURVEILLANCE_NETWORK: "Watch the Coastal Approaches"
 MAD_COASTAL_SURVEILLANCE_NETWORK_desc: "The channels around Madagascar are used by fishing vessels, commercial shipping and small craft that are difficult to monitor continuously. Shore-based observation and reliable communications help patrols direct limited attention where it is needed most."
 MAD_FAST_INTERCEPTOR_PROGRAMME: "Expand Rapid Interception"
 MAD_FAST_INTERCEPTOR_PROGRAMME_desc: "Small, fast boats are useful for boarding suspicious craft and responding to incidents near ports and fishing grounds. They cannot replace an offshore patrol vessel, but they can cover short distances quickly and support maritime enforcement."
 MAD_JOINT_MARITIME_OPERATIONS: "Coordinate Maritime Enforcement"
 MAD_JOINT_MARITIME_OPERATIONS_desc: "Illegal fishing, smuggling and search-and-rescue incidents cross the responsibilities of several Malagasy agencies. A common operating picture and agreed procedures allow ships, customs teams and fisheries inspectors to cooperate rather than duplicate effort."
 MAD_SECREN_TECHNICAL_TRAINING: "Train a New Generation of Naval Engineers"
 MAD_SECREN_TECHNICAL_TRAINING_desc: "A sustainable shipbuilding workforce needs welders, marine engineers, electricians, designers and quality inspectors. Training alongside practical repair work helps SECREN retain technical knowledge that otherwise disappears between contracts."
 MAD_MODULAR_HULL_ASSEMBLY: "Establish Modular Hull Assembly"
 MAD_MODULAR_HULL_ASSEMBLY_desc: "Modern commercial and naval vessels rely on accurately fabricated sections assembled to repeatable standards. Developing modular construction practices would allow Antsiranana's yard to learn from small craft before attempting a more complicated combatant."
 MAD_STANDARDISE_MARINE_PROPULSION: "Standardise Marine Engineering"
 MAD_STANDARDISE_MARINE_PROPULSION_desc: "Engines, generators, gearboxes and control systems are expensive to keep running when every vessel requires different spares and specialist knowledge. Common marine engineering standards can simplify procurement and maintenance across a small fleet."
 MAD_DRAFT_THE_MALAGASY_CORVETTE: "Set the Malagasy Corvette Requirements"
 MAD_DRAFT_THE_MALAGASY_CORVETTE_desc: "The proposed corvette must suit Madagascar's extensive maritime zone, limited maintenance base and reliance on foreign components. Endurance, reliability, crew size and ease of repair matter as much as combat performance in defining the vessel."
 MAD_NAVAL_DESIGN_OFFICE: "Establish a Naval Design Office"
 MAD_NAVAL_DESIGN_OFFICE_desc: "A permanent design team coordinates shipyard engineers, naval officers and external specialists. It turns operational experience into requirements, plans and technical documentation that can be retained locally rather than lost when a foreign contract ends."
 MAD_CORVETTE_PROTOTYPE_HULL: "Assemble the Prototype Hull"
 MAD_CORVETTE_PROTOTYPE_HULL_desc: "The first hull tests whether domestic fabrication, imported machinery and the selected construction method can be integrated safely. A prototype reveals practical problems in assembly and maintenance before the design is repeated across a class."
 MAD_INTEGRATE_NAVAL_SENSORS_AND_WEAPONS: "Integrate the Combat Systems"
 MAD_INTEGRATE_NAVAL_SENSORS_AND_WEAPONS_desc: "A combatant's usefulness depends on its sensors, communications, weapons and command systems working together. Integrating these systems is a separate engineering challenge from building the hull, especially when components come from several foreign suppliers."
 MAD_CORVETTE_SEA_TRIALS: "Begin the Sea Trials"
 MAD_CORVETTE_SEA_TRIALS_desc: "Sea trials expose problems that cannot be fully predicted in a workshop: handling in rough water, engine reliability, endurance, sensor performance and the crew's ability to operate the ship safely over extended patrols."
 MAD_STANDARDISE_THE_CORVETTE_CLASS: "Standardise the Malagasy Corvette"
 MAD_STANDARDISE_THE_CORVETTE_CLASS_desc: "A class of ships is easier to sustain when vessels share machinery, layout, components and training requirements. Standardisation also lets the yard learn from early construction and avoid turning every new ship into a separate engineering project."
 MAD_LOCAL_NAVAL_COMPONENTS: "Build the Naval Supply Chain"
 MAD_LOCAL_NAVAL_COMPONENTS_desc: "Local suppliers can contribute fabricated sections, cables, fittings, workshop services and selected mechanical components even when advanced sensors or engines must be imported. Building this support network gives the shipyard a broader industrial base than a single contract."
 MAD_ESTABLISH_THE_FIRST_CORVETTE_SQUADRON: "Form the First Corvette Squadron"
 MAD_ESTABLISH_THE_FIRST_CORVETTE_SQUADRON_desc: "A new ship class requires crews, maintainers, command arrangements, spare parts and a sustainable operating schedule. Bringing these elements together is what turns a completed vessel into a dependable naval capability."
 MAD_WESTERN_INDIAN_OCEAN_DOCTRINE: "Adopt the Western Indian Ocean Doctrine"
 MAD_WESTERN_INDIAN_OCEAN_DOCTRINE_desc: "Madagascar's maritime interests centre on a vast island coastline, busy regional sea routes and a limited ability to keep ships deployed continuously. A national doctrine must balance patrol, presence and combat roles with the fleet the country can maintain."
 MAD_NAVAL_HELICOPTER_DETACHMENT: "Establish a Naval Helicopter Detachment"
 MAD_NAVAL_HELICOPTER_DETACHMENT_desc: "Helicopters can extend a ship's ability to search, observe and respond beyond the horizon. A naval detachment needs trained aircrew, maintainers, communications procedures and support facilities before shipboard aviation becomes a practical capability."
 MAD_SHIPBORNE_HELICOPTER_DOCTRINE: "Develop Shipborne Helicopter Operations"
 MAD_SHIPBORNE_HELICOPTER_DOCTRINE_desc: "Operating aircraft from a moving vessel requires coordinated bridge, flight-crew and deck procedures. Training and doctrine must address safe flight operations, maintenance at sea, reconnaissance hand-offs and the limits imposed by weather and deck space."
 MAD_SECREN_FLIGHT_DECK_ENGINEERING: "Study Flight-Deck and Hangar Construction"
 MAD_SECREN_FLIGHT_DECK_ENGINEERING_desc: "An aviation-capable vessel demands far more than a landing area. Hangar arrangements, fuel safety, structural reinforcement, firefighting and maintenance access require specialised design work and cooperation between shipbuilders and aviation engineers."
 MAD_HELICOPTER_OPERATOR_CONCEPT: "Develop the Helicopter-Operator Concept"
 MAD_HELICOPTER_OPERATOR_CONCEPT_desc: "A helicopter-operating ship would represent a major change in Madagascar's naval ambitions. Any credible concept depends on a proven surface fleet, trained aviation personnel, technical partners and a realistic plan for building and maintaining the vessel over its lifetime."

 # SECREN Military Industrial Organisation
 MAD_SECREN_shipbuilding: "SECREN Naval Works"
 MAD_SECREN_shipbuilding_trait: "Repair-Yard Foundations"
 MAD_SECREN_shipbuilding_trait_desc: "The yard's core strength is maintaining existing vessels and learning through practical repair work."
 MAD_SECREN_shipbuilding_header_hull: "Hull Construction"
 MAD_SECREN_shipbuilding_header_systems: "Systems Integration"
 MAD_SECREN_shipbuilding_header_production: "Production and Sustainment"
 MAD_SECREN_trait_modular_hulls: "Modular Hull Fabrication"
 MAD_SECREN_trait_modular_hulls_desc: "Repeatable sections and common assembly standards reduce rework across small-ship and corvette construction."
 MAD_SECREN_trait_tropical_corrosion_control: "Tropical Corrosion Control"
 MAD_SECREN_trait_tropical_corrosion_control_desc: "Protective coatings, inspection routines and maintainable fittings are adapted to heat, humidity and salt exposure."
 MAD_SECREN_trait_local_shipyard_sustainment: "Local Shipyard Sustainment"
 MAD_SECREN_trait_local_shipyard_sustainment_desc: "A stronger local maintenance network lowers dependence on external yards for routine work."
 MAD_SECREN_trait_sensors_and_combat_systems: "Sensor and Combat-System Integration"
 MAD_SECREN_trait_sensors_and_combat_systems_desc: "Technical staff learn to integrate imported sensors and communications with the ship's core design."
 MAD_SECREN_trait_local_weapon_integration: "Local Weapon Integration"
 MAD_SECREN_trait_local_weapon_integration_desc: "Standard interfaces and local fitting expertise help integrate light naval armament with fewer bespoke modifications."
 MAD_SECREN_trait_repeatable_quality_control: "Repeatable Quality Control"
 MAD_SECREN_trait_repeatable_quality_control_desc: "Documented checks and production learning reduce variation between successive vessels."
 MAD_SECREN_trait_national_supply_chain: "National Marine Supply Chain"
 MAD_SECREN_trait_national_supply_chain_desc: "Domestic suppliers and technical institutions become more closely connected to the shipyard's production work."
 MAD_SECREN_trait_indian_ocean_corvette_design: "Indian Ocean Corvette Design"
 MAD_SECREN_trait_indian_ocean_corvette_design_desc: "A locally sustained design balances endurance, structural strength and practical maintenance for regional waters."
 MAD_corvette_cooperation: "Corvette Industrial Cooperation"

 # Narrative events — Chapter I
 mad_naval.1.t: "A Navy for Madagascar"
 mad_naval.1.d: "The government has completed its first review of the Navy's condition. Senior officers and civilian planners have set out competing ideas for the future of Malagasy sea power, and the cabinet must now choose the direction of its naval programme."
 mad_naval.1.a: "Concentrate on coastal presence"
 mad_naval.1.b: "Prepare the fleet for offshore duties"
 mad_naval.1.c: "Rebuild the national naval industry"

 # Narrative events — Chapter II
 mad_naval.2.t: "The First Modernisation Package"
 mad_naval.2.d: "The first modernisation phase is complete. The Navy's leadership has identified the next stage of its development, but limited resources mean the government must decide which part of the service should take priority."
 mad_naval.2.a: "Strengthen maintenance and readiness"
 mad_naval.2.b: "Build a shared coastal surveillance picture"
 mad_naval.2.c: "Improve rapid-interception capability"

 # Narrative events — Chapter III
 mad_naval.3.t: "Who Designs the Malagasy Corvette?"
 mad_naval.3.d: "The requirements for a new Malagasy corvette have been established. The government must now decide how the design should be developed and how much of the work should be undertaken at home."
 mad_naval.3.a: "Obtain a foreign production licence"
 mad_naval.3.b: "Continue joint development without a foreign partner"
 mad_naval.3.b_fra: "Offer joint corvette development to France"
 mad_naval.3.b_kor: "Offer joint corvette development to South Korea"
 mad_naval.3.c: "Develop a domestic design in stages"

 # Narrative events — Chapter IV
 mad_naval.4.t: "Set the Corvette's Mission Profile"
 mad_naval.4.d: "The corvette's preliminary design and sea trials are complete. The final review will determine the character of the ship before the programme moves forward."
 mad_naval.4.a: "Prioritise maritime patrol and surveillance"
 mad_naval.4.b: "Prioritise coastal defence and naval guns"
 mad_naval.4.c: "Prioritise a general-purpose systems fit"

 # Narrative events — Chapter V
 mad_naval.5.t: "A Fleet With a Future"
 mad_naval.5.d: "The locally sustained corvette programme has become a realistic long-term naval objective. The government must now decide how far to extend its ambitions for the fleet."
 mad_naval.5.a: "Expand the corvette force"
 mad_naval.5.b: "Pursue a helicopter-operator programme"
 MAD_NAVAL_HELICOPTER_FOCUSES_UNLOCKED_TT: "Unlocks the helicopter operator focuses"

 # Narrative events — Optional capstone
 mad_naval.6.t: "The Next Generation of the Malagasy Fleet"
 mad_naval.6.d: "The helicopter-operator concept has brought shipbuilders, naval officers and aviation specialists into the same programme. Madagascar is ready to make one proposal to a foreign partner. A refusal will end the proposal; it will not be redirected to another country."
 mad_naval.6.a: "Send the partnership proposal to France"
 mad_naval.6.a_kor: "Send the partnership proposal to South Korea"
 mad_naval.6.a_chi: "Send the partnership proposal to China"
 mad_naval.6.b: "Keep the project under Malagasy design authority"

 # French corvette purchase
 mad_naval.7.t: "Madagascar Offers to Buy Two Tripartite Minehunters"
 mad_naval.7.d: "Madagascar has asked France to sell two Tripartite-class minehunters, Pégase and Orion, for a total of $5 billion. The vessels would provide a near-term mine-countermeasure capability in the western Indian Ocean. The sale would bring revenue and strengthen the defence relationship while releasing two ageing vessels from French service."
 mad_naval.7.a: "Approve the sale"
 mad_naval.7.b: "Decline the request"
 mad_naval.8.t: "The French Minehunter Purchase Is Approved"
 mad_naval.8.d: "France has approved the sale. The two Tripartite-class minehunters, Pégase and Orion, have been transferred to the Malagasy Navy."
 mad_naval.8.a: "Put the vessels into service"
 MAD_french_corvette_sale_refused: "France refused the corvette sale"
 MAD_offer_refused: "Declined Madagascar's proposal"
 mad_naval.9.t: "France Declines the Minehunter Sale"
 mad_naval.9.d: "The French government has declined Madagascar's request to acquire Pégase and Orion. The proposed transfer will not go ahead, and the Malagasy Navy must continue its development plans without the two minehunters."
 mad_naval.9.a: "Continue with the existing fleet"

 # Corvette co-development proposal
 mad_naval.10.t: "Madagascar Proposes Corvette Co-Development"
 mad_naval.10.d: "Madagascar has approached [This.GetNameDef] to explore cooperation on a new Malagasy corvette. The proposal would bring the two countries into a long-term shipbuilding partnership centred on SECREN."
 mad_naval.10.a: "Support the Malagasy programme"
 mad_naval.10.b: "Decline the proposal"
 mad_naval.11.t: "Corvette Co-Development Agreement with [FROM.GetNameDef]"
 mad_naval.11.d: "[FROM.GetNameDef] has accepted Madagascar's proposal to cooperate on a new corvette at SECREN. The agreement marks the beginning of a new chapter in Malagasy naval shipbuilding."
 mad_naval.11.a: "Begin the SECREN expansion"


 # Helicopter-operator partnership proposal
 mad_naval.12.t: "Madagascar Proposes Helicopter-Operator Cooperation"
 mad_naval.12.d: "Madagascar has approached [This.GetNameDef] to discuss cooperation on a helicopter-operator programme. The proposal is part of the country's longer-term ambition to develop a more capable navy and a domestic maritime-industrial base."
 mad_naval.12.a: "Support the Malagasy helicopter-operator programme"
 mad_naval.12.b: "Decline the proposal"
 mad_naval.13.t: "Helicopter-Operator Partnership with [FROM.GetNameDef]"
 mad_naval.13.d: "[FROM.GetNameDef] has accepted Madagascar's proposal to cooperate on a helicopter-operator programme. The agreement marks an important step in the development of Madagascar's naval ambitions."
 mad_naval.13.a: "Begin the SECREN expansion"
 mad_naval.14.t: "[FROM.GetNameDef] Declines the Corvette Partnership"
 mad_naval.14.d: "[FROM.GetNameDef] has declined Madagascar's proposal for joint corvette development at SECREN. No agreement has been reached, and the proposal will not be offered to another country."
 mad_naval.14.a: "Continue without the foreign partner"
 mad_naval.15.t: "[FROM.GetNameDef] Declines the Helicopter-Operator Partnership"
 mad_naval.15.d: "[FROM.GetNameDef] has declined Madagascar's proposal for helicopter-operator cooperation. The proposed partnership will not proceed, and Madagascar will not approach another country with this offer."
 mad_naval.15.a: "Continue without the foreign partner"

