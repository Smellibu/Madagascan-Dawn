 MAD_drought_phase_failed: "§RThe south is emptying.§! The drought cannot be beaten any more; it can only be endured until the number reaches zero."
 MAD_drought_phase_won: "§GThe drought is beaten.§! It recedes month by month."
 MAD_drought_phase_lost: "§RThe fight is lost.§! Keep working until the number reaches zero."
