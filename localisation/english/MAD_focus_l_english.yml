 MAD_POLICY_STRATEGIC_SUPPLY_RESERVE_IDEA: "Strategic Supplier and Domestic Production Reserve"
 MAD_POLICY_STRATEGIC_SUPPLY_RESERVE_IDEA_desc: "State purchasing and strategic reserves help sustain domestic suppliers of essential goods during external disruptions."

