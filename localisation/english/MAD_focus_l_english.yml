 MAD_JIRAMA: "Audit the Grid"
 MAD_JIRAMA_desc: "Map the generation and distribution problems before deciding where scarce capital should go. The programme improves the system slightly and opens the utility branch."
 MAD_JIRAMA_MAINTENANCE: "Repair Before Expansion"
 MAD_JIRAMA_MAINTENANCE_desc: "Put money into maintenance before chasing new megawatts. Existing equipment becomes more productive and thermal generation wastes less fuel."
 MAD_JIRAMA_BILL_COLLECTION: "Read Every Meter"
 MAD_JIRAMA_BILL_COLLECTION_desc: "Commercial losses are power that JIRAMA generates but never gets paid for. Metering and collection reduce electricity waste and improve revenue, while businesses face tighter enforcement."
 MAD_JIRAMA_GRID_REINFORCEMENT: "Transformers First"
 MAD_JIRAMA_GRID_REINFORCEMENT_desc: "Prepare a national reinforcement of the distribution system. The focus itself improves the network slightly; the actual grid upgrade is financed through a treasury decision."
 MAD_RURAL_ENERGY: "Extend the Last Mile"
 MAD_RURAL_ENERGY_desc: "Take reliable electricity beyond the main urban networks. The policy reduces rural energy costs and unlocks the actual connection programme."
 MAD_HYDROLECT_FUEL_PP: "Run the Hydro First"
 MAD_HYDROLECT_FUEL_PP_desc: "Use Madagascar's hydroelectric fleet harder and lean less on expensive thermal generation. Better utilisation also makes later renewable investment cheaper to operate."
 MAD_JIRAMA_ANDEKALEKA: "Expand Andekaleka"
 MAD_JIRAMA_ANDEKALEKA_desc: "Prepare the Andekaleka expansion and rehabilitation. The focus improves hydro readiness; the full expansion is paid for and completed through a two-year construction decision."
 MAD_JIRAMA_VOLOBE_AMONT: "Finance Volobe Amont"
 MAD_JIRAMA_VOLOBE_AMONT_desc: "Get the financing package moving for Volobe Amont. This prepares the project and improves financing conditions; the final deal and construction still require years of work."
 MAD_JIRAMA_PRIVATIZATION_FORK: "Who Owns the Wires?"
 MAD_JIRAMA_PRIVATIZATION_FORK_desc: "Choose how Madagascar will manage its electricity utility: commercial discipline and private capital, or a stronger publicly backed JIRAMA."
 MAD_JIRAMA_CORPORATIZE: "Turn JIRAMA into a Utility Company"
 MAD_JIRAMA_CORPORATIZE_desc: "Separate utility management from direct political control, attract private capital and make JIRAMA easier to finance. Investors gain influence and political support comes at a cost."
 MAD_JIRAMA_STAY_PUBLIC: "Keep the Grid Public"
 MAD_JIRAMA_STAY_PUBLIC_desc: "Keep JIRAMA publicly owned and give the state a cheaper route to finance renewable projects and internal investment."
 MAD_JIRAMA_IMF_PLAN: "JIRAMA Reform Framework"
 MAD_JIRAMA_IMF_PLAN_desc: "Set out the recovery framework around lower losses, efficient generation, financial reform and increased access. This is the reform architecture; the next focus is the political decision on how to implement it."
 MAD_IMF_REVIEW_2025: "Adopt the JIRAMA Recovery Plan"
 MAD_IMF_REVIEW_2025_desc: "Bring the JIRAMA recovery plan to a final political decision. This triggers the branch's one major event: tariffs, state recapitalisation or competitive private contracts."
 MAD_JIRAMA_RECOVERY_FAILS: "Run an Austerity Rescue"
 MAD_JIRAMA_RECOVERY_FAILS_desc: "Use hard cost control, fuel savings and cheaper internal investment to keep JIRAMA functioning. The utility improves, but household and business pain makes the politics uglier."
 MAD_JIRAMA_RECOVERY_SUCCEEDS: "Fund the Expansion"
 MAD_JIRAMA_RECOVERY_SUCCEEDS_desc: "With generation and network projects already underway, commit to investment-led expansion. The stronger system now supports faster productivity and renewable growth."
 MAD_JIRAMA_TWO_GENERATION_PROJECTS_tt: "At least two generation projects have been completed"
 MAD_JIRAMA_GENERATION_120_PERCENT_tt: "Electricity generation is at least 120% of electricity consumption"
 MAD_ELECTRICITY_FOR_ALL: "Light the Whole Island"
 MAD_ELECTRICITY_FOR_ALL_desc: "Make reliable electricity a national development objective. The final package lowers energy burdens, raises productivity and turns the earlier generation and access investments into an economy-wide advantage."

 # --- JIRAMA project decisions ---
