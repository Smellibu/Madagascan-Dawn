 MAD_RURAL_COOP_FOCUS_GAIN_6_TT: "Monthly Rural Cooperation: §G+0.25§!"
 MAD_RURAL_COOP_FOCUS_GAIN_GENDARMERIE_TT: "Monthly Rural Cooperation: §G+0.50§!\nDahalo/security operations cost 25% less Rural Cooperation."
