 MAD_DROUGHT_RESETTLED: "Resettled Families"
 MAD_DROUGHT_DISPLACEMENT_OVERLOAD: "Refugee Pressure"
 MAD_DROUGHT_DISPLACEMENT_OVERLOAD_desc: "This state has at least 50,000 of its own residents still displaced by drought. Construction speed is reduced by 20% until fewer than 50,000 of its displaced residents remain away, whether elsewhere in Madagascar or abroad."
 MAD_FARMER_FUNDING: "Farmer Funding"
 MAD_FUND_THE_FARMERS: "Redirect Funds to Malagasy Farmers"
 MAD_FUND_THE_FARMERS_desc: "With the concession abandoned, direct resources toward Malagasy smallholders instead. Support for farmers can help preserve local production and rural livelihoods, although it does not provide the foreign capital or export logistics promised by the Daewoo proposal."
 MAD_DEAL_KEPT_FAILED: "The Deal Collapses"
 MAD_DEAL_KEPT_FAILED_desc: "The viability deadline expired before the government could settle the lease terms. The concession collapses, the government falls, and the state must pay the costs of the failed agreement."
 # --- decisions ---
 MAD_DROUGHT_EMERGENCY_WATER: "Provide Emergency Water Relief to [FROM.GetName]"
 MAD_DROUGHT_FOOD_AID_APPEAL: "Food Aid Appeal for [FROM.GetName]"
 MAD_DROUGHT_FOOD_AID_APPEAL_desc: "A 30-day food-aid programme for §Y[FROM.GetName]§!. It reduces local drought and hunger; while it runs, no other food-aid programme can start.\n\nCooperation changes relief effectiveness: below 35, reductions are 50% weaker; 35-59.99, 20% weaker; 60-79.99, unchanged; 80+, 20% stronger."
 MAD_DROUGHT_SEED: "Distribute Drought-Tolerant Seed"
 MAD_DROUGHT_SEED_desc: "Sorghum, cassava and short-cycle rice for farmers in the south.\n\nA permanent measure."
 MAD_DROUGHT_EARLY_WARNING: "Build an Early-Warning System"
 MAD_DROUGHT_EARLY_WARNING_desc: "Rainfall monitoring and food-security forecasts, so the government moves before the harvest fails. Establish a warning network.\n\nA permanent measure; the coming droughts hit less hard."
 MAD_DROUGHT_BOREHOLES: "Drill Boreholes in the Grand Sud"
 MAD_DROUGHT_BOREHOLES_desc: "Wells and solar pumps for the villages of the deep south.\n\nA permanent measure."
 MAD_DROUGHT_SUD_EST: "Water and Roads for the South-East"
 MAD_DROUGHT_SUD_EST_desc: "Reservoirs, feeder roads and grain depots along the railway.\n\nA permanent measure."
 MAD_DROUGHT_CLIMATE_ADAPTATION: "Climate Adaptation Programme"
 MAD_DROUGHT_CLIMATE_ADAPTATION_desc: "Reforestation, soil conservation and terracing, funded for the long term.\n\nA permanent measure."
 MAD_DROUGHT_GRAIN_RESERVE: "Establish a Grain Reserve"
 MAD_DROUGHT_GRAIN_RESERVE_desc: "Warehouses of rice and maize that feed the schools when the harvest fails.\n\nStability §G+1%§!. A permanent measure."
 MAD_DROUGHT_LOCUST_WATCH: "Locust Monitoring Network"
 MAD_DROUGHT_LOCUST_WATCH_desc: "Formalise the monitoring network as a permanent drought-prevention measure."
 MAD_DROUGHT_RESETTLE: "Resettle the Displaced"
 MAD_DROUGHT_RESETTLE_desc: "Help internally displaced families return to their recorded home regions. Each operation can resettle up to 20,000 people, limited by the remaining displacement."
 MAD_DROUGHT_EXPAT_RETURN: "Facilitate Return from Abroad"
 MAD_DROUGHT_EXPAT_RETURN_desc: "Offer travel, documentation and reintegration assistance to displaced Malagasy communities who settled abroad. Returns are limited by the living diaspora and people still abroad."
 MAD_DROUGHT_FINAL_PUSH: "The Final Push"
 MAD_DROUGHT_FINAL_PUSH_desc: "The drought is beaten. One last programme to lay it to rest for good.\n\nSeverity §G-25§!."
