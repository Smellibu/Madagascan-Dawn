 ###### Ownership BOP decisions ######
 MAD_OWNERSHIP_BOP: "Economic Ownership and Development"
 MAD_OWNERSHIP_BOP_desc: "Use public and private programmes to shape economic development, or transfer selected state enterprises to private ownership. Each completed policy shifts the balance towards public provision or private enterprise."

 MAD_SELL_TELMA_PRIVATE: "Privatise TelMa"
 MAD_SELL_TELMA_PRIVATE_desc: "Sell TelMa back into private hands after its nationalisation."

 MAD_SELL_AIRLINE_PRIVATE: "Privatise Madagascan Airlines"
 MAD_SELL_AIRLINE_PRIVATE_desc: "Return Madagascan Airlines to private ownership after successful state control."

 MAD_SELL_JIRAMA_PRIVATE: "Privatise JIRAMA"
 MAD_SELL_JIRAMA_PRIVATE_desc: "Return JIRAMA to private ownership after choosing the public model."

 MAD_SELL_MADARAIL_PRIVATE: "Privatise Madarail"
 MAD_SELL_MADARAIL_PRIVATE_desc: "Sell Madarail back into private hands after nationalisation."

 MAD_SELL_GPM_PRIVATE: "Privatise Fuel Distribution"
 MAD_SELL_GPM_PRIVATE_desc: "Return the state-controlled fuel distribution system to private ownership."

 MAD_SELL_AMBATOVY_PRIVATE: "Privatise Ambatovy"
 MAD_SELL_AMBATOVY_PRIVATE_desc: "Return Ambatovy to private control after state participation."

 MAD_Rosewood: "Rosewood Controls"
 MAD_Rosewood_desc: "Madagascar's rosewood trade has left behind seized stockpiles, international scrutiny and a corruption problem that cannot be solved by a simple ban. First establish what the state actually controls, then decide whether to prioritise strict traceability or controlled domestic use."
 MAD_ROSEWOOD_STOCKPILE_AUDIT: "Audit the Rosewood Stockpiles"
 MAD_ROSEWOOD_STOCKPILE_AUDIT_desc: "Inventory, mark and secure the seized rosewood and ebony stockpiles. A credible chain of custody is the first condition for doing anything useful with timber already in state hands."
 MAD_ROSEWOOD_CITES_TRACEABILITY: "Enforce CITES Traceability"
 MAD_ROSEWOOD_CITES_TRACEABILITY_desc: "Keep the stockpile under strict verification and traceability rules. Madagascar's international credibility matters more than a quick sale, and a clean chain of custody can support conservation-linked investment and tourism."
 MAD_ROSEWOOD_DOMESTIC_USE: "Authorise Controlled Domestic Use"
 MAD_ROSEWOOD_DOMESTIC_USE_desc: "Permit verified stockpiles to be used inside Madagascar for public buildings and tightly controlled artisan production. This releases some trapped value now, but a politicised enforcement system makes leakage and corruption more likely."

 MAD_SPAT: "SPAT Operations Continue"
 MAD_SPAT_desc: "Keep Toamasina under its autonomous public port authority. SPAT keeps the port in domestic hands, but it must become more commercially capable if it is to carry the expansion burden itself."
 MAD_SPAT_STRENGTHEN_AUTHORITY: "Strengthen SPAT's Authority"
 MAD_SPAT_STRENGTHEN_AUTHORITY_desc: "Give SPAT stronger commercial and operational capacity so the autonomous port authority can plan investment, manage terminals and prepare Toamasina for the next expansion. The payoff is a more capable public gateway rather than a private concession."
 MAD_TOAMASINA_JICA_EXPANSION_desc: "Expand Toamasina's berths, access infrastructure and terminal capacity with Japanese financing. The project can follow either the private ICTSI route or a strengthened public SPAT route; in both cases it turns the port into a larger gateway for the national economy."

 MAD_mining_code_reform: "Rewrite the Mining Code"
 MAD_mining_code_reform_desc: "Replace the old mining framework with clearer fiscal, environmental and social rules."
 MAD_END_PERMIT_FREEZE: "Reopen the Mining Registry"
 MAD_END_PERMIT_FREEZE_desc: "Resume the processing of pending mining permit applications and clear the regulatory bottleneck. A working registry lets legitimate exploration and development projects move again instead of leaving permits frozen indefinitely."
 MAD_MINING_LOCAL_BENEFIT_FUND: "Make Mining Pay Locally"
 MAD_MINING_LOCAL_BENEFIT_FUND_desc: "Create a visible local and regional return from mineral development. New community investment rules make the mining sector more productive and more defensible by ensuring extraction leaves something behind where it happens."
 MAD_2009_Sanctions_desc: "The post-coup government loses preferential access to the US market. The shock falls hardest on export-oriented activity, especially the apparel sector, while investment becomes harder to attract and economic uncertainty deepens."
 MAD_POL_ROY_SUMMON_HOUSES: "Summon the Houses of Madagascar"
 MAD_POL_ROY_SUMMON_HOUSES_desc: "The royalist movement must bring together associations and authorities whose histories and traditions are not identical. Building a national constituency requires negotiation between these different institutions, rather than treating every community as part of one royal hierarchy."
 MAD_POL_ROY_MALAGASY_TRADITION: "Fihavanana and Hasina"
 MAD_POL_ROY_MALAGASY_TRADITION_desc: "Fihavanana expresses bonds of kinship, solidarity and mutual obligation, while hasina refers to sacred authority and the legitimacy associated with respected leadership. The royalist movement draws on these concepts to present its programme as rooted in Malagasy political culture, while recognising that their meanings and practice differ across communities."
 MAD_POL_ROY_SACRED_CONSTITUTION: "A New Constitutional Order"
 MAD_POL_ROY_SACRED_CONSTITUTION_desc: "The movement seeks to replace the republican constitutional order with a Malagasy settlement grounded in the country's political traditions. It has yet to resolve whether legitimacy will rest primarily with a personal sovereign or a council representing the Houses; the rupture within the royalist movement has made that question unavoidable."
 MAD_POL_ROY_CROWN_QUESTION: "The Question of the Crown"
 MAD_POL_ROY_CROWN_QUESTION_desc: "Ndriana Rabarioelina's expulsion from TAMIMA has split the royalist movement. His supporters argue for authority centred on his personal claim to the Imerina Crown, while TAMIMA's collective project looks to the associations and Houses it represents. The movement must now decide which of these rival political directions will shape the restoration."
 MAD_POL_ROY_KINGS_MANDATE: "The King's Mandate"
 MAD_POL_ROY_KINGS_MANDATE_desc: "Ndriana's claim to the historic kingship of Imerina becomes the foundation of the restored state. Executive authority rests personally with the Crown, while the wider Andriana associations remain institutions of counsel and support. The new monarchy is organised around Ndriana's authority rather than a collective government of the Houses."
 MAD_POL_ROY_CROWN_ABOVE_NOBILITY: "Christ the King of Kings"
 MAD_POL_ROY_CROWN_ABOVE_NOBILITY_desc: "In this branch, the personal Crown is placed above the noble Houses. The King claims final authority, with princes and other noble representatives serving within a hierarchy centred on the sovereign. The movement presents this arrangement through a Christian ideal of righteous kingship, rather than government by a council of equal Houses."
 MAD_POL_ROY_CHRIST_KING: "Servants of Righteousness"
 MAD_POL_ROY_CHRIST_KING_desc: "Ndriana's Christian programme presents public office as a moral responsibility under the Crown. The administration is expected to resist patronage, corruption and arbitrary rule, with Christian teaching shaping the standards by which officials are judged. The aim is to restore confidence in government through disciplined and responsible public service."
 MAD_POL_ROY_LEGAL_ORDER: "Recast the Legal Order"
 MAD_POL_ROY_LEGAL_ORDER_desc: "Madagascar's legal order draws on French-derived civil law, national legislation and customary practices that continue to shape matters such as land, inheritance and local dispute resolution. Ndriana's programme seeks a Malagasy constitutional settlement that gives traditional authorities a clearer place in public life. The Crown must decide how customary rules will be recognised alongside national law and equal legal protections."
 MAD_POL_ROY_FINANCIAL_REFORM: "Monetary and Financial Reform"
 MAD_POL_ROY_FINANCIAL_REFORM_desc: "A restored state needs credible public finances before it can pursue a wider programme. Debt obligations, limited revenue and reliance on external finance constrain the choices available to any government. Ndriana's programme therefore places fiscal stability and greater control over financial policy ahead of a return to normal party competition."
 MAD_POL_ROY_MALAGASY_LAND_FARMERS: "Malagasy Land for Malagasy Farmers"
 MAD_POL_ROY_MALAGASY_LAND_FARMERS_desc: "The Crown's land programme argues that land should remain a secure foundation for Malagasy livelihoods. It seeks to protect smallholder access, strengthen land tenure and ensure that agricultural investment respects the rights of local communities. The restoration's claim to national sovereignty must have practical meaning for the people who cultivate the land."
 MAD_POL_ROY_COUNCIL_OF_KINGS: "Convene the Royal and Noble Houses"
 MAD_POL_ROY_COUNCIL_OF_KINGS_desc: "Bring dynastic claimants, noble associations and recognised traditional authorities into a common forum in Antananarivo. The assembly provides a place for consultation before the movement settles the source and limits of national authority. It is a proposed institution of the alternative settlement, not the revival of a single historical parliament shared by all Malagasy communities."
 MAD_POL_ROY_LIVING_FORCES: "The Living Forces of the Nation"
 MAD_POL_ROY_LIVING_FORCES_desc: "The restoration cannot govern through royal and noble associations alone. It needs a wider national coalition of professionals, workers, researchers, business groups and organised communities. Bring these constituencies into the political settlement and give them a lasting role in the country's intellectual and administrative life."
 MAD_POL_ROY_NATIONAL_TRUST: "The National Wealth Is a National Trust"
 MAD_POL_ROY_NATIONAL_TRUST_desc: "The Crown proposes treating Madagascar's mineral, forestry and energy wealth as a national trust. Resource development should retain more value within the country through local processing, Malagasy skills and transparent agreements, while ensuring that communities near extraction projects share in their benefits. The objective is to move beyond exporting raw materials with too little lasting value retained at home."
 MAD_POL_ROY_ENDOGENOUS_DEVELOPMENT: "Endogenous Development"
 MAD_POL_ROY_ENDOGENOUS_DEVELOPMENT_desc: "The Crown's development programme seeks to build economic capacity from within Madagascar rather than depend indefinitely on imported expertise and external capital. Stronger technical education, scientific research, domestic enterprise and local production are intended to reinforce one another. Malagasy industry must be able to develop its own skills, suppliers and productive capabilities."
 MAD_POL_ROY_SACRED_HERITAGE: "Restore the Sacred Heritage"
 MAD_POL_ROY_SACRED_HERITAGE_desc: "The Crown places the Rova of Antananarivo and the wider royal landscape of Imerina at the centre of national heritage. Royal tombs, historic sites and sacred places carry memories of the kingdom and its people. Their preservation is intended to reconnect the restored monarchy with the history of Imerina while presenting that heritage as part of Madagascar's wider national story."
 MAD_POL_ROY_BIBLICAL_GEOPOLITICS: "Biblical Geopolitics"
 MAD_POL_ROY_BIBLICAL_GEOPOLITICS_desc: "Ndriana's royal theology links the Imerina dynastic claim to an Abrahamic inheritance and argues that Madagascar should stand with Israel and the wider Judeo-Christian world. This is the religious and political doctrine of his movement, not an established historical account of Malagasy royal genealogy. The government must decide whether this conviction becomes a formal foreign-policy commitment, practical cooperation or a matter of religious and scholarly affinity."
 MAD_POL_ROY_TRUE_SOVEREIGNTY: "True National Sovereignty"
 MAD_POL_ROY_TRUE_SOVEREIGNTY_desc: "The movement treats sovereignty as more than formal independence: it also means having the ability to shape the country's financial and productive future. The Crown seeks greater control over strategic investment, public debt and the terms on which foreign capital develops Malagasy resources. Economic independence must be balanced with the technology, finance and trade relationships required for growth."
 MAD_POL_ROY_REGIONAL_HOUSES: "Recognise the Regional Houses"
 MAD_POL_ROY_REGIONAL_HOUSES_desc: "Madagascar's traditional authorities have distinct histories and sources of legitimacy. Sakalava dynastic traditions, the different historical political traditions of Betsileo communities, Antemoro noble and religious lineages, and the local authorities of Antanala and Antambahoaka communities cannot be treated as interchangeable forms of kingship. Ndriana's government seeks negotiated recognition for these institutions, giving regional authorities a place in the restored kingdom without imposing a single model of royal rule across the island."
 MAD_POL_ROY_NEW_KINGDOM: "The New Kingdom of Madagascar"
 MAD_POL_ROY_NEW_KINGDOM_desc: "Ndriana's supporters extend his personal Imerina royal claim into a national project: a new Kingdom of Madagascar under the Crown. Its political identity combines the Imerina dynastic claim, Christian state principles and negotiated recognition of regional traditional authorities. This is a modern restoration programme and an alternative political settlement, not the uninterrupted continuation of the historic Merina monarchy."
 MAD_POL_ROY_TAMIMA_SACRED_HERITAGE: "Guard the Sacred Heritage"
 MAD_POL_ROY_TAMIMA_SACRED_HERITAGE_desc: "TAMIMA's heritage programme seeks to document and preserve the histories of the island's Andriana associations and traditional communities. Genealogies, royal tombs, sacred sites, manuscripts and local customs form part of a heritage that cannot be reduced to a single royal tradition. Preservation should be pursued with the communities and institutions that maintain these traditions."
 MAD_POL_ROY_CROWNLESS_CONSTITUTION: "The Crown Without a King"
 MAD_POL_ROY_CROWNLESS_CONSTITUTION_desc: "Replace the provisional council arrangement with a written constitution rooted in the negotiated settlement of the Houses, local customary institutions and representative government. The new order gives collective institutions a constitutional role without placing a hereditary monarch at the head of the state."
 MAD_POL_ROY_ONE_MADAGASCAR_MANY_HOUSES_FINAL: "One Madagascar, Many Houses"
 MAD_POL_ROY_ONE_MADAGASCAR_MANY_HOUSES_FINAL_desc: "The Houses and their constituent associations are brought into a shared national settlement without a sovereign throne. Their histories and customs remain distinct, but they are represented within one constitutional order and one Malagasy state."
 MAD_POL_ROY_TAMIMA_COUNCIL_GOVERNMENT: "Council Government"
 MAD_POL_ROY_TAMIMA_COUNCIL_GOVERNMENT_desc: "Establish the council of Houses as a permanent part of national government under the new constitution. Political authority is exercised through collective representation and renewed elections, allowing smaller associations and political groupings to participate in public life without restoring a personal monarchy."
 MAD_POL_ROY_TAMIMA_COUNCIL: "TAMIMA: The National Council of Houses"
 MAD_POL_ROY_TAMIMA_COUNCIL_desc: "TAMIMA, the Fiombonambe Taranaka Andriana Miray eto Madagasikara, brings together associations of Andriana descendants from across Madagascar. Ndriana Rabarioelina's expulsion from TAMIMA created the rupture that divided the royalist movement. TAMIMA's political project places collective representation by its associations and Houses, rather than Ndriana's personal Imerina claim, at the centre of the proposed settlement."
 MAD_POL_ROY_FIHAVANANA: "Fihavanana Before Faction"
 MAD_POL_ROY_FIHAVANANA_desc: "Fihavanana, often expressed through kinship, solidarity and mutual responsibility, provides a social principle for TAMIMA's wider political settlement. Its purpose is to encourage cooperation between communities and organised groups, grounding national government in obligations that extend beyond the interests of individual Houses."
 MAD_POL_ROY_ANTENIMIERAN_ANDRIANA: "The Antenimieran'ny Andriana"
 MAD_POL_ROY_ANTENIMIERAN_ANDRIANA_desc: "Establish the Antenimieran'ny Andriana as a proposed upper chamber representing TAMIMA's constituent noble associations and recognised Houses. It gives the Andriana a permanent place in the national constitutional settlement and provides a forum for collective deliberation. This is a new institution within the alternative political order, not a claim that an equivalent nationwide nobles' parliament existed historically."
 MAD_POL_ROY_TAMIMA_REPRESENT_LIVING_FORCES: "Represent the Living Forces"
 MAD_POL_ROY_TAMIMA_REPRESENT_LIVING_FORCES_desc: "TAMIMA's council cannot rely on noble descent alone to govern the country. Its constitutional settlement must also include recognised local authorities, professional associations, workers, researchers and business organisations. Customary institutions can contribute to national governance while remaining connected to the responsibilities and protections of the modern state."
 MAD_POL_ROY_TAMIMA_LIVING_FORCES: "TAMIMA Living Forces"
 MAD_POL_ROY_RESTORE_FOKONOLONA: "Restore the Fokonolona"
 MAD_POL_ROY_RESTORE_FOKONOLONA_desc: "Place the Fokonolona, the village community assembly, at the foundation of local government. Communities gain a greater role in shared resources, local agreements and mutual assistance. This village-level institution is distinct from the national Antenimieran'ny Andriana, giving the council constitution a local basis beyond the noble associations in the capital."
 MAD_POL_ROY_DINA_CUSTOMARY_JUSTICE: "Dina and Customary Justice"
 MAD_POL_ROY_DINA_CUSTOMARY_JUSTICE_desc: "Recognise Dina, locally rooted agreements used by communities to regulate shared life and resolve disputes, as part of the constitutional settlement. Their place in national governance must be clearly defined, with safeguards for due process and individual rights and consistency with national law. Customary justice should complement public institutions rather than operate beyond their protections."

 MAD_POL_MIL_TAKES_RESPONSIBILITY: "The FPA Takes Political Responsibility"
 MAD_POL_MIL_TAKES_RESPONSIBILITY_desc: "The FPA assumes responsibility for directing the post-crisis government and implementing its political programme. Its leadership must maintain public administration, restore confidence in state institutions and establish the foundations of a durable national settlement."
 MAD_POL_MIL_CHAIN_OF_COMMAND: "Defend the Recognised Chain of Command"
 MAD_POL_MIL_CHAIN_OF_COMMAND_desc: "The General Staff will establish a unified command structure across the armed forces. Appointments, operational planning, orders and discipline will follow the recognised military hierarchy, with each formation accountable through its established chain of command."
 MAD_POL_MIL_PROTECT_BALLOT: "Commit to Electoral Competition"
 MAD_POL_MIL_PROTECT_BALLOT_desc: "In May 2010, the Army and Gendarmerie high commands rejected a formal military quota in government, maintaining that officers could hold civilian office only as private citizens. In September–November 2023, the joint EMMO-NAT security command affirmed the importance of recognising the president proclaimed through the constitutional electoral process. The FPA adopts electoral competition as the basis of its political legitimacy, accepting that its leadership must seek public authority through the ballot and respect the constitutional process."
 MAD_POL_MIL_PROTECT_BALLOT_ELECTION_BAN_TT: "The FPA will no longer be able to ban elections while it remains in power."
 MAD_POL_MIL_FINAL_ARBITER: "The Military's Reserved Veto"
 MAD_POL_MIL_FINAL_ARBITER_desc: "The FPA reserves a final role for the military leadership in matters it considers vital to national security and the direction of the state. This doctrine gives the movement authority to review or block decisions by civilian institutions when it judges the national interest to be at risk."
 MAD_POL_MIL_CAPSAT_LESSON: "Consolidate CAPSAT's Institutional Network"
 MAD_POL_MIL_CAPSAT_LESSON_desc: "CAPSAT's influence derives from a network of personnel, administration, logistics and technical services extending across the armed forces. The organisation will consolidate these relationships and preserve its role within the security establishment, turning the influence gained during the crisis into a durable institutional position."

 MAD_pol_mil_confirm_chief_of_staff: "Confirm the Chief of Staff"
 MAD_pol_mil_confirm_chief_of_staff_desc: "The new command settlement must be reflected in the appointment of the Chief of Staff. Confirming the senior appointment will align the Army's central command with the authority and priorities of the new leadership, providing a clear point of responsibility for orders and military administration."
 MAD_pol_mil_general_staff_verifiable_roadmap: "Demand a Verifiable Political Roadmap"
 MAD_pol_mil_general_staff_verifiable_roadmap_desc: "In April 2010, Chief of Staff André Ndriarijaona demanded that the High Authority of Transition publish a verifiable plan for resolving the national crisis and meeting public-sector salary obligations. The General Staff will establish a clear timetable for the transition, requiring the political authorities to publish their objectives, milestones and responsibilities."
 MAD_pol_mil_capsat_gendarmerie_alignment: "Align the Gendarmerie Command"
 MAD_pol_mil_capsat_gendarmerie_alignment_desc: "Following the FIGN's defection on 12 October 2025, the new command moved to secure the leadership of the National Gendarmerie. On 13 October, General Démosthène Pikulas appointed the FIGN commander to head the service, extending the post-takeover command arrangement beyond the Army."
 MAD_pol_mil_capsat_transitional_defence_council: "Establish the Transitional National Defence Council"
 MAD_pol_mil_capsat_transitional_defence_council_desc: "On 14 October 2025, the new authorities announced the Conseil national de défense de la transition (CNDT). The council formalised the military leadership's role in directing the transitional administration and provided a central forum for coordinating defence and security policy, distinct from CAPSAT's own organisational network."
 MAD_pol_mil_capsat_security_command: "Formalize the Security High Command"
 MAD_pol_mil_capsat_security_command_desc: "Decrees adopted by the Council of Ministers at the end of October 2025 formalised senior appointments across the Army, National Gendarmerie and National Police. These appointments extended the post-takeover command settlement across the principal security institutions and established a new senior leadership structure."
 MAD_pol_mil_capsat_high_counsellors: "Define the High Counsellors' Status"
 MAD_pol_mil_capsat_high_counsellors_desc: "The High Constitutional Court's decision of 18 November 2025 clarified the protocol rank and privileges of four High Counsellors drawn from the Army's senior leadership. The ruling recognised their formal status and privileges without transferring to them the constitutional powers of the Head of State."
 MAD_POL_MIL_NEVER_DIVIDED: "Never Again a Divided Army"
 MAD_POL_MIL_NEVER_DIVIDED_desc: "The crises of 2002 and 2009 demonstrated the dangers of competing military authorities. Reforms will place the Army, Gendarmerie and other services under a unified national command, with clear responsibilities, consistent discipline and a common institutional framework."
 MAD_POL_MIL_SOUTHERN_SECURITY: "Restore State Presence in the Grand Sud"
 MAD_POL_MIL_SOUTHERN_SECURITY_desc: "Expand the state's presence across the Grand Sud through coordinated rural administration, food logistics, essential services and lawful security operations. Stronger links between local authorities, the Gendarmerie and service providers will help restore public order, protect communities and support the movement of people and goods."
 MAD_POL_MIL_GENDARMERIE_REFORM: "A Gendarmerie Under Law"
 MAD_POL_MIL_GENDARMERIE_REFORM_desc: "The Gendarmerie will concentrate on rural patrols, crime prevention, lawful public-order operations and cooperation with local authorities. Clear civilian oversight and consistent procedures will strengthen its ability to provide reliable security across the countryside."
 MAD_POL_MIL_ENGINEERS: "National Reconstruction Works"
 MAD_POL_MIL_ENGINEERS_desc: "Engineering capacity should restore roads, water and electricity infrastructure, bridge remote areas to markets and strengthen the productive base. The same skills can support a limited domestic defence industry alongside the country's wider reconstruction programme."
 MAD_POL_MIL_MARITIME_SECURITY: "Watch the Indian Ocean"
 MAD_POL_MIL_MARITIME_SECURITY_desc: "Extend maritime awareness across Madagascar's territorial waters and exclusive economic zone. Coastal observation, naval patrols and coordination with customs and fisheries authorities will improve the state's ability to monitor its maritime approaches and respond to illegal fishing, trafficking and other security incidents."
 MAD_POL_MIL_MULTILATERAL_DOCTRINE: "A Multilateral Defence Doctrine"
 MAD_POL_MIL_MULTILATERAL_DOCTRINE_desc: "Develop a defence policy built around practical cooperation with a range of international partners. Joint training, staff exchanges and equipment agreements will strengthen interoperability and professional standards while preserving Madagascar's independent military command and national defence priorities."
 MAD_POL_MIL_ASSEMBLIES: "Entrust National Consultations to the FFKM"
 MAD_POL_MIL_ASSEMBLIES_desc: "The transitional authorities have entrusted the Council of Christian Churches of Madagascar (FFKM) with coordinating nationwide consultations on the country's future institutional settlement. The first consultation findings were handed to the FFKM in November 2026, while further regional and national discussions are planned for 2027. The process is intended to bring together communities, political movements and national stakeholders to consider constitutional, administrative and security reforms; it is still underway."
 MAD_POL_MIL_CLEAN_UNIFORM: "Audit Public Finances and Strengthen Integrity"
 MAD_POL_MIL_CLEAN_UNIFORM_desc: "The President directed the Cour des Comptes to examine public financial management, and during 2026 the Court published audits covering ministries and state bodies including the Armed Forces, Gendarmerie, Public Security, Justice, Health and Public Works. The programme also includes renewed scrutiny of the JIRAMA utility, a youth civic-engagement body dedicated to fighting corruption, and secure channels for reporting irregularities. These initiatives are distinct instruments of oversight and public accountability; the existence of an audit or reporting platform does not itself establish that every allegation has been resolved."
 MAD_POL_MIL_REFOUNDATION: "Implement the Refoundation Programme"
 MAD_POL_MIL_REFOUNDATION_desc: "The Government presented its Programme de Mise en Œuvre de la Politique Générale de l'État pour la Refondation (PGE-R) to the National Assembly on 18 November 2025. The more detailed Programme de la Refondation published in February 2026 sets out the constitutional and electoral roadmap within a maximum 24-month transition. Together, the programmes cover institutional renewal, public administration, economic reform, essential services and the return to elected government; their publication marks the start of implementation, not its completion."
 MAD_POL_MIL_GENERAL_STAFF_CONSTITUTIONAL_OVERSIGHT: "Place the Transition Under Constitutional Oversight"
 MAD_POL_MIL_GENERAL_STAFF_CONSTITUTIONAL_OVERSIGHT_desc: "A General Staff-led transition would follow a defined constitutional timetable, separating temporary military authority from the permanent institutions of the state. Drawing on the military leadership's earlier refusal to claim a formal share of government and its public commitment to recognising constitutional electoral outcomes, this counterfactual route would place the High Constitutional Court and civilian electoral institutions at the centre of the restoration of elected government. It describes a plausible alternative, not a historical programme implemented by the General Staff."
 MAD_POL_MIL_CIVILIAN_GUARDIANSHIP: "Commit to the Return to Elected Government"
 MAD_POL_MIL_CIVILIAN_GUARDIANSHIP_desc: "With national consultation still underway and the constitutional referendum not yet held, the transition must establish a clear route back to elected government. Electoral laws and the CENI must be reformed, and the constitutional vote must be prepared before the presidential election if the legal and practical conditions are met. The Programme de la Refondation sets a maximum 24-month timetable, after which executive authority is intended to pass to the government established through the vote."
 MAD_POL_MIL_MODERNISE_MILITARY_STATUTE: "Amend the General Statute of the Military"
 MAD_POL_MIL_MODERNISE_MILITARY_STATUTE_desc: "Law No. 2026-012 amended the General Statute of the Military after adoption by the National Assembly on 31 August 2026 and constitutional review by the HCC on 23 September. Among its principal measures, it raised retirement-age limits by two years for categories of military personnel and gendarmes, including career and contract personnel; the Government said approximately 800 personnel would be affected in 2026. The measure applies across the armed forces and Gendarmerie, rather than representing a policy exclusive to either command faction."
 MAD_POL_MIL_BIOMETRIC_ID_REGISTRATION: "Launch Izaho Tokana Biometric Registration"
 MAD_POL_MIL_BIOMETRIC_ID_REGISTRATION_desc: "On 12 May 2026, Prime Minister Mamitiana Rajaonarison launched the Izaho Tokana biometric registration campaign at the Primature. The programme seeks to establish a unique biometric identity for each citizen and maintain the resulting records in state databases, with the Government presenting identification as a basis for accessing education, employment and electoral rights. The campaign is also intended to reduce identity fraud and modernise public administration; the launch does not mean that national registration has already been completed."
 MAD_POL_MIL_CYBERCRIME_BILL: "Introduce the Cybercrime Bill"
 MAD_POL_MIL_CYBERCRIME_BILL_desc: "The Council of Ministers considered Bill 042/2026 on 7 July 2026, and the Government formally submitted it to the National Assembly on 25 August as a 96-article proposal. It would expand the legal framework for cybercrime investigations and digital evidence, but remained a bill rather than enacted law on 14 November. Amnesty International has warned that its provisions could permit extensive monitoring of online activity and telecommunications data without adequate judicial oversight, raising concerns about privacy and media freedom."
 MAD_POL_MIL_PUBLIC_PRIVATE_PARTNERSHIP_BILL: "Introduce a Public-Private Partnership Framework"
 MAD_POL_MIL_PUBLIC_PRIVATE_PARTNERSHIP_BILL_desc: "The Government lodged Bill 005-2026 on public-private partnerships with the National Assembly on 22 October 2026. The proposal seeks to establish a legal framework for cooperation between the state and private investors in delivering public projects and services. It remained at the formal-deposit stage on 14 November and should therefore be treated as a proposed investment framework, not an enacted reform."
 MAD_POL_MIL_ESSENTIAL_MARKET_REGULATION: "Regulate Essential Goods and Curb Speculation"
 MAD_POL_MIL_ESSENTIAL_MARKET_REGULATION_desc: "The Government lodged Bill 045/2026 on 26 October 2026, proposing measures against speculation and the regulation of prices for essential and strategic goods and services. Separately, Madagascar opened a WTO-notified safeguard investigation into rice imports on 31 August 2026. These initiatives indicate a willingness to intervene in essential markets, but the price-regulation bill and the rice investigation had not yet produced an enacted general price-control regime."
 MAD_POL_MIL_GREEN_BUDGET: "Adopt a Green Budget and Climate Finance Strategy"
 MAD_POL_MIL_GREEN_BUDGET_desc: "The IMF recorded in September 2026 that Madagascar had adopted its first green budget and a National Climate Finance Strategy under its Resilience and Sustainability Facility commitments. These measures seek to integrate climate risks and resilience priorities into public budgeting and identify financing for climate-related investment. The reform agenda predates the coup and represents continued implementation of an existing international programme rather than a wholly new initiative of the transitional administration."
 MAD_POL_MIL_YOUTH_ANTI_CORRUPTION_HIGH_COMMISSION: "Establish the Youth Civic Engagement High Commission"
 MAD_POL_MIL_YOUTH_ANTI_CORRUPTION_HIGH_COMMISSION_desc: "The Council of Ministers created the Haut-Commissariat de la Jeunesse chargé de l'Engagement citoyen et de la Lutte contre la Corruption (HCJ-ECLC) on 29 September 2026, placing the body under the Presidency. It is intended to involve young people directly in civic participation and anti-corruption work, complementing existing institutions such as BIANCO, SAMIFIN and the Comité pour la sauvegarde de l'intégrité. Its creation was presented as a youth-led route into public accountability, not as a replacement for the established investigative and judicial agencies."
 MAD_POL_MIL_TOROHY_TAX_INTEGRITY: "Launch the TOROHY Tax-Integrity Platform"
 MAD_POL_MIL_TOROHY_TAX_INTEGRITY_desc: "The Ministry of Economy and Finance, through the Directorate-General of Taxes, officially launched TOROHY on 9 October 2026. The platform allows taxpayers and other users of tax services to report suspected corruption and irregularities securely and confidentially, while also collecting feedback on service quality. Its initial remit is the tax administration; it is not a general-purpose reporting platform for every state institution."
 MAD_POL_MIL_SECURE_EMERGENCY_POWER_SUPPLY: "Requisition Emergency Electricity Generation"
 MAD_POL_MIL_SECURE_EMERGENCY_POWER_SUPPLY_desc: "Decree No. 2026-2432 of 3 November 2026 placed ENELEC's heavy-fuel-oil thermal power plant at Toamasina, together with the equipment and personnel needed to operate it, under temporary requisition. JIRAMA took over its operation to secure continuity of electricity supply, while the decree provides for the requisition to end when the emergency circumstances cease and no later than 24 months after notification. This is a temporary operational measure, not a transfer of ownership or a permanent nationalisation of the plant."
 MAD_AREMA_REBUILDING: "AREMA National Organisation Restored"
 MAD_AREMA_REBUILDING_desc: "The party restores its provincial branches, national coordination and links with local organisers across Madagascar, rebuilding the broad political structure that made AREMA one of the country's most extensive parties before the 2002 crisis."
 MAD_POL_AREMA_CHOOSE_OLD_GUARD: "The Ratsiraka Tradition"
 MAD_POL_AREMA_CHOOSE_OLD_GUARD_desc: "AREMA became the dominant political organisation of Didier Ratsiraka's Second Republic. Its identity was shaped by the Malagasy Socialist Revolution and the Red Book, which placed national sovereignty, state-directed development and non-alignment at the centre of government. The old guard seeks to restore that political tradition while confronting the failures of its original economic model."
 MAD_POL_AREMA_CHOOSE_RENEWAL: "The Rajaonarivelo Renewal"
 MAD_POL_AREMA_CHOOSE_RENEWAL_desc: "The reformist current around Pierrot Rajaonarivelo sought to rebuild AREMA around competent administration, social development and an economy open to productive private investment. His 2006 presidential platform and the later MDM programme promoted federalism, stronger local participation, institutional reform and the revival of regional industry. This route gives that renewal current a younger leadership while retaining AREMA's commitment to social provision."
 MAD_POL_AREMA_CHOOSE_RECONCILIATION: "The AREMA Matotra Alternative"
 MAD_POL_AREMA_CHOOSE_RECONCILIATION_desc: "Pierre Raharijaona was an early AREMA member and a longtime supporter of Didier Ratsiraka. After Ratsiraka's 2002 exile, Raharijaona moved closer to Marc Ravalomanana, founded AREMA Matotra in 2004 and joined the Isika Miaraka amin'i Marc Ravalomanana coalition. By 2006, his breakaway current was openly separated from the official party. This route represents the alternative in which Raharijaona and the Matotra current take the lead of AREMA and pursue pragmatic cooperation with the post-2002 governing camp."
 MAD_POL_AREMA_REVOLUTIONARY_ORGANISATION: "Reconstitute the National Front for the Defence of the Revolution"
 MAD_POL_AREMA_REVOLUTIONARY_ORGANISATION_desc: "The 1975 Constitution made the Front national pour la défense de la révolution (FNDR) the political body tasked with guiding the Revolution and inspiring state activity. Created in 1976, the Front brought AREMA together with allied parties including Vonjy, AKFM and UDECMA; other movements joined as it developed. AREMA became its dominant member. Reconstituting the FNDR means restoring a centrally coordinated alliance of political organisations around the socialist project, not merely expanding AREMA's own membership."
 MAD_POL_AREMA_OLD_GUARD_ADAPT: "Reform the State-Enterprise System"
 MAD_POL_AREMA_OLD_GUARD_ADAPT_desc: "The Ratsiraka government gradually revised its original state-led model as financial and production problems mounted. Madagascar adopted a first structural-adjustment plan in 1981; the mid-1980s brought price liberalisation and initial privatisations, followed by trade liberalisation and a public-enterprise restructuring programme in 1988. This focus represents the old guard's attempt to repair state enterprises and reduce administrative inefficiency while retaining AREMA's leading role in the economy."
 MAD_POL_AREMA_RENEWAL_PROGRAMME: "Renew AREMA's Social and Productive Programme"
 MAD_POL_AREMA_RENEWAL_PROGRAMME_desc: "The renewal current around Pierrot Rajaonarivelo linked AREMA's social commitments to the revival of productive activity. During the 2013 campaign under the MDM banner, endorsed by an AREMA faction, he advocated restarting regional enterprises, creating jobs for young people and investing in local livelihoods alongside social needs. The November 2000 Interim Poverty Reduction Strategy had already prioritised basic education, healthcare, drinking water, rural infrastructure and smallholder agriculture. The renewal programme brings these social priorities together with a stronger emphasis on productive employment and regional opportunity."
 MAD_POL_AREMA_RENEWAL_MODERNISE: "Modernise AREMA's Productive Programme"
 MAD_POL_AREMA_RENEWAL_MODERNISE_desc: "Rajaonarivelo's reformist programme sought to pair social provision with a more dynamic productive economy. His 2006 platform called for secure conditions for investors and tax relief for private enterprise; his 2013 campaign emphasised the recovery of regional industry and the creation of jobs for young people. Modernising AREMA means improving the management of productive enterprises, expanding opportunities for local businesses and connecting economic growth to employment."
 MAD_POL_AREMA_RECONCILIATION_PACT: "Align with the Ravalomanana Coalition"
 MAD_POL_AREMA_RECONCILIATION_PACT_desc: "Raharijaona's AREMA Matotra faction entered the Isika Miaraka amin'i Marc Ravalomanana coalition after the 2002 political crisis. In this alternative route, his pragmatic approach becomes the line of the national AREMA leadership: cooperate with the post-2002 governing camp, restore political stability and improve relations with commercial partners. This is a political realignment, not a historical agreement reunifying the Ratsiraka and Rajaonarivelo wings."
 MAD_POL_AREMA_RECONCILIATION_INSTITUTIONALISE: "Institutionalise the Matotra Realignment"
 MAD_POL_AREMA_RECONCILIATION_INSTITUTIONALISE_desc: "Make the Matotra current's pragmatic political realignment the durable direction of the party. Replace a provisional leadership arrangement with stable internal structures and sustained working relations with the Ravalomanana-aligned political camp and commercial actors. This represents an alternative historical outcome for the faction, not a claim that the main AREMA organisation was actually reunified."
 MAD_POL_AREMA_REBUILD: "Rebuild AREMA's National Organisation"
 MAD_POL_AREMA_REBUILD_desc: "Before the 2002 crisis, AREMA had a broad organisation with strong representation across all six provinces. The defeat and exile of Didier Ratsiraka weakened the party, while disputes over leadership and political direction fractured its national structure. Rebuild provincial branches, restore a functioning national directorate and reconnect local organisers with the party leadership."
 MAD_POL_AREMA_REVOLUTION_ADAPTS: "The Revolution Must Adapt"
 MAD_POL_AREMA_REVOLUTION_ADAPTS_desc: "Decide whether the movement restores the old state-led model or builds a modern Malagasy socialism."
 MAD_POL_AREMA_STATE_LEADS: "The Malagasy State Must Lead"
 MAD_POL_AREMA_STATE_LEADS_desc: "The Red Book envisaged a state capable of directing investment, coordinating production and using public enterprises to support national development. AREMA now seeks to restore that responsibility to government, concentrating public resources on strategic infrastructure, essential services and industries that private capital alone may neglect. The objective is not simply to expand state ownership, but to give the government a more deliberate role in shaping the country's economic priorities."
 MAD_POL_AREMA_STRATEGIC_ENTERPRISES: "Consolidate Public Ownership of Strategic Utilities"
 MAD_POL_AREMA_STRATEGIC_ENTERPRISES_desc: "Build on the specific decisions that have already kept JIRAMA public, retained state control of fuel imports, taken Madarail into public ownership or renationalised TELMA. This focus consolidates the selected strategic enterprise within a wider public-ownership programme. It does not launch another JIRAMA, railway or telecommunications project; those investments remain represented by their existing content."
 MAD_POL_AREMA_FOKONOLONA: "Give Fokonolona a Voice in Local Development"
 MAD_POL_AREMA_FOKONOLONA_desc: "At the MDM convention in January 2010, Pierrot Rajaonarivelo's movement called for democratic participation throughout public administration and social life, with citizens taking ownership of projects affecting their regions. The proposed structure extended from regions and districts to communes and fokontany, with representative assemblies at national and district levels. This policy gives communities a formal role in choosing local priorities and overseeing development, rather than treating decentralisation as the simple transfer of administration away from Antananarivo."
 MAD_POL_AREMA_FOOD_FIRST: "Prioritise Domestic Food Self-Sufficiency"
 MAD_POL_AREMA_FOOD_FIRST_desc: "The early Ratsiraka-era agrarian programme made food self-sufficiency a central objective. It prioritised food crops, price controls for essential goods and public management of agricultural distribution, seeking to reduce dependence on imported staples. This focus renews that approach by directing support towards domestic food production and rural productivity, and by giving the home market priority over export maximisation."
 MAD_POL_AREMA_INDEPENDENCE: "Reassert Malagasy Economic Sovereignty"
 MAD_POL_AREMA_INDEPENDENCE_desc: "The 1975 Socialist Charter called for Malagasy control over the principal means of production and national control of mineral wealth. The nationalisation of banks, insurers and key companies was intended to reduce foreign control of strategic parts of the economy. This focus restores economic sovereignty as a governing principle: decisions over essential industries and resources should serve Malagasy development priorities, even while the country continues to need external technology, finance and markets."
 MAD_POL_AREMA_INDIAN_OCEAN: "Restore Non-Aligned Foreign Policy"
 MAD_POL_AREMA_INDIAN_OCEAN_desc: "From 1978 to 1991, Ratsiraka emphasised independence and non-alignment through an all-points foreign policy. Madagascar cultivated relations with socialist and radical governments including North Korea, Cuba, Libya and Iran, while continuing to maintain economic relations with Western countries. The policy was not isolation: it sought diplomatic room for manoeuvre and freedom to cooperate with different partners without binding Madagascar to a single power bloc."
 MAD_POL_AREMA_PROVINCES: "Constitutionalise the Six-State Federation"
 MAD_POL_AREMA_PROVINCES_desc: "The 1998 constitutional reform established six autonomous provinces, whose councils were elected in December 2000 and whose governors and councils were installed in 2001. Pierrot Rajaonarivelo later proposed a constitutional referendum to make Madagascar a republic subdivided into six federated states. During the 2013 campaign under MDM, he again advocated a strongly decentralised republic, with regional institutions able to shape development around local priorities. The renewal programme would give the six former provinces a defined constitutional and administrative role in national government."
 MAD_POL_AREMA_MIXED_ECONOMY: "Balance Public Ownership with Private Investment"
 MAD_POL_AREMA_MIXED_ECONOMY_desc: "The renewal route accepts selected market-oriented reforms, including fuel liberalisation, corporatising JIRAMA, allowing investors to remain in Madarail or accepting foreign ownership in selected enterprises. This focus brings those choices into a mixed-economy settlement: the state keeps a strategic role in essential sectors while private capital is allowed to operate, invest and expand in others."
 MAD_POL_AREMA_STRATEGIC_INVESTMENT: "Protect Investment and Develop Private Enterprise"
 MAD_POL_AREMA_STRATEGIC_INVESTMENT_desc: "At the 2006 presidential campaign, Pierrot Rajaonarivelo's AREMA platform called for securing the investments of local economic operators and reducing the tax burden on businesses. The proposal focused on protecting productive investment and lowering the cost of operating private enterprises, with the aim of encouraging firms to expand, reinvest and create employment. Public investment in infrastructure would support a more confident domestic private sector."
 MAD_POL_AREMA_ECO_SOCIAL_REPUBLIC: "Renew the National Conservation and Development Strategy"
 MAD_POL_AREMA_ECO_SOCIAL_REPUBLIC_desc: "In 1984, the Ratsiraka government adopted a National Strategy for Conservation and Development; an international conference followed in 1985 to help prepare a national environmental programme. This focus renews that established policy within AREMA's development model. It moves beyond extractive-first growth by strengthening environmental protections around economic activity and pairing conservation with the needs of local communities."
 MAD_POL_AREMA_SECOND_SOCIALISM: "The Second Malagasy Socialism"
 MAD_POL_AREMA_SECOND_SOCIALISM_desc: "The first Malagasy socialist experiment demonstrated both the possibilities and limitations of state-directed development. Public ownership and national planning offered a means of pursuing economic independence, but excessive administrative controls, poorly coordinated investment and mounting financial pressures undermined the model. A second Malagasy socialism must retain strategic public direction while building a more productive, financially sustainable economy."

 MAD_POL_TIM_RETURN: "Return to Madagascar Naturally"
 MAD_POL_TIM_RETURN_desc: "The Madagascar Naturellement vision, developed after the 2002 crisis and set out in the government's first Poverty Reduction Strategy Paper in 2003, linked rural development and agricultural value chains with infrastructure, research, technology and private-sector partnerships. It aimed to turn the initial economic recovery into broader poverty reduction and more effective public administration."
 MAD_POL_TIM_TRUST: "A Government Citizens Can Trust"
 MAD_POL_TIM_TRUST_desc: "The Madagascar Action Plan's responsible-governance commitment called for a professional civil service, stronger rule of law, reduced corruption, more effective budget management and better public services. The government established BIANCO and the economic anti-corruption prosecution chain in 2004, adopted a new organic budget framework, and later created the financial-intelligence unit SAMIFIN. Decentralisation and measurable administrative performance were also stated priorities."
 MAD_POL_TIM_BUSINESS_SEPARATION: "Separate Business From Government"
 MAD_POL_TIM_BUSINESS_SEPARATION_desc: "Ravalomanana entered politics as the founder of TIKO, a Malagasy food and retail conglomerate that became one of the country's largest domestic businesses. His commercial background informed TIM's approach to private-sector development, but his position as president also raised concerns over conflicts of interest and the influence of private business on public decisions. Government procurement, regulatory authority and private ownership must now be clearly separated."
 MAD_POL_TIM_NATIONAL_CHAMPION: "Build a Malagasy National Champion"
 MAD_POL_TIM_NATIONAL_CHAMPION_desc: "The growth of TIKO demonstrated the potential for Malagasy-owned companies to become major industrial and commercial groups. Rather than treating domestic business success as a threat, the government can help build nationally owned enterprises through investment, infrastructure and fair access to finance. The challenge is to support domestic champions without recreating the political privileges and conflicts of interest associated with the TIKO controversy."
 MAD_POL_TIM_CONNECT_ISLAND: "Connect the Island"
 MAD_POL_TIM_CONNECT_ISLAND_desc: "The MAP's Connected Infrastructure commitment prioritised the expansion and rehabilitation of national and rural roads, improved transport and port links, and wider telecommunications access. The aim was to connect farming and production areas to markets and make schools, health centres and other public services more accessible beyond the main towns."
 MAD_POL_TIM_TIKO_COMPETITION: "Tiko and the Competition Question"
 MAD_POL_TIM_TIKO_COMPETITION_desc: "TIKO's expansion raised a central question for Madagascar's political economy: how can the country encourage successful domestic corporations without allowing one group to dominate access to markets and government? The government must choose whether to prioritise competition policy and independent regulation or use nationally owned companies as instruments of economic development."
 MAD_POL_TIM_MAP: "The Madagascar Action Plan"
 MAD_POL_TIM_MAP_desc: "Adopted for 2007–2012, the Madagascar Action Plan became the government's second-generation poverty-reduction strategy. Its eight commitments were responsible governance; connected infrastructure; educational transformation; rural development and a Green Revolution; health, family planning and the fight against HIV/AIDS; a high-growth economy; environmental protection; and national solidarity. It translated the Madagascar Naturellement vision into sector goals, priority actions and monitoring indicators."
 MAD_POL_TIM_GREEN_REVOLUTION: "A Green Revolution for Madagascar"
 MAD_POL_TIM_GREEN_REVOLUTION_desc: "The MAP's Green Revolution aimed to raise smallholder productivity through improved seeds and farming methods, agricultural extension, irrigation and stronger links between farmers, processors and markets. Higher rice and other food production, better rural incomes and more resilient food supplies were central objectives, alongside the development of commercially viable agricultural value chains."
 MAD_POL_TIM_LAND_TITLES: "Modernise Land Tenure and Registration"
 MAD_POL_TIM_LAND_TITLES_desc: "Beginning in 2005, the National Land Tenure Reform Programme decentralised parts of land administration to communes. Local land offices (guichets fonciers) were established to issue certificates for untitled private land, alongside reforms to land law, registries, surveying and staff training. The programme aimed to make land rights more transparent, accessible and secure for rural households and investors."
 MAD_POL_TIM_OPEN_ECONOMY: "Open the Economy"
 MAD_POL_TIM_OPEN_ECONOMY_desc: "The government pursued an economic programme centred on private investment, trade integration and a larger role for private operators in productive sectors. Investment promotion, export-oriented activity and restructuring or opening selected state-owned enterprises were intended to expand capacity and improve services, while the MAP called for growth that could generate employment and reduce poverty."
 MAD_POL_TIM_DECENTRALISE: "Put the Fokontany to Work"
 MAD_POL_TIM_DECENTRALISE_desc: "The government replaced the former provincial administration with a 22-region structure and appointed regional chiefs in 2004 to coordinate decentralisation. The MAP made more effective local administration a national priority, seeking to bring development planning and public services closer to communities while clarifying the powers and financing available to regional and local authorities."
 MAD_POL_TIM_ENVIRONMENT: "Cherish the Environment"
 MAD_POL_TIM_ENVIRONMENT_desc: "The MAP's environmental commitment called for expanding protected areas, reducing degradation of forests and other natural resources, improving forest management and building environmental awareness into development policy. Conservation was presented as part of the national growth strategy, with protected landscapes and sustainable resource use intended to support livelihoods as well as biodiversity."
 MAD_POL_TIM_RECONCILIATION: "National Reconciliation"
 MAD_POL_TIM_RECONCILIATION_desc: "In his 2018 presidential Manifesto, Ravalomanana proposed a National Reconciliation Council and a nationally led Refoundation process, supported by credible and independent facilitators. Inclusive consultations beginning at the fokontany would feed into constitutional reform by referendum and a settlement intended to address recurring political crises, restore confidence in public institutions and rebuild a shared democratic framework."
 MAD_POL_TIM_REFUND_THE_REPUBLIC: "Rebuild the Republic's Institutions"
 MAD_POL_TIM_REFUND_THE_REPUBLIC_desc: "The programme places lasting institutions above personal or party influence. It calls for public authorities that can regulate commercial activity fairly, scrutinise executive decisions and administer public resources transparently. The objective is to make the state more accountable and capable while protecting the independence of oversight and judicial institutions."

 MAD_POL_TGV_YOUTH_READY: "The Youth Are Ready"
 MAD_POL_TGV_YOUTH_READY_desc: "Tanora malaGasy Vonona emerged as the political movement behind Andry Rajoelina's rise in Antananarivo. Rajoelina was an entrepreneur with substantial interests in the capital's media and advertising industries, and his political appeal drew on his public profile, younger supporters and dissatisfaction with the established political leadership. TGV now seeks to turn that following into a durable national political organisation."
 MAD_POL_TGV_2009_LEGACY: "Define the Transitional Mandate"
 MAD_POL_TGV_2009_LEGACY_desc: "The confrontation with Marc Ravalomanana escalated after the government closed Rajoelina's Viva television station. Demonstrations, opposition mobilisation and military defections culminated in Ravalomanana's departure in March 2009 and Rajoelina's installation as head of the High Transitional Authority. The Maputo Charter and the SADC-brokered Roadmap for Ending the Crisis then set out frameworks for an inclusive transition and a return to elections. The task was to move from the disputed transfer of power towards constitutional government."
 MAD_POL_TGV_FOURTH_REPUBLIC: "The Fourth Republic"
 MAD_POL_TGV_FOURTH_REPUBLIC_desc: "The Fourth Republic was established through a new Constitution approved by referendum during Rajoelina's period as head of the High Transitional Authority. Although it provided a new constitutional framework, the process remained disputed by opposition groups and much of the international community. The new republic must build legitimacy through functioning institutions, credible elections and a constitutional order that commands broader political acceptance."
 MAD_POL_TGV_MAJORITY_GOVERNMENT: "A Majority-backed Government"
 MAD_POL_TGV_MAJORITY_GOVERNMENT_desc: "Under the previous constitutional settlement, the President appointed the Prime Minister directly. Article 54 of the Fourth Republic requires the President to appoint the candidate presented by the party or group of parties holding a majority in the National Assembly. The Presidency retains the power of appointment, but the formation of government is now tied to the elected parliamentary majority."
 MAD_POL_TGV_RESTORE_PROVINCES: "Restore the Provinces"
 MAD_POL_TGV_RESTORE_PROVINCES_desc: "The removal of the Provinces from Madagascar's territorial structure left the Regions as the highest level of decentralised administration. The Constitution of the Fourth Republic restores the Provinces alongside the Communes and Regions, recognising three levels of decentralised territorial collectivities and providing for their administrative and financial autonomy."
 MAD_POL_TGV_CONSTITUTIONAL_HCDN: "Constitutionalise National Defence"
 MAD_POL_TGV_CONSTITUTIONAL_HCDN_desc: "Article 56 establishes the President as Supreme Head of the Armed Forces, assisted by a Haut Conseil de la Défense Nationale. Operating under presidential authority, the Council is charged with coordinating the activities entrusted to the Armed Forces and advising on external military interventions. The Constitution also defines national defence across military, economic, social, cultural, territorial and environmental dimensions, leaving the Council's detailed organisation to legislation."
 MAD_POL_TGV_RETURN_BALLOT: "Return Through the Ballot Box"
 MAD_POL_TGV_RETURN_BALLOT_desc: "The end of the transitional period requires TGV to demonstrate that its authority rests on electoral support rather than the political arrangements of the transition. The compromise surrounding the return to elections kept both Rajoelina and Ravalomanana from standing, and Rajoelina instead backed Hery Rajaonarimampianina, who won the presidency. In this alternative path, TGV must establish its own electoral mandate and accept the responsibilities of constitutional government."
 MAD_POL_TGV_THIRTEEN_VELIRANO: "The Thirteen Velirano"
 MAD_POL_TGV_THIRTEEN_VELIRANO_desc: "Rajoelina's thirteen Velirano were the public commitments of his presidential programme. They covered peace and security; electricity and potable water; anti-corruption and good governance; education, health and decent work; support for women, young people and vulnerable households; industrialisation, food sovereignty, natural-resource management, national modernisation, decentralisation, and sport and culture."
 MAD_POL_TGV_EMERGENCE_INITIATIVE: "The Emergence Initiative"
 MAD_POL_TGV_EMERGENCE_INITIATIVE_desc: "The Initiative pour l'Émergence de Madagascar was Rajoelina's presidential development platform and was formalised as the Plan Émergence Madagascar for 2019–2023. Built around the thirteen Velirano, the plan organised policy around social and human capital, economic growth and environmental management, with governance as a cross-cutting priority. After his re-election in 2023, the January 2024 General State Policy retained the Velirano as its foundation and restated the programme around human capital, industrialisation and economic transformation, and good governance."
 MAD_POL_TGV_INFRASTRUCTURE_FIRST: "Build National Infrastructure"
 MAD_POL_TGV_INFRASTRUCTURE_FIRST_desc: "The PEM placed transport and urban infrastructure at the centre of its development agenda. Its project portfolio included the Antananarivo–Toamasina motorway, upgrades to national roads such as the RN6, RN10, RN13 and RN31, expansion of the Port of Toamasina, and improvements to urban, airport and river transport."
 MAD_POL_TGV_JIRAMA_DELIVERY: "Make JIRAMA Work"
 MAD_POL_TGV_JIRAMA_DELIVERY_desc: "Reliable electricity was central to Velirano 2, but JIRAMA's generation and distribution constraints remained a major barrier. The programme called for restoring the utility's operational capacity, upgrading the network, expanding access and increasing domestic generation, including through the planned Volobe and Sahofika hydropower projects, which together were expected to add 312 MW."
 MAD_POL_TGV_SPECIAL_ECONOMIC_ZONES: "The Special Economic Zones"
 MAD_POL_TGV_SPECIAL_ECONOMIC_ZONES_desc: "The PEM proposed designated investment zones and more predictable business rules to attract private capital into manufacturing and processing. These zones were intended to support export industries, link domestic suppliers to larger value chains and broaden employment beyond raw-material production."
 MAD_POL_TGV_INDUSTRIAL_MADAGASCAR: "Industrial Madagascar"
 MAD_POL_TGV_INDUSTRIAL_MADAGASCAR_desc: "Industrialisation was presented as a route to diversify the economy and retain more value inside Madagascar. The policy sought to expand processing of agricultural and mineral products, strengthen manufacturing and build a stronger base for exports and skilled employment."
 MAD_POL_TGV_FOOD_SOVEREIGNTY: "Food Sovereignty"
 MAD_POL_TGV_FOOD_SOVEREIGNTY_desc: "Velirano 9 called for food self-sufficiency and a modern agricultural sector. The PEM aimed to raise domestic output for local consumption, improve farm productivity and strengthen the links between producers, irrigation, storage, processing and markets."
 MAD_POL_TGV_DIGITAL_MADAGASCAR: "Digital Madagascar"
 MAD_POL_TGV_DIGITAL_MADAGASCAR_desc: "The PEM treated digital development as part of national modernisation and economic growth. Its priorities included broader telecommunications and internet access, digital public services and the expansion of a digital economy capable of supporting businesses and jobs."
 MAD_POL_TGV_PRESIDENTIAL_PROJECTS: "Deliver Presidential Projects"
 MAD_POL_TGV_PRESIDENTIAL_PROJECTS_desc: "Both of Rajoelina's periods in office featured high-visibility public works promoted by the executive. During the 2009–2014 transition, projects in Antananarivo included housing, schools, hospitals and stadium facilities. The later PEM portfolio included Tanamasoandro, the Antananarivo–Toamasina motorway, the Toamasina port expansion, and Antananarivo's cable-car and flyover schemes, with several of these projects still under construction or delayed."
 MAD_POL_TGV_TRANSPARENT_EMERGENCE: "Transparent Emergence"
 MAD_POL_TGV_TRANSPARENT_EMERGENCE_desc: "Velirano 3 placed anti-corruption, fair justice and public-sector performance at the centre of the government's governance programme. The policy agenda included stronger anti-corruption enforcement, public-procurement oversight and administrative accountability, alongside a clearer environment for public and private investment."
 MAD_POL_TGV_STRONG_EXECUTIVE: "The Strong Executive"
 MAD_POL_TGV_STRONG_EXECUTIVE_desc: "Rajoelina's development model placed the Presidency at the centre of project selection and delivery. Presidential project structures coordinated priority infrastructure and urban developments, concentrating oversight close to the executive and giving the head of state a direct role in setting public-investment priorities."
 MAD_POL_HVM_PARTY_OF_GOVERNMENT: "Build a Party of Government"
 MAD_POL_HVM_PARTY_OF_GOVERNMENT_desc: "Hery Rajaonarimampianina entered national politics after serving as Finance Minister under the transitional administration. Supported by Rajoelina, he won the presidency but did not inherit an established national party with a long political tradition. HVM was developed as his political base, providing the administration with an organisation capable of building parliamentary support and sustaining its governing programme."
 MAD_POL_HVM_STABILISE_REPUBLIC: "Stabilise the Republic"
 MAD_POL_HVM_STABILISE_REPUBLIC_desc: "The return to elected government ended a prolonged period of political transition, but the new administration inherited weakened public institutions, disrupted development programmes, damaged donor relations and an unsettled political environment. Restoring predictable government and rebuilding confidence in the Fourth Republic are the immediate priorities. The state must demonstrate that constitutional government can provide continuity, rather than another temporary arrangement between competing political forces."
 MAD_POL_HVM_RSS_INTERNATIONAL_ASSESSMENT: "International Security Sector Assessment"
 MAD_POL_HVM_RSS_INTERNATIONAL_ASSESSMENT_desc: "Madagascar's return to constitutional government provides an opportunity to examine the weaknesses of its defence and security institutions. At the government's request, an international assessment mission led by the African Union, alongside the United Nations, European Union, SADC and other partners, will examine the country's armed forces, police, gendarmerie, intelligence services, judiciary and mechanisms of democratic oversight. Its findings will provide the basis for a comprehensive programme of security sector reform."
 MAD_POL_HVM_RSS_POLICY: "Adopt the RSS Policy"
 MAD_POL_HVM_RSS_POLICY_desc: "The findings of the international assessment, combined with consultations conducted throughout Madagascar's twenty-two regions, must be translated into a coherent national programme. The Lettre de Politique Générale de la Réforme du Secteur de la Sécurité establishes the government's vision for reform, identifying the institutions to be strengthened, the shortcomings to be addressed and the priorities that will guide a comprehensive transformation of the national security sector."
 MAD_POL_HVM_HCDN_REFORM: "Broaden the HCDN"
 MAD_POL_HVM_HCDN_REFORM_desc: "The constitutional High Council of National Defence requires a legal framework appropriate to the breadth of its responsibilities. Following the Constitutional High Court's rejection of a proposed military-only composition, Law 2016-059 establishes a broader council incorporating the principal civilian ministries alongside the security leadership. The HCDN will become a forum for coordinating national defence and security policy across the government, rather than an exclusively military body."
 MAD_POL_HVM_SP_DSN: "Establish the Permanent Secretariat"
 MAD_POL_HVM_SP_DSN_desc: "A council meeting periodically cannot provide the continuous administrative capacity required to develop national defence policy. The Secrétariat Permanent à la Défense et à la Sécurité Nationale will provide the HCDN with a permanent supporting institution, preparing its dossiers, coordinating with relevant ministries, contributing to the development of the national security strategy and monitoring the implementation of its decisions."
 MAD_POL_HVM_BNC_RSS: "Create the RSS Coordination Bureau"
 MAD_POL_HVM_BNC_RSS_desc: "The national reform programme requires a dedicated mechanism to coordinate its activities across institutions. The Bureau National de Coordination de la Réforme du Secteur de la Sécurité, established within the Permanent Secretariat, will harmonise the work of the eight pillars, coordinate their operational plans, monitor implementation and help mobilise the resources required to carry the programme forward."
 MAD_POL_HVM_RSS_EIGHT_PILLARS: "Implement the Eight RSS Pillars"
 MAD_POL_HVM_RSS_EIGHT_PILLARS_desc: "The national reform programme must now be translated into concrete institutional changes. Its eight pillars encompass the Malagasy Armed Forces, National Gendarmerie, National Police, Intelligence Services, Justice, Territorial Administration, Parliament and Non-State Actors. Each sector will develop its own operational programme within the common national framework, bringing the institutions providing, administering and overseeing security into a coordinated process of reform."
 MAD_POL_HVM_ARSSAM: "Mobilise ARSSAM Support"
 MAD_POL_HVM_ARSSAM_desc: "International assistance will provide additional resources for Madagascar's security sector reform programme. Through the Appui à la Réforme du Secteur de la Sécurité à Madagascar, the United Nations and its partners will support strategic planning, institutional capacity-building, technical assistance and equipment for relevant national institutions. This partnership will reinforce Madagascar's own reform programme and help translate its national objectives into practical improvements."
 MAD_POL_HVM_RULE_OF_LAW: "Strengthen the Rule of Law"
 MAD_POL_HVM_RULE_OF_LAW_desc: "The administration launched the National Strategy to Fight Corruption 2015–2025 in September 2015. It called for stronger anti-corruption legislation, more independent and better-resourced enforcement agencies, a system to track corruption cases and greater integrity in the judiciary. Subsequent laws established specialised courts and strengthened international cooperation."
 MAD_POL_HVM_DECENTRALISE: "Implement Local Government Reform"
 MAD_POL_HVM_DECENTRALISE_desc: "The 2014 decentralisation laws defined the powers and organisation of communes, regions and provinces, revised the State's representation in local authorities, and set out the resources and responsibilities of decentralised territorial collectivities. Four implementing decrees in 2015 addressed local consultation, inter-local cooperation, local budgeting and the powers of local executives. Law No. 2015-024 also established a Local Development Fund for basic territorial authorities."
 MAD_POL_HVM_MACRO_STABILITY: "Preserve Macroeconomic Stability"
 MAD_POL_HVM_MACRO_STABILITY_desc: "The administration pursued fiscal consolidation by widening the tax base, improving tax and customs collection and reducing costly subsidies. IMF reviews recorded tax revenue rising from 9.9 per cent of GDP in 2014 to 10.9 per cent in 2016, while fuel subsidies were discontinued in 2016; reforms of loss-making state enterprises remained incomplete."
 MAD_POL_HVM_INVESTMENT_FRIENDLY: "Improve the Investment Climate"
 MAD_POL_HVM_INVESTMENT_FRIENDLY_desc: "After the political transition, the government sought to restore confidence among domestic businesses, international investors and development partners through a more predictable regulatory environment, stronger tax and customs administration and reform of state-owned enterprises. Law No. 2017-023 later established a Special Economic Zone regime to attract investment, support value-added production and diversify exports."
 MAD_POL_HVM_HUMAN_CAPITAL: "Invest in Human Capital"
 MAD_POL_HVM_HUMAN_CAPITAL_desc: "The National Development Plan 2015–2019 treated human capital as one of its five pillars, linking education and professional skills with health, nutrition and access to basic services. The government translated this priority into sector plans for education, employment and health, while seeking to improve opportunities for children and vulnerable households."
 MAD_POL_HVM_VOCATIONAL_TRAINING: "National Employment and Training Policy"
 MAD_POL_HVM_VOCATIONAL_TRAINING_desc: "Law No. 2015-040 of 9 December 2015 established the National Employment and Vocational Training Policy. It aimed to widen access to technical and professional learning, strengthen lifelong training and link qualifications to the labour market, with an emphasis on decent work and expanding formal employment."
 MAD_POL_HVM_AGRICULTURE: "Reform Agriculture and Fisheries"
 MAD_POL_HVM_AGRICULTURE_desc: "The Programme Sectoriel Agriculture, Élevage et Pêche and its National Agricultural Investment Plan set a framework for the development of agriculture, livestock and fisheries. The programmes sought to raise productivity, improve access to domestic and export markets, strengthen food and nutrition security, and manage production resources more sustainably."
 MAD_POL_HVM_LIGHT_INDUSTRY: "Develop Light Manufacturing"
 MAD_POL_HVM_LIGHT_INDUSTRY_desc: "Fisandratana 2030 envisaged moving beyond raw-material exports by expanding agro-processing, textiles and other light manufacturing around the country's proposed growth hubs. The programme linked industrial development to improved energy and transport infrastructure, domestic value chains and vocational skills."
 MAD_POL_HVM_PPP_FRAMEWORK: "The 2015–2016 Presidential Emergency Programme tied urgent public investment to the National Development Plan, while Law No. 2015-039, promulgated on 3 February 2016, established the legal framework for awarding and executing public-private partnership contracts. Decrees Nos. 2017-149 and 2017-150 then set out procurement procedures and institutional responsibilities, providing a framework for the government's major-project pipeline and private financing."
 MAD_POL_HVM_PPP_FRAMEWORK_desc: "The 2015–2016 Presidential Emergency Programme tied urgent public investment to the National Development Plan, while public-private partnerships were used to pursue projects beyond the State's own financing capacity. At the December 2016 donor conference in Paris, partners pledged substantial financing for the plan and the government presented a large pipeline of PPP projects; these commitments were investment plans, not proof that every project was delivered."
 MAD_POL_HVM_ENERGY_FOR_GROWTH: "Implement the New Energy Policy"
 MAD_POL_HVM_ENERGY_FOR_GROWTH_desc: "Adopted in 2015, the New Energy Policy set a 2030 goal of sustainable modern-energy access for 70 per cent of households and promoted renewable generation, greater efficiency and a stronger investment framework. The government also sought to restore JIRAMA's operational capacity and improve the reliability of electricity supply, a major constraint on industry and household services."
 MAD_POL_HVM_NATURAL_CAPITAL: "Protect Natural Capital"
 MAD_POL_HVM_NATURAL_CAPITAL_desc: "Natural capital and disaster resilience formed the fifth pillar of the National Development Plan. The government updated the Environmental Charter in 2015, revised the Protected Areas Management Code and adopted a national policy for disaster-risk and catastrophe management, framing conservation and resilience as part of the country's development strategy."
 MAD_POL_HVM_ELECTORAL_FRAMEWORK: "Revise the Electoral Laws"
 MAD_POL_HVM_ELECTORAL_FRAMEWORK_desc: "In May 2018, President Rajaonarimampianina promulgated three organic laws covering general elections and referendums, the presidential election and National Assembly elections. They followed a contested legislative process and Constitutional High Court review after opposition protests, and provided the legal framework for the November 2018 presidential poll."
 MAD_POL_HVM_FISANDRATANA_2030: "Fisandratana 2030"
 MAD_POL_HVM_FISANDRATANA_2030_desc: "Fisandratana 2030 was presented as a long-term vision for Madagascar's economic growth and transformation under Rajaonarimampianina. It sought to concentrate investment around four economic growth hubs and develop priority sectors including agriculture, fisheries, light industry, mining and tourism. Transport, energy, education, vocational training and healthcare were central to the programme. Its ambitious targets depended on sustained investment and effective implementation, rather than simply announcing a new national vision."

