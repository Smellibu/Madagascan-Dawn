 # ================================================================
 # THE CNA AND THE LOCUSTS
 # ================================================================
 MAD_CNA_GENETIC_ENGINEERING: "CNA Genetic-Engineering Programme"
 MAD_CNA: "Establish the National Locust Control Centre"
 MAD_CNA_desc: "Create the Centre National Antiacridien (CNA) as Madagascar's dedicated national body for locust monitoring and control. Give it a stable budget and technical authority to coordinate preventive measures and emergency response before swarms devastate crops."
 MAD_Continue_the_path: "Expand Locust Survey and Control"
 MAD_Continue_the_path_desc: "Consolidate the first phase of the CNA programme by supporting agricultural productivity and easing rural labour demands. The investment establishes a stronger base for future monitoring and control campaigns, but the country still needs dedicated surveillance and response capacity."
 MAD_become_the_locust: "Support Farmers through Locust Relief"
 MAD_become_the_locust_desc: "Support farmers in affected areas through a coordinated locust response. Harvesting and control operations can limit immediate crop losses, while assistance to rural households helps protect the next planting season. Emergency action should complement surveillance and longer-term prevention rather than stand alone."
 MAD_map_infestations: "Map Locust Infestations"
 MAD_map_infestations_desc: "Map swarm movements, breeding grounds and seasonal conditions across agricultural areas. Regular reporting from local communities, agricultural services and technical teams can identify where locusts are developing and direct treatment before swarms spread into major farming regions."
 MAD_biopesticides: "Develop Biological Locust Control"
 MAD_biopesticides_desc: "Expand biological control as an alternative to repeated broad-spectrum spraying. Carefully targeted biological agents can suppress locust populations while limiting harm to other insects, crops and surrounding ecosystems. The approach requires monitoring, appropriate application conditions and coordination with farmers in affected areas."
 MAD_locust_invasion_response: "Prepare for Locust Invasions"
 MAD_locust_invasion_response_desc: "Prepare aerial and ground teams to respond when swarms spread across agricultural areas. Effective control depends on early warning, coordinated treatment and the ability to reach remote breeding grounds before locusts mature and disperse. Aerial intervention must be matched with ground assessment and safeguards for people, livestock and non-target species."
 MAD_preventative_measures: "Fund Permanent Locust Prevention"
 MAD_preventative_measures_desc: "Shift from emergency spraying to sustained prevention by monitoring breeding areas, treating hopper bands early and coordinating control across affected regions. Timely action before swarms mature can limit the scale of outbreaks, while continued surveillance helps agricultural services respond before vulnerable crops are threatened."
 MAD_drought_unlock_spray_tt: "Unlocks the per-state decision: §YSpray§!"
 MAD_drought_unlock_wells_tt: "Unlocks the per-state decision: §YSink Wells§!"
