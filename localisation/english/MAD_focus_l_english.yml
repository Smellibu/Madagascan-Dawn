 MAD_MADARAIL_CONCEDE_HOLDING_HOLIDAY: "Grant a Tax Holiday"
 MAD_MADARAIL_CONCEDE_HOLDING_HOLIDAY_desc: "Offer to exempt the consortium's terminal investments from tax."
 MAD_MADARAIL_CONCEDE_HOLDING_LOANS: "Arrange State-Bank Loans"
 MAD_MADARAIL_CONCEDE_HOLDING_LOANS_desc: "Offer state banks' loans to the consortium on favourable terms."
 mad_madarail.3.b: "Bring in Vecturis"
