 MAD_SECREN_FRENCH_PARTNERSHIP: "French Partnership for SECREN"
 MAD_SECREN_FRENCH_PARTNERSHIP_desc: "Turn renewed French-Malagasy interest in Antsiranana's civilian port and SECREN into a concrete modernisation programme. French financing could restore ship-repair capacity and strengthen our maritime industry, but the investment depends on Paris accepting the proposal."

 mad_secren.1.t: "A French Investment in SECREN"
 mad_secren.1.d: "Madagascar has proposed a $7.5 billion package to support SECREN and the civilian port at Antsiranana. The programme would expand ship-repair capacity and strengthen maritime cooperation in the western Indian Ocean. The investment offers France a commercial stake and greater influence, but requires a substantial financial commitment."
 mad_secren.1.a: "Finance the modernisation programme"
 mad_secren.1.b: "Decline the offer"

 mad_secren.2.t: "French Funding for SECREN"
 mad_secren.2.d: "France has accepted the modernisation proposal. The funding will support SECREN's revival, with a new naval dockyard and additional industrial capacity at Antsiranana."
 mad_secren.2.a: "Put the investment to work"

 mad_secren.3.t: "France Declines SECREN Investment"
 mad_secren.3.d: "Paris has declined the proposed investment in SECREN. The modernisation programme will have to wait for alternative financing or a future agreement."
 mad_secren.3.a: "We will seek other partners"
