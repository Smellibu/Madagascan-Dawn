 MAD_MADARAIL_CONCEDE_COMAZAR_FREIGHT: "Guarantee Freight Volumes"
 MAD_MADARAIL_CONCEDE_COMAZAR_FREIGHT_desc: "Offer to commit public cargo, and press the mining companies, to minimum volumes on Madarail."
 MAD_MADARAIL_CONCEDE_VECTURIS_RETURNS: "Guarantee Investor Returns"
