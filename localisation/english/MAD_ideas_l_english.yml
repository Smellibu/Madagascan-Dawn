MAD_POLICY_ROAD_PUBLIC:0 "Public District Road Crews"
 MAD_POLICY_ROAD_PUBLIC_desc:0 "For 180 days, public district crews coordinate maintenance, improving local productivity and public order."
 MAD_POLICY_ROAD_PRIVATE:0 "Private Road Maintenance Contracts"
 MAD_POLICY_ROAD_PRIVATE_desc:0 "For 180 days, performance-based private maintenance contracts improve productivity and make private investment easier."
 MAD_POLICY_FISHERIES_PUBLIC:0 "Public Fisheries Landing and Ice Facilities"
 MAD_POLICY_FISHERIES_PUBLIC_desc:0 "For 180 days, public landing and cold-chain facilities improve fish handling and export capacity."
 MAD_POLICY_FISHERIES_PRIVATE:0 "Private Fisheries Cold Chain"
 MAD_POLICY_FISHERIES_PRIVATE_desc:0 "For 180 days, private storage and processing contracts improve fish handling, exports and productivity."
 MAD_POLICY_VANILLA_PUBLIC:0 "Public Commodity Warehousing"
 MAD_POLICY_VANILLA_PUBLIC_desc:0 "For 180 days, public crop warehouses improve agricultural productivity and producer-side market coordination."
 MAD_POLICY_VANILLA_PRIVATE:0 "Private Commodity Warehousing"
 MAD_POLICY_VANILLA_PRIVATE_desc:0 "For 180 days, private warehouses and forward contracts improve productivity and export capacity."
 MAD_POLICY_APPRENTICESHIP_PUBLIC:0 "Public Technical Apprenticeships"
 MAD_POLICY_APPRENTICESHIP_PUBLIC_desc:0 "For 180 days, public technical apprenticeships improve research capacity and workforce availability."
 MAD_POLICY_APPRENTICESHIP_PRIVATE:0 "Employer-Led Apprenticeships"
 MAD_POLICY_APPRENTICESHIP_PRIVATE_desc:0 "For 180 days, employer-led apprenticeships improve industrial production and training."
 MAD_POLICY_DEFENCE_PUBLIC:0 "State Defence Depot Maintenance"
 MAD_POLICY_DEFENCE_PUBLIC_desc:0 "For 180 days, state-run depots improve military readiness and reduce military operating costs."
 MAD_POLICY_DEFENCE_PRIVATE:0 "Private Defence Maintenance Contracts"
 MAD_POLICY_DEFENCE_PRIVATE_desc:0 "For 180 days, private maintenance contractors improve equipment availability and military organisation."

 MAD_POLICY_ROYAL_BONDS_IDEA:0 "Crown-Backed Regional Development Bonds"
 MAD_POLICY_ROYAL_BONDS_IDEA_desc:0 "The Crown and regional houses have become guarantors of a public regional-development financing mechanism."
 MAD_POLICY_TAMIMA_EXPORT_SYNDICATES_IDEA:0 "TAMIMA Export Syndicates"
 MAD_POLICY_TAMIMA_EXPORT_SYNDICATES_IDEA_desc:0 "Chartered merchant houses coordinate private export finance and logistics, with the associated risk of concentrated commercial influence."
 MAD_POLICY_MILITARY_ENGINEER_MANDATE_IDEA:0 "Military Engineer Corps Works Mandate"
 MAD_POLICY_MILITARY_ENGINEER_MANDATE_IDEA_desc:0 "The Engineer Corps has been assigned a standing national works mandate alongside its military responsibilities."
 MAD_POLICY_AREMA_MILLING_BOARD_IDEA:0 "Public Milling and Storage Board"
 MAD_POLICY_AREMA_MILLING_BOARD_IDEA_desc:0 "The state directly operates strategic milling, storage and local food-processing capacity."
 MAD_POLICY_TIM_EXPORT_CREDIT_IDEA:0 "Export Credit Guarantee Framework"
 MAD_POLICY_TIM_EXPORT_CREDIT_IDEA_desc:0 "The state underwrites part of private export-credit risk to protect supply chains and access to external markets."
 MAD_POLICY_TGV_VELIRANO_BONDS_IDEA:0 "Velirano Project Bonds"
 MAD_POLICY_TGV_VELIRANO_BONDS_IDEA_desc:0 "Sovereign-backed project bonds finance the selected infrastructure portfolio, increasing the state's financing exposure."
 MAD_POLICY_HVM_SME_COINVESTMENT_IDEA:0 "Malagasy SME Co-Investment Facility"
 MAD_POLICY_HVM_SME_COINVESTMENT_IDEA_desc:0 "Public capital is matched with private SME investment, including participation by external development-finance partners."
 MAD_POLICY_GRAZING_TRIBUNAL_PUBLIC_IDEA:0 "Public Grazing Claims Tribunal"
 MAD_POLICY_GRAZING_TRIBUNAL_PUBLIC_IDEA_desc:0 "A public tribunal provides a uniform process for grazing access, livestock losses and restitution."
 MAD_POLICY_GRAZING_TRIBUNAL_PRIVATE_IDEA:0 "Mutual Grazing Compensation Associations"
 MAD_POLICY_GRAZING_TRIBUNAL_PRIVATE_IDEA_desc:0 "Locally recognised mutual associations mediate grazing and compensation claims through negotiated agreements."
 MAD_POLICY_PLAGUE_SURVEILLANCE_IDEA:0 "District Epidemic Surveillance Charter"
 MAD_POLICY_PLAGUE_SURVEILLANCE_IDEA_desc:0 "District health services maintain reporting, contact-tracing and rapid-response capacity after the 2017 pneumonic-plague emergency."
 MAD_POLICY_STRATEGIC_SUPPLY_RESERVE_IDEA:0 "Strategic Supplier and Domestic Production Reserve"
 MAD_POLICY_STRATEGIC_SUPPLY_RESERVE_IDEA_desc:0 "State purchasing and strategic reserves help sustain domestic suppliers of essential goods during external disruptions."
