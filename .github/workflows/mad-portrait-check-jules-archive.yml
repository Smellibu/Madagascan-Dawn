name: Check archived Jules Mamizara portrait
on:
  push:
    branches:
      - codex/mad-military-policy-history-2026-11-12
    paths:
      - .github/workflows/mad-portrait-check-jules-archive.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mad-military-policy-history-2026-11-12
          persist-credentials: true
      - name: Check old SECES portrait page and web archive
        run: |
          python - <<'PY'
          import requests, json, re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session()
          s.headers["User-Agent"]="Mozilla/5.0"
          urls=[
            "https://www.geocities.com/seces_madagascar/page/jules.html",
            "https://www.geocities.ws/seces_madagascar/page/jules.html",
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=30,allow_redirects=True)
              print("DIRECT",url,r.status_code,r.url,r.headers.get("content-type"),len(r.content))
              if r.ok and "html" in r.headers.get("content-type",""):
                soup=BeautifulSoup(r.text,"html.parser")
                print("HTML_TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
                for img in soup.find_all("img"):
                  print("DIRECT_IMAGE",urljoin(r.url,img.get("src","")),img.get("alt",""))
            except Exception as e: print("DIRECT_ERROR",url,repr(e))
          targets=[
            "www.geocities.com/seces_madagascar/page/jules.html",
            "www.geocities.ws/seces_madagascar/page/jules.html",
          ]
          for target in targets:
            cdx="https://web.archive.org/cdx/search/cdx"
            try:
              r=s.get(cdx,params={"url":target,"output":"json","filter":"statuscode:200","filter_mimetype":"text/html","fl":"timestamp,original,statuscode","collapse":"digest"},timeout=40)
              print("CDX",target,r.status_code,len(r.content),r.text[:5000])
              rows=r.json() if r.ok else []
              for row in rows[1:]:
                ts,original,status=row[:3]
                snap=f"https://web.archive.org/web/{ts}id_/{original}"
                try:
                  p=s.get(snap,timeout=30)
                  print("SNAPSHOT",snap,p.status_code,p.url,len(p.content))
                  if p.ok:
                    soup=BeautifulSoup(p.text,"html.parser")
                    for img in soup.find_all("img"):
                      src=urljoin(p.url,img.get("src",""))
                      print("ARCHIVE_IMAGE",src,img.get("alt",""))
                    for a in soup.find_all("a",href=True):
                      href=urljoin(p.url,a["href"])
                      if re.search(r"\.(jpe?g|png|gif|webp)(?:[?#]|$)",href,re.I):
                        print("ARCHIVE_LINK",href,a.get_text(" ",strip=True))
                except Exception as e: print("SNAPSHOT_ERROR",snap,repr(e))
            except Exception as e: print("CDX_ERROR",target,repr(e))
          PY
      - name: Remove diagnostic workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mad-portrait-check-jules-archive.yml
          git add -u .github/workflows/mad-portrait-check-jules-archive.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Jules portrait archive check"
          git push origin HEAD:codex/mad-military-policy-history-2026-11-12
