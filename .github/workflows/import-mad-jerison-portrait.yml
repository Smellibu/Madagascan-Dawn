name: Import Rafenomanjato Mamy Jerison portrait

on:
  push:
    branches:
      - codex/mad-military-policy-history-2026-11-12
    paths:
      - .github/workflows/import-mad-jerison-portrait.yml

permissions:
  contents: write

jobs:
  import-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mad-military-policy-history-2026-11-12
          persist-credentials: true

      - name: Install image processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Download and prepare the identified CEDS portrait
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://ceds-madagascar.com/media/promotions/10-louis-rakotomalala/vignettes/rafenomanjato-mamy-jerison.webp' \
            --output /tmp/rafenomanjato-mamy-jerison.webp

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import subprocess

          source = Path('/tmp/rafenomanjato-mamy-jerison.webp')
          image = Image.open(source)
          image.load()
          image = ImageOps.exif_transpose(image).convert('RGB')

          # Refuse a broken/placeholder image. CEDS labels this image directly
          # as Mamy Jerison Rafenomanjato on its 10th-promotion profile.
          if image.width < 160 or image.height < 200:
              raise SystemExit(f'CEDS portrait resolution is too low: {image.size}')

          portrait = ImageOps.fit(
              image, (156, 210),
              method=Image.Resampling.LANCZOS,
              centering=(0.50, 0.42)
          )
          small = portrait.resize((38, 51), Image.Resampling.LANCZOS)

          portrait.save('/tmp/Rafenomanjato_Mamy_Jerison.png')
          small.save('/tmp/Rafenomanjato_Mamy_Jerison_small.png')

          subprocess.run([
              'convert', '/tmp/Rafenomanjato_Mamy_Jerison.png',
              '-strip', '-colorspace', 'sRGB', '-type', 'TrueColor',
              '-define', 'dds:compression=dxt1',
              'gfx/leaders/MAD/Rafenomanjato_Mamy_Jerison.dds'
          ], check=True)
          subprocess.run([
              'convert', '/tmp/Rafenomanjato_Mamy_Jerison_small.png',
              '-strip', '-colorspace', 'sRGB', '-type', 'TrueColor',
              '-define', 'dds:compression=dxt1',
              'gfx/leaders/MAD/small/Rafenomanjato_Mamy_Jerison_small.dds'
          ], check=True)

          for path in [
              'gfx/leaders/MAD/Rafenomanjato_Mamy_Jerison.dds',
              'gfx/leaders/MAD/small/Rafenomanjato_Mamy_Jerison_small.dds'
          ]:
              if not Path(path).is_file() or Path(path).stat().st_size == 0:
                  raise SystemExit(f'DDS export failed: {path}')
          print('Prepared large and small DDS portraits from', image.size)
          PY

      - name: Assign portrait and record source
        run: |
          python - <<'PY'
          from pathlib import Path

          chars_path = Path('common/characters/MAD.txt')
          chars = chars_path.read_text(encoding='utf-8-sig')
          marker = '\tMAD_rafenomanjato_mamy_jerison = {'
          start = chars.find(marker)
          if start < 0:
              raise SystemExit('MAD_rafenomanjato_mamy_jerison definition not found')

          open_pos = chars.find('{', start)
          depth = 0
          end = None
          for i in range(open_pos, len(chars)):
              if chars[i] == '{':
                  depth += 1
              elif chars[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('Could not parse Rafenomanjato character block')

          block = chars[start:end]
          if 'portraits = {' not in block:
              name_line = '\t\tname = "Rafenomanjato Mamy Jerison"\n'
              if name_line not in block:
                  raise SystemExit('Unexpected Rafenomanjato name line')
              portrait = (
                  name_line +
                  '\n\t\tportraits = {\n'
                  '\t\t\tarmy = {\n'
                  '\t\t\t\tsmall = "gfx/leaders/MAD/small/Rafenomanjato_Mamy_Jerison_small.dds"\n'
                  '\t\t\t\tlarge = "gfx/leaders/MAD/Rafenomanjato_Mamy_Jerison.dds"\n'
                  '\t\t\t}\n'
                  '\t\t}\n'
              )
              block = block.replace(name_line, portrait, 1)
              chars = chars[:start] + block + chars[end:]
              chars_path.write_text(chars, encoding='utf-8')

          source_path = Path('gfx/leaders/MAD/portrait_sources.md')
          sources = source_path.read_text(encoding='utf-8-sig')
          row = (
              '| Rafenomanjato_Mamy_Jerison | '
              '[CEDS Madagascar](https://ceds-madagascar.com/promotions/10-louis-rakotomalala/) | '
              'CEDS profile labels the photograph as Mamy Jerison Rafenomanjato; reuse permission not established |'
          )
          lines = sources.splitlines()
          existing = next((i for i, line in enumerate(lines)
                           if line.startswith('| Rafenomanjato_Mamy_Jerison |')), None)
          if existing is None:
              header = next((i for i, line in enumerate(lines) if line.startswith('|---')), None)
              if header is None:
                  raise SystemExit('Portrait source register header not found')
              lines.insert(header + 1, row)
          else:
              lines[existing] = row
          source_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          # Verify all portrait paths currently referenced by MAD characters exist.
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('common/characters/MAD.txt').read_text(encoding='utf-8-sig')
          missing = [p for p in re.findall(r'"(gfx/leaders/MAD/[^"]+\\.dds)"', text)
                     if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing referenced portrait files: ' + ', '.join(missing))
          PY

      - name: Commit assets, character assignment and source record
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-mad-jerison-portrait.yml
          git add common/characters/MAD.txt gfx/leaders/MAD/portrait_sources.md \
            gfx/leaders/MAD/Rafenomanjato_Mamy_Jerison.dds \
            gfx/leaders/MAD/small/Rafenomanjato_Mamy_Jerison_small.dds
          git add -u .github/workflows/import-mad-jerison-portrait.yml
          git commit -m "Add Rafenomanjato Mamy Jerison portrait"
          git push origin HEAD:codex/mad-military-policy-history-2026-11-12
