name: Recover Andrianome portrait from archive

on:
  push:
    branches:
      - codex/dahalo-campaign-chain-review-2026-10-25
    paths:
      - .github/workflows/import_mad_andrianome_archive.yml
      - tools/import_mad_portraits_once.py

permissions:
  contents: write

jobs:
  import-portrait:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch sparsely
        uses: actions/checkout@v4
        with:
          ref: codex/dahalo-campaign-chain-review-2026-10-25
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/import_mad_andrianome_archive.yml
            tools/import_mad_portraits_once.py
            common/characters/MAD.txt
            events/MAD_events.txt
            gfx/leaders/MAD
          sparse-checkout-cone-mode: true
      - name: Install portrait tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick poppler-utils
          python -m pip install --upgrade pip
          python -m pip install pillow requests beautifulsoup4 opencv-python-headless==4.10.0.84 numpy==1.26.4
      - name: Import archived portrait
        run: python tools/import_mad_portraits_once.py
      - name: Commit portrait and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gfx/leaders/MAD common/characters/MAD.txt events/MAD_events.txt
          git rm -f .github/workflows/import_mad_andrianome_archive.yml
          if git diff --cached --quiet; then
            echo "No additional portrait asset was available."
            exit 1
          fi
          git commit -m "Recover Andrianome portrait in Millennium Dawn DDS format"
          git push origin HEAD:codex/dahalo-campaign-chain-review-2026-10-25
