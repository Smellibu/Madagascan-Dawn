name: Repair Madagascar leader portraits — Group 1

on:
  push:
    branches:
      - codex/dahalo-campaign-chain-review-2026-10-25
    paths:
      - .github/workflows/mad-portrait-repair.yml

permissions:
  contents: write

jobs:
  repair-portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dahalo-campaign-chain-review-2026-10-25
          persist-credentials: true
          sparse-checkout: |
            .github/workflows
            common/characters
            common/scripted_effects
            events
            gfx/leaders/MAD
          sparse-checkout-cone-mode: true
      - name: Install portrait-processing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow opencv-python-headless==4.10.0.84 pymupdf
      - name: Retrieve, verify and format portraits
        run: |
          python - <<'PY'
          import io, os, re, json, html, subprocess, hashlib
          from pathlib import Path
          from urllib.parse import urljoin, quote_plus
          import requests, cv2, fitz
          import numpy as np
          from PIL import Image, ImageOps
          from bs4 import BeautifulSoup

          ROOT = Path.cwd()
          MAIN = ROOT / "gfx/leaders/MAD"
          SMALL = MAIN / "small"
          CHAR_FILE = ROOT / "common/characters/MAD.txt"
          EVENT_FILE = ROOT / "events/MAD_events.txt"
          LEADER_FILE = ROOT / "common/scripted_effects/MAD_political_leaders.txt"
          SOURCES_FILE = MAIN / "portrait_sources.md"
          MAIN.mkdir(parents=True, exist_ok=True)
          SMALL.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"})
          face_cascade = cv2.CascadeClassifier(cv2.data.haarcascades + "haarcascade_frontalface_default.xml")
          glasses_cascade = cv2.CascadeClassifier(cv2.data.haarcascades + "haarcascade_eye_tree_eyeglasses.xml")

          TARGETS = [
            {
              "base":"Charles_Andrianasoavina", "char":"MAD_charles_andrianasoavina", "role":"army",
              "urls":["https://i0.wp.com/www.agencemalagasydepresse.com/media/2023/10/colonel-charles-andrianasoavina.jpg?fit=1024%2C735&ssl=1"],
              "source_page":"https://www.agencemalagasydepresse.com/politique/raharaham-pirenena-fanambanny-colonel-charles-andrianasoavina/",
              "terms":["charles","andrianasoavina"],
              "credit":"Agence Malagasy de Presse",
              "rights":"Copyright / permission not established",
              "allow_center_crop":True
            },
            {
              "base":"Noel_Girardin_Rakotonandrasana", "char":"MAD_noel_rakotonandrasana", "role":"army",
              "urls":["https://images.ladepeche.fr/api/v1/images/view/5c1cf7e28fe56f701700bc28/large/image.jpg"],
              "source_page":"https://www.ladepeche.fr/article/2010/11/17/950064-madagascar-appel-a-la-mutinerie-le-jour-du-referendum-constitutionnel.html",
              "terms":["noel","rakotonandrasana"],
              "credit":"Grégoire Pourtier / AFP / La Dépêche",
              "rights":"AFP / La Dépêche copyright; permission not established",
              "allow_center_crop":True
            },
            {
              "base":"Petera_Behajaina", "char":"MAD_petera_behajaina", "role":"army",
              "urls":["https://www1.rfi.fr/actufr/images/059/madagascar_petera_behajaina.jpg"],
              "source_page":"https://www1.rfi.fr/actufr/articles/059/article_31466.asp",
              "terms":["petera","behajaina","bahajaina"],
              "credit":"Olivier Péguy / RFI",
              "rights":"Copyright / permission not established; RFI/AFP images may require permission",
              "prefer_glasses":True,
              "allow_center_crop":True
            },
          ]

          def get(url):
            try:
              r = session.get(url, timeout=30, allow_redirects=True)
            except requests.exceptions.SSLError as exc:
              # A few older Malagasy news archives have expired/misconfigured TLS chains.
              # Retry only those public image/archive requests with certificate validation disabled.
              print("TLS verification failed; retrying legacy source:", url, str(exc)[:100])
              r = session.get(url, timeout=30, allow_redirects=True, verify=False)
            r.raise_for_status()
            return r.content, r.headers.get("content-type","").lower(), r.url

          def faces(img):
            rgb = ImageOps.exif_transpose(img).convert("RGB")
            arr = cv2.cvtColor(np.array(rgb), cv2.COLOR_RGB2BGR)
            gray = cv2.cvtColor(arr, cv2.COLOR_BGR2GRAY)
            found = face_cascade.detectMultiScale(gray, scaleFactor=1.035, minNeighbors=2, minSize=(12,12))
            result = []
            for x,y,w,h in found:
              # Reject banner/logo false positives such as the tall RFI language strip.
              ratio = w / float(h) if h else 0
              if not 0.62 <= ratio <= 1.48:
                continue
              if w*h > rgb.width*rgb.height*0.42:
                continue
              score = w*h
              eyeregion = gray[max(0,y):min(gray.shape[0],y+int(h*.62)), max(0,x):min(gray.shape[1],x+w)]
              glasses = glasses_cascade.detectMultiScale(eyeregion, scaleFactor=1.05, minNeighbors=2, minSize=(5,5)) if eyeregion.size else []
              result.append((int(x),int(y),int(w),int(h),score,bool(len(glasses))))
            if not result:
              return rgb, []
            return rgb, sorted(result,key=lambda z:(int(z[5]) if False else 0,z[4]),reverse=True)

          def crop_face(img, box):
            x,y,w,h = box[:4]
            ratio = 156/210
            ch = max(int(h*3.4), 120)
            cw = int(ch*ratio)
            cx = x + w//2
            top = y - int(h*.42)
            left = cx - cw//2
            # Expand at borders by shifting the crop rather than shrinking it.
            left = max(0, min(left, img.width-cw))
            top = max(0, min(top, img.height-ch))
            if cw > img.width or ch > img.height:
              return ImageOps.fit(img,(156,210),method=Image.Resampling.LANCZOS,centering=(.5,.4))
            return img.crop((left,top,left+cw,top+ch))

          def image_bytes(data):
            try:
              im = Image.open(io.BytesIO(data))
              im.load()
              if im.width >= 60 and im.height >= 80:
                return im.convert("RGB")
            except Exception:
              pass
            return None

          def page_candidates(url, terms, allow_center_crop=False, trusted_domains=None):
            out=[]
            try:
              data, typ, landed = get(url)
              if typ.startswith("image/") or data[:4] in (b"\xff\xd8\xff\xe0",b"\xff\xd8\xff\xdb",b"\x89PNG",b"RIFF"):
                im=image_bytes(data)
                if im: out.append((url, url, im, 150))
                return out
              if url.lower().endswith(".pdf") and not (data.startswith(b"%PDF") or "application/pdf" in typ):
                print("PDF source redirected to a non-PDF page; skipping:", url, "->", landed)
                return out
              if data.startswith(b"%PDF") or "application/pdf" in typ or url.lower().endswith(".pdf"):
                doc=fitz.open(stream=data,filetype="pdf")
                candidates=[]
                # Render pages whose text names the officer first; if their page has no face, inspect the rest.
                text_pages=[]
                need=[t.casefold() for t in terms if len(t)>4]
                for n,page in enumerate(doc):
                  txt=page.get_text("text").casefold()
                  score=sum(80 for t in need if t in txt)
                  if score: text_pages.append((n,score))
                order=[n for n,_ in sorted(text_pages,key=lambda z:z[1],reverse=True)]
                order += [n for n in range(min(len(doc),15)) if n not in order]
                for n in order[:15]:
                  page=doc[n]
                  pix=page.get_pixmap(matrix=fitz.Matrix(2.5,2.5),alpha=False)
                  im=Image.open(io.BytesIO(pix.tobytes("png"))).convert("RGB")
                  _, fs=faces(im)
                  if fs:
                    txt=page.get_text("text").casefold()
                    page_score=sum(80 for t in need if t in txt)
                    box=fs[0]
                    candidates.append((score + page_score + box[4]/10000, landed + "#page=" + str(n+1), im, box))
                for score, src, im, box in sorted(candidates,key=lambda z:z[0],reverse=True):
                  out.append((src, landed, im, box))
                return out
              soup=BeautifulSoup(data,"html.parser")
              needles=[x.casefold() for x in terms]
              cand={}
              def add(u,label,weight=0):
                if not u: return
                u=urljoin(landed,u)
                low=(u+" "+label).casefold()
                if any(z in low for z in ["favicon","web-app-manifest","/logo","logo-","avatar","gravatar","placeholder","advert","sprite","site-icon","/icons/","programmes-rfi","generique/img","rfi-langues","banner","banniere"]):
                  return
                if re.search(r"\.(jpe?g|png|webp)(?:[?#]|$)",u,re.I): weight+=10
                weight += sum(25 for term in needles if term and term in low)
                cand[u]=max(cand.get(u,-999),weight)
              for meta in soup.find_all("meta"):
                key=(meta.get("property") or meta.get("name") or "").lower()
                if key in ("og:image","twitter:image","twitter:image:src") and meta.get("content"):
                  add(meta["content"],meta.get("alt",""),4)
              for container in soup.select("article, main, .article, .post, .entry-content"):
                for img in container.find_all("img"):
                  u=img.get("src") or img.get("data-src") or img.get("data-lazy-src")
                  if not u and img.get("srcset"): u=img["srcset"].split(",")[0].strip().split(" ")[0]
                  add(u," ".join(str(img.get(k,"")) for k in ("alt","title","class","id")),30)
              for img in soup.find_all("img"):
                u=img.get("src") or img.get("data-src") or img.get("data-lazy-src")
                if u: add(u," ".join(str(img.get(k,"")) for k in ("alt","title","class","id")),0)
              for u,sc in sorted(cand.items(),key=lambda z:z[1],reverse=True)[:24]:
                if trusted_domains:
                  lower_u=u.casefold()
                  label_match=all(term.casefold() in lower_u for term in terms if len(term)>=6)
                  host_match=any(domain in landed.casefold() and domain in lower_u for domain in trusted_domains)
                  if not (host_match or label_match):
                    continue
                try:
                  b,t,_=get(u)
                  im=image_bytes(b)
                  if im:
                    _,fs=faces(im)
                    if fs:
                      out.append((u,landed,im,fs[0],sc))
                    elif allow_center_crop and im.width >= 180 and im.height >= 140 and 0.45 <= im.width / float(im.height) <= 2.2:
                      out.append((u,landed,im,150,sc))
                except Exception: pass
              out.sort(key=lambda z:(z[4] if len(z)>4 else 0, z[3][4] if isinstance(z[3],tuple) else 0),reverse=True)
              return out
            except Exception as exc:
              print("PAGE FAILED",url,str(exc)[:180])
              return []

          def trusted_image_candidate(image_url, page_url, label, spec):
            domains=spec.get("trusted_domains",[])
            if not domains:
              return True
            image_lower=(image_url+" "+label).casefold()
            page_lower=(page_url or "").casefold()
            identity=[term.casefold() for term in spec["terms"] if len(term)>=6]
            image_host_trusted=any(domain in image_lower for domain in domains)
            source_page_trusted=any(domain in page_lower for domain in domains)
            # Search results are only accepted if the image itself is on an approved publisher/Commons host,
            # or the actual image URL/metadata contains every distinctive name token.
            return (source_page_trusted and image_host_trusted) or (bool(identity) and all(term in image_lower for term in identity))

          def commons_candidates(spec):
            found=[]
            queries=spec.get("commons_queries",[])
            if not queries:
              return found
            for query in queries:
              try:
                response=session.get("https://commons.wikimedia.org/w/api.php",params={
                  "action":"query","generator":"search","gsrsearch":query,"gsrnamespace":6,
                  "gsrlimit":20,"prop":"imageinfo","iiprop":"url|extmetadata","iiurlwidth":1000,"format":"json"
                },timeout=20)
                response.raise_for_status()
                payload=response.json()
                pages=(payload.get("query",{}).get("pages",{}) or {}).values()
              except Exception as exc:
                print("COMMONS SEARCH FAILED",query,str(exc)[:120])
                continue
              for page in pages:
                title=page.get("title","")
                info=(page.get("imageinfo") or [{}])[0]
                meta=info.get("extmetadata") or {}
                desc=" ".join(str(meta.get(k,{}).get("value","")) for k in ("ObjectName","ImageDescription","Artist"))
                searchable=(title+" "+desc).casefold()
                identity=[t.casefold() for t in spec["terms"] if len(t)>=6]
                if identity and not all(t in searchable for t in identity):
                  continue
                url=info.get("thumburl") or info.get("url")
                if not url: continue
                try:
                  b,typ,landed=get(url)
                  im=image_bytes(b)
                  if not im: continue
                  _,fs=faces(im)
                  if fs:
                    chosen=fs[0]
                  elif spec.get("allow_center_crop") and im.width>=180 and im.height>=140 and 0.45 <= im.width/float(im.height) <= 2.2:
                    chosen=(0,0,im.width,im.height,0,False)
                  else:
                    continue
                  pageurl="https://commons.wikimedia.org/wiki/"+quote_plus(title.replace(" ","_"))
                  spec["source_page"]=pageurl
                  license_name=html.unescape(str(meta.get("LicenseShortName",{}).get("value","not stated")))
                  artist=html.unescape(str(meta.get("Artist",{}).get("value","Wikimedia Commons contributor")))
                  spec["credit"]=artist+" / Wikimedia Commons"
                  spec["rights"]="Commons file licence: "+license_name+"; verify attribution on linked file page"
                  return [(im,chosen,landed,pageurl)]
                except Exception:
                  continue
            return found

          def bing_candidates(query, terms):
            try:
              data,_,landed=get("https://www.bing.com/images/search?q="+quote_plus(query))
              soup=BeautifulSoup(data,"html.parser")
              res=[]
              for item in soup.select("a.iusc"):
                try: meta=json.loads(html.unescape(item.get("m","{}")))
                except Exception: continue
                url=meta.get("murl")
                # Do not let a relevant result-page URL make an unrelated image look like a match.
                label=" ".join(str(meta.get(k,"")) for k in ("t","desc"))
                if not url: continue
                joined=(label+" "+url).casefold()
                identity=[t.casefold() for t in terms if len(t)>=8]
                if identity and not any(t in joined for t in identity): continue
                score=sum(50 for t in terms if t and t.casefold() in joined)
                if score < 50: continue
                if any(z in (label+" "+url).casefold() for z in ["logo","avatar","icon","advert","video game"]): continue
                res.append((score,url,meta.get("purl") or landed,label))
              return sorted(res,reverse=True)[:25]
            except Exception as exc:
              print("BING SEARCH FAILED",query,str(exc)[:150])
              return []

          def find_portrait(spec):
            # Search exact source articles and direct files first.
            for url in spec.get("urls",[]):
              for item in page_candidates(url,spec["terms"],spec.get("allow_center_crop",False),spec.get("trusted_domains")):
                src, page, im, box, *extra = item
                _, found=faces(im)
                if isinstance(box,tuple) and len(box)>=4:
                  chosen=box
                elif found:
                  chosen=found[0]
                elif spec.get("allow_center_crop") and isinstance(box, (int, float)):
                  chosen=(0,0,im.width,im.height,0,False)
                else:
                  continue
                # For Behajaina, prefer a face with eyewear because the RFI caption identifies him as the man with glasses.
                if spec.get("prefer_glasses") and found:
                  gl=[f for f in found if f[5]]
                  if gl: chosen=gl[0]
                return im,chosen,src,page
            # Search Wikimedia Commons by person and source metadata before broad image engines.
            for item in commons_candidates(spec):
              im,chosen,source,page=item
              return im,chosen,source,page
            # Broader image searches, including French-language titles.
            for query in spec.get("queries",[]):
              for score, imgurl, pageurl, label in bing_candidates(query,spec["terms"]):
                if not trusted_image_candidate(imgurl,pageurl,label,spec):
                  continue
                try:
                  data,typ,landed=get(imgurl)
                  im=image_bytes(data)
                  if not im: continue
                  _,found=faces(im)
                  if not found: continue
                  chosen=found[0]
                  if spec.get("prefer_glasses"):
                    gl=[f for f in found if f[5]]
                    if gl: chosen=gl[0]
                  return im,chosen,landed,pageurl or query
                except Exception: continue
            return None

          def write_portrait(spec, img, box):
            crop=crop_face(img,box)
            crop=ImageOps.fit(crop,(156,210),method=Image.Resampling.LANCZOS,centering=(.5,.42)).convert("RGB")
            small=crop.resize((38,51),Image.Resampling.LANCZOS)
            stem=spec["base"]
            tmp=ROOT/("tmp_"+stem+".png")
            tmp_small=ROOT/("tmp_"+stem+"_small.png")
            crop.save(tmp); small.save(tmp_small)
            subprocess.run(["convert",str(tmp),"-strip","-colorspace","sRGB","-type","TrueColor","-define","dds:compression=dxt1",str(MAIN/(stem+".dds"))],check=True)
            subprocess.run(["convert",str(tmp_small),"-strip","-colorspace","sRGB","-type","TrueColor","-define","dds:compression=dxt1",str(SMALL/(stem+"_small.dds"))],check=True)
            tmp.unlink(missing_ok=True); tmp_small.unlink(missing_ok=True)

          # These existing assets were visually checked and confirmed to be bad:
          # a PDF text page, site logos, an article excerpt, a text scrap, an advert, or an unverified officer.
          # This grouped pass only replaces portraits when its exact source succeeds.
          # A source failure must never delete the currently committed portrait or character link.
          invalid_if_unreplaced = set()
          chars=CHAR_FILE.read_text(encoding="utf-8-sig")
          events=EVENT_FILE.read_text(encoding="utf-8-sig")
          leaders=LEADER_FILE.read_text(encoding="utf-8-sig")
          rows={}
          old=SOURCES_FILE.read_text(encoding="utf-8-sig") if SOURCES_FILE.exists() else ""
          for spec in TARGETS:
            print("SEARCHING",spec["base"])
            found=find_portrait(spec)
            if found:
              img,box,source,page=find_portrait_result = found
              write_portrait(spec,img,box)
              rows[spec["base"]]=(source,spec.get("source_page",page),spec["credit"],spec["rights"],True)
              print("IMPORTED",spec["base"],"source",source,"page",page,"image",img.size,"face",box[:4])
            else:
              rows[spec["base"]]=("", "", spec["credit"],spec["rights"],False)
              print("NO VERIFIED FACE CANDIDATE",spec["base"])
              if spec["base"] in invalid_if_unreplaced:
                # Remove bad art rather than leave a logo, document excerpt, ad, or misidentified person.
                (MAIN/(spec["base"]+".dds")).unlink(missing_ok=True)
                (SMALL/(spec["base"]+"_small.dds")).unlink(missing_ok=True)

          # Remove portrait paths only for assets we failed to replace and know were invalid.
          failed={base for base, row in rows.items() if not row[4] and base in invalid_if_unreplaced}
          bybase={
            "Andrianome_Ranivo_Dieudonne":"MAD_andrianome_dieudonne",
            "Jules_Mamizara":"MAD_jules_mamizara",
            "Raonenantsoamampianina":"MAD_raonenantsoamampianina",
            "Edmond_Rasolomahandry":"MAD_edmond_rasolomahandry",
            "Charles_Andrianasoavina":"MAD_charles_andrianasoavina",
            "Hyppolite_Rarison_Ramaroson":"MAD_hyppolite_ramaroson",
          }
          def remove_property(block, prop):
            token=re.search(r"(?m)^\s*"+re.escape(prop)+r"\s*=\s*\{",block)
            if not token: return block
            start=token.start(); openpos=block.find("{",token.start()); depth=0; end=None
            for i in range(openpos,len(block)):
              if block[i]=="{": depth+=1
              elif block[i]=="}":
                depth-=1
                if depth==0: end=i+1; break
            if end is not None: return block[:start]+block[end:].lstrip("\n")
            return block
          for base in failed:
            cid=bybase[base]
            marker="\t"+cid+" = {"
            s=chars.find(marker)
            if s>=0:
              depth=0; end=None
              for i in range(s,len(chars)):
                if chars[i]=="{": depth+=1
                elif chars[i]=="}":
                  depth-=1
                  if depth==0: end=i+1; break
              if end:
                block=chars[s:end]
                chars=chars[:s]+remove_property(block,"portraits")+chars[end:]
            display={"Andrianome_Ranivo_Dieudonne":"Andrianome Ranivo Dieudonné","Jules_Mamizara":"Jules Mamizara",
                     "Raonenantsoamampianina":"Raonenantsoamampianina","Edmond_Rasolomahandry":"Edmond Rasolomahandry",
                     "Charles_Andrianasoavina":"Charles Andrianasoavina","Hyppolite_Rarison_Ramaroson":"Hyppolite Rarison Ramaroson"}[base]
            # Any country-leader image reference that points to a removed image must also be dropped.
            if display in ("Edmond Rasolomahandry","Noël Girardin Rakotonandrasana"):
              lines=events.splitlines(True); new=[]; active=False; depth=0
              for line in lines:
                if "create_country_leader" in line: active=True; depth=0
                if active and 'name = "'+display+'"' in line and display=="Edmond Rasolomahandry":
                  pass
                if active and "picture = \""+base+".dds\"" in line: continue
                new.append(line)
                if active:
                  depth += line.count("{")-line.count("}")
                  if depth<=0 and "}" in line: active=False
              events="".join(new)

          POLITICAL_NAMES = {
            "Andry_Rajoelina":["Andry Rajoelina"],
            "Marc_Ravalomanana":["Marc Ravalomanana"],
            "Richard_Andriamanjato":["Richard Andriamanjato"],
            "Herizo_Razafimahaleo":["Herizo Razafimahaleo"],
            "Dr_Ndriana_Rabarioelina":["Dr. Ndriana Rabarioelina"],
            "Remenabila":["Remenabila"],
          }
          ADD_PICTURE_ON_SUCCESS = {
            "Remenabila":["Remenabila"],
            "Andry_Rajoelina":["Andry Rajoelina"],
            "Noel_Girardin_Rakotonandrasana":["Noël Girardin Rakotonandrasana"],
            "Edmond_Rasolomahandry":["Edmond Rasolomahandry"],
          }
          def remove_picture_from_named_leaders(doc, names, picture):
            lines=doc.splitlines(True); out=[]; active=False; depth=0; block=[]
            def flush(b):
              txt="".join(b)
              m=re.search(r'name\s*=\s*"([^"]+)"',txt)
              if m and m.group(1) in names:
                txt=re.sub(r'(?m)^[ \t]*picture\s*=\s*"'+re.escape(picture)+r'"[ \t]*\n', '', txt)
              return txt
            for line in lines:
              if not active and "create_country_leader = {" in line:
                active=True; depth=0; block=[line]
                depth += line.count("{")-line.count("}")
                if depth<=0: out.append(flush(block)); active=False; block=[]
              elif active:
                block.append(line); depth += line.count("{")-line.count("}")
                if depth<=0: out.append(flush(block)); active=False; block=[]
              else:
                out.append(line)
            if block: out.append(flush(block))
            return "".join(out)

          failed_political={base for base,row in rows.items() if not row[4] and base in POLITICAL_NAMES}
          for base in failed_political:
            portrait=base+".dds"
            existing=(MAIN/(base+".dds")).exists()
            # Preserve known-good portraits on temporary download/rate-limit failures.
            # Richard's last image was a confirmed wrong-person match and must be discarded.
            if existing and base != "Richard_Andriamanjato":
              continue
            leaders=remove_picture_from_named_leaders(leaders,POLITICAL_NAMES[base],portrait)
            events=remove_picture_from_named_leaders(events,POLITICAL_NAMES[base],portrait)
            (MAIN/(base+".dds")).unlink(missing_ok=True)
            (SMALL/(base+"_small.dds")).unlink(missing_ok=True)
          def add_picture_to_named_leaders(doc, names, picture):
            lines=doc.splitlines(True); out=[]; active=False; depth=0; block=[]
            def flush(b):
              txt="".join(b)
              m=re.search(r'name\s*=\s*"([^"]+)"',txt)
              if m and m.group(1) in names and not re.search(r'(?m)^\s*picture\s*=',txt):
                txt=re.sub(r'(?m)^([ \t]*name\s*=\s*"[^"]+"[ \t]*\n)',r'\1'+("            picture = \""+picture+"\"\n"),txt,count=1)
              return txt
            for line in lines:
              if not active and "create_country_leader = {" in line:
                active=True; depth=0; block=[line]
                depth += line.count("{")-line.count("}")
                if depth<=0: out.append(flush(block)); active=False; block=[]
              elif active:
                block.append(line); depth += line.count("{")-line.count("}")
                if depth<=0: out.append(flush(block)); active=False; block=[]
              else:
                out.append(line)
            if block: out.append(flush(block))
            return "".join(out)
          for base,row in rows.items():
            if row[4] and base in ADD_PICTURE_ON_SUCCESS:
              leaders=add_picture_to_named_leaders(leaders,ADD_PICTURE_ON_SUCCESS[base],base+".dds")
              events=add_picture_to_named_leaders(events,ADD_PICTURE_ON_SUCCESS[base],base+".dds")

          # The picture field is filename-only in MD create_country_leader blocks.
          # Add it to the civilian TGV-formation event as well as the scripted party leader.
          CHARACTER_TARGETS = {
            "Andrianome_Ranivo_Dieudonne":("MAD_andrianome_dieudonne","Andrianome Ranivo Dieudonné","army"),
            "Jules_Mamizara":("MAD_jules_mamizara","Jules Mamizara","army"),
            "Raonenantsoamampianina":("MAD_raonenantsoamampianina","Raonenantsoamampianina","army"),
            "Petera_Behajaina":("MAD_petera_behajaina","Petera Behajaina","army"),
            "Noel_Girardin_Rakotonandrasana":("MAD_noel_rakotonandrasana","Noël Girardin Rakotonandrasana","army"),
            "Edmond_Rasolomahandry":("MAD_edmond_rasolomahandry","Edmond Rasolomahandry","army"),
            "Charles_Andrianasoavina":("MAD_charles_andrianasoavina","Charles Andrianasoavina","army"),
            "Hyppolite_Rarison_Ramaroson":("MAD_hyppolite_ramaroson","Hyppolite Rarison Ramaroson","navy"),
          }
          def ensure_character_portrait(doc, char_id, name, role, base):
            marker="\t"+char_id+" = {\n\t\tname = \""+name+"\""
            if marker not in doc: return doc
            start=doc.find(marker); depth=0; end=None
            for i in range(start,len(doc)):
              if doc[i]=="{": depth+=1
              elif doc[i]=="}":
                depth-=1
                if depth==0: end=i+1; break
            if end is None: return doc
            block=doc[start:end]
            if re.search(r'(?m)^\s*portraits\s*=\s*\{',block): return doc
            portrait="\n\t\tportraits = {\n\t\t\t"+role+" = {\n\t\t\t\tsmall = \"gfx/leaders/MAD/small/"+base+"_small.dds\"\n\t\t\t\tlarge = \"gfx/leaders/MAD/"+base+".dds\"\n\t\t\t}\n\t\t}"
            return doc[:start]+block.replace(marker,marker+"\n"+portrait,1)+doc[end:]
          for base,row in rows.items():
            if row[4] and base in CHARACTER_TARGETS:
              char_id,name,role=CHARACTER_TARGETS[base]
              chars=ensure_character_portrait(chars,char_id,name,role,base)

          CHAR_FILE.write_text(chars,encoding="utf-8")
          EVENT_FILE.write_text(events,encoding="utf-8")
          LEADER_FILE.write_text(leaders,encoding="utf-8")

          def replace_or_add_row(doc, base, source, page, credit, rights, ok):
            lines=doc.splitlines()
            start=next((i for i,l in enumerate(lines) if l.startswith("| "+base+" |")),None)
            if ok:
              src=page or source
              link="["+credit+"]("+src+")"
              row="| "+base+" | "+link+" | "+rights+" |"
            else:
              row="| "+base+" | No verified portrait candidate passed face/source checks | Not imported; no new portrait reference was added |"
            if start is not None: lines[start]=row
            else:
              marker=next((i for i,l in enumerate(lines) if l.startswith("|---")),None)
              if marker is not None: lines.insert(marker+1,row)
            return "\n".join(lines)+"\n"

          doc=old
          for base,(source,page,credit,rights,ok) in rows.items():
            doc=replace_or_add_row(doc,base,source,page,credit,rights,ok)
          SOURCES_FILE.write_text(doc,encoding="utf-8")

          # Structural checks: every portrait path declared in MAD.txt must exist.
          txt=CHAR_FILE.read_text(encoding="utf-8")
          missing=[]
          for rel in re.findall(r'"(gfx/leaders/MAD/[^"]+\.dds)"',txt):
            if not (ROOT/rel).exists(): missing.append(rel)
          if missing:
            raise SystemExit("Missing referenced DDS files: "+", ".join(missing))
          print("PORTRAIT REPAIR SUMMARY",json.dumps(rows,ensure_ascii=False))
          print("All remaining character portrait paths resolve.")
          PY
