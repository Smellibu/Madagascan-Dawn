name: Inspect Bruno speech source links
on:
  push:
    branches:
      - codex/mad-military-policy-history-2026-11-12
    paths:
      - .github/workflows/mad-portrait-repair.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mad-military-policy-history-2026-11-12
          persist-credentials: true
      - name: Install PDF reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pymupdf
      - name: Extract Bruno video link
        run: |
          python - <<'PY'
          import requests, fitz, re
          url="https://www.madagate.org/reportages/manifestation/2703-camp-ratsimandrava-les-videos-des-discours-du-11-octobre-2012.pdf"
          r=requests.get(url,headers={"User-Agent":"Mozilla/5.0"},timeout=40)
          print("PDF response",r.status_code,len(r.content),r.url)
          r.raise_for_status()
          doc=fitz.open(stream=r.content,filetype="pdf")
          for n,page in enumerate(doc):
              words=page.get_text("words")
              for link in page.get_links():
                  if not link.get("uri"): continue
                  rect=fitz.Rect(link["from"])
                  near=[]
                  for w in words:
                      wr=fitz.Rect(w[:4])
                      if wr.intersects(rect) or (abs(wr.y0-rect.y0)<20 and abs(wr.x0-rect.x0)<80):
                          near.append(w[4])
                  context=" ".join(near)
                  print("PDF_LINK",n,repr(context),link["uri"])
          PY
      - name: Remove one-shot workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mad-portrait-repair.yml
          git add -u .github/workflows/mad-portrait-repair.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove portrait source inspection workflow"
          git push origin HEAD:codex/mad-military-policy-history-2026-11-12
